    <script>
(function () {
/* ============================================================
   KIT 00 CORE: math, seeded random, noise, splines, beat grid, boil clock
   Every frame is a pure function of time t (seconds). No Math.random,
   no Date.now, no performance.now anywhere in the kit.
   ============================================================ */
var AK = window.AK || (window.AK = {});
(function (K) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const ss = (a, b, t) => { const u = inv(a, b, t); return u * u * (3 - 2 * u); };
  const f1 = (n) => Math.round(n * 10) / 10;
  const f2 = (n) => Math.round(n * 100) / 100;

  /* eases (u in 0..1) */
  const E = {
    inOut: (u) => u * u * (3 - 2 * u),
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    back: (u, s) => { s = s == null ? 1.7 : s; const v = u - 1; return 1 + v * v * ((s + 1) * v + s); },
    elastic: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
  };
  /* tween value from a to b during [t0, t1] with an ease */
  const tw = (t, t0, t1, a, b, ease) => lerp(a, b, (ease || E.inOut)(inv(t0, t1, t)));

  /* seeded PRNG (mulberry32) */
  function mulberry(seed) {
    let s = seed | 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let q = Math.imul(s ^ (s >>> 15), 1 | s);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* stateless hash -> [0,1) for (i, seed) */
  function hash(i, s) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const hs = (i, s) => hash(i, s) * 2 - 1; /* signed */
  function vnoise(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s), hash(i + 1, s), u); }
  function fbm(x, s, oct) { let a = 0.5, v = 0, fr = 1, n = 0; for (let k = 0; k < (oct || 3); k++) { v += a * vnoise(x * fr, s + k * 17); n += a; a *= 0.5; fr *= 2.03; } return v / n; }

  /* monotone cubic Hermite spline through [[t, v], ...] (no overshoot) */
  function mkSpline(pts) {
    const n = pts.length, T = pts.map((p) => p[0]), V = pts.map((p) => p[1]);
    if (n === 1) return () => V[0];
    const d = [], m = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) d[i] = (V[i + 1] - V[i]) / (T[i + 1] - T[i]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
    }
    return function (x) {
      x = clamp(x, T[0], T[n - 1]);
      let i = 0; while (i < n - 2 && x >= T[i + 1]) i++;
      const h = T[i + 1] - T[i], u = (x - T[i]) / h, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * V[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * V[i + 1] + (u3 - u2) * h * m[i + 1];
    };
  }
  /* keys: [[t, {a:.., b:..}], ...] -> fn(t) -> {a, b} (one spline per channel) */
  function mkTrack(keys) {
    const names = Object.keys(keys[0][1]), sp = {};
    names.forEach((k) => { sp[k] = mkSpline(keys.map((q) => [q[0], q[1][k]])); });
    return (t) => { const o = {}; names.forEach((k) => (o[k] = sp[k](t))); return o; };
  }

  /* ---------- beat grid (retime to the real song by changing BPM/OFFSET or BARS) ----------
     BARS: optional list of measured downbeat times (seconds). Songs cut from
     several takes drift a few ms per splice, so measured downbeats beat a
     single OFFSET. Past the list, bars extrapolate at BPM. */
  const G = { BPM: 113, OFFSET: 0, BEATS_PER_ACCENT: 4, BARS: null };
  const beatLen = () => 60 / G.BPM;
  const barLen = () => beatLen() * G.BEATS_PER_ACCENT;
  function barStart(b) {
    const B = G.BARS;
    if (!B || !B.length) return G.OFFSET + b * barLen();
    if (b < 0) return B[0] + b * barLen();
    if (b < B.length) return B[b];
    return B[B.length - 1] + (b - B.length + 1) * barLen();
  }
  /* time of bar b (0-based, an "accent" = 4 beats) plus beat k (fractional ok) */
  const at = (bar, beat) => barStart(Math.floor(bar)) + ((bar - Math.floor(bar)) * G.BEATS_PER_ACCENT + (beat || 0)) * beatLen();
  /* index of the bar containing t (-1 before the first downbeat) */
  function barAt(t) {
    if (t < barStart(0)) return -1;
    let b = 0; while (barStart(b + 1) <= t) b++;
    return b;
  }
  /* 1 on the beat, decaying to 0 before the next beat (k = sharpness) */
  function pulse(t, everyBeats, k) {
    const b = barAt(t); if (b < 0) return 0;
    const L = beatLen() * (everyBeats || 1), x = t - barStart(b);
    return Math.exp(-(k || 7) * ((x % L) / L));
  }
  const beatIndex = (t) => { const b = barAt(t); return b < 0 ? -1 : b * G.BEATS_PER_ACCENT + Math.floor((t - barStart(b)) / beatLen()); };

  /* ---------- line boil clock: drawings change 12 times per second ---------- */
  const BOIL_FPS = 12;
  const boilFrame = (t) => Math.floor(t * BOIL_FPS);

  Object.assign(K, { clamp, lerp, inv, ss, f1, f2, E, tw, mulberry, hash, hs, vnoise, fbm, mkSpline, mkTrack,
    G, beatLen, barLen, barStart, barAt, at, pulse, beatIndex, BOIL_FPS, boilFrame, TAU: Math.PI * 2 });
})(AK);

/* ============================================================
   INTRO 10 SETUP: variables, title DOM, world layout, timing (beat grid)
   Song: song_20s.m4a, 80s synth-funk with vocoder, ~113 BPM (beat 0.531 s,
   bar 2.12 s). Cut: one intro bar (raw 3.58-5.83) + the second chorus with
   its natural ending (raw 40.08-58.3), crossfade 30 ms, loudnorm -14 LUFS.
     0.08  instrumental bar: Beepo boots up
     2.24  "Beep boop, the signals run"
     6.46  "Agents trade till the day is done"
    10.70  "Observe, decide, then act again"
    14.95  "AI Agents for Trading, here they come!"  (title hit)
    17.09  "AI Agents for Trading!" (tag), ring-out to 20.5
   All story times are K.at(bar, beat) on the measured downbeats below.
   ============================================================ */
const K = AK, P = K.P, at = K.at;
K.G.BPM = 113;
K.G.BARS = [0.08, 2.24, 4.34, 6.46, 8.59, 10.70, 12.84, 14.95, 17.09, 19.21];
const DUR = 20.5;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const BEAT = K.beatLen();

/* ---------- story beats (on the song's downbeats) ---------- */
const T = {
  powerOn: [at(0), at(0) + 0.32],   /* CRT power-on line opens the film */
  noise: [at(0) + 0.2, at(0, 2)],   /* face screen boots: static */
  eyesOn: at(0, 2),                 /* 1.14 pixel eyes appear */
  crouch: at(0, 3.2),               /* anticipation before the hop */
  hop: at(1),                       /* 2.24 "Beep boop": hop + pull back */
  pullBack: [at(1), at(1, 2.5)],
  chart: at(1, 1),                  /* wall chart candles draw */
  signals: at(2),                   /* 4.34 "the signals run": cables light, pulses run */
  follow: [at(2, 2), at(3)],        /* camera follows the pulses to the team */
  trade: at(3),                     /* 6.46 "Agents trade": ticket pipeline starts */
  hopOver: [at(3) - 0.25, at(3) + 0.35],
  dayEnd: [at(3), at(5) - 0.4],     /* "till the day is done": dusk, clock runs */
  dive: [at(5) - 0.55, at(5)],      /* camera dives into Beepo's face screen */
  observe: at(5),                   /* 10.70 */
  decide: at(5, 2),                 /* 11.76 */
  act: at(6),                       /* 12.84 */
  again: at(6, 2),                  /* 13.90 loop returns to observe, counter 02 */
  crtOff: [at(7) - 0.42, at(7) - 0.04],  /* power-off squeeze into a line */
  title: at(7),                     /* 14.95 sign buzzes on */
  letters: at(7) + 0.25,
  jump: at(7, 2),
  medals: at(8),                    /* 17.09 tag line: medallions + confetti */
  final: at(9),
};

/* ---------- variables (title text, language) ---------- */
const VARS = Object.assign({ title: "AI Agents|for Trading", lang: "en" },
  (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {});
const LANG = VARS.lang || "en";
const TITLE_LINES = String(VARS.title || "AI Agents|for Trading").split("|").map((s) => s.trim()).filter(Boolean);
const IS_CJK = LANG === "zh-CN" || LANG === "zh-TW";

/* ---------- title DOM: one span per character (letters flicker on like neon) ---------- */
const titleEl = document.getElementById("title");
if (LANG === "zh-CN") titleEl.classList.add("cjk-sc");
if (LANG === "zh-TW") titleEl.classList.add("cjk-tc");
/* sizes chosen so the longest line fits the 1400 px inside of the neon sign (STYLE.md, type) */
const longest = Math.max(...TITLE_LINES.map((s) => s.length));
const WIDE = /[Ѐ-ӿ]/.test(VARS.title) ? 1500 : 1600; /* Cyrillic runs wider in Russo One */
const TITLE_SIZE = IS_CJK ? 128 : Math.min(128, Math.floor(WIDE / Math.max(9, longest)));
const TITLE_CH = [];
TITLE_LINES.forEach((ln, li) => {
  const d = document.createElement("div");
  d.className = "ln " + (li === TITLE_LINES.length - 1 && TITLE_LINES.length > 1 ? "l1" : "l0");
  const size = li === 0 || TITLE_LINES.length === 1 ? TITLE_SIZE : Math.round(TITLE_SIZE * 0.86);
  d.style.fontSize = size + "px";
  d.dataset.size = size;
  Array.from(ln).forEach((c) => {
    const s = document.createElement("span");
    s.className = "ch"; s.textContent = c === " " ? " " : c;
    d.appendChild(s); TITLE_CH.push({ el: s, line: li, idx: TITLE_CH.length });
  });
  titleEl.appendChild(d);
});
const TITLE_LN = Array.from(titleEl.querySelectorAll(".ln"));

/* ---------- world layout (world units; horizon = 700) ---------- */
const HORIZON = 700;
const WORLD = { x0: -600, x1: 4200 };
const SCREEN_BIG = { x: 260, y: 150, w: 860, h: 420 };   /* wall chart */
const WINDOW = { x: 1560, y: 110, w: 980, h: 460 };      /* synthwave window behind the team */
const CLOCK = { x: 2600, y: 170, w: 330, h: 120 };      /* 7-seg wall clock */
const PNL = { x: 2600, y: 400, w: 330, h: 170 };        /* PnL scoreboard */
const TUBE = { x: 3200, top: -200, y: 980 };            /* pneumatic tube to the exchange */
const BEEPO_A = [1000, 1060], BEEPO_B = [1600, 1070], BEEPO_S = 1.2;
const TEAM = [
  { kind: "analyst", x: 1950, y: 1030, s: 0.95, seed: 811 },
  { kind: "risk", x: 2375, y: 1030, s: 0.95, seed: 833 },
  { kind: "trader", x: 2800, y: 1030, s: 0.95, seed: 857 },
];
/* hands where tickets are handed over (world) */
const HAND = (i) => [TEAM[i].x + 95, TEAM[i].y - 150];
/* candles on the wall chart (language-free data) */
const CANDLES = [[40, 44, 38, 43], [43, 47, 42, 46], [46, 47, 41, 42], [42, 45, 40, 44], [44, 50, 43, 49], [49, 52, 47, 48], [48, 49, 44, 45], [45, 51, 45, 50], [50, 56, 49, 55], [55, 58, 52, 57], [57, 58, 53, 54], [54, 61, 54, 60]];
const TAPE = [{ sym: "NVDA", chg: "+3.2%" }, { sym: "AAPL", chg: "-0.4%" }, { sym: "BTC", chg: "+1.8%" }, { sym: "TSLA", chg: "-2.1%" }, { sym: "SPY", chg: "+0.6%" }, { sym: "MSFT", chg: "+0.9%" }];
/* tickets in the pipeline: one every two beats from the "Agents trade" downbeat */
const TICKETS = [
  { t: at(3), sym: "NVDA", dir: "up", qty: "100", pnl: "+0.4" },
  { t: at(3, 2), sym: "AAPL", dir: "down", qty: "50", pnl: "+1.1" },
  { t: at(4), sym: "BTC", dir: "up", qty: "2", pnl: "+1.9" },
  { t: at(4, 2), sym: "SPY", dir: "up", qty: "300", pnl: "+2.6" },
];

/* ============================================================
   INTRO 20 FLOOR SET: the neon trading floor, one continuous world.
   Used for the boot close-up, the pull-back, the team's ticket line and the
   dive into Beepo's face. Camera: monotone Hermite keys (never overshoot),
   moves start and land on beats.
   ============================================================ */
const FACE_W = [BEEPO_B[0], BEEPO_B[1] - BEEPO_S * 221]; /* world centre of Beepo's screen at rest */
const camKeys = K.mkTrack([
  [0, { x: BEEPO_A[0] + 20, y: BEEPO_A[1] - 285, z: 2.15 }],
  [T.hop, { x: BEEPO_A[0] + 30, y: BEEPO_A[1] - 300, z: 2.0 }],
  [T.hop + 0.45, { x: BEEPO_A[0] + 60, y: BEEPO_A[1] - 380, z: 1.5 }],
  [T.pullBack[1], { x: 1180, y: 600, z: 0.95 }],
  [T.follow[0], { x: 1300, y: 605, z: 0.95 }],
  [T.trade + 0.3, { x: 2360, y: 620, z: 0.9 }],
  [T.dive[0], { x: 2340, y: 625, z: 0.92 }],
]);
function camFloor(t) {
  if (t < T.dive[0]) return Object.assign({ rot: 0 }, camKeys(t));
  /* dive: zoom in log space so the rush feels even, centre slides onto the face */
  const u = K.E.in3(K.inv(T.dive[0], T.dive[1], t)), c0 = camKeys(T.dive[0]);
  const z = Math.exp(K.lerp(Math.log(c0.z), Math.log(DIVE_Z), u));
  const k = K.E.out3(K.inv(T.dive[0], T.dive[1] - 0.15, t));
  return { x: K.lerp(c0.x, FACE_W[0], k), y: K.lerp(c0.y, FACE_W[1], k), z, rot: 0 };
}
/* zoom at which the face screen is wider than the frame (132 px screen x scale) */
const DIVE_Z = 2060 / (132 * BEEPO_S);

const CABLES = [
  [[380, 590], [380, 780], [1100, 870], [1640, 900], [HAND(0)[0] - 120, 1040]],
  [[470, 590], [470, 760], [1300, 830], [2050, 880], [HAND(1)[0] - 120, 1045]],
  [[560, 590], [560, 740], [1500, 800], [2500, 850], [HAND(2)[0] - 120, 1050]],
];

function drawFloor(t, cam) {
  K.begin(ctx, t, cam);
  K.applyCam(ctx, 1);
  const dusk = K.lerp(0.12, 1, K.ss(T.dayEnd[0], T.dayEnd[1], t));
  K.wall(ctx, WORLD.x0, WORLD.x1, -900, HORIZON, { seed: 3 });
  K.floorGrid(ctx, WORLD.x0, WORLD.x1, HORIZON, 1400, { vx: 1600, scroll: t * 0.5, rows: 16, cols: 40, spread: 300 });
  /* ceiling neon strip */
  K.neon(ctx, [[WORLD.x0, -60], [WORLD.x1, -60]], { color: P.pink, w: 8, on: K.flick(t, 4, 0.25), seed: 4, boil: 0 });
  /* LED tape over the wall chart */
  K.ledTape(ctx, SCREEN_BIG.x - 10, SCREEN_BIG.y - 116, SCREEN_BIG.w + 20, 64, TAPE, { speed: 150 });
  /* wall chart: candles draw on "Beep boop", a green line runs when the signals run */
  const draw = K.inv(T.chart, T.chart + 2.2 * BEAT * 2, t);
  K.wallScreen(ctx, SCREEN_BIG.x, SCREEN_BIG.y, SCREEN_BIG.w, SCREEN_BIG.h, (c, w, h) => {
    K.plot(c, w, h, [{ kind: "candle", data: CANDLES }], { draw: 0.25 + 0.75 * draw, yMin: 36, yMax: 62, title: "NVDA  1H", seed: 41 });
  }, { seed: 12, glow: P.green });
  /* the window: dusk falls during the trading day */
  K.skyWindow(ctx, WINDOW.x, WINDOW.y, WINDOW.w, WINDOW.h, { dusk, seed: 7 });
  /* wall clock runs 09:30 -> 16:00 */
  const mins = Math.round(K.lerp(9 * 60 + 30, 16 * 60, K.inv(T.dayEnd[0], T.dayEnd[1], t)));
  const hh = String(Math.floor(mins / 60)).padStart(2, "0"), mm = String(mins % 60).padStart(2, "0");
  K.scoreboard(ctx, CLOCK.x + CLOCK.w / 2, CLOCK.y + CLOCK.h / 2, CLOCK.w, CLOCK.h, [{ v: hh + ":" + mm, c: P.cyan }], { seed: 14 });
  const pnl = pnlAt(t);
  K.scoreboard(ctx, PNL.x + PNL.w / 2, PNL.y + PNL.h / 2, PNL.w, PNL.h, [{ v: pnl.v, c: P.green }], { seed: 15, label: "PNL", bump: pnl.bump });
  /* pneumatic tube to the exchange */
  K.shape(ctx, K.rrPts(TUBE.x - 46, TUBE.top, 92, TUBE.y - TUBE.top - 220, 40, 3), { fill: K.rgba(P.cyan, 0.12), w: 7, boil: 0.6, seed: 21, rim: { color: P.cyan, dx: 6, dy: 0, a: 0.5 }, gloss: 0.4 });
  K.shape(ctx, K.rrPts(TUBE.x - 80, TUBE.y - 260, 160, 120, 30, 3), { fill: P.metalDark, w: 6, boil: 0.6, seed: 22, rim: { color: P.violet, a: 0.8 }, dots: { gap: 11, r: 2.4, alpha: 0.3 } });
  K.shape(ctx, K.ellipsePts(TUBE.x, TUBE.y - 200, 50, 26, 16), { fill: P.ink, w: 5, boil: 0.4, seed: 23 });
  TICKETS.forEach((tk, i) => { /* whoosh up the tube */
    const t0 = tk.t + 4.6 * BEAT, u = K.inv(t0, t0 + 0.5, t);
    if (u > 0 && u < 1) { const y = K.lerp(TUBE.y - 260, TUBE.top - 40, K.E.in3(u)); K.glow(ctx, TUBE.x, y, 60, K.rgba(P.yellow, 0.9), 1); K.dot(ctx, TUBE.x, y, 16, P.paper, P.ink, 4, 30 + i); }
    K.sparks(ctx, TUBE.x, TUBE.y - 210, t0, { seed: 90 + i, r: 120 });
  });
  /* cables: dark until the signals run, then lit with travelling pulses */
  CABLES.forEach((pts, i) => {
    const lit = K.inv(T.signals, T.signals + 0.3, t);
    const pulses = [];
    if (t >= T.signals) for (let k = 0; k < 3; k++) pulses.push(((t - T.signals) * 0.42 - k * 0.33 - i * 0.07));
    K.cable(ctx, pts, { color: [P.cyan, P.pink, P.yellow][i], lit: lit * 0.7, pulses: pulses.filter((u) => u >= 0 && u <= 1), seed: 41 + i * 9 });
  });
  /* team (behind Beepo) and their stations */
  TEAM.forEach((m, i) => {
    K.shape(ctx, K.ellipsePts(m.x, m.y + 6, 90, 18, 14), { fill: P.ink, stroke: null, w: 0, boil: 0.3, seed: 60 + i, alpha: 0.6 });
    K.robot(ctx, m.x, m.y, m.s, teamPose(i, t));
  });
  /* tickets in flight */
  TICKETS.forEach((tk, i) => {
    const s = ticketState(tk, t); if (!s) return;
    K.ticket(ctx, s.x, s.y, 1.0, { sym: tk.sym, dir: tk.dir, qty: tk.qty, stamp: s.stamp, rot: s.rot, a: s.a, seed: 70 + i });
    if (s.stamp > 0 && s.stamp < 1) K.sparks(ctx, s.x + 30, s.y, tk.t + 2 * BEAT, { seed: 120 + i, r: 90, n: 8, color: P.green });
  });
  /* Beepo */
  const bp = beepoPos(t);
  K.shape(ctx, K.ellipsePts(bp[0], bp[1] + 6, 100, 20, 14), { fill: P.ink, stroke: null, w: 0, boil: 0.3, seed: 66, alpha: 0.6 });
  K.beepo(ctx, bp[0], bp[1], BEEPO_S, beepoPose(t));
  /* landing dust: pixel sparks */
  K.sparks(ctx, bp[0], bp[1] - 10, T.hop + 0.5, { seed: 140, r: 150, n: 12, color: P.cyan });
  K.sparks(ctx, bp[0], bp[1] - 10, T.hopOver[1], { seed: 150, r: 150, n: 12, color: P.pink });
}

/* ============================================================
   INTRO 30 ACTORS: Beepo's poses, the team's poses, the ticket pipeline.
   Every pose is a pure function of t. Big actions have anticipation
   (crouch before a hop) and squash on landing.
   ============================================================ */
const pulseB = (t) => K.pulse(t, 1, 6);       /* every beat */
const pulseA = (t) => K.pulse(t, 4, 5);       /* every bar */
const hopArc = (t, t0, t1, h) => { const u = K.inv(t0, t1, t); return u > 0 && u < 1 ? 4 * h * u * (1 - u) : 0; };
/* landing squash: a quick squash then rebound after time tl */
const land = (t, tl, k) => { const d = t - tl; return d < 0 || d > 0.5 ? 0 : (k || 0.4) * Math.exp(-d * 9) * Math.cos(d * 22); };

/* ---------- Beepo ---------- */
function beepoPos(t) {
  const u = K.E.inOut(K.inv(T.hopOver[0], T.hopOver[1], t));
  return [K.lerp(BEEPO_A[0], BEEPO_B[0], u), K.lerp(BEEPO_A[1], BEEPO_B[1], u)];
}
function beepoPose(t) {
  const b = pulseB(t);
  const st = { kind: "lead", seed: 700, blink: K.blinkAt(t, 3), mouth: "smile", look: [0, 0], squash: 0.08 * b - 0.03, bulb: 0.25 + 0.75 * b, chest: 0.3 + 0.7 * pulseA(t) };
  st.armL = { x: -104, y: -150 + 6 * Math.sin(t * 3), open: 0.2 };
  st.armR = { x: 104, y: -150 - 6 * Math.sin(t * 3 + 1), open: 0.2 };
  /* boot: static, then eyes pop on, look around */
  if (t < T.eyesOn) {
    st.screen = (c, w, h) => {
      const f = K.bf, cell = 6;
      for (let y = 0; y < h; y += cell) for (let x = 0; x < w; x += cell) { const v = K.hash(x * 31 + y, f * 13 + 5); c.fillStyle = `rgba(93,255,216,${(v * v * 0.85).toFixed(2)})`; c.fillRect(x, y, cell - 1, cell - 1); }
    };
    st.bulb = 0.1; st.squash = -0.02;
  } else if (t < T.hop) {
    const k = t - T.eyesOn;
    st.eyes = k < 0.18 ? "wide" : "dot";
    st.look = [K.tw(t, T.eyesOn + 0.25, T.eyesOn + 0.45, 0, -0.9) + K.tw(t, T.eyesOn + 0.6, T.eyesOn + 0.8, 0, 1.6), -0.1];
    st.blink = k < 0.2 ? 0 : st.blink;
  }
  /* anticipation crouch, then the hop on the "Beep boop" downbeat */
  const crouch = K.ss(T.crouch, T.hop, t) * (1 - K.ss(T.hop, T.hop + 0.08, t));
  st.squash += 0.32 * crouch;
  if (crouch > 0) { st.armL.y += 30 * crouch; st.armR.y += 30 * crouch; st.eyes = "happy"; }
  st.hop = hopArc(t, T.hop, T.hop + 0.5, 110);
  st.squash += land(t, T.hop + 0.5, 0.42);
  if (st.hop > 0) { st.squash -= 0.18; st.armL = { x: -130, y: -330, open: 0.8 }; st.armR = { x: 130, y: -330, open: 0.8 }; st.eyes = "happy"; st.mouth = "open"; }
  /* singing "beep boop": waveform mouth, bulb flashes on each beat */
  if (t >= T.hop && t < T.trade) {
    st.mouth = "talk"; st.talk = 0.35 + 0.65 * b; st.bulb = b;
    if (st.hop <= 0 && t > T.hop + 0.6) { /* point at the cables when the signals run */
      const pt = K.ss(T.signals - 0.3, T.signals, t);
      st.armR = { x: K.lerp(104, 160, pt), y: K.lerp(-150, -250, pt), open: 0.15 }; st.look = [pt, -0.2 * pt];
      st.armL = { x: -104, y: -150 - 40 * b, open: 0.4 * b };
      if (t > T.signals) st.eyes = "wide";
      if (t > T.signals + 0.5) st.eyes = "dot";
    }
    if (t > T.follow[0]) st.look = [1, -0.1];
  }
  /* hop over to the team, then conduct with a neon baton */
  const hv = hopArc(t, T.hopOver[0], T.hopOver[1], 120);
  if (hv > 0) { st.hop = hv; st.squash = -0.15; st.armL = { x: -140, y: -300, open: 0.7 }; st.armR = { x: 140, y: -300, open: 0.7 }; st.eyes = "happy"; }
  st.squash += land(t, T.hopOver[1], 0.38);
  if (t >= T.hopOver[1]) {
    const c = Math.sin((t - T.trade) / BEAT * Math.PI); /* baton swings once per beat */
    st.hold = { R: "baton" }; st.armR = { x: 100 + 30 * c, y: -230 - 40 * Math.abs(c), open: 0.05 };
    st.armL = { x: -110, y: -170 - 30 * b, open: 0.3 };
    st.look = [0.9, -0.2]; st.mouth = "talk"; st.talk = 0.3 + 0.5 * b; st.lean = 3 * c;
    st.eyes = t > T.dayEnd[1] - 1.2 ? "dollar" : "dot";
  }
  /* calm pose while the camera dives into the face (no squash: the target must not move) */
  if (t >= T.dive[0] - 0.1) { st.squash = 0; st.lean = 0; st.hop = 0; st.blink = 0; st.eyes = "wide"; st.mouth = "o"; st.hold = null; st.armR = { x: 104, y: -160, open: 0.3 }; st.armL = { x: -104, y: -160, open: 0.3 }; }
  if (t >= T.dive[0] - 0.35) { st.screen = faceLoop(t); st.noScan = true; }
  return st;
}

/* ---------- team ---------- */
function teamPose(i, t) {
  const m = TEAM[i], b = K.pulse(t - i * 0.06, 1, 6);
  const st = { kind: m.kind, seed: m.seed, blink: K.blinkAt(t, 11 + i * 7), mouth: "smile", look: [-0.3, 0], squash: 0.07 * b - 0.03, bulb: 0.2 + 0.8 * b, chest: 0.4 + 0.6 * b };
  st.armL = { x: -104, y: -140, open: 0.2 };
  st.armR = { x: 104, y: -140 - 10 * b, open: 0.2 };
  if (m.kind === "analyst") { st.hold = { L: "lens" }; st.armL = { x: -120, y: -230 + 10 * Math.sin(t * 2), open: 0.1, rot: 200 }; st.look = [-0.8, -0.4]; }
  if (m.kind === "risk") st.hold = { L: "shield" };
  /* signals arrive: everyone wakes */
  const wake = K.ss(T.signals + 0.6 + i * 0.25, T.signals + 0.9 + i * 0.25, t);
  if (t < T.signals + 0.6 + i * 0.25) { st.blink = 1; st.mouth = "flat"; st.bulb = 0; st.chest = 0; st.squash = 0.06; }
  else if (wake < 1) { st.eyes = "wide"; st.squash = -0.2 * (1 - wake); }
  /* ticket handling: reach for incoming tickets, stamp, throw */
  TICKETS.forEach((tk) => {
    if (i === 1) { /* risk stamps on beat 2 of each ticket */
      const ts = tk.t + 2 * BEAT, r = K.ss(ts - 0.25, ts, t) * (1 - K.ss(ts + 0.05, ts + 0.3, t));
      if (r > 0) { st.armR = { x: K.lerp(104, 120, r), y: K.lerp(-140, -260, r * (t < ts ? 1 : 0.2)), open: 0.1 }; st.squash += 0.12 * K.inv(ts, ts + 0.05, t) * (1 - K.inv(ts + 0.05, ts + 0.3, t)); st.eyes = "happy"; }
    }
    if (i === 2) { /* trader throws into the tube on beat 4 */
      const tt = tk.t + 4 * BEAT, r = K.ss(tt - 0.35, tt - 0.05, t) * (1 - K.ss(tt + 0.1, tt + 0.4, t));
      if (r > 0) { st.armR = { x: K.lerp(80, 170, r), y: K.lerp(-120, -290, r), open: t > tt - 0.05 ? 0.9 : 0.1 }; st.lean = 8 * r; st.look = [1, -0.6]; }
    }
  });
  if (t > T.dayEnd[1] - 1.2) st.eyes = i === 2 ? "dollar" : "happy";
  return st;
}

/* ---------- ticket pipeline: analyst -> risk (stamp) -> trader -> tube ---------- */
function ticketState(tk, t) {
  const d = (t - tk.t) / BEAT; /* in beats since spawn */
  if (d < 0 || d > 5) return null;
  const A = HAND(0), B = HAND(1), C = HAND(2), Tb = [TUBE.x, 760];
  const arc = (p, q, u, h) => [K.lerp(p[0], q[0], u), K.lerp(p[1], q[1], u) - 4 * h * u * (1 - u)];
  let pos, rot = 0, a = 1;
  if (d < 1) { pos = A; a = K.inv(0, 0.35, d); rot = 0.1 * Math.sin(d * 6); }
  else if (d < 1.6) { const u = K.E.inOut(K.inv(1, 1.6, d)); pos = arc(A, B, u, 120); rot = u * K.TAU * 0.5; }
  else if (d < 3) pos = B;
  else if (d < 3.6) { const u = K.E.inOut(K.inv(3, 3.6, d)); pos = arc(B, C, u, 120); rot = -u * K.TAU * 0.5; }
  else if (d < 4) pos = C;
  else { const u = K.E.in3(K.inv(4, 4.6, d)); pos = arc(C, Tb, u, 160); a = 1 - K.inv(4.45, 4.6, d); rot = u * 3; }
  return { x: pos[0], y: pos[1], rot, a, stamp: K.inv(2, 2.25, d) };
}
/* PnL shown on the scoreboard: the last ticket to reach the tube */
function pnlAt(t) {
  let v = "+0.0", bump = 0;
  TICKETS.forEach((tk) => { const ti = tk.t + 4.6 * BEAT; if (t >= ti) { v = tk.pnl; bump = K.inv(ti, ti + 0.35, t); } });
  return { v: v + "%", bump };
}

/* ============================================================
   INTRO 40 LOOP SET: inside Beepo's face screen.
   "Observe, decide, then act again": the agent loop as a ring of three
   pods (eye, brain, bolt). A running light lands on each pod on the beat,
   each pod pops a readout, and "again" ticks the loop counter to 02.
   Drawn in a virtual 1920 x 1080 frame; the caller sets the transform, so
   the same drawing sits inside the face during the dive and fills the frame
   afterwards.
   ============================================================ */
const LOOP_STEPS = [{ icon: "eye", color: P.cyan }, { icon: "fork", color: P.pink }, { icon: "bolt", color: P.yellow }];
const LOOP_C = [960, 590], LOOP_R = 350;
const ARRIVE = [T.observe, T.decide, T.act, T.again, T.again + 2 * BEAT];
function loopActive(t) {
  /* light index: travels 0.4 s before each arrival, rests on the pod */
  let v = 0;
  for (let i = 1; i < ARRIVE.length; i++) v += K.E.inOut(K.inv(ARRIVE[i] - 0.4, ARRIVE[i], t));
  return v;
}
function drawLoopScene(c, t) {
  /* phosphor background + grid */
  c.fillStyle = P.screen; c.fillRect(-200, -200, 2320, 1480);
  const g = c.createRadialGradient(960, 540, 60, 960, 540, 1100); g.addColorStop(0, "#0b3440"); g.addColorStop(1, P.screen);
  c.fillStyle = g; c.fillRect(-200, -200, 2320, 1480);
  c.save(); c.strokeStyle = K.rgba(P.phosphor, 0.08); c.lineWidth = 2; c.beginPath();
  for (let x = -40; x <= 1960; x += 80) { c.moveTo(x, -200); c.lineTo(x, 1280); }
  for (let y = 20; y <= 1100; y += 80) { c.moveTo(-200, y); c.lineTo(2120, y); }
  c.stroke(); c.restore();
  const act = loopActive(t), app = K.inv(T.dive[0] - 0.3, T.dive[0] + 0.1, t);
  K.loopRing(c, LOOP_C[0], LOOP_C[1], LOOP_R, LOOP_STEPS, { a: app, active: act, nodeR: 108, seed: 81, lit: K.inv(T.observe - 0.1, T.observe + 0.1, t) });
  /* centre: loop counter on a seven-segment display, ticks on "again" */
  const n = t >= T.again ? 2 : 1, bump = t >= T.again ? K.inv(T.again, T.again + 0.35, t) : K.inv(T.observe, T.observe + 0.35, t);
  const s = 1 + 0.18 * Math.sin(bump * Math.PI);
  c.save(); c.translate(LOOP_C[0], LOOP_C[1]); c.scale(s * K.popS(app), s * K.popS(app));
  K.pix(c, "clock", 0, -62, 6, P.violet, { glow: 0.8 });
  K.seg7(c, "0" + n, 0, 26, 92, P.phosphor);
  c.restore();
  /* readouts pop beside each pod as the light lands */
  const pod = (i) => { const a = -Math.PI / 2 + (i / 3) * K.TAU; return [LOOP_C[0] + Math.cos(a) * LOOP_R, LOOP_C[1] + Math.sin(a) * LOOP_R]; };
  const pop = (t0) => K.inv(t0, t0 + 0.35, t) * (1 - K.inv(t0 + 3.2, t0 + 3.5, t));
  /* observe: a tiny live chart next to the eye */
  const o0 = pod(0), oa = Math.max(pop(T.observe), pop(T.again));
  if (oa > 0) K.wallScreen(c, o0[0] + 150, o0[1] - 80, 300, 170, (cc, w, h) => K.plot(cc, w, h, [{ data: [3, 4, 3.6, 5, 4.6, 6, 5.7, 7.2], color: P.green }], { draw: K.inv(T.observe, T.observe + 1, t), grid: false }), { a: oa, seed: 83, glow: P.green });
  /* decide: an up arrow with a confidence number */
  const o1 = pod(1), da = pop(T.decide);
  if (da > 0) { K.tag(c, o1[0] + 30, o1[1] + 150, "0.82", { a: da, size: 34, color: P.pink, seed: 84 }); K.pix(c, "up", o1[0] + 150, o1[1] + 150, 8, P.green, { glow: 1, a: Math.min(1, da * 2) }); }
  /* act: a ticket flies out of the bolt pod */
  const o2 = pod(2), aa = K.inv(T.act, T.act + 0.6, t);
  if (aa > 0 && aa < 1) K.ticket(c, K.lerp(o2[0], o2[0] - 330, K.E.out3(aa)), K.lerp(o2[1], o2[1] + 110, K.E.out3(aa)) - 120 * Math.sin(aa * Math.PI), 1.3, { sym: "NVDA", dir: "up", qty: "100", rot: -0.3 * aa, a: Math.min(1, aa * 4) * (1 - K.inv(0.8, 1, aa)), seed: 85 });
  if (t >= T.act + 0.6 && t < T.again + 1.5) K.ticket(c, o2[0] - 330, o2[1] + 110, 1.3, { sym: "NVDA", dir: "up", qty: "100", rot: -0.3, stamp: K.inv(T.act + 0.6, T.act + 0.85, t), seed: 85 });
  [T.observe, T.decide, T.act, T.again].forEach((ta, i) => { const p = pod(i % 3); K.sparks(c, p[0], p[1], ta, { seed: 160 + i, r: 190, n: 12, color: LOOP_STEPS[i % 3].color, size: 16 }); });
  /* phosphor scanlines */
  c.fillStyle = "rgba(0,0,0,0.22)"; for (let y = -200; y < 1280; y += 6) c.fillRect(-200, y, 2320, 2);
}

/* ============================================================
   INTRO 50 TITLE SET: the neon sign over the whole team.
   "AI Agents for Trading, here they come!": the sign buzzes on, letters
   flicker on one by one (DOM text, per language), the team bounces in.
   Tag line "AI Agents for Trading!": everyone jumps, five episode
   medallions pop on eighth notes, pixel confetti falls.
   ============================================================ */
const SIGN = { cx: 960, cy: 256, w: 1500, h: 360 };
const MEDAL_Y = 514, MEDAL_R = 48;
/* five episodes, language-free: agentic revolution, open-source hedge fund team,
   AI4Finance foundation, daily stock-analysis agent, agent harness */
const MEDALS = [["rocket", P.orange], ["team", P.pink], ["globe", P.cyan], ["chart", P.green], ["harness", P.violet]];
const TITLE_BOTS = [
  { kind: "analyst", x: 300, y: 1050, s: 1.0, seed: 811, hold: { L: "lens" } },
  { kind: "trader", x: 620, y: 1055, s: 1.0, seed: 857 },
  { kind: "risk", x: 1310, y: 1055, s: 1.0, seed: 833, hold: { L: "shield" } },
];
/* neon sign brightness: stuttering ignition, then a buzz pulse on every bar */
function signOn(t) {
  if (t < T.title) return 0;
  const d = t - T.title, f = Math.floor(d * 24);
  if (d < 0.42) return [1, 0.2, 0.9, 0, 0, 1, 0.3, 1, 1, 0.1, 1][f % 11];
  return K.flick(t, 9, 0.35) * (1 + 0.25 * pulseA(t));
}
function titlePose(i, t) {
  const m = TITLE_BOTS[i], b = K.pulse(t - i * 0.07, 1, 6);
  const st = { kind: m.kind, seed: m.seed, blink: K.blinkAt(t, 21 + i * 5), mouth: "smile", eyes: "happy", look: [i === 2 ? -0.6 : 0.6, -0.4], squash: 0.1 * b - 0.04, bulb: b, chest: b, hold: m.hold };
  st.armL = { x: -104, y: -150, open: 0.2 }; st.armR = { x: 104, y: -150 - 20 * b, open: 0.3 };
  if (m.kind === "analyst") st.armL = { x: -120, y: -230, open: 0.1, rot: 200 };
  /* staggered jump on the beat before the tag, and again on the tag */
  [T.jump + i * BEAT / 2, T.medals + i * BEAT / 4].forEach((tj) => {
    st.squash += 0.3 * K.ss(tj - 0.22, tj, t) * (1 - K.ss(tj, tj + 0.05, t));
    const h = hopArc(t, tj, tj + 0.46, 90); if (h > 0) { st.hop = h; st.squash = -0.16; st.armR = { x: 120, y: -330, open: 0.9 }; st.mouth = "open"; }
    st.squash += land(t, tj + 0.46, 0.35);
  });
  if (t > T.medals) st.eyes = i === 1 ? "dollar" : "heart";
  return st;
}
function titleBeepo(t) {
  const b = pulseB(t);
  const st = { kind: "lead", seed: 700, blink: K.blinkAt(t, 3), eyes: "happy", mouth: "talk", talk: 0.4 + 0.6 * b, squash: 0.1 * b - 0.04, bulb: b, chest: b, look: [0, -0.5] };
  st.armL = { x: -150, y: -300 - 20 * b, open: 0.8 }; st.armR = { x: 150, y: -300 - 20 * b, open: 0.8 }; /* "here they come!" arms up */
  /* entrance: drops in from above on the title downbeat with a big squash */
  const drop = K.inv(T.title, T.title + 0.36, t);
  st.hop = drop < 1 ? 520 * (1 - K.E.in3(drop)) : 0;
  st.squash += land(t, T.title + 0.36, 0.5);
  if (st.hop > 0) { st.squash = -0.25; st.eyes = "wide"; st.mouth = "o"; }
  /* tag: big jump, hearts */
  const tj = T.medals;
  st.squash += 0.34 * K.ss(tj - 0.25, tj, t) * (1 - K.ss(tj, tj + 0.05, t));
  const h = hopArc(t, tj, tj + 0.55, 130); if (h > 0) { st.hop = h; st.squash = -0.2; }
  st.squash += land(t, tj + 0.55, 0.45);
  if (t > tj) { st.eyes = "heart"; st.heartPop = ((t - tj) % 0.9) / 0.9; }
  /* final bar: wave goodbye with the right arm */
  if (t > T.final) {
    const r = K.ss(T.final, T.final + 0.3, t), w = Math.sin((t - T.final) * 9);
    st.armR = { x: 150 + 30 * w * r, y: K.lerp(-300, -320, r), open: 0.6 }; st.armL = { x: -110, y: -160, open: 0.3 };
    st.eyes = "happy"; st.mouth = "smile"; st.heartPop = 0;
  }
  return st;
}

function drawTitleSet(t) {
  K.begin(ctx, t, { x: 960, y: 540, z: K.tw(t, T.title, DUR, 1.04, 1.0, K.E.out3), rot: 0 });
  K.applyCam(ctx, 1);
  const hz = 760;
  K.wall(ctx, -200, 2120, -200, hz, { seed: 5 });
  K.floorGrid(ctx, -200, 2120, hz, 600, { vx: 960, scroll: t * 0.8, rows: 12, cols: 30, spread: 220, color: P.violet });
  K.neon(ctx, [[-200, 30], [2120, 30]], { color: P.pink, w: 7, on: signOn(t) * 0.7, seed: 6, boil: 0 });
  /* PnL board on a stand (right) */
  K.line(ctx, [[1640, 960], [1640, 760]], { w: 14, stroke: P.ink, boil: 0.4, seed: 7 });
  K.line(ctx, [[1640, 960], [1640, 760]], { w: 6, stroke: P.metal, boil: 0.4, seed: 7 });
  K.scoreboard(ctx, 1640, 700, 330, 170, [{ v: t > T.medals ? "+12.4%" : "+2.6%", c: P.green }], { seed: 16, label: "PNL", bump: K.inv(T.medals, T.medals + 0.35, t), a: K.inv(T.title + 0.3, T.title + 0.6, t) });
  /* bots */
  TITLE_BOTS.forEach((m, i) => {
    const a = K.inv(T.title + 0.1 + i * 0.12, T.title + 0.4 + i * 0.12, t); if (a <= 0) return;
    K.shape(ctx, K.ellipsePts(m.x, m.y + 6, 80, 16, 14), { fill: P.ink, stroke: null, w: 0, boil: 0.3, seed: 60 + i, alpha: 0.6 });
    ctx.save(); ctx.translate(m.x, m.y); const s = K.E.back(a, 2.4); ctx.scale(s, s); ctx.translate(-m.x, -m.y);
    K.robot(ctx, m.x, m.y, m.s, titlePose(i, t)); ctx.restore();
  });
  K.shape(ctx, K.ellipsePts(960, 1056, 100, 20, 14), { fill: P.ink, stroke: null, w: 0, boil: 0.3, seed: 66, alpha: 0.6 });
  K.beepo(ctx, 960, 1062, 1.24, titleBeepo(t));
  K.sparks(ctx, 960, 1040, T.title + 0.36, { seed: 170, r: 220, n: 14, color: P.yellow });
  /* sign */
  const on = signOn(t);
  const box = K.neonSign(ctx, SIGN.cx, SIGN.cy, SIGN.w, SIGN.h, { on, a: K.inv(T.title - 0.05, T.title + 0.25, t), seed: 91 });
  if (on > 0.5) K.glow(ctx, SIGN.cx, SIGN.cy, 900, K.rgba(P.pink, 0.16), on);
  /* medallions: tiny CRT tiles, eighth notes after the tag */
  MEDALS.forEach((md, i) => {
    const t0 = T.medals + i * BEAT / 2, a = K.inv(t0, t0 + 0.35, t); if (a <= 0) return;
    const s = K.E.back(a, 2.6), x = 960 + (i - 2) * 150, y = MEDAL_Y + 5 * Math.sin(t * 2.6 + i) - 8 * K.pulse(t - i * 0.08, 1, 6);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    K.glow(ctx, 0, 0, 90, K.rgba(md[1], 0.5), 1);
    K.shape(ctx, K.rrPts(-MEDAL_R, -MEDAL_R, MEDAL_R * 2, MEDAL_R * 2, 16, 2), { fill: P.screen, w: 5, boil: 0.5, seed: 600 + i * 7, rim: { color: md[1], dx: 4, dy: 4, a: 0.9 } });
    K.pix(ctx, md[0], 0, 0, 8.6, md[1], { glow: 0.7 });
    ctx.restore();
  });
  K.confetti(ctx, 0, 1920, -60, T.medals, { n: 70, fall: 480, seed: 81 });
  return box;
}

function layoutTitleDom(t) {
  const on = signOn(t);
  titleEl.style.opacity = t >= T.letters ? "1" : "0";
  if (t < T.letters) return;
  const n = TITLE_LN.length, sizes = TITLE_LN.map((d) => +d.dataset.size), gap = 14;
  const total = sizes.reduce((a, b) => a + b, 0) + gap * (n - 1);
  let y = SIGN.cy - total / 2 - 8;
  TITLE_LN.forEach((d, i) => { d.style.top = y.toFixed(1) + "px"; y += sizes[i] + gap; });
  TITLE_CH.forEach((c) => {
    /* each letter ignites with its own short stutter (neon), then follows the sign's buzz */
    const t0 = T.letters + c.idx * 0.05, d = t - t0;
    let o = 0;
    if (d >= 0) { const f = Math.floor(d * 24); o = f < 6 ? [1, 0.15, 0.8, 0, 1, 0.6][f] : 1; }
    o *= Math.min(1, 0.55 + 0.45 * on);
    const pop = d >= 0 && d < 0.25 ? 1 + 0.12 * Math.sin((d / 0.25) * Math.PI) : 1;
    const hopY = c.line === n - 1 && t > T.medals ? -8 * K.pulse(t, 2, 6) : 0; /* second line bounces on half notes after the tag */
    c.el.style.opacity = o.toFixed(2);
    c.el.style.transform = `translateY(${hopY.toFixed(1)}px) scale(${pop.toFixed(3)})`;
  });
}

/* ============================================================
   INTRO 70 RENDER: render(t) is the whole film. One paused GSAP timeline
   drives a proxy whose setter calls render(t).
    0.00 -  2.24  CRT power-on; close-up: Beepo boots (static, eyes, look)
    2.24 -  6.46  "Beep boop, the signals run": hop, pull back to the floor,
                  candles draw, cables light, pulses run to the team
    6.46 - 10.15  "Agents trade till the day is done": Beepo hops over and
                  conducts; tickets go analyst -> risk (stamp) -> trader ->
                  tube; dusk falls, the clock runs 09:30 -> 16:00
   10.15 - 10.70  dive into Beepo's face screen (diegetic transition)
   10.70 - 14.53  "Observe, decide, then act again": the agent loop ring
   14.53 - 14.95  CRT power-off squeeze
   14.95 - 20.50  "AI Agents for Trading, here they come!": neon sign title
   ============================================================ */
const FACE_SCALE = (2060 / 1920); /* loop scene scale when the face fills the frame */

/* the loop scene drawn inside Beepo's screen during the dive */
function faceLoop(t) {
  return (c, w, h) => { c.save(); c.translate(w / 2, h / 2); const s = w / 1920; c.scale(s, s); c.translate(-960, -540); drawLoopScene(c, t); c.restore(); };
}

/* CRT power-on / power-off: a bright line that opens to the full frame (u 0..1 = open) */
function crtMask(u, draw) {
  K.screen(ctx);
  ctx.fillStyle = "#020208"; ctx.fillRect(0, 0, 1920, 1080);
  if (u <= 0) return;
  const k = K.E.out3(K.clamp(u, 0, 1)), sx = K.clamp(u * 3, 0.02, 1), h = Math.max(3, 1080 * K.clamp((k - 0.15) / 0.85, 0, 1));
  ctx.save(); ctx.beginPath(); ctx.rect(960 - 960 * sx, 540 - h / 2, 1920 * sx, h); ctx.clip();
  draw(); ctx.restore();
  K.screen(ctx);
  const flash = 1 - K.clamp(u * 1.4, 0, 1);
  if (flash > 0) {
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = `rgba(200,240,255,${(0.9 * flash).toFixed(2)})`;
    ctx.fillRect(960 - 960 * sx, 540 - h / 2 - 3, 1920 * sx, h + 6); ctx.restore();
    K.glow(ctx, 960, 540, 700 * sx, "rgba(160,230,255,0.9)", flash);
  }
}
/* squeeze a full-frame drawing into a line, then a dot (u 0..1 = closing) */
function crtOff(u, draw) {
  K.screen(ctx);
  ctx.fillStyle = "#020208"; ctx.fillRect(0, 0, 1920, 1080);
  const sy = u < 0.55 ? K.lerp(1, 0.004, K.E.in3(u / 0.55)) : 0.004, sx = u < 0.55 ? 1 : K.lerp(1, 0.01, K.E.out3((u - 0.55) / 0.45));
  ctx.save(); ctx.translate(960, 540); ctx.scale(sx, sy); ctx.translate(-960, -540); draw(); ctx.restore();
  K.screen(ctx);
  const b = K.clamp(u * 2, 0, 1);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = `rgba(210,245,255,${(0.85 * b * K.clamp((0.25 - sy) / 0.2, 0, 1)).toFixed(2)})`;
  ctx.fillRect(960 - 960 * sx, 540 - Math.max(2, 540 * sy), 1920 * sx, Math.max(4, 1080 * sy)); ctx.restore();
  K.glow(ctx, 960, 540, 200 + 600 * sx, "rgba(160,230,255,0.9)", K.clamp((0.25 - sy) / 0.2, 0, 1) * (1 - K.inv(0.85, 1, u)));
  return { sx, sy };
}

function drawLoopFull(t) {
  K.screen(ctx); ctx.save(); ctx.translate(960, 540); ctx.scale(FACE_SCALE, FACE_SCALE); ctx.translate(-960, -540);
  drawLoopScene(ctx, t); ctx.restore();
}

function render(t) {
  try {
    K.begin(ctx, t, { x: 960, y: 540, z: 1 });
    titleEl.style.opacity = "0"; titleEl.style.transform = "";
    if (t < T.dive[1]) {
      /* 1-3: the floor (opens through a CRT power-on) */
      const floor = () => drawFloor(t, camFloor(t));
      if (t < T.powerOn[1]) crtMask(K.inv(T.powerOn[0], T.powerOn[1], t), floor);
      else floor();
    } else if (t < T.crtOff[0]) {
      drawLoopFull(t);
    } else if (t < T.title) {
      if (t < T.crtOff[1]) crtOff(K.inv(T.crtOff[0], T.crtOff[1], t), () => drawLoopFull(t));
      else { K.screen(ctx); ctx.fillStyle = "#020208"; ctx.fillRect(0, 0, 1920, 1080); K.glow(ctx, 960, 540, 60 * (1 - K.inv(T.crtOff[1], T.title, t)), "rgba(160,230,255,0.9)", 1); }
    } else {
      /* 5: title set, opens with a power-on; the whole frame powers off over the last 0.4 s */
      const endU = K.inv(DUR - 0.42, DUR - 0.02, t);
      if (t < T.title + 0.3) crtMask(K.inv(T.title, T.title + 0.3, t), () => drawTitleSet(t));
      else if (endU > 0) {
        const s = crtOff(endU, () => drawTitleSet(t));
        titleEl.style.transformOrigin = "960px 540px"; titleEl.style.transform = `scale(${s.sx.toFixed(3)}, ${s.sy.toFixed(3)})`;
      } else drawTitleSet(t);
      layoutTitleDom(t);
    }
  } catch (err) {
    /* never leave a black frame silently: draw the error so a snapshot shows it */
    K.screen(ctx); ctx.fillStyle = "#300"; ctx.fillRect(0, 0, 1920, 80); ctx.fillStyle = "#fff"; ctx.font = "28px monospace"; ctx.fillText(String(err && err.stack || err).slice(0, 140), 20, 50);
  }
  /* rolling CRT bright band, continuous time */
  rollEl.style.transform = `translateY(${(((t * 0.32) % 1) * 1500).toFixed(1)}px)`;
}

const rollEl = document.getElementById("roll");
const TL = gsap.timeline({ paused: true });
const drv = { _t: 0 };
Object.defineProperty(drv, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
TL.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
render(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(drv._t));
window.__timelines["main"] = TL;
window.__render = render;

})();
    </script>
  </body>
