    <script>
(function () {
/* ============================================================
   KIT 00 CORE: math, seeded random, noise, splines, beat grid, boil clock
   Every frame is a pure function of time t (seconds). No Math.random,
   no Date.now, no performance.now anywhere in the kit.
   ============================================================ */
var SK = window.SK || (window.SK = {});
(function (K) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const ss = (a, b, t) => { const u = inv(a, b, t); return u * u * (3 - 2 * u); };
  const f1 = (n) => Math.round(n * 10) / 10;
  const f2 = (n) => Math.round(n * 100) / 100;

  /* eases (u in 0..1) */
  const E = {
    inOut: (u) => u * u * (3 - 2 * u),
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    back: (u, s) => { s = s == null ? 1.7 : s; const v = u - 1; return 1 + v * v * ((s + 1) * v + s); },
    elastic: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
  };
  /* tween value from a to b during [t0, t1] with an ease */
  const tw = (t, t0, t1, a, b, ease) => lerp(a, b, (ease || E.inOut)(inv(t0, t1, t)));

  /* seeded PRNG (mulberry32) */
  function mulberry(seed) {
    let s = seed | 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let q = Math.imul(s ^ (s >>> 15), 1 | s);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* stateless hash -> [0,1) for (i, seed) */
  function hash(i, s) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const hs = (i, s) => hash(i, s) * 2 - 1; /* signed */
  function vnoise(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s), hash(i + 1, s), u); }
  function fbm(x, s, oct) { let a = 0.5, v = 0, fr = 1, n = 0; for (let k = 0; k < (oct || 3); k++) { v += a * vnoise(x * fr, s + k * 17); n += a; a *= 0.5; fr *= 2.03; } return v / n; }

  /* monotone cubic Hermite spline through [[t, v], ...] (no overshoot) */
  function mkSpline(pts) {
    const n = pts.length, T = pts.map((p) => p[0]), V = pts.map((p) => p[1]);
    if (n === 1) return () => V[0];
    const d = [], m = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) d[i] = (V[i + 1] - V[i]) / (T[i + 1] - T[i]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
    }
    return function (x) {
      x = clamp(x, T[0], T[n - 1]);
      let i = 0; while (i < n - 2 && x >= T[i + 1]) i++;
      const h = T[i + 1] - T[i], u = (x - T[i]) / h, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * V[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * V[i + 1] + (u3 - u2) * h * m[i + 1];
    };
  }
  /* keys: [[t, {a:.., b:..}], ...] -> fn(t) -> {a, b} (one spline per channel) */
  function mkTrack(keys) {
    const names = Object.keys(keys[0][1]), sp = {};
    names.forEach((k) => { sp[k] = mkSpline(keys.map((q) => [q[0], q[1][k]])); });
    return (t) => { const o = {}; names.forEach((k) => (o[k] = sp[k](t))); return o; };
  }

  /* ---------- beat grid (retime to the real song by changing BPM/OFFSET or BARS) ----------
     BARS: optional list of measured downbeat times (seconds). Songs cut from
     several takes drift a few ms per splice, so measured downbeats beat a
     single OFFSET. Past the list, bars extrapolate at BPM. */
  const G = { BPM: 120, OFFSET: 0, BEATS_PER_ACCENT: 4, BARS: null };
  const beatLen = () => 60 / G.BPM;
  const barLen = () => beatLen() * G.BEATS_PER_ACCENT;
  function barStart(b) {
    const B = G.BARS;
    if (!B || !B.length) return G.OFFSET + b * barLen();
    if (b < 0) return B[0] + b * barLen();
    if (b < B.length) return B[b];
    return B[B.length - 1] + (b - B.length + 1) * barLen();
  }
  /* time of bar b (0-based, an "accent" = 4 beats) plus beat k (fractional ok) */
  const at = (bar, beat) => barStart(Math.floor(bar)) + ((bar - Math.floor(bar)) * G.BEATS_PER_ACCENT + (beat || 0)) * beatLen();
  /* index of the bar containing t (-1 before the first downbeat) */
  function barAt(t) {
    if (t < barStart(0)) return -1;
    let b = 0; while (barStart(b + 1) <= t) b++;
    return b;
  }
  /* 1 on the beat, decaying to 0 before the next beat (k = sharpness) */
  function pulse(t, everyBeats, k) {
    const b = barAt(t); if (b < 0) return 0;
    const L = beatLen() * (everyBeats || 1), x = t - barStart(b);
    return Math.exp(-(k || 7) * ((x % L) / L));
  }
  const beatIndex = (t) => { const b = barAt(t); return b < 0 ? -1 : b * G.BEATS_PER_ACCENT + Math.floor((t - barStart(b)) / beatLen()); };

  /* ---------- line boil clock: drawings change 12 times per second ---------- */
  const BOIL_FPS = 12;
  const boilFrame = (t) => Math.floor(t * BOIL_FPS);

  Object.assign(K, { clamp, lerp, inv, ss, f1, f2, E, tw, mulberry, hash, hs, vnoise, fbm, mkSpline, mkTrack,
    G, beatLen, barLen, barStart, barAt, at, pulse, beatIndex, BOIL_FPS, boilFrame, TAU: Math.PI * 2 });
})(SK);

var SK = window.SK || (window.SK = {});
(function (K) {
  K.P = {
    /* the four inks */
    ink: "#2a2a2e",          /* key plate: all lines, dark type */
    inkSoft: "#4d4b52",      /* secondary lines, halftone on cream */
    cream: "#f3e6c8",        /* paper, signs, light type */
    creamShade: "#e0cfa6",
    creamDeep: "#cdb88a",
    mustard: "#e2a42b", mustardDark: "#b07a12", mustardLight: "#f3c95f",
    teal: "#2a7b78", tealDark: "#1b5654", tealLight: "#5fa79c", tealPale: "#a7d0c3",
    /* the one accent (impact, loss, ask) */
    tomato: "#d65a3a", tomatoDark: "#a23e26", tomatoLight: "#ec8a6c",
    /* mascot: Mr. Tick, the stationmaster mouse */
    fur: "#b4aa9c", furDark: "#8a8073", furLight: "#d8d0c2", earPink: "#ec9a86", nose: "#2a2a2e",

    const o = Object.assign({ color: P.mustard, seed: 1, hole: 0.32, w: 2.5 }, opt || {});
    const pts = [], n = teeth * 4;
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * K.TAU, q = i % 4, rr = q === 1 || q === 2 ? r : r * 0.82;
      pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    K.shape(ctx, pts, { fill: o.color, w: o.w, boil: 0.5, seed: o.seed, shade: { color: P.mustardDark, dx: r * 0.08, dy: r * 0.1 } });
    K.shape(ctx, K.ellipsePts(x, y, r * o.hole, r * o.hole, 16), { fill: P.ink, key: null, boil: 0.3, seed: o.seed + 1, smooth: true, reg: 0 });
    for (let i = 0; i < 4; i++) { const a = rot + (i / 4) * K.TAU + 0.4; K.dot(ctx, x + Math.cos(a) * r * 0.58, y + Math.sin(a) * r * 0.58, r * 0.09, P.cream, P.ink, 1.8, o.seed + 3 + i); }
  };
  /* clock face; hour and minute in "clock hours" (minute hand = frac part) */
  K.clockFace = function (ctx, x, y, r, opt) {
    const o = Object.assign({ hour: 10, minute: 10, seed: 1, rim: P.mustard, face: P.cream }, opt || {});
    K.shape(ctx, K.ellipsePts(x, y, r * 1.12, r * 1.12, 40), { fill: o.rim, w: 3.5, boil: 0.6, seed: o.seed, smooth: true, shade: { color: P.mustardDark, dx: r * 0.06, dy: r * 0.08 } });
    K.shape(ctx, K.ellipsePts(x, y, r, r, 40), { fill: o.face, w: 3, boil: 0.5, seed: o.seed + 1, smooth: true, tone: { color: P.creamDeep, gap: 9, r: 0, r2: 3, dir: Math.PI * 0.3, alpha: 0.5 } });
    ctx.save(); ctx.strokeStyle = P.ink; ctx.lineCap = "butt";
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * K.TAU, big = i % 3 === 0, r0 = r * (big ? 0.72 : 0.8);
      ctx.lineWidth = K.lw(ctx, big ? r * 0.09 : r * 0.04); ctx.beginPath();
      ctx.moveTo(x + Math.sin(a) * r0, y - Math.cos(a) * r0); ctx.lineTo(x + Math.sin(a) * r * 0.9, y - Math.cos(a) * r * 0.9); ctx.stroke();
    }
    ctx.restore();
    const ah = (o.hour / 12) * K.TAU, am = (o.minute / 60) * K.TAU;
    const hand = (a, L, w, c, s) => K.shape(ctx, [[x - Math.sin(a) * L * 0.15 - Math.cos(a) * w, y + Math.cos(a) * L * 0.15 - Math.sin(a) * w], [x + Math.sin(a) * L, y - Math.cos(a) * L], [x - Math.sin(a) * L * 0.15 + Math.cos(a) * w, y + Math.cos(a) * L * 0.15 + Math.sin(a) * w]], { fill: c, w: 2, boil: 0.3, seed: s, reg: 1 });
    hand(ah, r * 0.5, r * 0.07, P.ink, o.seed + 5);
    hand(am, r * 0.78, r * 0.05, P.tomato, o.seed + 6);
    K.dot(ctx, x, y, r * 0.07, P.mustard, P.ink, 2, o.seed + 7);
  };
  /* tower with a big clock and a gear window; y = ground */
  K.clockTower = function (ctx, x, y, s, opt) {

    /* mustard trim bands */
    [-H + 40, -330].forEach((yy, i) => K.shape(ctx, K.rectPts(-W / 2 - 14, yy, W + 28, 26, 3), { fill: P.mustard, w: 3, seed: o.seed + 1 + i, shade: { color: P.mustardDark, dx: 0, dy: -9 } }));
    K.shape(ctx, K.rectPts(-W / 2 - 20, -24, W + 40, 24, 3), { fill: P.ink, w: 3, seed: o.seed + 4, reg: 0 });
    /* roof: tall triangle with a star finial */
    K.shape(ctx, [[-W / 2 - 30, -H + 40], [0, -H - 220], [W / 2 + 30, -H + 40]], { fill: P.tomato, w: 3.5, seed: o.seed + 5, shade: { color: P.tomatoDark, dx: -60, dy: 0 } });
    K.line(ctx, [[0, -H - 220], [0, -H - 270]], { w: 4, seed: o.seed + 6 });
    K.star(ctx, 0, -H - 290, 30, { rot: K.now * 0.6, seed: o.seed + 7 });

    K.clockFace(ctx, 0, -H + 170, 104, { hour: o.hour, minute: o.minute, seed: o.seed + 10 });
    /* gear window (porthole into the clockwork) */
    const gy = -205;
    K.shape(ctx, K.ellipsePts(0, gy, 92, 92, 32), { fill: P.ink, w: 3.5, seed: o.seed + 20, reg: 0, smooth: true });
    ctx.save(); K.pathOf(ctx, K.ellipsePts(0, gy, 86, 86, 32), true, true); ctx.clip();
    K.gear(ctx, -24, gy - 18, 58, 10, o.gearRot, { seed: o.seed + 21 });
    K.gear(ctx, 50, gy + 46, 42, 8, -o.gearRot * 1.25 + 0.2, { seed: o.seed + 24, color: P.cream });

    ctx.restore();
    K.shape(ctx, K.ellipsePts(0, gy, 92, 92, 32), { fill: null, key: P.mustard, w: 8, seed: o.seed + 29, smooth: true });
    ctx.restore();
  };

  /* ---------- the station ---------- */
  K.platform = function (ctx, x0, x1, y, opt) {
    const o = Object.assign({ h: 70, seed: 60 }, opt || {});
    K.shape(ctx, K.rectPts(x0, y, x1 - x0, o.h, 6), { fill: P.creamShade, w: 3, seed: o.seed, tone: { color: P.ink, gap: 10, r: 0.5, r2: 2.8, dir: Math.PI / 2, alpha: 0.25 } });
    K.shape(ctx, K.rectPts(x0, y, x1 - x0, 14, 6), { fill: P.mustard, w: 2.5, seed: o.seed + 1 });
    /* safety stripes */
    ctx.save(); ctx.fillStyle = P.ink;
    for (let x = x0 + 10; x < x1 - 20; x += 36) { ctx.beginPath(); ctx.moveTo(x, y + 14); ctx.lineTo(x + 16, y + 14); ctx.lineTo(x + 6, y); ctx.lineTo(x - 10, y); ctx.closePath(); ctx.globalAlpha = 0.85; ctx.fill(); }
    ctx.restore();
  };
  /* side-view track: sleepers + one rail; y = rail top */
  K.track = function (ctx, x0, x1, y, opt) {
    const o = Object.assign({ seed: 70, ballast: true }, opt || {});
    if (o.ballast) K.shape(ctx, [[x0, y + 26], [x1, y + 26], [x1, y + 60], [x0, y + 60]], { fill: P.creamDeep, w: 2.5, seed: o.seed, tone: { color: P.ink, gap: 8, r: 1.6, r2: 1.6, alpha: 0.35 } });
    ctx.save(); ctx.fillStyle = P.woodDark;
    for (let x = Math.ceil(x0 / 46) * 46; x < x1; x += 46) { const j = hs(x, o.seed + K.bf) * 0.6; ctx.fillRect(x - 12 + j, y + 8, 24, 20); }
    ctx.restore();
    K.shape(ctx, K.rectPts(x0, y, x1 - x0, 10, 12), { fill: P.steelLight, w: 2.5, seed: o.seed + 1, boil: 0.4 });
  };
  K.lampPost = function (ctx, x, y, h, seed) {
    K.shape(ctx, K.rectPts(x - 6, y - h, 12, h, 3), { fill: P.ink, w: 2, seed, reg: 0 });
    K.shape(ctx, [[x - 34, y - h], [x + 34, y - h], [x + 20, y - h - 30], [x - 20, y - h - 30]], { fill: P.teal, w: 2.5, seed: seed + 1 });
    K.dot(ctx, x, y - h + 12, 14, P.mustardLight, P.ink, 2.5, seed + 2);
  };

  /* ---------- rolling stock ---------- */
  K.wheel = function (ctx, x, y, r, rot, seed) {
    K.shape(ctx, K.ellipsePts(x, y, r, r, 20), { fill: P.steel, w: 3, seed, smooth: true, shade: { color: P.steelDark, dx: r * 0.15, dy: r * 0.2 } });
    ctx.save(); ctx.strokeStyle = P.ink; ctx.lineWidth = K.lw(ctx, Math.max(2, r * 0.1)); ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = rot + (i / 3) * Math.PI; ctx.moveTo(x - Math.cos(a) * r * 0.78, y - Math.sin(a) * r * 0.78); ctx.lineTo(x + Math.cos(a) * r * 0.78, y + Math.sin(a) * r * 0.78); }
    ctx.stroke(); ctx.restore();
    K.dot(ctx, x, y, r * 0.24, P.mustard, P.ink, 2, seed + 1);
  };
  /* freight crate; (x, y) = bottom centre */
  K.crate = function (ctx, x, y, w, h, opt) {
    const o = Object.assign({ color: P.mustard, shade: P.mustardDark, label: "", labelSize: 0, seed: 80, slices: 0, sliceU: 0, a: 1, labelColor: P.ink }, opt || {});
    if (o.a <= 0) return;
    ctx.save(); ctx.globalAlpha *= clamp(o.a, 0, 1);
    K.shape(ctx, K.rectPts(x - w / 2, y - h, w, h, 3), { fill: o.color, w: 3.5, seed: o.seed, shade: { color: o.shade, dx: -w * 0.08, dy: -h * 0.06 } });
    /* planks */
    ctx.save(); ctx.strokeStyle = P.ink; ctx.globalAlpha *= 0.55; ctx.lineWidth = K.lw(ctx, 2);
    const np = Math.max(2, Math.round(h / 34)); ctx.beginPath();
    for (let i = 1; i < np; i++) { const yy = y - h + (h * i) / np; ctx.moveTo(x - w / 2 + 6, yy); ctx.lineTo(x + w / 2 - 6, yy); }
    ctx.stroke(); ctx.restore();
    /* corner brackets */
    const b = Math.min(w, h) * 0.16;
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy], i) => {
      const cx = x + sx * (w / 2), cy = y - h / 2 + sy * (h / 2);
      K.shape(ctx, [[cx, cy], [cx - sx * b, cy], [cx - sx * b, cy - sy * b * 0.35], [cx - sx * b * 0.35, cy - sy * b * 0.35], [cx - sx * b * 0.35, cy - sy * b], [cx, cy - sy * b]], { fill: P.ink, key: null, boil: 0.3, seed: o.seed + 10 + i, reg: 0 });
    });
    if (o.label) K.text(ctx, o.label, x, y - h / 2 + 2, { size: o.labelSize || Math.min(h * 0.36, w / (o.label.length * 0.62)), weight: 700, font: K.FONT.mono, fill: o.labelColor });
    /* slicing: dashed cut lines draw one after another (vertical cuts, then
       horizontal cuts when rows > 1), so a parent order splits into slices x rows pieces */
    const rows = o.rows || 1, cuts = [];
    for (let i = 1; i < o.slices; i++) cuts.push([x - w / 2 + (w * i) / o.slices, y - h - 14, 0, h + 28]);
    for (let j = 1; j < rows; j++) cuts.push([x - w / 2 - 14, y - h + (h * j) / rows, w + 28, 0]);
    if (cuts.length && o.sliceU > 0) cuts.forEach((q, i) => {
      const u = clamp(o.sliceU * cuts.length - i, 0, 1); if (u <= 0) return;
      K.line(ctx, [[q[0], q[1]], [q[0] + q[2] * u, q[1] + q[3] * u]], { key: P.ink, w: 4, boil: 0.4, seed: o.seed + 40 + i, dash: [16, 10], cap: "butt" });
    });
    ctx.restore();
  };
  /* flat wagon; (x, y) = rail top under the wagon centre. roll = distance travelled (wheel spin) */
  K.wagon = function (ctx, x, y, s, opt) {
    const o = Object.assign({ color: P.teal, shade: P.tealDark, roll: 0, seed: 90, load: null, bob: 0, coupler: true }, opt || {});
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const r = 22, rot = o.roll / r;
    K.wheel(ctx, -50, -r, r, rot, o.seed);
    K.wheel(ctx, 50, -r, r, rot + 0.5, o.seed + 3);
    ctx.translate(0, o.bob);
    if (o.coupler) { K.line(ctx, [[-96, -40], [-80, -40]], { w: 6, seed: o.seed + 9 }); K.line(ctx, [[80, -40], [96, -40]], { w: 6, seed: o.seed + 10 }); }
    K.shape(ctx, K.rectPts(-82, -58, 164, 26, 4), { fill: o.color, w: 3, seed: o.seed + 6, shade: { color: o.shade, dx: 0, dy: -10 } });
    if (o.load) o.load(ctx); /* drawn in wagon space: deck top is y = -58 */
    ctx.restore();
  };
  /* steam locomotive facing right; (x, y) = rail top under the cab/boiler joint.
     cab(ctx) draws whoever rides in the cab window (wagon space, window centre (-92, -158)) */
  K.loco = function (ctx, x, y, s, opt) {
    const o = Object.assign({ roll: 0, seed: 120, cab: null, bob: 0 }, opt || {});
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const rot = o.roll / 34;
    /* chassis */
    K.shape(ctx, K.rectPts(-150, -78, 330, 30, 4), { fill: P.ink, w: 3, seed: o.seed, reg: 0 });
    /* driving wheels + rod */
    const wx = [-110, -30, 50];
    wx.forEach((xx, i) => K.wheel(ctx, xx, -34, 34, rot + i * 0.3, o.seed + 2 + i * 3));
    K.wheel(ctx, 135, -22, 22, o.roll / 22, o.seed + 14);
    const rx = Math.cos(rot) * 16, ry = Math.sin(rot) * 16;
    K.shape(ctx, K.rrectPts(-118 + rx, -40 + ry, 176, 12, 6, 3), { fill: P.steelLight, w: 2.5, seed: o.seed + 16 });
    ctx.translate(0, o.bob);
    /* cowcatcher */
    K.shape(ctx, [[176, -78], [214, -10], [176, -10]], { fill: P.tomato, w: 3, seed: o.seed + 18 });
    /* boiler */
    K.shape(ctx, K.rrectPts(-40, -190, 220, 112, 40, 5), { fill: P.teal, w: 3.5, seed: o.seed + 20, shade: { color: P.tealDark, dx: 0, dy: -36 }, tone: { color: P.ink, gap: 11, r: 0, r2: 2.6, dir: Math.PI / 2, alpha: 0.22 } });
    [10, 80, 150].forEach((bx, i) => K.shape(ctx, K.rectPts(bx - 7, -192, 14, 116, 2), { fill: P.mustard, w: 2.5, seed: o.seed + 22 + i }));
    /* smoke box front */
    K.shape(ctx, K.rrectPts(168, -184, 30, 100, 12, 3), { fill: P.ink, w: 3, seed: o.seed + 26, reg: 0 });
    K.dot(ctx, 200, -160, 16, P.mustardLight, P.ink, 3, o.seed + 27);
    /* chimney + dome */
    K.shape(ctx, [[118, -188], [148, -188], [158, -262], [108, -262]], { fill: P.ink, w: 3, seed: o.seed + 28, reg: 0 });
    K.shape(ctx, K.rectPts(102, -274, 62, 16, 2), { fill: P.mustard, w: 3, seed: o.seed + 29 });
    K.shape(ctx, K.arcPts(50, -188, 30, Math.PI, K.TAU, 8), { fill: P.mustard, w: 3, seed: o.seed + 30 });
    /* cab */
    K.shape(ctx, K.rectPts(-160, -250, 130, 172, 3), { fill: P.mustard, w: 3.5, seed: o.seed + 32, shade: { color: P.mustardDark, dx: 34, dy: 0 } });
    K.shape(ctx, [[-176, -246], [-14, -246], [-24, -276], [-166, -276]], { fill: P.tomato, w: 3.5, seed: o.seed + 33, shade: { color: P.tomatoDark, dx: 0, dy: -10 } });
    K.shape(ctx, K.rrectPts(-138, -226, 86, 82, 16, 3), { fill: P.cream, w: 3, seed: o.seed + 34, tone: { color: P.creamDeep, gap: 8, r: 0, r2: 2.4, dir: Math.PI * 0.3, alpha: 0.7 } });
    if (o.cab) { ctx.save(); K.pathOf(ctx, K.rrectPts(-138, -226, 86, 160, 16, 3), true); ctx.clip(); o.cab(ctx); ctx.restore(); }
    ctx.restore();
  };
  /* smoke / steam puff: u 0..1 life (grows, rises is the caller's job, fades at the end) */
  K.puff = function (ctx, x, y, r, u, seed, color) {
    if (u <= 0 || u >= 1) return;
    const g = 0.35 + 0.65 * K.E.out3(clamp(u * 1.6, 0, 1)), a = 1 - K.ss(0.6, 1, u);
    ctx.save(); ctx.globalAlpha *= a;
    [[0, 0, 1], [-0.62, 0.22, 0.66], [0.6, 0.18, 0.7], [0.1, -0.5, 0.62]].forEach((c, i) => {
      const rr = r * g * c[2];
      K.shape(ctx, K.ellipsePts(x + c[0] * r * g, y + c[1] * r * g, rr, rr, 18), { fill: color || P.cream, key: P.ink, w: 2.5, smooth: true, boil: 1, seed: seed * 7 + i, shade: { color: P.creamShade, dx: rr * 0.2, dy: rr * 0.25 } });
    });
    ctx.restore();
  };

  /* ---------- the price pond (market impact) ---------- */
  K.pond = function (ctx, x, y, w, h, seed) {
    K.shape(ctx, K.ellipsePts(x, y, w / 2, h / 2, 36), { fill: P.water, w: 3, seed, smooth: true, shade: { color: P.waterDeep, dx: 0, dy: h * 0.18 }, tone: { color: P.cream, gap: 12, r: 2.4, r2: 0, dir: Math.PI / 2, alpha: 0.4 } });
  };
  /* one ripple ring; u 0..1 */
  K.ripple = function (ctx, x, y, size, u, seed) {
    if (u <= 0 || u >= 1) return;
    const r = size * K.E.out3(u);
    K.shape(ctx, K.ellipsePts(x, y, r, r * 0.32, 24), { fill: null, key: P.cream, w: 4 * (1 - u) + 1.5, smooth: true, boil: 0.5, seed, alpha: 1 - u });
  };
  /* crown splash: a column and drops; size = height in px; u 0..1 */
  K.splash = function (ctx, x, y, size, u, seed, color) {
    if (u <= 0 || u >= 1) return;
    const c = color || P.water, up = Math.sin(Math.PI * clamp(u * 1.3, 0, 1));
    ctx.save(); ctx.globalAlpha *= 1 - K.ss(0.75, 1, u);
    const hw = size * 0.22, hh = size * up;
    if (hh > 2) K.shape(ctx, [[x - hw, y], [x - hw * 0.5, y - hh * 0.7], [x - hw * 0.2, y - hh], [x + hw * 0.25, y - hh * 0.85], [x + hw * 0.55, y - hh * 0.6], [x + hw, y]], { fill: c, w: 3, smooth: true, seed, shade: { color: P.cream, dx: hw * 0.3, dy: 0 } });
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI / 2 + (i / 8 - 0.5) * 2.4, sp = size * (0.6 + 0.6 * hash(i, seed));
      const px = x + Math.cos(a) * sp * u * 1.1, py = y + Math.sin(a) * sp * u * 1.3 + size * 1.6 * u * u;
      K.dot(ctx, px, py, size * 0.06 * (1 - u * 0.5), c, P.ink, 2, seed + 10 + i);
    }
    ctx.restore();
  };

  /* ---------- money, quote windows, dials ---------- */
  K.coin = function (ctx, x, y, r, opt) {
    const o = Object.assign({ color: P.mustard, label: "", seed: 1, labelColor: P.ink, size: 0 }, opt || {});
    K.shape(ctx, K.ellipsePts(x, y, r, r, 24), { fill: o.color, w: Math.max(2, r * 0.07), smooth: true, boil: 0.4, seed: o.seed, shade: { color: P.mustardDark, dx: r * 0.12, dy: r * 0.14 } });
    K.shape(ctx, K.ellipsePts(x - r * 0.04, y - r * 0.04, r * 0.7, r * 0.7, 20), { fill: null, key: P.ink, w: Math.max(1.6, r * 0.05), smooth: true, boil: 0.3, seed: o.seed + 1 });
    if (o.label) K.text(ctx, o.label, x - r * 0.04, y - r * 0.02, { size: o.size || r * 0.7, weight: 800, fill: o.labelColor, font: K.FONT.mono });
  };
  /* kiosk with a striped awning and an open window; (x, y) = ground centre */
  K.booth = function (ctx, x, y, w, h, opt) {
    const o = Object.assign({ color: P.teal, shade: P.tealDark, seed: 140, lit: 0 }, opt || {});
    K.shape(ctx, K.rectPts(x - w / 2, y - h, w, h, 3), { fill: o.color, w: 3.5, seed: o.seed, shade: { color: o.shade, dx: -w * 0.12, dy: 0 } });
    /* window */
    const wy = y - h * 0.78, wh = h * 0.42;
    K.shape(ctx, K.rectPts(x - w * 0.36, wy, w * 0.72, wh, 3), { fill: o.lit > 0 ? P.mustardLight : P.ink, w: 3, seed: o.seed + 1, reg: 0 });
    K.shape(ctx, K.rectPts(x - w * 0.44, wy + wh, w * 0.88, 16, 3), { fill: P.cream, w: 3, seed: o.seed + 2 });
    /* awning: alternating stripes with a scalloped edge */
    const ay = y - h - 10, n = 6, sw = (w + 40) / n;
    for (let i = 0; i < n; i++) {
      const x0 = x - w / 2 - 20 + i * sw;
      const pts = [[x0 + 8, ay - 40], [x0 + sw + 8, ay - 40], [x0 + sw, ay + 20]].concat(K.arcPts(x0 + sw / 2, ay + 20, sw / 2, 0, Math.PI, 5));
      K.shape(ctx, pts, { fill: i % 2 ? P.cream : o.color, w: 2.5, seed: o.seed + 5 + i, boil: 0.5 });
    }
  };
  /* dial gauge: v 0..1; green-ish (teal) low zone, tomato high zone */
  K.gauge = function (ctx, x, y, r, v, opt) {
    const o = Object.assign({ seed: 160, lo: 0.35, hi: 0.7, label: "" }, opt || {});
    K.shape(ctx, K.ellipsePts(x, y, r * 1.12, r * 1.12, 32), { fill: P.ink, w: 3, seed: o.seed, smooth: true, reg: 0 });
    K.shape(ctx, K.ellipsePts(x, y, r, r, 32), { fill: P.cream, w: 2.5, seed: o.seed + 1, smooth: true });
    const a0 = Math.PI * 0.8, a1 = Math.PI * 2.2, A = (u) => lerp(a0, a1, u);
    const band = (u0, u1, c, s) => K.shape(ctx, K.arcPts(x, y, r * 0.86, A(u0), A(u1), 10).concat(K.arcPts(x, y, r * 0.62, A(u1), A(u0), 10)), { fill: c, w: 2, seed: s, boil: 0.3 });

    K.shape(ctx, K.rectPts(x - 16, y - 16, w + 32, h + 32, 3), { fill: P.mustard, w: 3.5, seed: o.seed, shade: { color: P.mustardDark, dx: 10, dy: 10 } });
    K.shape(ctx, K.rectPts(x, y, w, h, 3), { fill: P.cream, w: 2.5, seed: o.seed + 1, tone: { color: P.mustardLight, gap: 12, r: 0, r2: 3.6, dir: -Math.PI / 2, alpha: 0.6 } });
    const px = x + 70, py = y + (o.title ? 80 : 40), pw = w - 110, ph = h - (o.title ? 80 : 40) - (o.xLabels ? 70 : 40);
    if (o.title) K.text(ctx, o.title, x + w / 2, y + 44, { size: 36, weight: 800, fill: P.ink });
    let mn = o.min, mx = o.max;
    if (mn == null || mx == null) { const all = series.flatMap((s) => s.data); mn = mn == null ? Math.min(0, ...all) : mn; mx = mx == null ? Math.max(...all) * 1.1 : mx; }
    const X = (i, n) => px + (n > 1 ? (pw * i) / (n - 1) : pw / 2), Y = (v) => py + ph - ((v - mn) / (mx - mn)) * ph;
    K.line(ctx, [[px, py - 10], [px, py + ph], [px + pw + 10, py + ph]], { w: 3.5, seed: o.seed + 2 });
    series.forEach((s, si) => {
      const n = s.data.length;
      if (s.kind === "bars") {
        const bw = (pw / n) * 0.66;
        s.data.forEach((v, i) => {
          const g = K.E.back(clamp(o.draw * (n + 3) / 3 - i * 0.33, 0, 1), 1.6);
          if (g <= 0) return;
          const cx = px + (pw * (i + 0.5)) / n, top = lerp(py + ph, Y(v), g);
          K.shape(ctx, K.rectPts(cx - bw / 2, top, bw, py + ph - top, 1), { fill: s.color || P.teal, w: 2.5, seed: o.seed + 10 + si * 40 + i, shade: { color: P.tealDark, dx: -bw * 0.28, dy: 0 } });
        });
      } else {
        const m = o.draw * (n - 1); if (m <= 0) return;
        const pts = [];
        for (let i = 0; i <= Math.floor(m); i++) pts.push([X(i, n), Y(s.data[i])]);
        const f = m - Math.floor(m);
        if (f > 0 && Math.floor(m) < n - 1) { const i = Math.floor(m); pts.push([lerp(X(i, n), X(i + 1, n), f), lerp(Y(s.data[i]), Y(s.data[i + 1]), f)]); }
        if (pts.length > 1) {
          K.line(ctx, pts, { key: P.ink, w: (s.w || 6) + 5, seed: o.seed + 80 + si, smooth: !!s.smooth });
          K.line(ctx, pts, { key: s.color || P.tomato, w: s.w || 6, seed: o.seed + 80 + si, smooth: !!s.smooth });
        }
        const last = pts[pts.length - 1];
        if (s.dot !== false) K.dot(ctx, last[0], last[1], 9, s.color || P.tomato, P.ink, 2.5, o.seed + 90 + si);
      }
    });
    if (o.xLabels) o.xLabels.forEach((l, i, arr) => K.text(ctx, l, px + (pw * (i + 0.5)) / arr.length, py + ph + 34, { size: 26, weight: 500, font: K.FONT.mono, fill: P.inkSoft }));
    ctx.restore();
  };

  /* ---------- tickets (bullets): each ticket pops on its own beat ---------- */
  K.tickets = function (ctx, x, y, w, items, opt) {
    const o = Object.assign({ a: 1, shown: 99, size: 34, gap: 18, seed: 300, h: 76 }, opt || {});
    if (o.a <= 0) return;
    items.forEach((it, i) => {
      const a = clamp(o.shown - i, 0, 1) * clamp(o.a, 0, 1); if (a <= 0) return;
      const ty = y + i * (o.h + o.gap);
      ctx.save(); popAt(ctx, x, ty + o.h / 2, a); ctx.translate(x, ty); ctx.rotate((hash(i, o.seed) - 0.5) * 0.04); ctx.translate(-x, -ty);
      const pts = K.rrectPts(x, ty, w, o.h, 8, 2);
      K.shape(ctx, pts, { fill: i % 2 ? P.cream : P.mustardLight, w: 3, seed: o.seed + i * 5, shade: { color: P.creamShade, dx: 0, dy: -8 } });
      /* perforated stub */
      ctx.save(); ctx.setLineDash([6, 7]); K.line(ctx, [[x + 84, ty + 6], [x + 84, ty + o.h - 6]], { w: 2.5, boil: 0, seed: o.seed + i * 5 + 1 }); ctx.restore();
      K.text(ctx, String(i + 1), x + 42, ty + o.h / 2 + 1, { size: o.size * 1.05, weight: 800, font: K.FONT.mono, fill: P.teal });
      K.text(ctx, it, x + 108, ty + o.h / 2 + 1, { size: o.size, weight: 700, align: "left", fill: P.ink });
      ctx.restore();
    });
  };

  /* ---------- teletype tape (code): typed out character by character ---------- */
  const KW = /\b(fn|let|mut|for|in|if|else|return|def|import|from|while|struct|impl|pub|use|const|class|self)\b/;
  K.teletype = function (ctx, x, y, w, lines, opt) {
    const o = Object.assign({ a: 1, typed: 1, size: 26, seed: 320 }, opt || {});
    if (o.a <= 0) return;
    const lh = o.size * 1.5, h = lines.length * lh + 60;
    ctx.save(); popAt(ctx, x + w / 2, y, o.a);
    K.shape(ctx, K.rectPts(x, y, w, h, 4), { fill: P.cream, w: 3, seed: o.seed, shade: { color: P.creamShade, dx: -12, dy: 0 } });
    /* sprocket holes */
    ctx.save(); ctx.fillStyle = P.creamDeep;
    for (let yy = y + 16; yy < y + h - 8; yy += 22) { ctx.beginPath(); ctx.arc(x + 16, yy, 4.5, 0, K.TAU); ctx.arc(x + w - 16, yy, 4.5, 0, K.TAU); ctx.fill(); }
    ctx.restore();
    const total = lines.reduce((s, l) => s + l.length, 0);
    let budget = Math.floor(o.typed * total + 0.001);
    ctx.save(); ctx.font = `500 ${o.size}px ${K.FONT.mono}`; ctx.textBaseline = "middle";
    lines.forEach((ln, i) => {
      const str = ln.slice(0, Math.max(0, budget)); budget -= ln.length; if (!str) return;
      let cx = x + 44; const cy = y + 30 + lh / 2 + i * lh;
      const comment = str.indexOf("//") >= 0 ? str.indexOf("//") : str.indexOf("#");
      const toks = str.split(/(\s+|[(){}\[\],;:.<>=+\-*\/&|"]|"[^"]*")/).filter((q) => q !== "" && q != null);
      let pos = 0;
      toks.forEach((tk) => {
        let c = P.ink;
        if (comment >= 0 && pos >= comment) c = P.inkSoft;
        else if (KW.test(tk)) c = P.teal;
        else if (/^[0-9.]+$/.test(tk)) c = P.tomato;
        else if (/^".*"$/.test(tk)) c = P.mustardDark;
        ctx.fillStyle = c; ctx.font = `${KW.test(tk) ? 700 : 500} ${o.size}px ${K.FONT.mono}`;
        ctx.fillText(tk, cx, cy); cx += ctx.measureText(tk).width; pos += tk.length;
      });
      /* typing head */
      if (budget < 0 && budget > -ln.length) { ctx.fillStyle = P.tomato; ctx.fillRect(cx + 2, cy - o.size * 0.45, o.size * 0.55, o.size * 0.9); }
    });
    ctx.restore(); ctx.restore();
  };

  /* ---------- rail map (graph): stops and lines ---------- */
  K.routePoint = function (A, B, bend, u) {
    const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1;
    const C = [mx - (dy / L) * bend, my + (dx / L) * bend];
    const x = (1 - u) * (1 - u) * A[0] + 2 * (1 - u) * u * C[0] + u * u * B[0];
    const y = (1 - u) * (1 - u) * A[1] + 2 * (1 - u) * u * C[1] + u * u * B[1];
    const tx = 2 * (1 - u) * (C[0] - A[0]) + 2 * u * (B[0] - C[0]), ty = 2 * (1 - u) * (C[1] - A[1]) + 2 * u * (B[1] - C[1]);
    return [x, y, Math.atan2(ty, tx)];
  };
  K.route = function (ctx, A, B, opt) {
    const o = Object.assign({ p: 1, color: P.teal, bend: 0, w: 14, seed: 340, dim: false, label: "", lu: 0.5 }, opt || {});
    if (o.p <= 0) return;
    const pts = []; for (let i = 0; i <= 24; i++) pts.push(K.routePoint(A, B, o.bend, (i / 24) * o.p));
    const al = o.dim ? 0.35 : 1;
    K.line(ctx, pts, { key: P.ink, w: o.w + 6, seed: o.seed, boil: 0.5, alpha: al });
    K.line(ctx, pts, { key: o.color, w: o.w, seed: o.seed, boil: 0.5, alpha: al });
    if (o.label && o.p > 0.7) { const q = K.routePoint(A, B, o.bend, o.lu); K.tag(ctx, q[0], q[1] - 34, o.label, { a: (o.p - 0.7) / 0.3, seed: o.seed + 5 }); }
  };
  K.stop = function (ctx, x, y, r, opt) {
    const o = Object.assign({ a: 1, label: "", seed: 360, hot: 0, size: 30 }, opt || {});
    if (o.a <= 0) return;
    ctx.save(); popAt(ctx, x, y, o.a);
    if (o.hot > 0) K.rays(ctx, x, y, r * 1.4, r * 2.1, 12, { color: P.mustardDark, w: 3, alpha: o.hot, rot: K.now * 0.5 });
    K.dot(ctx, x, y, r, P.cream, P.ink, 5, o.seed);
    if (o.label) K.text(ctx, o.label, x, y + r + o.size * 0.9, { size: o.size, weight: 700, font: K.FONT.mono });
    ctx.restore();
  };
  /* luggage tag with a number */
  K.tag = function (ctx, x, y, str, opt) {
    const o = Object.assign({ a: 1, size: 30, seed: 380, color: P.cream, textColor: P.ink }, opt || {});
    if (o.a <= 0) return;
    ctx.save(); popAt(ctx, x, y, clamp(o.a, 0, 1));
    const w = K.textW(ctx, str, o.size, 700, K.FONT.mono) + 46, h = o.size * 1.5;
    K.shape(ctx, [[x - w / 2 + 16, y - h / 2], [x + w / 2, y - h / 2], [x + w / 2, y + h / 2], [x - w / 2 + 16, y + h / 2], [x - w / 2, y]], { fill: o.color, w: 2.5, seed: o.seed, boil: 0.4 });
    K.dot(ctx, x - w / 2 + 14, y, 4, P.ink, null, 0, o.seed + 1);
    K.text(ctx, str, x + 8, y + 1, { size: o.size, weight: 700, font: K.FONT.mono, fill: o.textColor });
    ctx.restore();
  };

  /* ---------- title sign: hangs from two chains, drops and swings in ----------
     u 0..1 entry; returns the sign box (screen space when drawn in screen space) */
  K.sign = function (ctx, cx, cy, w, h, u, opt) {
    const o = Object.assign({ seed: 400, color: P.enamel, shade: P.tealDark }, opt || {});
    if (u <= 0) return null;
    const drop = (1 - K.E.back(clamp(u, 0, 1), 1.6)) * -(cy + h);
    const sw = Math.sin(K.now * 1.7) * 0.6 * Math.PI / 180 + (1 - clamp(u * 1.3, 0, 1)) * 0.06 * Math.sin(u * 12);
    ctx.save(); ctx.translate(cx, cy + drop); ctx.rotate(sw);
    /* chains */
    [-w * 0.36, w * 0.36].forEach((xx, i) => {
      ctx.save(); ctx.strokeStyle = P.ink; ctx.lineWidth = K.lw(ctx, 3);
      for (let yy = -h / 2 - 8; yy > -cy - 400; yy -= 22) { ctx.beginPath(); ctx.ellipse(xx, yy, 5, 11, 0, 0, K.TAU); ctx.stroke(); }
      ctx.restore();
    });
    K.shape(ctx, K.rrectPts(-w / 2, -h / 2, w, h, 34, 5), { fill: o.color, w: 4, seed: o.seed, shade: { color: o.shade, dx: 0, dy: 16 }, tone: { color: P.cream, gap: 13, r: 2, r2: 0, dir: Math.PI * 0.3, alpha: 0.16 } });
    K.shape(ctx, K.rrectPts(-w / 2 + 16, -h / 2 + 16, w - 32, h - 32, 22, 5), { fill: null, key: P.mustard, w: 5, seed: o.seed + 1 });
    screws(ctx, -w / 2, -h / 2, w, h, 34, o.seed + 10);
    ctx.restore();
    return { x: cx, y: cy + drop, w, h, rot: sw };
  };
})(SK);

/* ============================================================

   Song: song_short.m4a (27.1 s), big-band swing ~129 BPM (beat 0.464 s,

     0.00 instrumental (2 bars)

/* ---------- station yard layout (world px, rail top y = RAIL) ---------- */
const RAIL = 900, PLAT_Y = 836;

/* ============================================================

   Instrumental (0 - 3.6 s):
   0.00  close on Mr. Tick and his pocket watch; the giant crate behind
   1.83  he looks up: "!" and the camera pulls back to show its size
   (mouseIntroPose also keeps a dawn walk-in and a timetable-board beat,
   switched off by T.walk / T.board in the short cut, for a longer song)
   Verse (3.6 - 9.1 s):
   3.60  "where the clockwork turns": the tower clock ticks on every beat
   5.43  wide yard; "a big order splits": cut lines, then 8 pieces hop onto 8 wagons
   7.24  whip pan to the bridge; wagons leave a quarter beat apart, tiny ripples,
         the price flap moves one tick only ("the price won't slide")
   ============================================================ */
const camYard = K.mkTrack([
  [0, { x: 540, y: 650, z: 1.3 }],
  [T.pull[0], { x: 590, y: 640, z: 1.38 }],
  [T.pull[1], { x: 980, y: 600, z: 0.86 }],
  [T.camClock[0], { x: 1010, y: 592, z: 0.86 }],
  [T.camClock[1], { x: 1240, y: 505, z: 0.92 }],
  [T.camWide[0], { x: 1270, y: 515, z: 0.92 }],

  [T.whip[0], { x: 1680, y: 562, z: 0.75 }],
  [T.whip[1], { x: 3820, y: 700, z: 1.08 }],
  [T.flap1[1], { x: 3880, y: 700, z: 1.1 }],
]);
const WHIP_MID = (T.whip[0] + T.whip[1]) / 2;
const TOWER = { x: 1790, s: 0.95 };

/* wagon i departure: front wagon (i = 7) first, a quarter beat apart */
const departAt = (i) => T.depart + (N_WAG - 1 - i) * BEAT * 0.25;
function wagonX(i, t) {
  const x0 = WAG_X0 + i * WAG_DX, tau = t - departAt(i);
  if (tau <= 0) return x0;
  const v = 1500, ramp = 0.5;
  return x0 + (tau < ramp ? (v * tau * tau) / (2 * ramp) : (v * ramp) / 2 + v * (tau - ramp));
}
/* time wagon i passes the middle of the pond (solved numerically once) */
const PASS = [];
for (let i = 0; i < N_WAG; i++) { let tt = departAt(i); while (wagonX(i, tt) < POND.x && tt < DUR) tt += 0.005; PASS.push(tt); }

/* slice i hop: start time and progress */
const hopAt = (i) => T.hops + i * BEAT * 0.25;
const HOP_D = 0.42;

/* tower clock: the minute hand jumps on every beat from 3.60 s */
function clockMinute(t) {
  const b = (t - T.clock) / BEAT;
  if (b < 0) return 52;
  const k = Math.floor(b), f = b - k;
  return 52 + k + K.E.back(K.clamp(f / 0.35, 0, 1), 3);
}

/* teardrop poplar (mid-century tree) */
function poplar(c, x, y, h, seed, col) {
  K.line(c, [[x, y], [x, y - h * 0.3]], { w: 4, seed: seed + 1, key: P.woodDark });
  const pts = [];
  for (let i = 0; i <= 16; i++) { const a = (i / 16) * K.TAU, sn = Math.sin(a), cs = Math.cos(a); pts.push([x + cs * h * 0.17 * (1 - 0.35 * Math.max(0, -sn)), y - h * 0.62 + sn * h * 0.42 - (sn < 0 ? -sn * h * 0.12 : 0)]); }
  K.shape(c, pts, { fill: col || P.tealDark, w: 2.5, smooth: true, seed, shade: { color: P.ink, dx: h * 0.06, dy: 0 }, alpha: 1 });
}

function yardBackground(c, t) {
  K.applyCam(c, 0.22);
  K.sky(c, { horizon: 760, sun: [1250, 230], sunR: 120 });
  K.cloud(c, 380, 160, 300, 11); K.cloud(c, 1620, 110, 240, 14); K.cloud(c, 2500, 210, 280, 17);
  K.applyCam(c, 0.45);

function parentCar(c, t, crateA) {

function drawPieces(c, t, car) {
  /* 4 x 2 grid of pieces; top row hops first, left to right */
  const pw = car.w / 4, ph = car.h / 2;
  if (t < hopAt(0)) return;
  for (let i = 0; i < N_WAG; i++) {
    const t0 = hopAt(i), u = K.inv(t0, t0 + HOP_D, t);
    if (u >= 1) continue; /* landed: the wagon draws its own crate */
    const col = i % 4, row = Math.floor(i / 4);
    const sx = car.x - car.w / 2 + pw * (col + 0.5), sy = car.y - (1 - row) * ph;
    const tx = WAG_X0 + i * WAG_DX, ty = RAIL - 58 * WAG_S;
    const e = K.E.inOut(u), x = K.lerp(sx, tx, e), arc = (220 + 26 * i) * Math.sin(Math.PI * u);
    const w = K.lerp(pw - 6, 140, K.E.out3(u)), h = K.lerp(ph - 6, 84, K.E.out3(u));
    c.save(); c.translate(x, K.lerp(sy, ty, e) - arc); c.rotate(Math.sin(Math.PI * u) * 0.5 * (i % 2 ? 1 : -1));
    K.crate(c, 0, 0, w, h, { seed: 940 + i * 3, color: P.mustard, label: u > 0.55 ? CHILD : "", labelSize: 40 });
    c.restore();
  }
}

function drawWagons(c, t) {

/* clock-tick sparkles on the beats of bar 2 */
function tickStars(c, t) {

function mouseIntroPose(t) {
  const bl = K.blinkAt(t, 9), pulse = K.pulse(t, 1, 6);
  const st = { blink: bl, squash: 0.06 * pulse, seed: 700, mouth: "smile" };
  if (t < T.walk[1]) {
    /* walking in, swinging his arms */
    const ph = (t / BEAT) * Math.PI;
    st.legWalk = ph; st.squash = 0.05 * Math.abs(Math.sin(ph)); st.look = [1, 0];
    st.handL = { x: -60 + 18 * Math.sin(ph), y: -70 }; st.handR = { x: 60 - 18 * Math.sin(ph), y: -70 };
    return st;
  }
  const arrive = t - T.walk[1];
  if (arrive < 0.5) st.squash = 0.22 * Math.exp(-arrive * 6) * Math.cos(arrive * 16);
  if (t < T.board) {
    /* watch close-up, then the look up */
    const lid = K.inv(T.lid, T.lid + 0.3, t) * (1 - K.inv(T.lidShut, T.lidShut + 0.12, t));
    st.handL = { x: -58, y: -122 + 4 * pulse, hold: "watch", lid };
    st.handR = { x: 66, y: -80 };
    st.look = t < T.push[0] ? [0.3, 0] : [-0.5, 0.9];
    const u = t - T.lookUp;
    if (u > -0.18 && u < 0) st.squash = 0.28 * K.inv(-0.18, -0.05, u); /* anticipation */
    if (u >= 0) {
      st.blink = 0; st.look = [1, -1]; st.exclaim = K.inv(0, 0.3, u); st.eyeUp = 6 * (1 - K.inv(0.6, 1.2, u));
      st.squash = -0.25 * Math.exp(-u * 5) * Math.cos(u * 16); st.brow = 1.3; st.mouth = u < 0.7 ? "o" : "grin"; st.ear = Math.exp(-u * 4) * Math.sin(u * 30);
      if (u > 0.55) { st.exclaim = 1 - K.inv(1.1, 1.3, u); st.handR = { x: 120, y: -200 - 6 * pulse, hold: "point" }; }
    }
    return st;
  }
  /* the timetable: points at the board, then nods along with each departure */
  st.handL = { x: -60, y: -130 + 4 * pulse, hold: "watch", lid: 1 };
  st.handR = { x: 118, y: -214 - 10 * pulse, hold: "point" };
  st.look = [1, -1]; st.brow = 0.6;
  const w = K.inv(T.whistleIn[0], T.whistleIn[0] + 0.3, t);
  if (w > 0) { st.handR = { x: 30, y: -172, hold: "whistle", wAng: Math.PI * 1.04 }; st.mouth = "whistle"; st.puff = 0.3 + 0.7 * K.inv(T.whistleIn[0] + 0.3, T.steam0[0] + 0.3, t); st.look = [0.4, -0.2]; st.blink = 0; st.squash = -0.12 * st.puff; }
  return st;
}

function mouseYardPose(t) {
  const bl = K.blinkAt(t, 9), pulse = K.pulse(t, 1, 6);
  const st = { blink: bl, squash: 0.06 * pulse, seed: 700 };
  if (t < T.camWide[0]) {
  } else if (t < T.camWide[0]) {
    /* compares his watch with the tower clock, nodding on the beat */
    st.handL = { x: -70, y: -230 + 8 * pulse, hold: "watch", lid: 1 };
    st.handR = { x: 64, y: -70 };
    st.look = [0.9, -1]; st.mouth = "smile"; st.brow = 0.5;

  } else {
    /* whistle on the downbeat, then the flag for each hop */
    const w = K.inv(T.camWide[1] - 0.3, T.camWide[1], t) * (1 - K.inv(T.slice[0] + 0.1, T.slice[0] + 0.3, t));
    st.handL = { x: -66, y: -74 };
    if (w > 0) { st.handR = { x: 30, y: -172, hold: "whistle", wAng: Math.PI * 1.04 }; st.mouth = "whistle"; st.puff = w; st.look = [0.6, 0]; st.blink = 0; }
    else {
      const b = (t - T.hops) / (BEAT * 0.25), f = b - Math.floor(b), wave = b > 0 && b < 8 ? Math.sin(f * Math.PI) : 0;
      st.handR = { x: 74, y: -190 + 40 * wave, hold: "flag" };
      st.look = [1, -0.3]; st.mouth = t > T.hops ? "grin" : "smile";

}

function mouseBridgePose(t) {

    K.flap(c, POND.x, 470, "100.01", { a: fa, h: 110, prev: "100.00", flip: K.inv(T.priceFlip, T.priceFlip + 0.35, t), seed: 1310, colors: [null, null, null, null, null, P.mustardLight] });
  }
  /* Mr. Tick */

  if (t < T.camClock[0]) {

      [1300, 1640].forEach((px, i) => K.shape(c, K.rectPts(px - 8, 420, 16, PLAT_Y - 420 + 60, 2), { fill: P.ink, w: 2, seed: 1150 + i, reg: 0 }));
      const rows = [["#", "time", "qty"], ["1", "09:00", CHILD], ["2", "09:30", CHILD], ["3", "10:00", CHILD], ["…", "…", "…"], ["8", "12:30", CHILD]];
      const shown = (t - T.board) / (BEAT * 0.5), hi = t > at(6, 0) ? 1 + (Math.floor((t - at(6, 0)) / BEAT) % 3) : -1;
      K.board(c, 1240, 70, [80, 170, 170], rows, { a: ba, size: 32, rowH: 56, shown, hi, seed: 1160 });
    }
  }
  if (t < T.camClock[0]) {
    const wx = K.lerp(-380, 520, K.E.out3(K.inv(T.walk[0], T.walk[1], t)));
    K.mouse(c, wx, PLAT_Y, MOUSE_S, mouseIntroPose(t));
  } else if (t < WHIP_MID) K.mouse(c, 520, PLAT_Y, MOUSE_S, mouseYardPose(t));
  else K.mouse(c, BRIDGE_MOUSE_X, RAIL + 74, MOUSE_S, mouseBridgePose(t));
  /* whip-pan speed lines */
  const wv = Math.sin(Math.PI * K.inv(T.whip[0], T.whip[1], t));
  if (wv > 0.05) {
    K.screen(c); c.save(); c.globalAlpha = 0.5 * wv; c.strokeStyle = P.cream; c.lineCap = "round";
    for (let i = 0; i < 14; i++) { const y = 80 + i * 70 + K.hash(i, K.bf) * 30, x = K.hash(i + 30, K.bf) * 1920, L = 300 + 500 * K.hash(i + 60, 5); c.lineWidth = 4 + 6 * K.hash(i, 9); c.beginPath(); c.moveTo(x - L, y); c.lineTo(x, y); c.stroke(); }
    c.restore();
  }
}

/* ============================================================
   INTRO 30 QUOTES: "Quote both sides and let the spread provide" (9.08 - 10.9 s)
   Two ticket booths: BID (teal) and ASK (tomato). Mr. Tick points to each as
   its split-flap price flips in, then coins from both windows land at his
   feet and the spread tag "+0.04" pops.
   ============================================================ */
const BOOTH = { y: 900, w: 380, h: 420, L: 470, R: 1450 };
const PILE = [1130, 900];

function coinArc(i, t) {
  /* coin i comes from the bid window (even) or the ask window (odd) */
  const t0 = T.coins + i * BEAT * 0.25, u = K.inv(t0, t0 + 0.45, t);
  if (u <= 0) return null;
  const sx = i % 2 ? BOOTH.R - 120 : BOOTH.L + 120, sy = BOOTH.y - BOOTH.h * 0.36;
  const rest = [PILE[0] + ((i % 3) - 1) * 26, PILE[1] - 16 - Math.floor(i / 2) * 15];
  if (u >= 1) return { x: rest[0], y: rest[1], landed: true };
  return { x: K.lerp(sx, rest[0], u), y: K.lerp(sy, rest[1], u) - 200 * Math.sin(Math.PI * u), landed: false };
}

function drawQuotes(c, t) {
  const z = K.tw(t, T.flap1[0], T.flap1[1] + 1.6, 1.04, 1.0, K.E.out3);
  K.begin(c, t, { x: 960, y: 560, z, rot: 0 });
  K.applyCam(c, 0.3);
  K.sky(c, { horizon: 780, sun: [960, 250], sunR: 125 });
  K.cloud(c, 260, 180, 260, 21); K.cloud(c, 1700, 140, 230, 24);
  K.applyCam(c, 0.7);
  K.hills(c, -600, 2600, 820, { h: 170, color: P.hillMid, seed: 27, n: 6 });
  K.applyCam(c, 1);
  K.shape(c, [[-400, BOOTH.y - 10], [2400, BOOTH.y - 10], [2400, 1500], [-400, 1500]], { fill: P.creamShade, w: 3, seed: 1400, tone: { color: P.ink, gap: 10, r: 0.6, r2: 2.4, dir: Math.PI / 2, alpha: 0.22 } });
  const litB = K.inv(T.bid, T.bid + 0.12, t), litA = K.inv(T.ask, T.ask + 0.12, t);
  K.booth(c, BOOTH.L, BOOTH.y, BOOTH.w, BOOTH.h, { color: P.teal, shade: P.tealDark, seed: 1410, lit: litB });
  K.booth(c, BOOTH.R, BOOTH.y, BOOTH.w, BOOTH.h, { color: P.tomato, shade: P.tomatoDark, seed: 1440, lit: litA });
  K.text(c, "BID", BOOTH.L, BOOTH.y - 72, { size: 64, weight: 800, fill: P.cream, track: 6 });
  K.text(c, "ASK", BOOTH.R, BOOTH.y - 72, { size: 64, weight: 800, fill: P.cream, track: 6 });
  /* split-flap prices on the booth roofs */
  K.flap(c, BOOTH.L, BOOTH.y - BOOTH.h - 140, " 99.98", { h: 92, a: K.inv(T.flap1[1] - 0.1, T.flap1[1] + 0.25, t), prev: "      ", flip: K.inv(T.bid, T.bid + 0.4, t), seed: 1470 });
  K.flap(c, BOOTH.R, BOOTH.y - BOOTH.h - 140, "100.02", { h: 92, a: K.inv(T.flap1[1] - 0.05, T.flap1[1] + 0.3, t), prev: "      ", flip: K.inv(T.ask, T.ask + 0.4, t), seed: 1480 });
  /* coin pile at his feet */
  for (let i = 0; i < 10; i++) {
    const q = coinArc(i, t); if (!q) continue;
    K.coin(c, q.x, q.y, 24, { seed: 1500 + i * 3, label: "¢", size: 22 });
  }
  /* the spread: "+0.04" tag above the pile */
  const sa = K.inv(T.spread, T.spread + 0.35, t);
  if (sa > 0) K.tag(c, PILE[0] + 40, BOOTH.y - 470 - 10 * K.pulse(t, 1, 6), "+0.04", { a: sa, size: 58, color: P.mustardLight });
  /* Mr. Tick between the booths */
  const bl = K.blinkAt(t, 21), pulse = K.pulse(t, 1, 6);
  const pb = K.inv(T.bid - 0.08, T.bid + 0.15, t), pa = K.inv(T.ask - 0.08, T.ask + 0.15, t), cn = K.inv(T.coins + 0.2, T.coins + 0.5, t);
  const st = { blink: bl, squash: 0.06 * pulse, seed: 700, mouth: "smile", look: [0, 0] };
  st.handL = pb > 0 ? { x: -60 - 70 * K.E.back(pb, 2), y: -170 - 20 * pb, hold: "point" } : { x: -64, y: -72 };
  st.handR = pa > 0 ? { x: 60 + 70 * K.E.back(pa, 2), y: -170 - 20 * pa, hold: "point" } : { x: 64, y: -72 };
  if (pb > 0) st.look = [-1, -0.4];
  if (pa > 0) st.look = [1, -0.4];
  if (cn > 0) { st.look = [0.6, 1]; st.mouth = "grin"; st.handL = { x: -80, y: -110, open: 1 }; st.handR = { x: 80, y: -110, open: 1 }; st.brow = 0.7; }
  const hp = K.inv(T.spread, T.spread + 0.4, t);
  if (hp > 0 && hp < 1) { st.hop = 50 * Math.sin(Math.PI * hp); st.squash = -0.15 * Math.sin(Math.PI * hp); }
  K.mouse(c, 900, BOOTH.y, 1.3, st);
}

/* ============================================================
   INTRO 40 TRAIN: "Choo choo, keep the slippage low" (10.9 - 14.6 s)
   The locomotive pulls the eight 1 250 wagons across a valley whose mesas
   are the day's volume profile (U-shaped: busy open and close).
   Mr. Tick rides in the cab and blows the whistle on both "choo"s; the
   slippage gauge by the line pops up, its needle swings and settles low,
   and he gives it a thumbs-up.
   ============================================================ */
const TRAIN = { rail: 880, v: 560, x0: 120, s: 1.2 };
const VOL = [430, 330, 250, 200, 190, 215, 270, 360, 470];
const locoX = (t) => TRAIN.x0 + TRAIN.v * (t - T.steam[0]);
const GAUGE = { x: locoX(T.gauge) + 600, y: 390, r: 125 }; /* low enough to clear the logo corner */

function slipNeedle(t) {
  const base = 0.14 + 0.025 * Math.sin(t * 9) + 0.015 * Math.sin(t * 23);
  const p = K.inv(T.gauge, T.gauge + 0.3, t), s = K.inv(T.gauge + 0.3, T.low, t);
  /* jumps toward the tomato zone when it appears, then is reined back to low */
  return p <= 0 ? base : K.lerp(base + 0.42 * K.E.out3(p), base, K.E.back(s, 1.4));
}

function drawTrain(c, t) {
  const lx = locoX(t);
  K.begin(c, t, { x: lx - 160, y: 610, z: 0.98, rot: 0 });
  K.applyCam(c, 0.2);
  K.sky(c, { horizon: 790, sun: [1450, 260], sunR: 110 });
  K.cloud(c, 200, 150, 260, 31); K.cloud(c, 1100, 230, 220, 34); K.cloud(c, 1900, 120, 250, 37);
  K.applyCam(c, 0.3);
  /* volume-profile mesas: the whole U stays in view (low parallax) */
  VOL.forEach((h0, i) => {
    const h = h0 * 0.95;
    const x = 230 + i * 215, w = 168;

      K.mouse(cc, -95, -58, 0.56, st);

  /* whistle steam above the cab */
  T.choo.forEach((tc, k) => { const age = t - tc - 0.05; if (age > 0 && age < 0.7) K.puff(c, lx - 80 * TRAIN.s - 30 * age, TRAIN.rail - 290 * TRAIN.s - 120 * age, 34, age / 0.7, 1950 + k); });

function drawLadder(c, t, L, total, book) {

    K.line(c, [[x, 150], [x, 560]], { w: 3, seed: 3203 + i }); K.line(c, [[x - 110, 380], [x + 110, 380]], { w: 3, seed: 3205 + i });
  });

    const ask = i < 3, col = flash > 0.3 && best ? P.ink : ask ? P.tomatoLight : P.tealPale;

  /* Mr. Tick's quote tabs (mouse-ear badge) slide in from the board edges */

    const pts = side < 0 ? [[tx - 70, ry - 34], [tx + 40, ry - 34], [tx + 70, ry], [tx + 40, ry + 34], [tx - 70, ry + 34]] : [[tx + 70, ry - 34], [tx - 40, ry - 34], [tx - 70, ry], [tx - 40, ry + 34], [tx + 70, ry + 34]];

    K.dot(c, bx, ry + 4, 16, P.fur, P.ink, 2, seed + 3); K.dot(c, bx, ry + 8, 3.5, P.ink, null, 0, seed + 4);

  const pb = K.inv(L.bid - 0.15, L.bid + 0.1, t), pa = K.inv(L.ask - 0.15, L.ask + 0.1, t), fl = K.inv(L.fill, L.fill + 0.2, t);
  st.handL = pb > 0 ? { x: -130, y: -150 + 40 * (1 - pa), hold: "point" } : { x: -64, y: -74 };
  st.handR = { x: 66, y: -78 };
  if (pa > 0) { st.handL = { x: -130, y: -230, hold: "point" }; st.look = [-1, -1]; }
  if (fl > 0) {

    st.handL = { x: -86, y: -150, open: 1 }; st.handR = { x: 86, y: -150, open: 1 }; st.mouth = "grin"; st.look = [0.2, 1]; st.brow = 0.8;
    if (hp > 0 && hp < 1) { st.hop = 46 * Math.sin(Math.PI * hp); st.squash = -0.15 * Math.sin(Math.PI * hp); }

  K.mouse(c, 1640, 1000, 1.5, st);

/* ============================================================
   INTRO 47 BALANCE: "Mind your inventory, keep it all in check"
   (chorus 1: 22.2 s, chorus 2: 44.2 s). A big freight balance in the yard:
   crates (inventory) land in the left pan one by one and the beam tips;
   Mr. Tick, balancing on top of the pivot, flings crates across to the cash
   pan where they turn into coins, and the beam comes level on "check".
   The flap in the corner shows the inventory: +0 -> +3 -> +1.
   ============================================================ */
const BAL = { px: 960, py: 470, arm: 560, panDrop: 230, fx: 470, fy: 200 };

function balanceState(t, B) {
  const dropped = B.drops.filter((d) => t >= d + 0.35).length;
  const sold = B.sells.filter((d) => t >= d + 0.4).length;
  const inv = dropped - sold;
  /* tilt eases toward its target after every event (back ease = a little wobble) */
  let ang = 0;
  const events = B.drops.map((d) => [d + 0.35, 1]).concat(B.sells.map((d) => [d + 0.4, -1])).sort((a, b) => a[0] - b[0]);
  let level = 0;
  events.forEach(([te, dv]) => { const u = K.E.back(K.inv(te, te + 0.4, t), 2.2); ang += -0.075 * dv * u; level += dv; });
  /* "check": the last nudge to level */
  const fix = K.E.back(K.inv(B.level, B.level + 0.4, t), 2);
  ang = K.lerp(ang, 0, fix);
  return { inv, ang, sold, dropped };
}

function drawBalance(c, t, B) {
  K.begin(c, t, { x: 960, y: 520, z: K.tw(t, B.t0 - 0.4, B.end, 1.1, 1.16, K.E.inOut), rot: 0 });
  K.applyCam(c, 0.3);
  K.sky(c, { horizon: 790, sun: [1600, 220], sunR: 110 });
  K.cloud(c, 760, 120, 240, 71); K.cloud(c, 1300, 210, 220, 74);
  K.applyCam(c, 0.7);
  K.hills(c, -400, 2400, 820, { h: 160, color: P.hillMid, seed: 77, n: 7 });
  K.applyCam(c, 1);
  K.shape(c, [[-300, 950], [2300, 950], [2300, 1500], [-300, 1500]], { fill: P.creamShade, w: 3, seed: 3300, tone: { color: P.ink, gap: 10, r: 0.6, r2: 2.4, dir: Math.PI / 2, alpha: 0.22 } });
  const S = balanceState(t, B), { px, py, arm } = BAL;
  /* pivot tower */
  K.shape(c, [[px - 150, 950], [px - 26, py + 10], [px + 26, py + 10], [px + 150, 950]], { fill: P.teal, w: 3.5, seed: 3310, shade: { color: P.tealDark, dx: -40, dy: 0 }, tone: { color: P.ink, gap: 11, r: 0, r2: 2.4, dir: 0, alpha: 0.2 } });
  K.gear(c, px, py + 250, 70, 10, t * 0.8 + S.ang * 6, { seed: 3311 });
  /* beam ends after rotation */
  const ca = Math.cos(S.ang), sa = Math.sin(S.ang);
  const end = (sd) => [px + sd * arm * ca, py + sd * arm * sa];
  /* pans hang straight down from the beam ends */
  const pan = (sd, seed) => {
    const [ex, ey] = end(sd), y = ey + BAL.panDrop;
    K.line(c, [[ex, ey], [ex - 140, y]], { w: 3, seed }); K.line(c, [[ex, ey], [ex + 140, y]], { w: 3, seed: seed + 1 });
    K.shape(c, [[ex - 170, y], [ex + 170, y], [ex + 130, y + 40], [ex - 130, y + 40]], { fill: sd < 0 ? P.tomato : P.mustard, w: 3.5, seed: seed + 2, shade: { color: sd < 0 ? P.tomatoDark : P.mustardDark, dx: 0, dy: 14 } });
    return [ex, y];
  };
  const [lx, ly] = pan(-1, 3320), [rx, ry] = pan(1, 3330);
  /* the beam */
  c.save(); c.translate(px, py); c.rotate(S.ang);
  K.shape(c, K.rrectPts(-arm - 20, -16, arm * 2 + 40, 32, 12, 3), { fill: P.mustard, w: 3.5, seed: 3340, shade: { color: P.mustardDark, dx: 0, dy: -10 } });
  for (let i = -6; i <= 6; i++) K.line(c, [[i * 80, -16], [i * 80, -4]], { w: 2.5, seed: 3341 + i });
  c.restore();
  K.dot(c, px, py, 16, P.ink, P.ink, 2, 3355);
  /* crates in the left pan: a pile that grows with each drop, minus the ones sold */
  const slots = [[-70, 0], [70, 0], [0, -84], [0, -168]];
  for (let i = 0; i < B.drops.length; i++) {
    const d = B.drops[i], u = K.inv(d - 0.1, d + 0.35, t); if (u <= 0) continue;
    const soldIdx = B.drops.length - 1 - i; /* the top crate is flung first */
    const sellT = soldIdx < B.sells.length ? B.sells[soldIdx] : 1e9, su = K.inv(sellT, sellT + 0.4, t);
    const q = slots[i], hx = lx + q[0], hy = ly + q[1];
    if (su >= 1) continue;
    if (su > 0) {
      /* flung across, turning into a coin stack */
      const fx = K.lerp(hx, rx + (soldIdx ? 60 : -60), su), fy = K.lerp(hy, ry, su) - 360 * Math.sin(Math.PI * su);
      c.save(); c.translate(fx, fy); c.rotate(su * 6);
      K.crate(c, 0, 42, 130 * (1 - su * 0.5), 84 * (1 - su * 0.5), { seed: 3360 + i * 3 });
      c.restore(); continue;
    }
    const fall = K.E.out3(u), yy = K.lerp(hy - 500, hy, fall);
    K.crate(c, hx, yy, 130, 84, { seed: 3360 + i * 3, label: CHILD, labelSize: 34 });
  }
  /* coin stacks in the right pan (one per sold crate, plus the starting cash) */
  const stacks = 1 + S.sold;
  for (let k = 0; k < stacks; k++) {
    const sx = rx + (k - (stacks - 1) / 2) * 80, n = 5;
    for (let j = 0; j < n; j++) {
      const yy = ry - 12 - j * 14;
      K.shape(c, K.ellipsePts(sx, yy, 34, 10, 16), { fill: P.mustard, w: 2.2, smooth: true, seed: 3380 + k * 9 + j, shade: { color: P.mustardDark, dx: 0, dy: 4 } });
    }
  }
  /* inventory flap on a post over the pivot */
  const inv = S.inv, prevInv = Math.max(0, inv - 1);
  const flipT = Math.max(...B.drops.concat(B.sells).map((d) => (t >= d + 0.3 ? d + 0.3 : -1)));
  const label = "+" + inv;
  K.flap(c, BAL.fx, BAL.fy, label, { h: 110, prev: "+" + (inv > prevInv ? prevInv : inv + 1), flip: flipT > 0 ? K.inv(flipT, flipT + 0.3, t) : 1, seed: 3400, colors: [inv > 1 ? P.tomatoLight : P.tealPale, inv > 1 ? P.tomatoLight : P.tealPale] });
  const ok = K.inv(B.level, B.level + 0.3, t);
  if (ok > 0) for (let k = 0; k < 6; k++) { const ang = (k / 6) * K.TAU, d = 0.5 * K.E.out3(K.inv(B.level, B.level + 0.6, t)); K.star(c, BAL.fx + Math.cos(ang) * (130 + 220 * d), BAL.fy + Math.sin(ang) * (70 + 120 * d), 30 * (1 - K.inv(B.level + 0.4, B.level + 0.9, t)), { seed: 3410 + k }); }
  /* Mr. Tick balances on the pivot: leans against the tilt, flings on each sell */
  const pulse = K.pulse(t, 1, 6), st = { blink: K.blinkAt(t, 71), seed: 700, squash: 0.06 * pulse, mouth: "smile", look: [-0.8, 0.6] };
  st.lean = -S.ang * 180 / Math.PI * 1.4;
  st.handL = { x: -110, y: -150 + 20 * Math.sin(t * 5), open: 1 }; st.handR = { x: 110, y: -150 - 20 * Math.sin(t * 5), open: 1 };
  if (S.dropped > 0 && t < B.sells[0]) { st.mouth = "o"; st.brow = 1.2; st.eyeUp = 3; }
  B.sells.forEach((d) => { const u = K.inv(d - 0.15, d + 0.25, t); if (u > 0 && u < 1) { st.handR = { x: 120, y: -230 + 60 * u, hold: "point" }; st.look = [1, -0.4]; st.squash = -0.15 * Math.sin(Math.PI * u); } });
  if (ok > 0) { st.handR = { x: 100, y: -160 - 40 * K.E.back(ok, 2), hold: "thumb" }; st.mouth = "grin"; st.look = [0, -0.5]; st.lean = 0; }
  c.save(); c.translate(px, py - 16); c.rotate(S.ang); K.mouse(c, 0, 0, 1.0, st); c.restore();
}

/* ============================================================

   An enamel station sign drops on the downbeat; the title (DOM text, per
   language) flips in letter by letter like a split-flap board. Four
   platform roundels pop on half beats: TWAP, VWAP, Almgren-Chriss, market
   making. Mr. Tick blows the whistle on "on deck!"; on "All aboard the market
   train" the train pulls in and he waves the flag; on "we got it cleared" the

const SIGN = { cx: 840, cy: 240, w: 1160, h: 290 }; /* left of centre: the top-right corner belongs to the logo */
const ROUND = { y: 512, r: 64, xs: [600, 768, 1152, 1320] };
const ROUND_C = [P.teal, P.mustard, P.tomato, P.tealDark];

/* episode icons, language-free, drawn in a disc of radius r around (0, 0) */
const ICONS = [
  (c, r) => { for (let i = 0; i < 4; i++) K.shape(c, K.rectPts(-r * 0.5 + i * r * 0.27, -r * 0.05, r * 0.18, r * 0.42, 1), { fill: P.teal, w: 2.2, seed: 2000 + i, boil: 0.3 }); },
  (c, r) => { [0.5, 0.3, 0.2, 0.32, 0.55].forEach((h, i) => K.shape(c, K.rectPts(-r * 0.55 + i * r * 0.23, r * 0.38 - h * r, r * 0.16, h * r, 1), { fill: P.mustard, w: 2.2, seed: 2010 + i, boil: 0.3 })); },
  (c, r) => {
    /* Almgren-Chriss frontier: cost falls as risk rises (convex); the chosen point in tomato */
    K.line(c, [[-r * 0.55, -r * 0.55], [-r * 0.55, r * 0.5], [r * 0.6, r * 0.5]], { w: 3, seed: 2019 });
    const P0 = (u) => [-r * 0.4 + u * r * 0.92, -r * 0.42 + r * 0.78 * (1 - Math.pow(1 - u, 3))];
    const pts = []; for (let i = 0; i <= 12; i++) { const q = P0(i / 12); pts.push([q[0], -q[1] + r * 0.06]); }
    K.line(c, pts, { w: 4.5, seed: 2020, smooth: true });
    const d = P0(0.3); K.dot(c, d[0], -d[1] + r * 0.06, r * 0.13, P.tomato, P.ink, 2, 2021);
  },
  (c, r) => {
    K.shape(c, [[-r * 0.3, -r * 0.45], [-r * 0.02, -r * 0.1], [-r * 0.2, -r * 0.1], [-r * 0.2, r * 0.4], [-r * 0.4, r * 0.4], [-r * 0.4, -r * 0.1], [-r * 0.58, -r * 0.1]], { fill: P.teal, w: 2.2, seed: 2030, boil: 0.3 });
    K.shape(c, [[r * 0.3, r * 0.45], [r * 0.02, r * 0.1], [r * 0.2, r * 0.1], [r * 0.2, -r * 0.4], [r * 0.4, -r * 0.4], [r * 0.4, r * 0.1], [r * 0.58, r * 0.1]], { fill: P.tomato, w: 2.2, seed: 2031, boil: 0.3 });
  },
];

function drawTitleSet(c, t) {
  const z = K.tw(t, T.flap2[0], DUR, 1.05, 1.0, K.E.out3);
  K.begin(c, t, { x: 960, y: 560, z, rot: 0 });
  K.applyCam(c, 0.3);
  K.sky(c, { horizon: 800, sun: [960, 250], sunR: 190, warm: 0.6 });
  K.cloud(c, 170, 470, 240, 41); K.cloud(c, 1760, 430, 260, 44);
  K.applyCam(c, 0.6);
  K.hills(c, -500, 2500, 830, { h: 150, color: P.hillMid, seed: 47, n: 6 });
  for (let i = 0; i < 6; i++) poplar(c, -60 + i * 400 + 90 * K.hash(i, 8), 840, 200 + 50 * K.hash(i, 9), 2100 + i, i % 2 ? P.tealDark : P.teal);
  K.applyCam(c, 1);
  K.shape(c, [[-400, 930], [2400, 930], [2400, 1500], [-400, 1500]], { fill: P.hillNear, w: 3, seed: 2150, tone: { color: P.ink, gap: 12, r: 0.6, r2: 2.6, dir: Math.PI / 2, alpha: 0.2 } });
  K.clockTower(c, 1660, 870, 0.62, { hour: 10 + 3 / 60, minute: 3 + (t - T.sign[0]) * 0.5, gearRot: t * 0.7, seed: 2160 });
  K.platform(c, 420, 1500, 870, { h: 80, seed: 2170 });
  K.lampPost(c, 520, 870, 230, 2180); K.lampPost(c, 1400, 870, 230, 2184);
  K.track(c, -400, 2400, 960, { seed: 2190 });
  /* "All aboard the market train": the train pulls in from the left and stops */
  const LX = 172, lx = K.lerp(-950, LX, K.E.out3(K.inv(T.aboard[0], T.aboard[1], t)));
  const rolling = t > T.aboard[0] && t < T.aboard[1];
  if (t > T.aboard[0]) {
    for (let k = 0; k < 20; k++) {
      const ts = T.aboard[0] + k * BEAT * (k < 4 ? 0.5 : 1), age = t - ts; if (age < 0 || age > 1.8) continue;
      const sx = K.lerp(-950, LX, K.E.out3(K.inv(T.aboard[0], T.aboard[1], ts)));
      K.puff(c, sx + 133 * 0.86 - 30 * age, 960 - 280 * 0.86 - 150 * age, 40 + 8 * (k % 3), age / 1.8, 2200 + k);
    }
    for (let j = 0; j < 4; j++) K.wagon(c, lx - 260 - j * 170, 960, WAG_S * 0.86, { roll: lx, seed: 2300 + j * 20, color: j % 2 ? P.teal : P.tealLight, shade: P.tealDark, load: (cc) => K.crate(cc, 0, -58, 140, 84, { label: CHILD, labelSize: 40, seed: 2310 + j * 3 }) });
    K.loco(c, lx, 960, 0.86, { roll: lx, seed: 2350, bob: rolling ? Math.sin(t * 18) * 1.5 : Math.sin(t * 3) * 1 });
  }
  /* "we got it cleared": the line signal turns from tomato to teal */
  const clr = K.inv(T.cleared, T.cleared + 0.25, t);
  K.shape(c, K.rectPts(1846, 470, 14, 400, 2), { fill: P.ink, w: 2, seed: 2360, reg: 0 });
  K.shape(c, K.rrectPts(1812, 360, 82, 160, 40, 6), { fill: P.ink, w: 3, seed: 2361, reg: 0 });
  K.dot(c, 1853, 400, 26, clr > 0.5 ? P.inkSoft : P.tomato, P.ink, 3, 2362);
  K.dot(c, 1853, 478, 26, clr > 0.5 ? P.tealLight : P.inkSoft, P.ink, 3, 2363);
  if (clr > 0) for (let k = 0; k < 5; k++) { const d = t - T.cleared - k * 0.05; if (d > 0 && d < 0.6) { const ang = -Math.PI / 2 + (k - 2) * 0.6; K.star(c, 1853 + Math.cos(ang) * (50 + 160 * d), 478 + Math.sin(ang) * (50 + 160 * d), 26 * (1 - d / 0.6), { seed: 2370 + k }); } }
  /* Mr. Tick on the platform */
  const bl = K.blinkAt(t, 41), pulse = K.pulse(t, 1, 6);
  const st = { blink: bl, squash: 0.07 * pulse, seed: 700, mouth: "smile", look: [0, -0.4] };
  const land = t - T.sign[1] + 0.5;
  st.handL = { x: -66, y: -124 + 6 * pulse, hold: "watch", lid: K.inv(T.roundels, T.roundels + 0.3, t) };
  st.handR = { x: 64, y: -72 };
  if (t < T.sign[1]) { st.look = [0, -1]; st.brow = 1.2; st.mouth = "o"; st.eyeUp = 4 * K.inv(T.sign[0], T.sign[0] + 0.3, t); }
  if (land > 0 && land < 0.6) st.squash = 0.3 * Math.exp(-land * 6) * Math.cos(land * 18);
  /* all aboard: flag up and waving toward the arriving train */
  const ab = K.inv(T.aboard[0] - 0.1, T.aboard[0] + 0.2, t) * (1 - K.inv(T.aboard[1] + 0.3, T.aboard[1] + 0.6, t));
  if (ab > 0) { st.handR = { x: 90, y: -190 + 30 * Math.sin(t * 9) * ab, hold: "flag" }; st.look = [-1, 0]; st.mouth = "open"; st.lean = -4 * ab; }
  if (t > T.roundels && t < T.cleared) { st.look = [0.3 * Math.sin((t - T.roundels) * 2), -1]; st.brow = 0.7; }
  const ok = K.inv(T.cleared, T.cleared + 0.25, t) * (1 - K.inv(T.hatTip - 0.6, T.hatTip - 0.3, t));
  if (ok > 0) { st.handR = { x: 96, y: -150 - 40 * K.E.back(ok, 2), hold: "thumb" }; st.look = [1, -0.6]; st.mouth = "grin"; st.brow = 0.8; }
  const whistleAt = [T.whistle].concat(T.whistle2 ? [T.whistle2] : []);
  let wh = 0, whT = 0;
  whistleAt.forEach((tw0) => { const v = Math.sin(Math.PI * K.inv(tw0 - 0.1, tw0 + 0.6, t)); if (v > wh) { wh = v; whT = tw0; } });
  if (wh > 0) { st.handR = { x: 30, y: -172, hold: "whistle", wAng: Math.PI * 1.04 }; st.mouth = "whistle"; st.puff = wh; st.blink = 0; st.look = [0.3, -0.2]; }
  const tip = K.inv(T.hatTip, T.hatTip + 0.3, t);
  if (tip > 0) {
    const k = Math.sin(Math.PI * K.inv(T.hatTip, T.hatTip + 1.2, t));
    st.handR = { x: 112, y: -236 - 24 * k, open: 1 }; st.hatTip = 16 * k; st.hatLift = 22 * k; st.mouth = "grin"; st.look = [0.2, 0.1]; st.brow = 0.6;
  }
  K.mouse(c, 960, 870, 1.25, st);
  if (wh > 0.1) { const age = K.inv(whT, whT + 0.8, t); K.puff(c, 960 - 40 - 50 * age, 870 - 1.25 * 230 - 140 * age, 40, age, 2400); }
  /* screen-space: sign + roundels */
  K.screen(c);
  const box = K.sign(c, SIGN.cx, SIGN.cy, SIGN.w, SIGN.h, K.inv(T.sign[0], T.sign[1], t), { seed: 2500 });
  for (let i = 0; i < 4; i++) {
    const t0 = T.roundels + i * BEAT * 0.5, a = K.inv(t0, t0 + 0.38, t);
    if (a <= 0) continue;
    const s = K.popS(a), x = ROUND.xs[i], y = ROUND.y + 5 * Math.sin(t * 2.2 + i) - 8 * K.pulse(t - i * 0.06, 1, 6);
    c.save(); c.translate(x, y); c.scale(s, s);
    K.shape(c, K.ellipsePts(0, 0, ROUND.r, ROUND.r, 30), { fill: ROUND_C[i], w: 3.5, smooth: true, seed: 2600 + i * 5 });
    K.shape(c, K.ellipsePts(0, 0, ROUND.r * 0.74, ROUND.r * 0.74, 26), { fill: P.cream, w: 3, smooth: true, seed: 2601 + i * 5 });
    ICONS[i](c, ROUND.r * 0.74);
    c.restore();
  }
  return box;
}

function layoutTitleDom(t, box) {
  titleEl.style.opacity = box ? "1" : "0";
  if (!box) return;
  const n = TITLE_LN.length, sizes = TITLE_LN.map((d) => +d.dataset.size), gap = 14;
  const total = sizes.reduce((a, b) => a + b, 0) + gap * (n - 1);
  let y = box.y - total / 2 - 4;
  TITLE_LN.forEach((d, i) => {
    d.style.top = y.toFixed(1) + "px";
    d.style.left = (box.x - 960).toFixed(1) + "px";
    d.style.transform = `rotate(${(box.rot * 180 / Math.PI).toFixed(3)}deg)`;
    d.style.transformOrigin = `960px ${(box.y - y).toFixed(1)}px`;
    y += sizes[i] + gap;
  });
  TITLE_CH.forEach((ch) => {
    const t0 = T.letters + ch.idx * 0.04, a = K.inv(t0, t0 + 0.32, t);
    /* split-flap flip: the letter swings down from the hinge above it */
    const rx = (1 - K.E.back(a, 1.8)) * -100;
    ch.el.style.opacity = a > 0 ? "1" : "0";
    ch.el.style.transform = `rotateX(${rx.toFixed(1)}deg)`;
  });
}

/* ============================================================
   INTRO 70 RENDER: render(t) is the whole film. One paused GSAP timeline
   drives a proxy whose setter calls render(t).
   Scenes (draw(c, t) functions) follow each other on the song's downbeats;
   between two scenes a diegetic transition renders both into offscreen
   buffers and composites them: a split-flap board, a wall of steam, or a
   railway tunnel. Never a crossfade.
     0.0  yard (intro + verse)     flap   9.1  quote booths
    10.9  train "Choo choo"         tunnel 14.6  order-book board
    18.3  balance "inventory"       flap  21.9  title, "All aboard" to 27.1
   ============================================================ */
const bufA = document.createElement("canvas"), bufB = document.createElement("canvas");
bufA.width = bufB.width = 1920; bufA.height = bufB.height = 1080;
const ctxA = bufA.getContext("2d"), ctxB = bufB.getContext("2d");

const sLadder = (c, t) => drawLadder(c, t, T.L2, "+0.04", BOOK1);
const sBal = (c, t) => drawBalance(c, t, T.B2);
/* [window, from, to, kind] in time order; a scene runs from the middle of one window to the middle of the next */
const CUTS = [
  [T.flap1, drawYard, drawQuotes, "flap"],
  [T.steam, drawQuotes, drawTrain, "steam"],
  [T.tunnel3, drawTrain, sLadder, "tunnel"],
  [T.steam2, sLadder, sBal, "steam"],
  [T.flap2, sBal, drawTitleSet, "flap"],
];

/* scene for time t (outside transitions) */
function sceneAt(t) {
  let sc = drawYard;
  CUTS.forEach((q) => { if (t >= (q[0][0] + q[0][1]) / 2) sc = q[2]; });
  return sc;
}

/* railway tunnel: an arch closes to black on the old scene and opens on the new one */
function tunnelWipe(c, u) {
  const closing = u < 0.5, k = closing ? 1 - K.E.in3(u * 2) : K.E.out3((u - 0.5) * 2);
  const r = 40 + 1280 * k, cx = 960, cy = 620;
  K.screen(c);
  c.fillStyle = P.ink; c.fillRect(0, 0, 1920, 1080);
  if (k > 0.002) {
    const arch = () => { c.beginPath(); c.moveTo(cx - r, 1200); c.lineTo(cx - r, cy); c.arc(cx, cy, r, Math.PI, 0); c.lineTo(cx + r, 1200); c.closePath(); };
    c.save(); arch(); c.clip(); c.drawImage(closing ? bufA : bufB, 0, 0); c.restore();
    /* brick ring of the portal */
    c.save(); c.strokeStyle = P.tomatoDark; c.lineWidth = 34; arch(); c.stroke();
    c.strokeStyle = P.ink; c.lineWidth = 4; c.beginPath();
    for (let i = 0; i <= 14; i++) { const a = Math.PI + (i / 14) * Math.PI; c.moveTo(cx + Math.cos(a) * (r - 17), cy + Math.sin(a) * (r - 17)); c.lineTo(cx + Math.cos(a) * (r + 17), cy + Math.sin(a) * (r + 17)); }
    c.stroke(); c.restore();
  }
}

/* split-flap wipe: tiles flip column by column, left to right */
function flapWipe(c, u) {
  const COLS = 8, ROWS = 4, w = 1920 / COLS, h = 1080 / ROWS;
  K.screen(c);
  for (let col = 0; col < COLS; col++) for (let row = 0; row < ROWS; row++) {
    const d = (col / (COLS - 1)) * 0.55 + (row / (ROWS - 1)) * 0.08 + K.hash(col * 7 + row, 3) * 0.04;
    const f = K.clamp((u - d) / 0.33, 0, 1), x = col * w, y = row * h, hh = h / 2, cy = y + hh;
    /* top half: new picture behind, old flap falling over it */
    c.drawImage(f > 0 ? bufB : bufA, x, y, w, hh, x, y, w, hh);
    /* bottom half: old picture until the flap lands on it */
    c.drawImage(bufA, x, cy, w, hh, x, cy, w, hh);
    if (f > 0 && f < 0.5) {
      const k = Math.cos(f * Math.PI);
      c.drawImage(bufA, x, y, w, hh, x, cy - hh * k, w, hh * k);
      c.fillStyle = `rgba(20,20,24,${(0.45 * (1 - k)).toFixed(3)})`; c.fillRect(x, cy - hh * k, w, hh * k);
    } else if (f >= 0.5) {
      const k = -Math.cos(f * Math.PI);
      c.drawImage(bufB, x, cy, w, hh, x, cy, w, hh * k);
      if (f < 1) { c.fillStyle = `rgba(20,20,24,${(0.4 * (1 - k)).toFixed(3)})`; c.fillRect(x, cy, w, hh * k); }
    }
  }
  /* the board itself: tile gaps and hinges, strongest mid-wipe */
  const a = Math.sin(Math.PI * K.clamp(u, 0, 1));
  c.save(); c.globalAlpha = 0.85 * a; c.strokeStyle = P.ink;
  c.lineWidth = 6; c.beginPath();
  for (let col = 1; col < COLS; col++) { c.moveTo(col * w, 0); c.lineTo(col * w, 1080); }
  for (let row = 1; row < ROWS; row++) { c.moveTo(0, row * h); c.lineTo(1920, row * h); }
  c.stroke();
  c.lineWidth = 2.5; c.beginPath();
  for (let row = 0; row < ROWS; row++) { c.moveTo(0, row * h + h / 2); c.lineTo(1920, row * h + h / 2); }
  c.stroke(); c.restore();
}

/* steam wipe: a wall of puffs rolls left to right; behind it is the next scene */
function steamWipe(c, u) {
  const x = K.lerp(-520, 2500, K.E.inOut(u));
  K.screen(c);
  c.drawImage(bufA, 0, 0);
  c.save(); c.beginPath(); c.rect(0, 0, Math.max(0, x - 120), 1080); c.clip(); c.drawImage(bufB, 0, 0); c.restore();
  for (let i = 0; i < 9; i++) {
    const y = -40 + i * 145, j = K.hash(i, 5);
    K.puff(c, x - 120 - 140 * j, y + 30 * Math.sin(i + K.now * 4), 190 + 60 * j, 0.5, 2700 + i);
    K.puff(c, x + 30 - 90 * K.hash(i, 6), y + 70, 120 + 40 * j, 0.45, 2720 + i);
  }
}

function render(t) {
  let box = null;
  try {
    const cut = CUTS.find((q) => t >= q[0][0] && t < q[0][1]);
    if (cut) {
      const u = K.inv(cut[0][0], cut[0][1], t);
      cut[1](ctxA, t);
      const r = cut[2](ctxB, t);
      if (cut[2] === drawTitleSet) box = r;
      if (cut[3] === "flap") flapWipe(ctx, u); else if (cut[3] === "steam") steamWipe(ctx, u); else tunnelWipe(ctx, u);
    } else {
      const sc = sceneAt(t);
      const r = sc(ctx, t);
      if (sc === drawTitleSet) box = r;
    }
  } catch (err) {
    /* never leave a blank frame silently: draw the error so a snapshot shows it */
    K.screen(ctx); ctx.fillStyle = "#300"; ctx.fillRect(0, 0, 1920, 80); ctx.fillStyle = "#fff"; ctx.font = "26px monospace"; ctx.fillText(String(err && err.stack || err).slice(0, 150), 20, 50);
  }
  layoutTitleDom(t, t >= T.flap2[1] ? box : null);
  /* logo: one small bounce on the first downbeats, then static */
  const lb = K.inv(0.05, 0.5, t), bounce = lb > 0 && lb < 1 ? Math.sin(Math.PI * lb) : 0;
  logoEl.style.transform = `translateY(${(-10 * bounce).toFixed(2)}px) scale(${(1 + 0.05 * bounce).toFixed(3)})`;
  /* paper grain steps at the boil rate */
  const f = K.boilFrame(t);
  grainEl.style.backgroundPosition = ((f % 7) * 37) + "px " + ((f % 5) * 53) + "px";
}

const grainEl = document.getElementById("grain"), logoEl = document.getElementById("logo");
grainEl.style.backgroundImage = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .3  0 0 0 1.4 -.2'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>\")";

const TL = gsap.timeline({ paused: true });
const drv = { _t: 0 };
Object.defineProperty(drv, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
TL.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
render(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(drv._t));
window.__timelines["main"] = TL;
window.__render = render;

})();
    </script>
  </body>
