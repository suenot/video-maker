    <script>
(function () {
/* ============================================================
   KIT 00 CORE (Surf Turtle kit): math, seeded random, noise, splines, beat grid, boil clock
   Every frame is a pure function of time t (seconds). No Math.random,
   no Date.now, no performance.now anywhere in the kit.
   ============================================================ */
var VK = window.VK || (window.VK = {});
(function (K) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const ss = (a, b, t) => { const u = inv(a, b, t); return u * u * (3 - 2 * u); };
  const f1 = (n) => Math.round(n * 10) / 10;
  const f2 = (n) => Math.round(n * 100) / 100;

  /* eases (u in 0..1) */
  const E = {
    inOut: (u) => u * u * (3 - 2 * u),
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    back: (u, s) => { s = s == null ? 1.7 : s; const v = u - 1; return 1 + v * v * ((s + 1) * v + s); },
    elastic: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
  };
  /* tween value from a to b during [t0, t1] with an ease */
  const tw = (t, t0, t1, a, b, ease) => lerp(a, b, (ease || E.inOut)(inv(t0, t1, t)));

  /* seeded PRNG (mulberry32) */
  function mulberry(seed) {
    let s = seed | 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let q = Math.imul(s ^ (s >>> 15), 1 | s);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* stateless hash -> [0,1) for (i, seed) */
  function hash(i, s) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const hs = (i, s) => hash(i, s) * 2 - 1; /* signed */
  function vnoise(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s), hash(i + 1, s), u); }
  function fbm(x, s, oct) { let a = 0.5, v = 0, fr = 1, n = 0; for (let k = 0; k < (oct || 3); k++) { v += a * vnoise(x * fr, s + k * 17); n += a; a *= 0.5; fr *= 2.03; } return v / n; }

  /* monotone cubic Hermite spline through [[t, v], ...] (no overshoot) */
  function mkSpline(pts) {
    const n = pts.length, T = pts.map((p) => p[0]), V = pts.map((p) => p[1]);
    if (n === 1) return () => V[0];
    const d = [], m = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) d[i] = (V[i + 1] - V[i]) / (T[i + 1] - T[i]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
    }
    return function (x) {
      x = clamp(x, T[0], T[n - 1]);
      let i = 0; while (i < n - 2 && x >= T[i + 1]) i++;
      const h = T[i + 1] - T[i], u = (x - T[i]) / h, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * V[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * V[i + 1] + (u3 - u2) * h * m[i + 1];
    };
  }
  /* keys: [[t, {a:.., b:..}], ...] -> fn(t) -> {a, b} (one spline per channel) */
  function mkTrack(keys) {
    const names = Object.keys(keys[0][1]), sp = {};
    names.forEach((k) => { sp[k] = mkSpline(keys.map((q) => [q[0], q[1][k]])); });
    return (t) => { const o = {}; names.forEach((k) => (o[k] = sp[k](t))); return o; };
  }

  /* ---------- beat grid (retime to the real song by changing BPM/OFFSET or BARS) ----------
     BARS: optional list of measured downbeat times (seconds). Songs cut from

  forecast: at(7),                 /* 10.75 "read the sea": the forecast dial swings to storm */
  grab: at(7, 2),                  /* Siggy picks the storm gun board */
  tilt: [at(8, -1.5), at(8)],      /* camera tilts up into the sky, cut on the downbeat */
  hmm: at(8),                      /* 12.24 "Volatility Modeling and Regimes!": two hidden states (buoys) */
  hmmSw: [at(9, 2), at(10, 2), at(11), at(11, 2)], /* instrumental: hidden states switch */
  unroll: [at(12, -1), at(12)],    /* a poster unrolls down over the sea */
  lev: at(12),                     /* 18.09 leverage effect: drops raise volatility more than rises */
  levPoint: at(13),                /* 19.57 Siggy points at the drop's spike */
  roll2: [at(14, -1), at(14)],     /* the poster rolls up onto the sea again */
  ride: at(14),                    /* 21.06 a cluster of big sets, then calm comes back */
  calmBack: at(16),                /* 23.99 the beam turns turquoise again */
  tilt2: [at(17, -1.5), at(17)],   /* tilt up into the sunset */
  title: at(17),                   /* 25.47 title card on the ending */
  line2: at(17, 2),
  medals: at(18),                  /* 26.94 five episode medals pop on eighth notes */
  hang: at(19),                    /* 28.42 hop on the wave, spray */
  tip: at(19, 2),                  /* shades up on the head, happy squint */
};

/* ---------- variables (title text, language) ---------- */
const VARS = Object.assign({ title: "Volatility Modeling|& Regimes", lang: "en" },
  (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {});
const LANG = VARS.lang || "en";
const TITLE_LINES = String(VARS.title || "Volatility Modeling|& Regimes").split("|").map((s) => s.trim()).filter(Boolean);
const IS_CJK = LANG === "zh-CN" || LANG === "zh-TW";

/* ---------- title DOM: one span per character (letters drop in on the beat) ---------- */
const titleEl = document.getElementById("title");
if (LANG === "zh-CN") titleEl.classList.add("cjk-sc");
if (LANG === "zh-TW") titleEl.classList.add("cjk-tc");
const TITLE_CH = [];
TITLE_LINES.forEach((ln, li) => {

    const s = document.createElement("span");
    s.className = "ch"; s.textContent = c === " " ? " " : c;

  });

});
const TITLE_LN = Array.from(titleEl.querySelectorAll(".ln"));
/* fit: line 1 at most 150 px (Lobster) / 140 px (CJK), line 2 at most 74 px, both inside 1700 px */
function fitTitle() {
  const fam = (li) => (IS_CJK ? (LANG === "zh-CN" ? '"CJK SC"' : '"CJK TC"') : li === 0 ? '"Lobster"' : '"Nunito"');
  TITLE_LN.forEach((d, li) => {
    const max = li === 0 ? (IS_CJK ? 140 : 150) : 74, wt = li === 0 && !IS_CJK ? 400 : 900;
    const txt = li === 0 ? TITLE_LINES[li] : TITLE_LINES[li].toUpperCase();
    ctx.save(); ctx.font = `${wt} 100px ${fam(li)}`; if (li > 0 && !IS_CJK) ctx.letterSpacing = "9px";
    const w100 = ctx.measureText(txt).width; ctx.restore();
    const size = Math.max(40, Math.min(max, Math.floor((1700 / Math.max(1, w100)) * 100)));
    d.style.fontSize = size + "px"; d.dataset.size = size;
  });
}

/* ---------- data: daily returns with a calm / storm / calm regime path (seeded) ---------- */
const RET = [], SIG = [], REG = [];
(function () {
  const rnd = K.mulberry(20261012), gauss = () => { let u = 0, v = 0; while (u === 0) u = rnd(); v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(K.TAU * v); };
  /* GARCH(1,1): sigma2 = omega + alpha * r^2 + beta * sigma2 (alpha 0.15); the regime sets omega and beta (storms persist, calm forgets fast) */
  let s2 = 0.33;
  for (let i = 0; i < 60; i++) {
    const storm = i >= 26 && i < 44, om = storm ? 0.9 : 0.12;
    s2 = om + 0.15 * (i ? RET[i - 1] * RET[i - 1] : 0) + (storm ? 0.7 : 0.5) * s2;
    const s = Math.sqrt(s2), r = s * gauss();
    RET.push(Math.max(-6.5, Math.min(6.5, r))); SIG.push(s); REG.push(storm ? 1 : 0);
  }
})();
const BANDS = [{ from: 0, to: 25, regime: "calm" }, { from: 26, to: 43, regime: "storm" }, { from: 44, to: 59, regime: "calm" }];

/* ============================================================
   INTRO 20 SEA: the side set. Siggy surfs in on glassy calm water, checks
   the gauge on the board, spots a storm bank, rides the calm, and on
   "ride the storm" the regime flips: the lighthouse beam turns coral, the
   sky bruises, the wave stands up and a second big set follows (clustering).
   ============================================================ */
const SEA_H = 560;            /* horizon (world y) */
const BOARD_LEN = 400;

const camSea = K.mkTrack([
  [0, { x: 960, y: 140, z: 1 }],
  [T.tiltDown[1], { x: 960, y: 560, z: 1.05 }],
  [T.gauge + 0.45, { x: 940, y: 700, z: 1.5 }],
  [T.calm + 0.35, { x: 960, y: 560, z: 1.02 }],
  [T.surprise + 0.3, { x: 1060, y: 600, z: 1.14 }],
  [T.storm, { x: 960, y: 540, z: 1.0 }],
  [T.storm + 0.6, { x: 900, y: 600, z: 1.07 }],
  [T.dial[1], { x: 900, y: 620, z: 1.16 }],
]);
/* regime: 0 calm -> 1 storm, flips on the "ride the storm" downbeat */
const stormAt = (t) => K.E.out3(K.inv(T.storm, T.storm + 0.42, t));
const waveH = (t) => 440 * K.E.back(K.inv(T.storm, T.storm + 0.6, t), 1.3);

/* the surfer: board under the feet, turtle on top. ang = board angle (deg) */
function surfer(x, y, ang, s, pose, gauge, kind) {
  const a = (ang * Math.PI) / 180, L = BOARD_LEN * s / 1.1;
  K.surfboard(ctx, x - Math.cos(a) * L * 0.5, y - Math.sin(a) * L * 0.5, L, ang, { gauge, kind: kind || "long", seed: 210 });
  K.turtle(ctx, x - Math.sin(a) * 4, y - 6, s, Object.assign({ lean: ang }, pose));
}

/* glint: a four-point print star */
function glint(x, y, r, a) {
  if (a <= 0) return;
  const pts = []; for (let i = 0; i < 8; i++) { const q = (i / 8) * K.TAU, rr = i % 2 ? r * 0.22 : r; pts.push([x + Math.cos(q) * rr, y + Math.sin(q) * rr]); }
  K.shape(ctx, pts, { fill: P.cream, w: 3, boil: 0.3, seed: 77, alpha: a, reg: false });
}

function seaPose(t) {
  const p = { seed: 700, blink: K.blinkAt(t, 3), squash: 0.07 * K.pulse(t, 1, 6), footL: { x: -66, y: 0 }, footR: { x: 58, y: 0 } };
  const bal = Math.sin(t * 2.2);
  p.flipL = { x: -120, y: -118 + 10 * bal }; p.flipR = { x: 118, y: -112 - 10 * bal };
  if (t < T.shaka) { p.squash += 0.12; p.mouth = "smile"; }
  else if (t < T.gauge) {
    /* shaka: right flipper up and waving, grin to camera, a glint on the shades */
    const u = K.inv(T.shaka, T.shaka + 0.2, t), wv = Math.sin((t - T.shaka) * K.TAU * 2.7) * 26 * K.inv(T.shaka + 0.15, T.shaka + 0.3, t);
    p.flipR = { x: K.lerp(118, 110 + wv, u), y: K.lerp(-112, -250, K.E.back(u, 1.6)) };
    p.mouth = "grin"; p.turn = 0.25; p.headTilt = -6 + 4 * Math.sin(t * 5);
  } else if (t < T.calm) {
    /* looks down at the gauge on the nose of the board, taps it */
    p.turn = 0.75; p.headTilt = 14; p.mouth = "o"; p.shades = 16; p.look = [0.8, 0.9]; p.brow = 0.3;
    const tap = Math.exp(-14 * Math.max(0, t - T.tap)) * (t > T.tap ? 1 : 0);
    p.flipR = { x: 150, y: -60 + 50 * tap - 20 * K.inv(T.gauge, T.gauge + 0.25, t) };
    p.squash = 0.05 + 0.1 * tap;
    if (t > T.tap + 0.15) p.mouth = "smile";
  } else if (t < T.surprise) {
    /* "Ride the calm": hop up, carve lazily, one flipper on the hip */
    const hopU = K.inv(T.calm, T.calm + 0.36, t);
    p.hop = Math.sin(hopU * Math.PI) * 34; p.squash = hopU < 1 ? -0.15 * Math.sin(hopU * Math.PI) : 0.06 * K.pulse(t, 1, 6);
    p.mouth = "smile"; p.turn = -0.15; p.headTilt = 6 * Math.sin(t * 2.4);
    p.flipL = { x: -64, y: -60 }; p.flipR = { x: 140, y: -150 + 12 * Math.sin(t * 4) };
  } else if (t < T.storm) {
    /* the storm bank: shades slide, eyes pop, "!" ; then a crouch before the drop */
    p.turn = 0.9; p.headTilt = -4;
    const sp = K.inv(T.surprise, T.surprise + 0.15, t), cr = K.inv(T.crouch, T.crouch + 0.15, t);
    p.shades = 22 * sp * (1 - cr); p.eyeUp = 3 * sp; p.brow = 1.4 * sp - 1.9 * cr; p.mouth = cr > 0 ? "flat" : "wow"; p.look = [1, -0.3];
    p.exclaim = K.inv(T.surprise, T.surprise + 0.3, t) * (1 - cr);
    p.neck = 0.8 * sp * (1 - cr);
    p.squash = -0.22 * sp * (1 - cr) + 0.32 * cr; p.blink = 0;
    p.flipL = { x: -100, y: -100 + 30 * sp }; p.flipR = { x: 110, y: -150 - 40 * sp };
  } else {
    /* "ride the storm": crouched, flippers out, big grin */
    const k = K.inv(T.storm, T.storm + 0.3, t);
    p.squash = 0.18 * k + 0.08 * K.pulse(t, 1, 6); p.mouth = "grin"; p.brow = 0.9; p.turn = -0.2; p.headTilt = -8;
    p.flipL = { x: -150, y: -170 + 12 * Math.sin(t * 7) }; p.flipR = { x: 150, y: -70 + 10 * Math.sin(t * 6) };
    p.footL = { x: -72, y: 0 }; p.footR = { x: 64, y: 0 };
  }
  return p;
}

function drawSea(t) {
  const cam = Object.assign({ rot: 0 }, camSea(t));
  if (t > T.storm) { const sh = Math.exp(-5 * (t - T.storm)); cam.x += 7 * sh * Math.sin(t * 61); cam.y += 6 * sh * Math.sin(t * 47); }
  K.begin(ctx, t, cam);
  K.applyCam(ctx, 1);
  const storm = stormAt(t);
  K.sky(ctx, SEA_H, { storm, sunX: 1180, sunY: 300, sunR: 130, top: -720 });
  /* storm bank rolling up on the horizon (from "horizon" until it takes the sky) */
  const bank = K.inv(T.horizon, T.storm, t);
  if (bank > 0 && storm < 1) {
    ctx.save(); ctx.globalAlpha *= 1 - storm;
    [[0, 1.3, 0], [260, 1.0, 1], [-200, 0.9, 2]].forEach((c, i) => K.cloud(ctx, K.lerp(2500, 1480, K.E.out3(bank)) + c[0], 470 - i * 40 - 40 * bank, c[1] * (0.6 + 0.6 * bank), 20 + c[2], 1));
    ctx.restore();
  }
  K.farIsle(ctx, 380, SEA_H, 420, storm, 61);
  for (let i = 0; i < 3; i++) K.gull(ctx, ((300 + i * 260 + t * 60) % 2200) - 100, 160 + i * 50 + 10 * Math.sin(t + i), 0.9, 50 + i);
  /* lighthouse: beam colour = regime; it blinks on downbeats while calm, flashes on the flip */
  const flash = t > T.storm ? Math.exp(-4 * (t - T.storm)) : 0.5 * K.pulse(t, 4, 5) * K.inv(T.calm - 0.3, T.calm, t);
  K.lighthouse(ctx, 1730, SEA_H + 40, 0.72, { beam: K.mix(P.beamCalm, P.beamStorm, storm), ang: 0.22 + 0.16 * Math.sin(t * 1.1), flash, seed: 120 });
  K.ocean(ctx, SEA_H, { storm, vol: 0.12 + 0.88 * storm, bottom: 1240 });
  /* clustering: a second big set stands up behind */
  const h2 = 280 * K.E.back(K.inv(T.cluster, T.cluster + 0.5, t), 1.2);
  if (h2 > 6) K.surfWave(ctx, 1500 - 60 * (t - T.cluster), 860, h2, { storm, seed: 330, width: 900 });
  /* the hero wave under Siggy */
  const h = waveH(t), cx = 330 + 50 * Math.max(0, t - T.storm);
  if (h > 6) K.surfWave(ctx, cx, 1080, h, { storm, seed: 300 });
  /* Siggy's path: glide in, drift, then lifted onto the wave face */
  const bob = 8 * Math.sin(t * 2.6);
  let x = K.tw(t, T.surfIn[0], T.surfIn[1], -300, 820, K.E.out3) + 26 * Math.sin(t * 0.9) * K.inv(T.shaka, T.shaka + 1, t), y = 890 + bob, ang = -3 + 3 * Math.sin(t * 2.6 + 1);
  if (t > T.calm && t < T.storm + 0.5) { x += 60 * Math.sin((t - T.calm) * 3); ang += 6 * Math.sin((t - T.calm) * 3); }
  const k = K.E.inOut(K.inv(T.storm, T.storm + 0.5, t));
  if (k > 0) {
    const v = 0.5, wx = cx + 60 + (600 - 60) * (1 - v), wy = 1080 - h * (0.2 + 0.72 * v);
    x = K.lerp(x, wx + 30 * Math.sin(t * 3), k); y = K.lerp(y, wy + 10 * Math.sin(t * 4), k); ang = K.lerp(ang, 16 + 4 * Math.sin(t * 3), k);
  }
  const gauge = storm > 0 ? K.lerp(0.18, 0.92, K.E.back(K.inv(T.storm, T.storm + 0.5, t), 2)) + 0.03 * Math.sin(t * 23) * storm : 0.16 + 0.05 * K.pulse(t, 1, 5) + 0.06 * Math.exp(-8 * Math.max(0, t - T.tap)) * (t > T.tap ? 1 : 0);
  surfer(x, y, ang, 1.3, seaPose(t), gauge);
  if (t > T.storm) K.spray(ctx, x + 160, y - 10, t - T.storm - 0.1, 1.4, 501);
  /* glint on the shades */
  const ga = Math.max(0, 1 - Math.abs(t - T.shaka - BEAT) / 0.15);
  glint(x + 50, y - 345, 34, ga);
  K.rain(ctx, storm * K.inv(T.storm, T.storm + 0.3, t), { x: cam.x - 1100, y: cam.y - 700, w: 2400, h: 1500 });
}

/* ============================================================
   INTRO 30 CHART: "Every regime has its form". We dive through the board's
   gauge into a surf-report poster: the day-by-day wave heights (returns)
   paint left to right over calm / storm / calm bands, the sigma envelope
   swells with them (big waves follow big waves), and on "its form" the two
   regime distributions rise: a narrow calm hump and a wide, fat storm one.
   Language-free: regimes are shown by colour and the sun / storm medals.
   ============================================================ */
const CHART = { x: 730, y: 560, w: 1240, h: 700 };
const DIST = { x: 1600, y: 560, w: 500, h: 700 };

function drawPosterBack(t) {
  K.screen(ctx);
  ctx.fillStyle = P.cream; ctx.fillRect(0, 0, K.W, K.H);
  K.halftone(ctx, K.ellipsePts(1820, 120, 420, 420, 24), { color: P.sky2, cell: 16, density: 0.5, alpha: 0.35 });
  K.halftone(ctx, K.ellipsePts(80, 1000, 360, 300, 24), { color: P.calm, cell: 16, density: 0.45, alpha: 0.3 });
  K.bands(ctx, -10, -10, K.W + 20, 120, [P.sky0, P.sky1, P.sky2, P.sky3], { wave: 4, seed: 9 });
  K.line(ctx, [[-10, 110], [K.W + 10, 110]], { stroke: P.ink, w: 5, boil: 0.6, seed: 801 });
  /* poster foot: a strip of little waves */
  K.waveRow(ctx, 1040, 16, { len: 120, speed: 30, fill: P.sea, shade: P.seaMid, seed: 805, bottom: 120 });
}

function drawChart(t) {
  K.begin(ctx, t, { x: 960, y: 540, z: 1, rot: 0 });
  drawPosterBack(t);
  const z = K.tw(t, T.chart - 0.3, T.roll[0], 1.0, 1.035, K.E.inOut);
  ctx.save(); ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(-960, -540);
  const draw = K.inv(T.chart, T.chart + 1.35, t);
  const series = [
    { kind: "zig", data: RET, colorAt: (i, v) => (v >= 0 ? P.up : P.down) },
    { kind: "line", data: SIG.map((s) => 2 * s), color: P.sigma, w: 7 },
    { kind: "line", data: SIG.map((s) => -2 * s), color: P.sigma, w: 7 },
  ];
  const ch = K.posterChart(ctx, CHART.x, CHART.y, CHART.w, CHART.h, series, { a: K.inv(T.dial[0], T.chart + 0.1, t), draw, bands: BANDS, yMin: -7.2, yMax: 7.2, zero: true, seed: 41 });
  /* regime medals stuck on the card's top edge, each pops when its band starts painting */
  if (ch) BANDS.forEach((b, i) => {
    const tb = T.chart + 1.35 * (b.from / RET.length) + 0.05;
    const mx = (ch.X(b.from) + ch.X(b.to)) / 2;
    K.medal(ctx, mx, CHART.y - CHART.h / 2 + 4, 46, { a: K.inv(tb, tb + 0.3, t), color: b.regime === "storm" ? P.storm : P.calm, icon: b.regime === "storm" ? K.ICON.storm : K.ICON.sun, seed: 640 + i * 5 });
  });
  /* "has its form": distribution card with the two humps */
  const dc = K.posterChart(ctx, DIST.x, DIST.y, DIST.w, DIST.h, [], { a: K.inv(T.forms - 0.15, T.forms + 0.2, t), seed: 47 });
  if (dc) {
    const base = dc.pb - 4, mid = (dc.pl + dc.pr) / 2;
    K.hump(ctx, mid, base, 215, 230, { a: K.inv(T.forms + BEAT, T.forms + BEAT + 0.4, t), color: P.storm, fat: 0.35, seed: 82 });
    K.hump(ctx, mid, base, 105, 470, { a: K.inv(T.forms, T.forms + 0.4, t), color: P.calm, seed: 81 });
    K.medal(ctx, mid - 150, DIST.y - DIST.h / 2 + 140, 40, { a: K.inv(T.forms + 0.1, T.forms + 0.4, t), color: P.calm, icon: K.ICON.sun, seed: 660 });
    K.medal(ctx, mid + 150, DIST.y - DIST.h / 2 + 140, 40, { a: K.inv(T.forms + BEAT + 0.1, T.forms + BEAT + 0.4, t), color: P.storm, icon: K.ICON.storm, seed: 665 });
  }
  ctx.restore();
  /* Siggy pops up from the bottom-left corner and points at the storm band */
  const up = K.E.back(K.inv(T.point, T.point + 0.4, t), 1.8);
  if (up > 0 && ch) {
    K.turtle(ctx, 170, 1230 - 190 * up, 1.25, {
      seed: 700, blink: K.blinkAt(t, 9), mouth: "grin", shades: 20, look: [1, -0.6], turn: 0.45, brow: 0.6,
      squash: 0.1 * K.pulse(t, 1, 6) - 0.2 * (1 - K.inv(T.point + 0.1, T.point + 0.4, t)),
      flipR: { x: 150, y: -280 + 8 * Math.sin(t * 6) }, flipL: { x: -90, y: -80 },
    });
  }
}

/* ============================================================
   INTRO 40 FORECAST: "Measure the swell and read the sea". On the beach the
   surf-report board writes the GARCH(1,1) recursion in chalk; on "read the
   sea" its dial swings to storm and Siggy swaps the calm longboard for the
   coral storm gun. Then the camera tilts up into a clearing sky (title).
   ============================================================ */
const FC = { horizon: 450, sand: 700, board: { x: 690, y: 330, w: 1120, h: 290 } };
const FORMULA = ["σ^2_t = ω + α·ε^2_{t-1} + β·σ^2_{t-1}", "ω = 0.02   α = 0.10   β = 0.88"];
const RACK = { long: [1530, 905], gun: [1700, 905] };

const camFc = (t) => ({ x: 960 + 14 * Math.sin(t * 0.7), y: K.tw(t, T.tilt[0], T.tilt[1], 540, -620, K.E.in3), z: K.tw(t, T.board - 0.4, T.forecast + 1, 1.04, 1.0, K.E.out3), rot: 0 });

function fcPose(t) {
  const p = { seed: 700, blink: K.blinkAt(t, 5), squash: 0.07 * K.pulse(t, 1, 6), footL: { x: -44, y: 0 }, footR: { x: 44, y: 0 } };
  if (t < T.forecast) {
    /* reads the board, pointing with the left flipper, nods on the beat */
    p.turn = -0.75; p.shades = 18; p.look = [-1, -0.7]; p.mouth = "o"; p.brow = -0.3; p.headTilt = -6 + 5 * K.pulse(t, 1, 5);
    const r = K.inv(T.board, T.board + 0.35, t);
    p.flipL = { x: K.lerp(-90, -170, r), y: K.lerp(-80, -290, K.E.back(r, 1.6)) }; p.flipR = { x: 70, y: -40 };
  } else if (t < T.grab) {
    /* the dial swings: eyebrows up, then turns to the boards and hovers over the longboard */
    const k = K.inv(T.forecast, T.forecast + 0.25, t);
    p.turn = K.lerp(-0.6, 0.8, K.inv(T.forecast + BEAT, T.forecast + 1.4 * BEAT, t)); p.shades = 20 * (1 - K.inv(T.grab - 0.2, T.grab, t));
    p.look = [p.turn > 0 ? 1 : -1, -0.4]; p.eyeUp = 3 * k; p.brow = 1.2 * k; p.mouth = "open"; p.neck = 0.5 * k;
    p.flipL = { x: -100, y: -90 }; p.flipR = { x: K.lerp(90, 200, K.inv(T.forecast + BEAT, T.grab - 0.1, t)), y: -180 };
    if (t > T.forecast + 1.5 * BEAT) { p.mouth = "flat"; p.headTilt = 10 * Math.sin((t - T.forecast) * 14) * (1 - K.inv(T.grab - 0.2, T.grab, t)); } /* "nah" head shake */
  } else {
    /* holds the storm gun, grin, shaka with the other flipper */
    const k = K.inv(T.grab, T.grab + 0.3, t);
    p.turn = 0.2; p.mouth = "grin"; p.brow = 0.8; p.squash = 0.06 * K.pulse(t, 1, 6) - 0.12 * Math.sin(Math.min(1, k) * Math.PI);
    p.flipR = { x: 130, y: -140 }; p.flipL = { x: -130, y: K.lerp(-90, -250, K.E.back(K.inv(T.grab + BEAT, T.grab + BEAT + 0.3, t), 1.8)) };
  }
  return p;
}

function drawForecast(t) {
  const cam = camFc(t);
  K.begin(ctx, t, cam);
  K.applyCam(ctx, 1);
  /* the storm is clearing; during the tilt the sky goes back to sunset */
  const storm = 0.55 * (1 - K.inv(T.tilt[0], T.tilt[1], t));
  K.sky(ctx, FC.horizon, { storm, sunX: 1250, sunY: 300, sunR: 120, top: -1700, drift: 300 });
  K.farIsle(ctx, 260, FC.horizon, 380, storm, 63);

  K.ocean(ctx, FC.horizon, { storm, vol: 0.7, bottom: FC.sand + 30, rows: 5 });

  for (let i = 0; i < 2; i++) K.palm(ctx, i ? 1900 : 40, FC.sand + 60, 1.25 - i * 0.2, 90 + i * 7);
  /* the surf-report board */
  const b = FC.board, wr = K.inv(T.board + 0.1, T.forecast - 0.1, t);
  K.forecastBoard(ctx, b.x, b.y, b.w, b.h, [{ t: FORMULA[0], size: 58 }, { t: FORMULA[1], size: 42, c: P.creamShade }], { a: K.inv(T.board - 0.2, T.board + 0.15, t), write: wr, hi: /σ/, seed: 31 });
  /* the board's dial: swings to storm on "read the sea" */
  const da = K.inv(T.forecast - 0.1, T.forecast + 0.2, t);

    const s = K.popS(da), v = K.lerp(0.2, 0.9, K.E.back(K.inv(T.forecast, T.forecast + 0.5, t), 2.4)) + 0.02 * Math.sin(t * 19);
    ctx.save(); ctx.translate(b.x + b.w / 2 + 10, b.y - b.h / 2 + 10); ctx.scale(s, s);

  /* the board rack: calm longboard, storm gun (stuck in the sand, nose up) */

  if (g < 1) K.surfboard(ctx, K.lerp(RACK.gun[0], SX + 160, g), K.lerp(RACK.gun[1], SY - 10, g), 520, K.lerp(-92, -80, g) + 1.5 * Math.sin(t * 1.5), { kind: "gun", seed: 240 });
  const pose = fcPose(t);

/* ============================================================
   INTRO 45 HMM: "hidden states switch". Two buoys on the water are the two
   hidden regimes (sun = calm, storm cloud = storm). Currents between them
   carry the transition probabilities, self-loops the "stay" odds. The
   active state glows and the whole world (sky, sea, beam) follows it;
   Siggy surfs over to whichever buoy is live.
   drawHmm(t, t0, switches): t0 = scene start, switches = times the state flips
   ============================================================ */
const HMM = { horizon: 520, calm: [600, 800], storm: [1330, 800] };

function hmmState(t, switches) {
  let s = 0, last = -1e9;
  switches.forEach((ts) => { if (t >= ts) { s = 1 - s; last = ts; } });
  return { s, last, u: K.E.inOut(K.inv(last, last + 0.45, t)) };
}

function drawHmm(t, t0, switches) {
  const st = hmmState(t, switches), storm = st.s ? st.u : 1 - st.u;
  K.begin(ctx, t, { x: 960, y: K.tw(t, t0, t0 + 0.6, -420, 540, K.E.out3), z: K.tw(t, t0, t0 + 2, 1.06, 1.0, K.E.out3), rot: 0 });
  K.applyCam(ctx, 1);
  K.sky(ctx, HMM.horizon, { storm, sunX: 1500, sunY: 280, sunR: 110, top: -1200, drift: 500 });
  K.farIsle(ctx, 240, HMM.horizon, 340, storm, 67);
  K.lighthouse(ctx, 1760, HMM.horizon + 40, 0.6, { beam: K.mix(P.beamCalm, P.beamStorm, storm), ang: 0.3 + 0.1 * Math.sin(t * 1.2), flash: Math.exp(-5 * Math.max(0, t - st.last)) * (st.last > t0 ? 1 : 0), seed: 160 });
  K.ocean(ctx, HMM.horizon, { storm, vol: 0.15 + 0.7 * storm, bottom: 1240 });
  const a = (k) => K.inv(t0 + 0.55 + k * BEAT / 2, t0 + 0.95 + k * BEAT / 2, t); /* pops start as the camera lands */
  const C = HMM.calm, S = HMM.storm, up = [0, -150];
  /* currents first (behind the buoys) */
  K.current(ctx, [C[0] + up[0], C[1] - 130], [S[0], S[1] - 130], { p: a(2), bend: -120, label: "0.03", seed: 171, hot: st.s === 1 && t - st.last < 0.8, labelSize: 34 });
  K.current(ctx, [S[0], S[1] - 40], [C[0], C[1] - 40], { p: a(3), bend: -70, label: "0.10", seed: 172, hot: st.s === 0 && st.last > t0 && t - st.last < 0.8, labelSize: 34 });
  K.loopCurrent(ctx, [C[0], C[1] - 230], 90, { p: a(4), label: "0.97", seed: 173, labelSize: 34 });
  K.loopCurrent(ctx, [S[0], S[1] - 230], 90, { p: a(5), label: "0.90", seed: 174, labelSize: 34 });
  K.buoy(ctx, C[0], C[1], 1.25, { a: a(0), color: P.calm, icon: K.ICON.sun, seed: 181, hot: st.s === 0 ? 1 : 0 });
  K.buoy(ctx, S[0], S[1], 1.25, { a: a(1), color: P.storm, icon: K.ICON.storm, seed: 182, hot: st.s === 1 ? 1 : 0 });
  /* Siggy surfs to the live buoy */
  const from = st.s ? C : S, to = st.s ? S : C, k = st.last > t0 ? st.u : 1;
  const side = (q) => q[0] + (q === C ? -330 : 330); /* rides on the outer side of the live buoy */
  const sx = K.lerp(side(from), side(to), k), sy = 985 - 40 * Math.sin(k * Math.PI) + 8 * Math.sin(t * 2.6);
  surfer(sx, sy, 6 * Math.sin(t * 2.2) - 10 * Math.sin(k * Math.PI), 0.95, {
    seed: 700, blink: K.blinkAt(t, 13), squash: 0.07 * K.pulse(t, 1, 6), mouth: storm > 0.5 ? "grin" : "smile", brow: storm > 0.5 ? 0.8 : 0,
    turn: st.s ? -0.5 : 0.5, flipL: { x: -130, y: -150 + 10 * Math.sin(t * 5) }, flipR: { x: 130, y: -120 }, footL: { x: -66, y: 0 }, footR: { x: 58, y: 0 },
  }, 0.15 + 0.75 * storm);
  K.rain(ctx, storm, {});
}

/* ============================================================
   INTRO 50 TITLE: "Volatility Modeling and Regimes!". A sunset surf poster:
   striped sun on the horizon, DOM title letters drop in on the downbeat,
   five episode medals pop on eighth notes, Siggy rides a curl below while
   the lighthouse beam switches regime colour every bar.
   ============================================================ */
const TT = { horizon: 720, medalY: 548, medalR: 62 };
const MEDALS = ["garch", "leverage", "cluster", "regimes", "realized"];
const camTitle = K.mkTrack([[T.title - 0.01, { x: 960, y: -260, z: 1 }], [T.title + 0.7, { x: 960, y: 540, z: 1 }], [DUR, { x: 960, y: 548, z: 1.02 }]]);

function titlePose(t) {
  const p = { seed: 700, blink: K.blinkAt(t, 11), squash: 0.08 * K.pulse(t, 1, 6) + 0.12, mouth: "grin", turn: 0.2, brow: 0.4, footL: { x: -70, y: 0 }, footR: { x: 62, y: 0 } };
  p.flipL = { x: -150, y: -160 + 10 * Math.sin(t * 5) }; p.flipR = { x: 150, y: -90 + 10 * Math.sin(t * 6) };
  const hop = K.inv(T.hang, T.hang + 0.5, t);
  if (hop > 0 && hop < 1) { p.squash = -0.2 * Math.sin(hop * Math.PI); p.mouth = "open"; p.brow = 1; }
  const tip = K.inv(T.tip, T.tip + 0.25, t);
  if (tip > 0) { /* pushes the shades up onto the head: happy squint */
    const back = K.inv(T.tip + 0.25, T.tip + 0.6, t);
    p.flipR = { x: K.lerp(150, 46, tip * (1 - back)), y: K.lerp(-90, -330, tip * (1 - back)) };
    p.shades = -28 * tip; p.blink = K.inv(T.tip + 0.2, T.tip + 0.35, t) > 0 ? 0.88 : 0; p.mouth = "grin"; p.brow = 0.8;
  }
  return p;
}

function drawTitle(t) {
  K.begin(ctx, t, camTitle(t));

  K.sky(ctx, TT.horizon, { storm: 0, sunX: 960, sunY: TT.horizon - 60, sunR: 250, top: -1400, drift: 900 });
  K.farIsle(ctx, 300, TT.horizon, 360, 0, 65);
  for (let i = 0; i < 3; i++) K.gull(ctx, ((200 + i * 300 + t * 70) % 2200) - 100, 590 + i * 30 + 10 * Math.sin(t + i), 1, 60 + i);
  /* the beam switches regime every bar: calm, storm, calm ... */
  const bar = Math.max(0, K.barAt(t)), beam = bar % 2 ? P.beamStorm : P.beamCalm;
  K.lighthouse(ctx, 1730, TT.horizon + 70, 0.82, { beam, ang: 0.15 + 0.2 * Math.sin(t * 1.1), flash: K.pulse(t, 4, 4), seed: 150 });
  K.ocean(ctx, TT.horizon, { storm: 0, vol: 0.45, bottom: 1250, rows: 6 });
  /* Siggy on the curl */
  const wx = 300 + 20 * (t - T.title), h = 380;
  K.surfWave(ctx, wx, 1110, h, { storm: 0, seed: 310 });
  const hop = K.inv(T.hang, T.hang + 0.5, t), lift = Math.sin(hop * Math.PI) * 80 * (hop < 1 ? 1 : 0);
  const sx = 780 + 30 * Math.sin(t * 1.6), sy = 1110 - h * 0.55 + 12 * Math.sin(t * 3) - lift;
  surfer(sx, sy, 14 + 4 * Math.sin(t * 1.6) - 10 * Math.sin(hop * Math.PI), 1.15, titlePose(t), 0.5 + 0.4 * Math.sin(t * 2));
  if (t > T.hang + 0.4) K.spray(ctx, sx + 150, sy + 20, t - T.hang - 0.45, 1.3, 520);
  /* episode medals (screen space, under the title) */
  K.screen(ctx);
  MEDALS.forEach((k, i) => {
    const t0 = T.medals + i * BEAT / 2, x = 960 + (i - 2) * 186, y = TT.medalY + 6 * Math.sin(t * 2.4 + i) - 10 * K.pulse(t - i * 0.06, 1, 6);
    K.medal(ctx, x, y, TT.medalR, { a: K.inv(t0, t0 + 0.35, t), color: P.A[i], icon: K.ICON[k], seed: 600 + i * 7 });
  });
}

function layoutTitleDom(t) {
  const on = t >= T.title;
  titleEl.style.opacity = on ? "1" : "0";
  if (!on) return;
  const sizes = TITLE_LN.map((d) => +d.dataset.size || 120), gap = 28;
  let y = (TITLE_LN.length > 1 ? 168 : 220) + 6 * Math.sin(t * 1.5); /* below the logo sticker (48 - 150 px) */
  TITLE_LN.forEach((d, i) => { d.style.top = y.toFixed(1) + "px"; y += sizes[i] * 1.1 + gap; });
  TITLE_CH.forEach((c) => {
    const t0 = (c.line === 0 ? T.title : T.line2) + (c.line === 0 ? c.idx : c.idx - TITLE_LINES[0].length) * 0.03;
    const a = K.inv(t0, t0 + 0.4, t), yy = (1 - K.E.back(a, 2.4)) * -160, land = K.inv(t0 + 0.28, t0 + 0.55, t);
    const sq = Math.sin(land * Math.PI) * 0.16 * (1 - land);
    const wave = c.line === 0 ? 5 * Math.sin(t * 3 - c.idx * 0.5) * K.inv(T.medals, T.medals + 0.5, t) : -6 * K.pulse(t, 4, 6) * K.inv(T.line2 + 1, T.line2 + 1.2, t);
    c.el.style.opacity = a > 0 ? Math.min(1, a * 3).toFixed(2) : "0";
    c.el.style.transform = `translateY(${(yy + wave).toFixed(1)}px) scale(${(1 + sq).toFixed(3)}, ${(1 - sq).toFixed(3)})`;
  });
}

/* ============================================================
   INTRO 55 LEVERAGE: the asymmetric (GJR) GARCH picture, on a surf poster.
   Top card: the price; bottom card: sigma. The same-size drop and rise
   (-12 % / +12 %) get very different swells: drops raise volatility far
   more than rises (the leverage effect). Siggy points at the drop's spike.
   ============================================================ */
const LEV = { price: { x: 780, y: 360, w: 1360, h: 400 }, sig: { x: 780, y: 800, w: 1360, h: 400 } };
const PRICE = [], LSIG = [];
(function () {
  const rnd = K.mulberry(1955), n = 60;
  /* designed daily returns (%): drift, a sharp drop (days 18-21), a slow climb, a sharp rise (days 40-43) */
  let p = 100, s2 = 0.4;
  for (let i = 0; i < n; i++) {
    let r = 0.15 + (rnd() - 0.5) * 0.9;
    if (i >= 18 && i < 22) r = -3.2 + (rnd() - 0.5) * 0.6;
    else if (i >= 22 && i < 38) r = 0.35 + (rnd() - 0.5) * 0.8;
    else if (i >= 40 && i < 44) r = 3.0 + (rnd() - 0.5) * 0.6;
    /* GJR-GARCH: sigma2 = omega + (alpha + gamma * [r < 0]) * r^2 + beta * sigma2 */
    s2 = 0.08 + (0.03 + (r < 0 ? 0.28 : 0)) * r * r + 0.72 * s2;
    p *= 1 + r / 100; PRICE.push(p); LSIG.push(Math.sqrt(s2));
  }
})();

function drawLeverage(t) {
  K.begin(ctx, t, { x: 960, y: 540, z: 1, rot: 0 });
  drawPosterBack(t);
  const draw = K.inv(T.lev + 0.1, T.lev + 1.5, t), A = LEV.price, B = LEV.sig;
  const pc = K.posterChart(ctx, A.x, A.y, A.w, A.h, [{ kind: "line", data: PRICE, color: P.seaDeep, w: 7 }], { a: K.inv(T.unroll[0], T.lev, t), draw, seed: 43, yMin: 84, yMax: 106 });
  const sc = K.posterChart(ctx, B.x, B.y, B.w, B.h, [{ kind: "area", data: LSIG, color: P.sigma, w: 7 }, { kind: "line", data: LSIG, color: P.sigma, w: 7 }], { a: K.inv(T.unroll[0] + 0.1, T.lev + 0.1, t), draw, seed: 45, yMin: 0, yMax: 2.8, header: false });
  if (pc && sc) {
    /* tags appear as the pen passes the move */
    const tg = (day) => K.inv(T.lev + 0.1 + 1.4 * (day / 60), T.lev + 0.4 + 1.4 * (day / 60), t);
    K.tag(ctx, pc.X(20), pc.Y(PRICE[21]) + 54, "-12 %", { a: tg(21), fill: P.storm, size: 34, seed: 191 });
    K.tag(ctx, pc.X(42), pc.Y(PRICE[43]) - 50, "+12 %", { a: tg(43), fill: P.up, size: 34, seed: 192 });
    /* the spikes: a big coral arrow for the drop, a small green one for the rise */
    const pk = (d0, d1) => { let m = 0, k = d0; for (let i = d0; i < d1; i++) if (LSIG[i] > m) { m = LSIG[i]; k = i; } return k; };
    const kd = pk(18, 30), ku = pk(40, 52);
    K.tag(ctx, sc.X(kd) + 90, sc.Y(LSIG[kd]) + 10, "σ " + LSIG[kd].toFixed(1), { a: tg(kd + 1), fill: P.storm, size: 32, seed: 193 });
    K.tag(ctx, sc.X(ku) + 90, sc.Y(LSIG[ku]) - 20, "σ " + LSIG[ku].toFixed(1), { a: tg(ku + 1), fill: P.up, size: 32, seed: 194 });
  }
  /* the leverage medal and Siggy on the right */
  K.medal(ctx, 1690, 330, 120, { a: K.inv(T.lev + 0.2, T.lev + 0.55, t), color: P.storm, icon: K.ICON.leverage, seed: 670 });
  const up = K.E.back(K.inv(T.lev + 0.3, T.lev + 0.7, t), 1.6), pt = K.inv(T.levPoint, T.levPoint + 0.3, t);
  if (up > 0) K.turtle(ctx, 1700, 1250 - 220 * up, 1.2, {
    seed: 700, blink: K.blinkAt(t, 17), mouth: pt > 0 ? "wow" : "smile", shades: 20 * pt, eyeUp: 2 * pt, look: [-1, -0.2], turn: -0.6, brow: 1.2 * pt,
    squash: 0.08 * K.pulse(t, 1, 6) - 0.15 * Math.sin(pt * Math.PI), flipL: { x: K.lerp(-110, -230, K.E.back(pt, 1.6)), y: K.lerp(-90, -170, pt) }, flipR: { x: 100, y: -80 },
  });
}

/* ============================================================
   INTRO 60 RIDE: volatility clustering on the water. A set of big storm
   waves rolls through one after another (big waves follow big waves) and
   Siggy rides them on the storm gun, the gauge pinned high; then calm
   returns on the downbeat, the beam turns turquoise and the camera tilts
   up into the sunset for the title.
   ============================================================ */
const RIDE_H = 540;
function drawRide(t) {
  const storm = 1 - K.E.inOut(K.inv(T.calmBack, T.calmBack + 0.7, t));
  const cam = { x: 960 + 20 * Math.sin(t * 0.8), y: K.tw(t, T.tilt2[0], T.tilt2[1], 560, -640, K.E.in3), z: K.tw(t, T.ride, T.ride + 1.5, 1.12, 1.02, K.E.out3), rot: 0 };
  K.begin(ctx, t, cam);
  K.applyCam(ctx, 1);
  K.sky(ctx, RIDE_H, { storm, sunX: 1250, sunY: 330, sunR: 120, top: -1500, drift: 700 });
  K.farIsle(ctx, 300, RIDE_H, 400, storm, 69);
  K.lighthouse(ctx, 1740, RIDE_H + 40, 0.7, { beam: K.mix(P.beamCalm, P.beamStorm, storm), ang: 0.25 + 0.15 * Math.sin(t * 1.3), flash: Math.exp(-4 * Math.max(0, t - T.calmBack)) * (t > T.calmBack ? 1 : 0) + 0.4 * K.pulse(t, 4, 5) * storm, seed: 170 });
  K.ocean(ctx, RIDE_H, { storm, vol: 0.15 + 0.85 * storm, bottom: 1300 });
  /* the set: three big waves on consecutive half bars march in from the right */
  for (let k = 2; k >= 0; k--) {
    const t0 = T.ride + k * 2 * BEAT, u = (t - t0) / (4.5 * BEAT);
    if (u < 0 || u > 1.4) continue;
    const h = 300 * storm * Math.sin(Math.min(1, u) * Math.PI * 0.9 + 0.15);
    if (h > 8) K.surfWave(ctx, 2100 - 1500 * u, 900, h, { storm, seed: 340 + k, width: 800 });
  }
  /* the hero wave under Siggy (shrinks when calm returns) */
  const h = (380 + 40 * Math.sin((t - T.ride) * 4.2)) * (0.25 + 0.75 * storm), cx = 300 + 30 * Math.sin(t * 0.9);
  K.surfWave(ctx, cx, 1110, h, { storm, seed: 300 });
  const x = 820 + 40 * Math.sin(t * 1.7), y = 1110 - h * 0.58 + 10 * Math.sin(t * 3.3), ang = 14 * (0.4 + 0.6 * storm) + 5 * Math.sin(t * 2.6);
  const relax = K.inv(T.calmBack, T.calmBack + 0.4, t);
  surfer(x, y, ang, 1.2, {
    seed: 700, blink: K.blinkAt(t, 19), squash: 0.16 * storm + 0.07 * K.pulse(t, 1, 6),
    mouth: relax > 0 ? "smile" : "grin", brow: 0.9 * storm, turn: -0.2 + 0.4 * relax, headTilt: -8 * storm + 6 * relax * Math.sin(t * 3),
    flipL: { x: -150, y: K.lerp(-170, -70, relax) + 10 * Math.sin(t * 6) }, flipR: { x: K.lerp(150, 120, relax), y: K.lerp(-80, -230, K.E.back(relax, 1.6)) + 8 * Math.sin(t * 5) },
    footL: { x: -72, y: 0 }, footR: { x: 64, y: 0 },
  }, 0.2 + 0.72 * storm + 0.05 * Math.sin(t * 17) * storm, "gun");
  if (storm > 0.5) for (let k = 0; k < 3; k++) K.spray(ctx, x + 170, y, t - (T.ride + k * 2 * BEAT + 0.5), 1.2, 530 + k);
  K.rain(ctx, storm, { x: cam.x - 1100, y: cam.y - 700, w: 2400, h: 1500 });
}

/* ============================================================
   INTRO 70 RENDER: render(t) is the whole film. One paused GSAP timeline
   drives a proxy whose setter calls render(t).
   0.00 - 6.34  sea set: surf in, shaka, gauge; "Ride the calm" (3.37), storm bank "!",
                "ride the storm" (4.85): regime flip, the wave stands up, a second set
   6.1  - 6.34  dial iris: through the board's gauge into the poster
   6.34 - 9.29  "Every regime has its form": returns over regime bands, sigma, two humps
   8.92 - 9.29  the poster rolls up onto the beach
   9.29 - 12.24 "Measure the swell and read the sea": GARCH on the surf-report board,
                the dial swings to storm, Siggy picks the storm gun; tilt up to the sky
   12.24- 18.09 "Volatility Modeling and Regimes!" + instrumental: two hidden states
                (buoys, transition currents), the state switches, the world follows
   17.72- 18.09 a poster unrolls down over the sea
   18.09- 21.06 the leverage effect: same-size drop and rise, very different sigma
   20.69- 21.06 the poster rolls up onto the sea
   21.06- 25.47 a cluster of big sets, then calm returns (23.99); tilt up
   25.47- 31.0  title card, medals, hop, shades up
   ============================================================ */
function dialRing(cx, cy, r) {
  K.screen(ctx); ctx.save(); ctx.lineCap = "butt";
  const w = Math.max(14, r * 0.07);
  [[0, 0.4, P.calm], [0.4, 0.7, P.sigma], [0.7, 1, P.storm]].forEach((z) => { ctx.beginPath(); ctx.arc(cx, cy, r + w / 2, Math.PI + Math.PI * 2 * z[0], Math.PI + Math.PI * 2 * z[1]); ctx.strokeStyle = z[2]; ctx.lineWidth = w; ctx.stroke(); });
  ctx.lineWidth = 6; ctx.strokeStyle = P.ink; ctx.beginPath(); ctx.arc(cx, cy, r, 0, K.TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy, r + w, 0, K.TAU); ctx.stroke();
  ctx.restore();
}
function rollCylinder(y) {
  K.screen(ctx);
  const pts = K.rectPts(-20, y - 34, K.W + 40, 68, 6);
  K.shape(ctx, pts, { fill: P.cream, w: 6, boil: 1, seed: 830, shade: { color: P.creamShade, dx: 0, dy: -24, dots: true, cell: 9, density: 0.7 } });
  K.line(ctx, [[-20, y + 10], [K.W + 20, y + 10]], { stroke: P.sky1, w: 8, boil: 0.8, seed: 831 });
}

/* a poster blind at screen y: draw `under` full, then `over` clipped above y, then the roll */
function blind(t, y, under, over) {
  under(t);
  K.screen(ctx); ctx.save(); ctx.beginPath(); ctx.rect(0, 0, K.W, y); ctx.clip(); over(t); ctx.restore();
  rollCylinder(y);
}

function render(t) {
  try {
    titleEl.style.opacity = "0";
    if (t < T.dial[1]) drawSea(t);
    if (t >= T.dial[0] && t < T.roll[0]) {
      if (t < T.dial[1]) { /* the gauge face grows into the poster */
        const g = K.gaugePt || { x: 960, y: 600, r: 30 }, u = K.E.in3(K.inv(T.dial[0], T.dial[1], t));
        const cx = K.lerp(g.x, 960, u), cy = K.lerp(g.y, 540, u), r = K.lerp(g.r || 30, 1250, u);
        K.screen(ctx); ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, K.TAU); ctx.clip();
        drawChart(t); ctx.restore(); dialRing(cx, cy, r);
      } else drawChart(t);
    }
    const hmm = (tt) => drawHmm(tt, T.hmm, T.hmmSw);
    if (t >= T.roll[0] && t < T.hmm) {
      if (t < T.roll[1]) blind(t, K.lerp(K.H + 40, -60, K.E.in3(K.inv(T.roll[0], T.roll[1], t))), drawForecast, drawChart);
      else drawForecast(t);
    }
    if (t >= T.hmm && t < T.lev) {
      if (t >= T.unroll[0]) blind(t, K.lerp(-60, K.H + 40, K.E.out3(K.inv(T.unroll[0], T.unroll[1], t))), hmm, drawLeverage);
      else hmm(t);
    }
    if (t >= T.lev && t < T.roll2[0]) drawLeverage(t);
    if (t >= T.roll2[0] && t < T.title) {
      if (t < T.roll2[1]) blind(t, K.lerp(K.H + 40, -60, K.E.in3(K.inv(T.roll2[0], T.roll2[1], t))), drawRide, drawLeverage);
      else drawRide(t);
    }
    if (t >= T.title) drawTitle(t);
    layoutTitleDom(t);
  } catch (err) {
    /* never leave a black frame silently: draw the error so a snapshot shows it */
    K.screen(ctx); ctx.fillStyle = "#300"; ctx.fillRect(0, 0, 1920, 80); ctx.fillStyle = "#fff"; ctx.font = "28px monospace"; ctx.fillText(String(err && err.stack || err).slice(0, 160), 20, 50);
  }
  /* the marketmaker.cc sticker: one small hop on the first downbeat, then static */
  const lb = K.inv(K.at(0), K.at(0) + 0.45, t);
  logoEl.style.transform = lb > 0 && lb < 1 ? `translateY(${(-16 * Math.sin(lb * Math.PI)).toFixed(1)}px)` : "none";
  /* screen-print grain steps at the wobble rate */
  const f = K.boilFrame(t);
  grainEl.style.backgroundPosition = ((f % 7) * 37) + "px " + ((f % 5) * 53) + "px";
}

const grainEl = document.getElementById("grain"), logoEl = document.getElementById("logo");
grainEl.style.backgroundImage = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .25  0 0 0 1.6 -.35'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>\")";

const TL = gsap.timeline({ paused: true });
const drv = { _t: 0 };
Object.defineProperty(drv, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
TL.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
fitTitle();
render(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitTitle(); render(drv._t); });
window.__timelines["main"] = TL;
window.__render = render;

})();
    </script>
  </body>
