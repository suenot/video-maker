    <script>
(function () {
/* ============================================================
   KIT 00 CORE: math, seeded random, noise, splines, beat grid, boil clock
   Every frame is a pure function of time t (seconds). No Math.random,
   no Date.now, no performance.now anywhere in the kit.
   ============================================================ */
var DK = window.DK || (window.DK = {});
(function (K) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const ss = (a, b, t) => { const u = inv(a, b, t); return u * u * (3 - 2 * u); };
  const f1 = (n) => Math.round(n * 10) / 10;
  const f2 = (n) => Math.round(n * 100) / 100;

  /* eases (u in 0..1) */
  const E = {
    inOut: (u) => u * u * (3 - 2 * u),
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    back: (u, s) => { s = s == null ? 1.7 : s; const v = u - 1; return 1 + v * v * ((s + 1) * v + s); },
    elastic: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
  };
  /* tween value from a to b during [t0, t1] with an ease */
  const tw = (t, t0, t1, a, b, ease) => lerp(a, b, (ease || E.inOut)(inv(t0, t1, t)));

  /* seeded PRNG (mulberry32) */
  function mulberry(seed) {
    let s = seed | 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let q = Math.imul(s ^ (s >>> 15), 1 | s);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* stateless hash -> [0,1) for (i, seed) */
  function hash(i, s) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const hs = (i, s) => hash(i, s) * 2 - 1; /* signed */
  function vnoise(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s), hash(i + 1, s), u); }
  function fbm(x, s, oct) { let a = 0.5, v = 0, fr = 1, n = 0; for (let k = 0; k < (oct || 3); k++) { v += a * vnoise(x * fr, s + k * 17); n += a; a *= 0.5; fr *= 2.03; } return v / n; }

  /* monotone cubic Hermite spline through [[t, v], ...] (no overshoot) */
  function mkSpline(pts) {
    const n = pts.length, T = pts.map((p) => p[0]), V = pts.map((p) => p[1]);
    if (n === 1) return () => V[0];
    const d = [], m = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) d[i] = (V[i + 1] - V[i]) / (T[i + 1] - T[i]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
    }
    return function (x) {
      x = clamp(x, T[0], T[n - 1]);
      let i = 0; while (i < n - 2 && x >= T[i + 1]) i++;
      const h = T[i + 1] - T[i], u = (x - T[i]) / h, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * V[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * V[i + 1] + (u3 - u2) * h * m[i + 1];
    };
  }
  /* keys: [[t, {a:.., b:..}], ...] -> fn(t) -> {a, b} (one spline per channel) */
  function mkTrack(keys) {
    const names = Object.keys(keys[0][1]), sp = {};
    names.forEach((k) => { sp[k] = mkSpline(keys.map((q) => [q[0], q[1][k]])); });
    return (t) => { const o = {}; names.forEach((k) => (o[k] = sp[k](t))); return o; };
  }

  /* ---------- beat grid (retime to the real song by changing BPM/OFFSET or BARS) ----------
     BARS: optional list of measured downbeat times (seconds). Songs cut from
     several takes drift a few ms per splice, so measured downbeats beat a
     single OFFSET. Past the list, bars extrapolate at BPM. */
  const G = { BPM: 120, OFFSET: 0, BEATS_PER_ACCENT: 4, BARS: null };
  const beatLen = () => 60 / G.BPM;
  const barLen = () => beatLen() * G.BEATS_PER_ACCENT;
  function barStart(b) {
    const B = G.BARS;
    if (!B || !B.length) return G.OFFSET + b * barLen();
    if (b < 0) return B[0] + b * barLen();
    if (b < B.length) return B[b];
    return B[B.length - 1] + (b - B.length + 1) * barLen();
  }
  /* time of bar b (0-based, an "accent" = 4 beats) plus beat k (fractional ok) */
  const at = (bar, beat) => barStart(Math.floor(bar)) + ((bar - Math.floor(bar)) * G.BEATS_PER_ACCENT + (beat || 0)) * beatLen();
  /* index of the bar containing t (-1 before the first downbeat) */
  function barAt(t) {
    if (t < barStart(0)) return -1;
    let b = 0; while (barStart(b + 1) <= t) b++;
    return b;
  }
  /* 1 on the beat, decaying to 0 before the next beat (k = sharpness) */
  function pulse(t, everyBeats, k) {
    const b = barAt(t); if (b < 0) return 0;
    const L = beatLen() * (everyBeats || 1), x = t - barStart(b);
    return Math.exp(-(k || 7) * ((x % L) / L));
  }
  const beatIndex = (t) => { const b = barAt(t); return b < 0 ? -1 : b * G.BEATS_PER_ACCENT + Math.floor((t - barStart(b)) / beatLen()); };

  /* ---------- line boil clock: drawings change 12 times per second ---------- */
  const BOIL_FPS = 12;
  const boilFrame = (t) => Math.floor(t * BOIL_FPS);

  Object.assign(K, { clamp, lerp, inv, ss, f1, f2, E, tw, mulberry, hash, hs, vnoise, fbm, mkSpline, mkTrack,
    G, beatLen, barLen, barStart, barAt, at, pulse, beatIndex, BOIL_FPS, boilFrame, TAU: Math.PI * 2 });
})(DK);

    K.shape(ctx, K.roundRectPts(x, y, w, h, 16), { fill: "#3b2f35", w: 4.5, boil: 1, seed: seed + 1, misreg: false, shade: { color: "#2a2126", dx: 0, dy: -h * 0.35 } });
    /* kitchen glimpse: hanging pans */
    for (let i = 0; i < Math.floor(w / 220); i++) {
      const px = x + 110 + i * 220, py = y + 40 + 6 * Math.sin(K.now * 1.7 + i);
      K.rule(ctx, [[px, y + 4], [px, py]], { stroke: P.chromeDark, w: 3, boil: 0.5, seed: seed + 10 + i });
      K.shape(ctx, K.ellipsePts(px, py + 34, 34, 30, 12), { fill: P.chromeDark, w: 3.5, boil: 0.8, seed: seed + 20 + i, shade: { color: "#5d6970", dx: 6, dy: 6 } });
    }
  };

  /* ---------- window to the night street (neon glow outside) ---------- */
  K.window = function (ctx, x, y, w, h, seed) {
    K.shape(ctx, K.roundRectPts(x - 14, y - 14, w + 28, h + 28, 20), { fill: P.chrome, w: 5, boil: 1, seed, misreg: false });
    K.shape(ctx, K.roundRectPts(x, y, w, h, 12), { fill: P.night, w: 4, boil: 1, seed: seed + 1, misreg: false });
    ctx.save(); K.pathOf(ctx, K.roundRectPts(x, y, w, h, 12), true); ctx.clip();
    for (let i = 0; i < 5; i++) { const bx = x + (i / 5) * w, bh = h * (0.35 + 0.4 * hash(i, seed)); ctx.fillStyle = P.nightDark; ctx.fillRect(bx, y + h - bh, w / 5 - 8, bh); for (let j = 0; j < 4; j++) if (hash(i * 7 + j, seed + 3) > 0.45) { ctx.fillStyle = P.mustard; ctx.globalAlpha = 0.6; ctx.fillRect(bx + 12 + (j % 2) * 30, y + h - bh + 20 + Math.floor(j / 2) * 34, 14, 18); ctx.globalAlpha = 1; } }
    ctx.restore();
    /* blinds */
    for (let i = 1; i < 6; i++) K.rule(ctx, [[x + 6, y + (h * i) / 6], [x + w - 6, y + (h * i) / 6]], { stroke: P.chromeDark, w: 3, boil: 0.6, seed: seed + 30 + i, alpha: 0.7 });
  };

  /* ---------- pendant lamp (cherry cone) with a light pool; on = 0..1 ---------- */
  K.lamp = function (ctx, x, y, s, on, seed) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const sway = Math.sin(K.now * 1.3 + seed) * 0.03; ctx.rotate(sway);
    K.rule(ctx, [[0, -400], [0, -40]], { stroke: P.ink, w: 4, boil: 0.6, seed: seed + 1 });
    if (on > 0) { ctx.save(); ctx.globalAlpha = 0.18 * on; ctx.fillStyle = "#fff4c4"; ctx.beginPath(); ctx.moveTo(-50, 30); ctx.lineTo(50, 30); ctx.lineTo(260, 620); ctx.lineTo(-260, 620); ctx.closePath(); ctx.fill(); ctx.restore(); K.glow(ctx, 0, 40, 120, "rgba(255,240,180,0.9)", on * 0.7); }
    K.shape(ctx, [[-22, -44], [22, -44], [74, 26], [-74, 26]], { fill: P.cherry, w: 5, boil: 1, seed: seed + 2, shade: { color: P.cherryDark, dx: 18, dy: 0 }, shine: true });
    K.shape(ctx, K.ellipsePts(0, 30, 26, 14, 10), { fill: on > 0.3 ? "#fff7d0" : "#8a8a7a", w: 3.5, boil: 0.6, seed: seed + 3 });
    ctx.restore();
  };

  /* ---------- checkerboard floor in perspective. Tiles converge to a vanishing point
     that follows the camera, so a pan reads as a dolly across the room. ---------- */
  K.checkerFloor = function (ctx, x0, x1, yTop, yBot, opt) {
    const o = Object.assign({ tile: 150, vpX: K.cam ? K.cam.x : 960, vpY: yTop - 700, rows: 7, seed: 9, dark: 0 }, opt || {});
    const rowY = []; /* perspective row lines: spacing grows toward the viewer */
    for (let r = 0; r <= o.rows; r++) { const u = r / o.rows; rowY.push(lerp(yTop, yBot, u * u * 0.55 + u * 0.45)); }
    const X = (xb, y) => o.vpX + (xb - o.vpX) * (y - o.vpY) / (yBot - o.vpY); /* column line x at height y */
    const c0 = Math.floor((x0 - 900) / o.tile), c1 = Math.ceil((x1 + 900) / o.tile);
    ctx.save(); ctx.beginPath(); ctx.rect(x0, yTop, x1 - x0, yBot - yTop + 400); ctx.clip();
    ctx.fillStyle = P.checkA; ctx.fillRect(x0, yTop, x1 - x0, yBot - yTop + 400);
    ctx.fillStyle = P.checkB;
    for (let r = 0; r < o.rows; r++) for (let c = c0; c < c1; c++) {
      if ((r + c) % 2) continue;
      const ya = rowY[r], yb = rowY[r + 1], xa = c * o.tile, xb = (c + 1) * o.tile;
      ctx.beginPath(); ctx.moveTo(X(xa, ya), ya); ctx.lineTo(X(xb, ya), ya); ctx.lineTo(X(xb, yb), yb); ctx.lineTo(X(xa, yb), yb); ctx.closePath(); ctx.fill();
    }
    /* floor shine: a soft dot screen band near the back */
    ctx.fillStyle = K.dotPattern(ctx, "rgba(30,20,25,0.18)", 2.2, 10); ctx.fillRect(x0, yTop, x1 - x0, (yBot - yTop) * 0.3);
    if (o.dark > 0) { ctx.globalAlpha = o.dark; ctx.fillStyle = P.nightDark; ctx.fillRect(x0, yTop, x1 - x0, yBot - yTop + 400); }
    ctx.restore();
    K.rule(ctx, [[x0, yTop], [x1, yTop]], { stroke: P.ink, w: 6, boil: 1, seed: o.seed });
  };

  /* ---------- counter: mint top, cherry quilted front, chrome trim ---------- */
  K.counter = function (ctx, x0, x1, y, h, opt) {
    const o = Object.assign({ seed: 40, top: 46 }, opt || {});
    K.shape(ctx, K.rectPts(x0, y + o.top, x1 - x0, h - o.top, 8), { fill: P.cherry, w: 5, boil: 1.2, seed: o.seed, shade: { color: P.cherryDark, dx: 0, dy: -h * 0.5 } });
    /* quilted vinyl ribs */
    for (let x = Math.ceil(x0 / 90) * 90; x < x1; x += 90) K.rule(ctx, [[x, y + o.top + 30], [x, y + h - 30]], { stroke: P.cherryDark, w: 6, boil: 0.8, seed: o.seed + x });
    K.chromeBar(ctx, x0 - 10, y + h - 30, x1 - x0 + 20, 24, o.seed + 2);
    /* top slab */
    K.shape(ctx, K.rectPts(x0 - 26, y, x1 - x0 + 52, o.top, 8), { fill: P.mint, w: 5, boil: 1.2, seed: o.seed + 3, shade: { color: P.mintDark, dx: 0, dy: -o.top * 0.4 } });
    K.chromeBar(ctx, x0 - 30, y + o.top - 12, x1 - x0 + 60, 16, o.seed + 4);
  };
  /* ---------- stool: chrome post, cherry seat ---------- */
  K.stool = function (ctx, x, y, s, seed) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    K.shape(ctx, K.rectPts(-12, -170, 24, 170, 2), { fill: P.chrome, w: 4, boil: 0.8, seed, shade: { color: P.chromeDark, dx: 8, dy: 0, dots: false } });
    K.shape(ctx, K.ellipsePts(0, -4, 60, 14, 12), { fill: P.chromeDark, w: 4, boil: 0.8, seed: seed + 1 });
    K.shape(ctx, [[-78, -200], [78, -200], [72, -168], [-72, -168]], { fill: P.chrome, w: 4, boil: 0.8, seed: seed + 2, misreg: false });
    K.shape(ctx, K.ellipsePts(0, -206, 82, 30, 14), { fill: P.cherry, w: 5, boil: 1, seed: seed + 3, shade: { color: P.cherryDark, dx: 0, dy: 10 }, shine: { x: 0.35, y: 0.2 } });
    ctx.restore();
  };

  /* ---------- conveyor chain (the blockchain): a belt of chain links over rollers.
     phase = belt travel in px (links move with the trays) ---------- */
  K.conveyor = function (ctx, x0, x1, y, phase, opt) {
    const o = Object.assign({ seed: 60, link: 46 }, opt || {});
    K.shape(ctx, K.rectPts(x0, y, x1 - x0, 46, 10), { fill: P.chromeDark, w: 5, boil: 1, seed: o.seed, misreg: false, shade: { color: "#5d6970", dx: 0, dy: -20, dots: false } });
    /* chain links: interlocking oval rings (open) over solid side plates */
    const off = ((phase % (o.link * 2)) + o.link * 2) % (o.link * 2);
    for (let x = x0 - o.link * 2 + off, i = 0; x < x1 + o.link; x += o.link, i++) {
      if (x < x0 - o.link) continue;
      const odd = Math.round((x - off) / o.link) % 2 !== 0;
      if (odd) K.shape(ctx, K.roundRectPts(x - 4, y + 10, o.link + 8, 26, 13, 3), { fill: null, stroke: P.chromeLight, w: 7, boil: 0.6, seed: o.seed + 10 + (i % 9), taper: 0 });
      else K.shape(ctx, K.roundRectPts(x - 2, y + 14, o.link + 4, 18, 9, 3), { fill: P.chrome, w: 3.5, boil: 0.6, seed: o.seed + 10 + (i % 9), misreg: false });
    }
    /* rollers + legs */
    for (let x = x0 + 60; x < x1; x += 240) {
      K.rule(ctx, [[x, y + 46], [x - 20, y + 160]], { stroke: P.ink, w: 7, boil: 0.8, seed: o.seed + x });
      const a = -phase / 18;
      K.dot(ctx, x, y + 46, 18, P.chrome, P.ink, 3.5, o.seed + x + 1);
      K.rule(ctx, [[x + Math.cos(a) * 12, y + 46 + Math.sin(a) * 12], [x - Math.cos(a) * 12, y + 46 - Math.sin(a) * 12]], { stroke: P.ink, w: 3, boil: 0.4, seed: o.seed + x + 2 });
    }
  };

  /* ---------- block = lunch tray on the chain ----------
     opt: num (block number string), items ([{kind, color, label}] left to right),
          hot (0..1 mustard glow), a (pop 0..1), seal (0..1 a "sealed" stamp ring) */
  K.block = function (ctx, x, y, s, opt) {
    const o = Object.assign({ num: "", items: [], hot: 0, a: 1, seed: 100, w: 300, h: 120, seal: 0 }, opt || {});
    const a = o.a >= 1 ? 1 : o.a <= 0 ? 0 : K.E.back(o.a, 2.2); if (a <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(s * a, s * a);
    const w = o.w, h = o.h;
    if (o.hot > 0) K.glow(ctx, 0, -h / 2, w * 0.8, "rgba(255,210,90,0.9)", o.hot * 0.7);
    /* tray body (seen slightly from above): rim + floor */
    K.shape(ctx, K.roundRectPts(-w / 2, -h, w, h, 22), { fill: P.mint, w: 5, boil: 1.2, seed: o.seed, shade: { color: P.mintDark, dx: 0, dy: -h * 0.3 } });
    K.shape(ctx, K.roundRectPts(-w / 2 + 16, -h + 14, w - 32, h - 46, 14), { fill: P.mintLight, w: 3, boil: 1, seed: o.seed + 1, misreg: false });
    /* items sit on the tray */
    const n = o.items.length, span = w - 70;
    o.items.forEach((it, i) => {
      const ix = n === 1 ? 0 : -span / 2 + (span * i) / (n - 1), iy = -h + 40 + (it.dy || 0);
      K.trayItem(ctx, ix, iy, it, o.seed + 20 + i * 5);
    });
    /* front number plate */
    if (o.num) {
      const pw = Math.max(120, K.textW(ctx, o.num, 30, 700, K.FONT.mono) + 36);
      K.shape(ctx, K.roundRectPts(-pw / 2, -30, pw, 40, 10), { fill: P.cream, w: 3.5, boil: 0.8, seed: o.seed + 3, misreg: false });
      K.text(ctx, o.num, 0, -9, { size: 30, weight: 700, font: K.FONT.mono, fill: P.ink });
    }
    if (o.seal > 0) { /* sealed: mustard ring stamp, chain-link icon */
      const sa = K.E.back(clamp(o.seal, 0, 1), 3);
      ctx.save(); ctx.translate(w / 2 - 10, -h + 6); ctx.rotate(-0.2); ctx.scale(sa, sa);
      K.shape(ctx, K.ellipsePts(0, 0, 30, 30, 14), { fill: P.mustard, w: 4, boil: 0.8, seed: o.seed + 5 });
      K.chainIcon(ctx, 0, 0, 16, o.seed + 6);
      ctx.restore();
    }
    ctx.restore();
  };
  K.chainIcon = function (ctx, x, y, r, seed) {
    K.shape(ctx, K.roundRectPts(x - r, y - r * 0.4, r * 1.2, r * 0.8, r * 0.4, 3), { stroke: P.ink, w: 3.5, boil: 0.5, seed, fill: null });
    K.shape(ctx, K.roundRectPts(x - r * 0.2, y - r * 0.4, r * 1.2, r * 0.8, r * 0.4, 3), { stroke: P.ink, w: 3.5, boil: 0.5, seed: seed + 1, fill: null });
  };
  /* one item on a tray: "ticket" | "burger" | "bread" | "coin" | "plate" | "cup" */
  K.trayItem = function (ctx, x, y, it, seed) {
    const k = it.kind || "ticket";
    if (k === "ticket") K.ticket(ctx, x, y - 20, 0.62, { color: it.color || P.mint, label: it.label || "", amt: it.amt || "", seed, clip: false, tilt: it.tilt || hs(seed, 4) * 0.1 });
    else if (k === "burger") K.burger(ctx, x, y + 8, 0.7, seed, it.bite);
    else if (k === "bread") K.breadSlice(ctx, x, y + 8, 0.7, it.color || P.cherry, seed);
    else if (k === "coin") K.coin(ctx, x, y + 6, 30, { color: it.color || P.mustard, label: it.label || "", seed });
    else if (k === "cup") K.coffee(ctx, x, y + 10, 0.7, seed);
    else K.plate(ctx, x, y + 10, 0.8, seed);
  };

  /* ---------- order ticket (= a transaction) ----------
     opt: color (header band = who sent it), label (ticker), amt (amount), gas (tip
     as 0..3 mustard dots), arrow ("up" | "down" | null), clip (chrome clip on top),
     stamp ({text, color, a}): a rubber stamp across the ticket, tilt (radians) */
  K.ticket = function (ctx, x, y, s, opt) {
    const o = Object.assign({ color: P.mint, label: "", amt: "", gas: 0, arrow: null, clip: true, seed: 200, tilt: 0, stamp: null, a: 1 }, opt || {});
    const a = o.a >= 1 ? 1 : o.a <= 0 ? 0 : K.E.back(o.a, 2.4); if (a <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt); ctx.scale(s * a, s * a);
    const w = 120, h = 160;
    /* paper with serrated bottom */
    const pts = [[-w / 2, 0], [w / 2, 0], [w / 2, h]];
    for (let i = 0; i <= 8; i++) pts.push([w / 2 - (w * i) / 8, h + (i % 2 ? 9 : 0)]);
    K.shape(ctx, pts, { fill: P.cream, w: 4, boil: 1, seed: o.seed, shade: { color: P.creamShade, dx: -10, dy: 0 } });
    K.shape(ctx, [[-w / 2 + 4, 4], [w / 2 - 4, 4], [w / 2 - 4, 34], [-w / 2 + 4, 34]], { fill: o.color, stroke: null, w: 0, boil: 0.6, seed: o.seed + 1, misreg: true });
    if (o.label) K.text(ctx, o.label, 0, 62, { size: 30, weight: 700, font: K.FONT.mono, fill: P.ink });
    if (o.amt) K.text(ctx, o.amt, 0, 98, { size: 28, weight: 700, font: K.FONT.mono, fill: P.inkSoft });
    if (o.arrow) { const d = o.arrow === "up" ? -1 : 1; K.shape(ctx, [[-30, 122 - d * 10], [-30 + 14, 122 + d * 8], [-30 - 14, 122 + d * 8]], { fill: o.arrow === "up" ? P.bid : P.ask, w: 3, boil: 0.5, seed: o.seed + 2 }); }
    for (let i = 0; i < o.gas; i++) K.dot(ctx, 4 + i * 20, 124, 7, P.mustard, P.ink, 2.5, o.seed + 4 + i);
    if (o.clip) {
      K.shape(ctx, K.roundRectPts(-22, -16, 44, 28, 6, 2), { fill: P.chrome, w: 3.5, boil: 0.6, seed: o.seed + 8, misreg: false, shade: { color: P.chromeDark, dx: 0, dy: -10, dots: false } });
    }
    if (o.stamp && o.stamp.a > 0) {
      const sa = o.stamp.a >= 1 ? 1 : K.E.back(o.stamp.a, 3);
      ctx.save(); ctx.translate(0, 112); ctx.rotate(-0.28); ctx.scale(sa * (1 + 0.6 * (1 - Math.min(1, o.stamp.a * 1.5))), sa * (1 + 0.6 * (1 - Math.min(1, o.stamp.a * 1.5))));
      const tw = K.textW(ctx, o.stamp.text, 30, 700, K.FONT.mono) + 22;
      K.shape(ctx, K.roundRectPts(-tw / 2, -26, tw, 52, 8, 2), { fill: null, stroke: o.stamp.color || P.loss, w: 5, boil: 1, seed: o.seed + 9 });
      K.text(ctx, o.stamp.text, 0, 1, { size: 30, weight: 700, font: K.FONT.mono, fill: o.stamp.color || P.loss });
      ctx.restore();
    }
    ctx.restore();
  };
  /* the mempool: a chrome order rail where pending tickets hang */
  K.ticketRail = function (ctx, x0, x1, y, seed) {
    K.chromeBar(ctx, x0, y - 12, x1 - x0, 26, seed || 300);
    [x0 + 10, x1 - 10].forEach((x, i) => K.dot(ctx, x, y + 1, 10, P.chromeDark, P.ink, 3, (seed || 300) + 1 + i));
  };

  /* ---------- the order bell (chrome dome on a mustard base); ring 0..1 decays ---------- */
  K.bell = function (ctx, x, y, s, ring, seed) {
    seed = seed || 400;
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const wob = ring > 0 ? Math.sin(K.now * 60) * 0.06 * ring : 0;
    K.shape(ctx, K.roundRectPts(-90, -10, 180, 34, 10), { fill: P.mustard, w: 5, boil: 1, seed, shade: { color: P.mustardDark, dx: 0, dy: -14 } });
    ctx.save(); ctx.rotate(wob); ctx.scale(1 + ring * 0.04, 1 - ring * 0.06);
    const dome = []; for (let i = 0; i <= 12; i++) { const a = Math.PI + (i / 12) * Math.PI; dome.push([Math.cos(a) * 76, -12 + Math.sin(a) * 66]); }
    K.shape(ctx, dome, { fill: P.chrome, w: 5, boil: 1, seed: seed + 1, shade: { color: P.chromeDark, dx: 22, dy: 0, dots: false }, shine: { x: 0.3, y: 0.3, alpha: 0.95 } });
    K.shape(ctx, K.rectPts(-8, -96, 16, 18, 1), { fill: P.chromeDark, w: 3.5, boil: 0.6, seed: seed + 2, misreg: false });
    K.shape(ctx, K.ellipsePts(0, -100 + ring * 12, 18, 9, 10), { fill: P.chrome, w: 3.5, boil: 0.6, seed: seed + 3, misreg: false });
    ctx.restore();
    if (ring > 0.05) { /* sound rings: language-free */
      for (let k = 0; k < 3; k++) {
        const r = 100 + k * 46 + (1 - ring) * 90, al = ring * (1 - k * 0.25);
        [-1, 1].forEach((sd) => K.line(ctx, [[sd * r * 0.82, -40 - r * 0.42], [sd * r * 0.98, -40], [sd * r * 0.82, -40 + r * 0.32]], { stroke: P.mustardDark, w: 7, boil: 1, seed: seed + 10 + k + (sd > 0 ? 5 : 0), alpha: al }));
      }
    }
    ctx.restore();
  };

  /* ---------- food props ---------- */
  K.plate = function (ctx, x, y, s, seed) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    K.shape(ctx, K.ellipsePts(0, 0, 90, 26, 16), { fill: P.cream, w: 4, boil: 1, seed, shade: { color: P.creamShade, dx: 0, dy: -10 } });
    K.shape(ctx, K.ellipsePts(0, -2, 60, 15, 14), { fill: null, stroke: P.cherry, w: 3, boil: 0.8, seed: seed + 1 });
    ctx.restore();
  };
  K.breadSlice = function (ctx, x, y, s, edge, seed) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const pts = [[-70, 4], [-74, -20], [-66, -40], [-40, -52], [0, -50], [40, -52], [66, -40], [74, -20], [70, 4]];
    K.shape(ctx, pts, { fill: P.bread, w: 5, boil: 1.1, seed, shade: { color: P.breadDark, dx: 0, dy: -14 } });
    K.shape(ctx, [[-62, -6], [-60, -24], [-38, -40], [38, -40], [60, -24], [62, -6]], { fill: P.cream, stroke: null, w: 0, boil: 0.8, seed: seed + 1, alpha: 0.55 });
    if (edge) K.rule(ctx, [[-60, 8], [60, 8]], { stroke: edge, w: 8, boil: 0.8, seed: seed + 2 });
    ctx.restore();
  };
  /* the victim's order: a burger. bite 0..1 takes a scalloped bite out of the right side */
  K.burger = function (ctx, x, y, s, seed, bite) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    if (bite > 0) { /* bite mark: clip away three overlapping circles */
      ctx.beginPath(); ctx.rect(-200, -200, 400, 400);
      const r = 26 * bite; [[70, -58], [82, -30], [74, -2]].forEach((c) => { ctx.moveTo(c[0] + r, c[1]); ctx.arc(c[0], c[1], r, 0, K.TAU, true); });
      ctx.clip("evenodd");
    }
    K.shape(ctx, [[-76, -6], [76, -6], [70, 10], [-70, 10]], { fill: P.bread, w: 4.5, boil: 1, seed: seed + 1 });
    K.shape(ctx, [[-80, -20], [80, -20], [84, -6], [-84, -6]], { fill: "#6b3a1e", w: 4.5, boil: 1, seed: seed + 2 });
    K.line(ctx, [[-84, -24], [-60, -16], [-40, -26], [-16, -16], [8, -26], [32, -16], [56, -26], [84, -20]], { stroke: P.lettuce, w: 9, boil: 1, seed: seed + 3, taper: 0 });
    K.shape(ctx, [[-70, -30], [70, -30], [74, -24], [-74, -24]], { fill: P.cheese, w: 3.5, boil: 0.8, seed: seed + 4 });
    const bun = []; for (let i = 0; i <= 12; i++) { const a = Math.PI + (i / 12) * Math.PI; bun.push([Math.cos(a) * 80, -32 + Math.sin(a) * 50]); }
    K.shape(ctx, bun, { fill: P.bread, w: 5, boil: 1.1, seed: seed + 5, shade: { color: P.breadDark, dx: 14, dy: 8 }, shine: { x: 0.3, y: 0.25 } });
    [[-30, -60], [0, -70], [28, -58], [-8, -50]].forEach((d, i) => K.shape(ctx, K.ellipsePts(d[0], d[1], 5, 3, 6, 0.4), { fill: P.cream, stroke: null, w: 0, boil: 0.3, seed: seed + 6 + i, misreg: false }));
    ctx.restore();
  };
  K.coffee = function (ctx, x, y, s, seed) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

    for (let i = 0; i <= Z; i++) pts.push([-w / 2 + (w * i) / Z, -h / 2 + (i % 2 ? 10 : 0)]);
    for (let i = Z; i >= 0; i--) pts.push([-w / 2 + (w * i) / Z, h / 2 - (i % 2 ? 10 : 0)]);
    K.shape(ctx, pts, { fill: P.cream, w: 4, boil: 1, seed: o.seed, shade: { color: P.creamShade, dx: 14, dy: 0 } });
    ctx.save(); ctx.font = `400 ${o.size}px ${K.FONT.mono}`; const cw = ctx.measureText("M").width; ctx.restore();
    const total = lines.reduce((s, l) => s + l.length, 0); let budget = Math.floor(total * o.typed);
    lines.forEach((ln, i) => {
      if (budget <= 0) return; const vis = ln.slice(0, budget); budget -= ln.length;
      const yy = -h / 2 + 45 + lh / 2 + i * lh; let col = 0;
      const toks = vis.match(/\/\/.*$|#.*$|"[^"]*"?|[A-Za-z_][A-Za-z0-9_]*|[0-9][0-9_.]*|\s+|./g) || [];
      toks.forEach((tk) => {
        const c = tk.startsWith("//") || tk.startsWith("#") ? "#8a7a6e" : KW.test(tk) ? P.cherryDark : /^[0-9]/.test(tk) ? P.USDC : tk.startsWith('"') ? P.gain : P.ink;
        K.text(ctx, tk, -w / 2 + 34 + col * cw, yy, { size: o.size, weight: KW.test(tk) ? 700 : 400, font: K.FONT.mono, fill: c, align: "left" });
        col += tk.length;
      });
    });
    ctx.restore();
  };

  /* ---------- AMM pool = balance scale with two ingredient pans (x * y = k) ----------
     opt: rx, ry (reserves, any units), labelX/labelY (tickers), colorX/colorY,
          tilt (deg; default from the reserve ratio; negative = left pan down), coins (max stack per pan),
     nX/nY (explicit coin counts), plaque (text on the base, "" = none) */
  K.ammScale = function (ctx, x, y, s, opt) {
    const o = Object.assign({ a: 1, rx: 10, ry: 10, labelX: "ETH", labelY: "USDC", colorX: P.ETH, colorY: P.USDC, tilt: null, seed: 81, coins: 8, plaque: "x · y = k" }, opt || {});
    const a = popS(o.a); if (a <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(s * a, s * a);
    const tilt = ((o.tilt != null ? o.tilt : clamp((o.rx - o.ry) / (o.rx + o.ry), -1, 1) * 14) * Math.PI) / 180;
    /* base + post */
    K.shape(ctx, K.roundRectPts(-170, -10, 340, 50, 16), { fill: P.mustard, w: 5, boil: 1.1, seed: o.seed, shade: { color: P.mustardDark, dx: 0, dy: -18 } });
    if (o.plaque) K.text(ctx, o.plaque, 0, 16, { size: 30, weight: 700, font: K.FONT.mono, fill: P.ink });
    K.shape(ctx, K.rectPts(-14, -330, 28, 322, 3), { fill: P.chrome, w: 4.5, boil: 0.9, seed: o.seed + 1, misreg: false, shade: { color: P.chromeDark, dx: 10, dy: 0, dots: false } });
    /* beam */
    ctx.save(); ctx.translate(0, -330); ctx.rotate(tilt);
    K.shape(ctx, K.roundRectPts(-300, -12, 600, 24, 10), { fill: P.chrome, w: 5, boil: 1, seed: o.seed + 2, misreg: false, shade: { color: P.chromeDark, dx: 0, dy: -10, dots: false } });
    const ends = [[-280, 0], [280, 0]].map((p) => ctx.getTransform().transformPoint(new DOMPoint(p[0], p[1])));
    ctx.restore();
    K.dot(ctx, 0, -330, 20, P.cherry, P.ink, 4, o.seed + 3);
    /* pans hang straight down from the beam ends (convert back to local space) */
    const inv = ctx.getTransform().inverse();
    [[ends[0], o.rx, o.labelX, o.colorX], [ends[1], o.ry, o.labelY, o.colorY]].forEach(([e, r, lb, col], i) => {
      const q = inv.transformPoint(e), px = q.x, py = q.y;
      K.ammPans = K.ammPans || []; K.ammPans[i] = ctx.getTransform().transformPoint(new DOMPoint(px, py + 120)); /* screen point above the pan's coins */
      [-1, 1].forEach((sd, k) => K.rule(ctx, [[px, py], [px + sd * 90, py + 170]], { stroke: P.ink, w: 3.5, boil: 0.6, seed: o.seed + 10 + i * 2 + k }));
      const nn = i ? o.nY : o.nX, n = nn != null ? nn : Math.max(1, Math.round(clamp(r, 0, 1e9) / Math.max(o.rx, o.ry) * o.coins));
      for (let c = 0; c < n; c++) {
        const cx = px + ((c % 3) - 1) * 52, cy = py + 150 - Math.floor(c / 3) * 40 - (c % 3 === 1 ? 14 : 0);
        K.coin(ctx, cx, cy, 30, { color: col, label: lb.slice(0, 1), labelColor: P.cream, seed: o.seed + 30 + i * 20 + c, size: 26 });
      }
      const pan = []; for (let j = 0; j <= 10; j++) { const ang = (j / 10) * Math.PI; pan.push([px + Math.cos(ang) * 110, py + 180 + Math.sin(ang) * 40]); }
      K.shape(ctx, pan, { fill: P.chrome, w: 5, boil: 1, seed: o.seed + 20 + i, misreg: false, shade: { color: P.chromeDark, dx: 0, dy: -16, dots: false } });
      K.tag(ctx, px, py + 250, lb, { seed: o.seed + 40 + i, size: 30, fill: col, color: P.cream });
    });
    ctx.restore();
  };

  /* ---------- neon diner sign (titles). on 0..1 lights the tubes, returns the text box ---------- */
  K.neonSign = function (ctx, cx, cy, w, h, on, opt) {
    const o = Object.assign({ seed: 71, a: 1, bulbs: true, flick: 0 }, opt || {});
    const a = popS(o.a); if (a <= 0) return null;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(a, a);
    /* sign board: arched top, chrome rim, cherry face */
    const pts = [];
    for (let i = 0; i <= 14; i++) { const u = i / 14; pts.push([-w / 2 + w * u, -h / 2 - Math.sin(u * Math.PI) * 46]); }
    pts.push([w / 2, h / 2 - 30], [w / 2 - 30, h / 2], [-w / 2 + 30, h / 2], [-w / 2, h / 2 - 30]);
    K.shape(ctx, pts.map((p) => [p[0] * 1.03, p[1] * 1.06 + (p[1] > 0 ? 4 : 0)]), { fill: P.chrome, w: 6, boil: 1.4, seed: o.seed, misreg: false, shade: { color: P.chromeDark, dx: 10, dy: 12, dots: false } });
    K.shape(ctx, pts, { fill: P.cherry, w: 5, boil: 1.2, seed: o.seed + 1, dots: { color: "rgba(120,10,25,0.35)", r: 3, gap: 13 } });
    /* neon tube outline inside the face; flickers on deterministically */
    const fl = on <= 0 ? 0 : on >= 1 ? 1 : (hash(Math.floor(on * 14), o.seed) > 0.4 ? on : 0.15);
    const tube = pts.map((p) => [p[0] * 0.94, p[1] * 0.88]);
    if (fl > 0) { ctx.save(); ctx.globalAlpha = 0.5 * fl; K.inkStroke(ctx, tube, true, 24, "rgba(255,93,143,0.45)", o.seed + 2); ctx.restore(); }
    K.inkStroke(ctx, tube, true, 7, fl > 0.3 ? "#ffd3e2" : "#9b5b6e", o.seed + 3);
    /* marquee bulbs chase along the rim */
    if (o.bulbs) {
      const n = 26, ph = Math.floor(K.now * 8);
      for (let i = 0; i < n; i++) {
        const u = i / (n - 1), bx = -w / 2 * 1.03 + w * 1.03 * u, by = (-h / 2 - Math.sin(u * Math.PI) * 46) * 1.06 - 2;
        const lit = on > 0.5 && (i + ph) % 3 !== 0;
        if (lit) K.glow(ctx, bx, by, 26, "rgba(255,230,140,0.9)", 0.7);
        K.dot(ctx, bx, by, 9, lit ? "#fff2b8" : P.creamShade, P.ink, 2.5, o.seed + 10 + i);
      }
    }
    ctx.restore();
    return { x: cx - (w / 2) * a, y: cy - (h / 2) * a, w: w * a, h: h * a };
  };
})(DK);

/* ============================================================
   INTRO 10 SETUP: variables, title DOM, timing (beat grid)
   Song: song_20s.m4a, "The Sandwich Gambit", vaudeville revival ~150 BPM
   (beat 0.40 s, bar 1.60 s). Cut = 1 instrumental bar from the outro +
   raw 6.39-25.75 s. Sung lines in the cut (whisper + downbeats):
     1.76 "MEV lurks in the mempool dark"
     4.97 "sandwich attacks leave their mark"
     8.15 "Read the book, read the book"
    11.35 "Microstructure off the hook"
    14.56 "... rings the matching bell"
    17.79 "Latency knows it well"          20.3-20.9 fade
   All story times are K.at(bar, beat) on the measured downbeats below.
   ============================================================ */
const K = DK, P = K.P, at = K.at;
K.G.BPM = 150;
K.G.BARS = [0.16, 1.76, 3.37, 4.97, 6.52, 8.15, 9.75, 11.35, 12.96, 14.56, 16.18, 17.79, 19.37, 20.97];
const DUR = 20.9;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const BEAT = K.beatLen();

/* ---------- story beats (on the song's downbeats) ---------- */
const T = {
  popUp: [at(0, 1) - 0.2, at(0, 1)],   /* 0.36 crouch, 0.56 Nibbs pops up behind the counter */
  magUp: at(0, 2.5),                   /* 1.16 magnifier up, looks right */
  pan: [at(1, 0), at(2, 0)],           /* 1.76 - 3.37 "MEV lurks": camera dollies to the mempool corner */
  dim: [at(1, 1.5), at(1, 3.5)],       /* the corner lamp flickers off */
  eyes: at(1, 2),                      /* 2.56 red visor eye glows in the dark */
  botUp: at(2, 0),                     /* 3.37 Slyce hops up onto the counter */
  frontClip: at(3, 0),                 /* 4.97 "sandwich attacks": front-run ticket jumps the queue */
  backClip: at(3, 2),                  /* 5.77 back-run ticket right behind the victim */
  fly: at(4, 0),                       /* 6.52 the three tickets fly into the next tray: a sandwich */
  bite: at(4, 2),                      /* 7.32 "leave their mark": bite + -1.2 % */
  gasp: at(4, 2.5),                    /* Nibbs: "!" */
  slap: [at(4, 3), at(5, 0)],          /* 7.75 - 8.15 the menu slaps into the camera */
  rows: at(5, 0),                      /* 8.15 "Read the book": rows pop */
  read2: at(6, 0),                     /* 9.75 second "read the book": best bid / ask + spread */
  whip: [at(6, 3), at(7, 0)],          /* 10.95 - 11.35 whip pan to the counter */
  amm: at(7, 0),                       /* 11.35 "Microstructure off the hook": scale + curve */
  trade: at(8, 0),                     /* 12.96 1 ETH drops in, the beam tips, USDC pops out */
  bellUp: at(8, 3),                    /* 14.16 paw raised */
  ding: at(9, 0),                      /* 14.56 "rings the matching bell" */
  doors: [at(9, 2), at(10, 0)],        /* 15.36 - 16.18 kitchen doors swing shut and open */
  sign: at(10, 0),                     /* 16.18 neon sign lights */
  letters: at(10, 0.5),
  plates: at(11, 0),                   /* 17.79 "Latency knows it well": episode plates pop */
  tip: at(11, 2),
  peek: at(11, 3),                     /* Slyce peeks in from the left */
  caught: at(12, 0),                   /* 19.37 caught by the magnifier flash */
};

/* ---------- variables (title text, language) ---------- */
const VARS = Object.assign({ title: "Onchain & DeFi|Quant", lang: "en" },
  (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {});
const LANG = VARS.lang || "en";

const IS_CJK = LANG === "zh-CN" || LANG === "zh-TW";

/* ---------- title DOM: one span per character (letters drop in on the beat) ---------- */
const titleEl = document.getElementById("title");
if (LANG === "zh-CN") titleEl.classList.add("cjk-sc");

const TITLE_LN = Array.from(titleEl.querySelectorAll(".ln"));

/* ============================================================
   INTRO 20 DINER: the long diner set (0 - 8.15 s).
   World strip, x -400 .. 3700: pass window + conveyor chain of trays (the
   blockchain) across the back, the mempool ticket rail in the dark corner
   (x 2380 - 3100), the counter in front. The camera dollies from Nibbs to the
   corner, Slyce clips his two tickets around the victim's order, the three
   tickets fly into the next tray and become a sandwich, Slyce takes a bite.
   ============================================================ */
const inv = K.inv, tw = K.tw, E = K.E;
const COUNTER_Y = 780, RAIL_Y = 470, BELT_Y = 340, BELT_V = 150, NIBBS_Y = 880, BOT_S = 1.0;

const camDiner = K.mkTrack([
  [0, { x: 760, y: 560, z: 1 }],
  [T.pan[0], { x: 760, y: 560, z: 1 }],
  [T.pan[1], { x: 2740, y: 520, z: 1.06 }],
  [T.frontClip, { x: 2790, y: 500, z: 1.1 }],
  [T.fly, { x: 2850, y: 480, z: 1.12 }],
  [T.fly + 0.6, { x: 2960, y: 440, z: 1.18 }],
  [T.slap[1], { x: 2980, y: 440, z: 1.22 }],
]);

/* ---------- the chain of trays: k = 0 is the tray that gets the sandwich ---------- */
const TRAY0 = 2910 - BELT_V * (T.fly + 0.25);
const trayX = (k, t) => TRAY0 + k * 600 + BELT_V * t;
const TRAY_ITEMS = (k) => {
  const r = (i) => K.hash(k * 13 + i, 77);
  const pick = (i) => (r(i) < 0.45 ? { kind: "ticket", color: r(i + 5) < 0.5 ? P.mint : P.cherryLight, label: r(i + 9) < 0.6 ? "ETH" : "USDC" } : r(i) < 0.7 ? { kind: "coin" } : r(i) < 0.85 ? { kind: "cup" } : { kind: "plate" });
  return [pick(1), pick(2), pick(3)];
};

/* ---------- pending tickets on the rail (the mempool) ---------- */
const VICTIM = { x: 2910, color: P.mint, label: "ETH", amt: "2.0", arrow: "up", gas: 1, seed: 230 };
const FRONT = { x: 2780, color: P.cherry, label: "ETH", amt: "9.5", arrow: "up", gas: 3, seed: 240, t: T.frontClip };
const BACK = { x: 3040, color: P.cherry, label: "ETH", amt: "9.5", arrow: "down", gas: 0, seed: 250, t: T.backClip };
const OTHERS = [
  { x: 2640, color: P.mint, label: "USDC", amt: "500", arrow: "down", gas: 1, seed: 210 },
  { x: 3170, color: P.mint, label: "ETH", amt: "0.4", arrow: "down", gas: 2, seed: 220 },
  { x: 3300, color: P.mint, label: "USDC", amt: "80", arrow: "up", gas: 1, seed: 225 },
];
const SANDWICH = [FRONT, VICTIM, BACK];
const SLOT = [-84, 0, 84]; /* slot x in the tray, left to right */

function railTicket(tk, t, extra) {
  const sw = Math.sin(t * 2.3 + tk.seed) * 0.04 + (extra || 0);
  K.ticket(ctx, tk.x, RAIL_Y + 6, 0.92, { color: tk.color, label: tk.label, amt: tk.amt, arrow: tk.arrow, gas: tk.gas, seed: tk.seed, tilt: sw, a: tk.t ? inv(tk.t, tk.t + 0.35, t) : 1 });
}
function darkness(t) { return 0.18 + 0.52 * inv(T.dim[0], T.dim[1], t); }
function lampOn(t) {
  if (t < T.dim[0]) return 1;
  if (t > T.dim[1]) return 0.08;
  return K.hash(Math.floor(t * 14), 5) > 0.5 ? 0.9 : 0.1; /* flicker, stepped at 14 Hz */
}

/* ---------- Nibbs in the diner ---------- */
function nibbsDiner(t) {
  const pop = inv(T.popUp[0], T.popUp[1], t), dash = inv(T.pan[0] + 0.05, T.pan[1] - 0.15, t);
  const x = K.lerp(640, 2150, E.inOut(dash)), down = (1 - E.back(pop, 1.6)) * 340;
  const land = t - T.popUp[1], bounce = 0.08 * K.pulse(t, 1, 6);
  const st = { blink: K.blinkAt(t, 3), mouth: "smile", look: [0, 0], cheeks: 0.25 };
  st.squash = pop < 1 ? -0.3 * Math.sin(pop * Math.PI) : land < 0.35 ? 0.32 * Math.exp(-land * 9) * Math.cos(land * 22) : bounce;
  st.pawL = { x: -78, y: -40 }; st.pawR = { x: 78, y: -40 };
  if (t > T.magUp - 0.25) {
    const u = E.back(inv(T.magUp - 0.25, T.magUp + 0.1, t), 2);
    st.hold = "magnifier"; st.magS = 1.35; st.magAng = K.lerp(40, -18, u); st.pawR = { x: K.lerp(70, 104, u), y: K.lerp(-40, -150, u) };
    st.look = [K.lerp(0, 1, u), -0.2];
  }
  if (dash > 0 && dash < 1) { /* cartoon dash: lean in, toque lags, speed lines */
    const sp = Math.sin(dash * Math.PI);
    st.lean = 18 * sp; st.toqueTip = -16 * sp; st.squash = -0.12 * sp; st.mouth = "o";
    for (let i = 0; i < 5; i++) { const y = 520 + i * 52, l = 160 + 120 * K.hash(i, K.bf); K.line(ctx, [[x - 120 - l, y], [x - 120, y]], { stroke: P.ink, w: 6, boil: 0.5, seed: 30 + i, alpha: sp }); }
  }
  if (t >= T.pan[1] - 0.15) { /* in the corner: magnifier on the rail */
    const sway = Math.sin(t * 2.2) * 6;
    st.hold = "magnifier"; st.magS = 1.5; st.magAng = -24 + sway * 0.4; st.pawR = { x: 100, y: -160 + sway };
    st.look = [1, 0.2]; st.brow = 0.3; st.whisk = 1.6;
  }
  if (t > T.frontClip) { st.brow = -0.6; st.mouth = "frown"; }
  if (t > T.gasp) {
    const g = inv(T.gasp, T.gasp + 0.3, t);
    st.exclaim = g; st.eyeUp = 6 * g; st.mouth = "open"; st.brow = 1.3; st.cheeks = 0.6; st.squash = -0.25 * Math.exp(-(t - T.gasp) * 6);
  }
  if (t > T.slap[0]) { /* yanks the menu out: paw swings at the camera */
    const u = inv(T.slap[0], T.slap[1], t);
    st.brow = -1; st.mouth = "grin"; st.exclaim = 0; st.eyeUp = 0;
    st.pawL = { x: K.lerp(-78, -20, u), y: K.lerp(-40, -200, u) };
  }
  ctx.save(); ctx.beginPath(); ctx.rect(-1000, -1000, 6000, COUNTER_Y + 1040); ctx.clip();
  K.hamster(ctx, x, NIBBS_Y + down, 1.6, st);
  ctx.restore();
  return { x, y: NIBBS_Y + down };
}

/* ---------- Slyce in the diner. Returns true when he stands on the counter (draw in front) ---------- */
function slyceDiner(t, front) {
  if (t < T.eyes - 0.1) return;
  const hop = inv(T.botUp, T.botUp + 0.42, t);
  const onTop = t >= T.botUp + 0.25;
  if (onTop !== front) return;
  const st = { glow: K.lerp(0.9, 0.5, inv(T.botUp, T.botUp + 1, t)), look: Math.sin(t * 3.1) * 0.8, grin: 0.6, seed: 900 };
  let x = 3160, y = COUNTER_Y + 105;
  if (t >= T.botUp) {
    const arc = Math.sin(Math.min(1, hop) * Math.PI) * 170;
    y = K.lerp(COUNTER_Y + 105, COUNTER_Y, E.out3(hop)) - arc;
    st.squash = hop < 0.05 ? 0.25 : hop >= 1 ? 0.3 * Math.exp(-(t - T.botUp - 0.42) * 8) : -0.2;
  }
  /* sneak left to the front slot, clip, then right to the back slot */
  const walk1 = inv(T.botUp + 0.45, T.frontClip - 0.12, t), walk2 = inv(T.frontClip + 0.3, T.backClip - 0.12, t);
  if (t >= T.botUp + 0.42) {
    x = K.lerp(3160, 2860, E.inOut(walk1));
    x = K.lerp(x, 3000, E.inOut(walk2));
    if ((walk1 > 0 && walk1 < 1) || (walk2 > 0 && walk2 < 1)) { st.walk = t * 15; st.lean = -8; y = COUNTER_Y - Math.abs(Math.sin(t * 15)) * 8; }
  }
  const s = BOT_S, toL = (wx, wy) => ({ x: (wx - x) / s, y: (wy - y) / s });
  /* clip the front ticket with the left glove, the back ticket with the right */
  const reach1 = inv(T.frontClip - 0.3, T.frontClip, t) * (1 - inv(T.frontClip + 0.15, T.frontClip + 0.4, t));
  const reach2 = inv(T.backClip - 0.3, T.backClip, t) * (1 - inv(T.backClip + 0.15, T.backClip + 0.4, t));
  st.armL = { x: K.lerp(-110, toL(FRONT.x, RAIL_Y + 10).x, reach1), y: K.lerp(-150, toL(FRONT.x, RAIL_Y + 10).y, reach1) };
  st.armR = { x: K.lerp(110, toL(BACK.x, RAIL_Y + 10).x, reach2), y: K.lerp(-150, toL(BACK.x, RAIL_Y + 10).y, reach2) };
  if (t > T.backClip + 0.4 && t < T.fly + 0.3) { const r = Math.sin(t * 18) * 14; st.armL = { x: -30 + r, y: -175 }; st.armR = { x: 30 - r, y: -170 }; st.grin = 1; st.glow = 0.9; } /* rubs his gloves */
  /* the bite: big hop up to the tray, chomp at the apex */
  const j = inv(T.bite - 0.42, T.bite + 0.45, t);
  if (j > 0 && j < 1) {
    const tx = trayX(0, T.bite);
    x = K.lerp(3000, tx - 10, Math.min(1, j * 2.2));
    y = COUNTER_Y - Math.sin(j * Math.PI) * 330; st.squash = -0.25 * Math.sin(j * Math.PI); st.grin = 1; st.armL = { x: -130, y: -260 }; st.armR = { x: 130, y: -260 };
  }
  if (t >= T.bite + 0.45) { x = trayX(0, T.bite) - 10; st.grin = 1; st.armL = { x: -60, y: -120 }; st.armR = { x: 60, y: -120 }; st.squash = 0.3 * Math.exp(-(t - T.bite - 0.45) * 8); st.look = -0.9; }
  K.sandwichBot(ctx, x, y, s, st);
  K.botAt = { x, y };
}

/* ---------- tray contents for the sandwich tray ---------- */
function sandwichTray(t, x) {
  const fly = (i) => inv(T.fly + i * BEAT / 4, T.fly + i * BEAT / 4 + 0.42, t);
  K.block(ctx, x, BELT_Y, 1, { num: "#19 204 118", items: [], seed: 160, hot: inv(T.fly + 0.5, T.fly + 0.9, t) * (1 - inv(T.bite + 0.3, T.bite + 0.8, t)) });

/* ---------- the whole diner frame ---------- */

function drawDinerWorld(t, full) {

    for (let i = 0; i < 3; i++) {
      const u = inv(T.bite + 0.1 + i * 0.1, T.bite + 0.55 + i * 0.1, t); if (u <= 0 || u >= 1) continue;

      K.coin(ctx, K.lerp(tx + 20, bx - 40 + i * 40, u), K.lerp(BELT_Y - 90, COUNTER_Y - 160, u) - Math.sin(u * Math.PI) * 140, 22, { color: P.mustard, seed: 630 + i });
    }
  }
  if (full) { K.stool(ctx, 360, 1150, 1, 70); K.stool(ctx, 1060, 1150, 1, 71); K.stool(ctx, 1760, 1150, 1, 72); K.stool(ctx, 2460, 1150, 1, 73); K.stool(ctx, 3160, 1150, 1, 74); }

/* ============================================================

/* ============================================================

   17.79 "Latency knows it well": six episode plates pop on half beats,
         Nibbs tips his toque. 18.98 Slyce peeks in from the left;
   19.37 the magnifier flashes, Slyce is caught and bolts.
   ============================================================ */
const SIGN = { cx: 960, cy: 300, w: 1480, h: 330 };
const PLATE_Y = 842, PLATE_R = 50;

/* six episode icons, language-free: DEX analytics, AMM pools, MEV sandwich,
   prediction-market traders, onchain flows, blocks */
const ICONS = [
  (c, r) => { [0.35, 0.7, 0.5].forEach((h, i) => K.shape(c, K.rectPts(-r * 0.42 + i * r * 0.3, r * 0.4 - r * h, r * 0.2, r * h, 1), { fill: P.cream, w: 3, boil: 0.4, seed: 3 + i, misreg: false })); },
  (c, r) => { K.rule(c, [[-r * 0.5, -r * 0.15], [r * 0.5, -r * 0.3]], { stroke: P.ink, w: 4, boil: 0.4, seed: 10 }); K.rule(c, [[0, -r * 0.22], [0, r * 0.45]], { stroke: P.ink, w: 4, boil: 0.4, seed: 11 }); K.dot(c, -r * 0.45, r * 0.05, r * 0.16, P.cream, P.ink, 2.5, 12); K.dot(c, r * 0.45, -r * 0.08, r * 0.16, P.cream, P.ink, 2.5, 13); },
  (c, r) => { K.breadSlice(c, -r * 0.3, r * 0.2, r * 0.0042, null, 20); ctx.save(); K.burger(c, r * 0.02, r * 0.28, r * 0.0055, 21, 0); ctx.restore(); K.breadSlice(c, r * 0.34, r * 0.2, r * 0.0042, null, 22); },
  (c, r) => { K.shape(c, K.ellipsePts(0, 0, r * 0.45, r * 0.45, 14), { fill: P.cream, w: 3, boil: 0.4, seed: 30, misreg: false }); K.shape(c, [[0, 0], [0, -r * 0.45], [r * 0.32, -r * 0.32], [r * 0.45, 0], [r * 0.32, r * 0.32]], { fill: P.cherry, w: 3, boil: 0.4, seed: 31, misreg: false }); },
  (c, r) => { K.rule(c, [[-r * 0.35, r * 0.25], [r * 0.3, -r * 0.25]], { stroke: P.ink, w: 4, boil: 0.4, seed: 40 }); K.shape(c, [[r * 0.42, -r * 0.34], [r * 0.12, -r * 0.3], [r * 0.32, -r * 0.08]], { fill: P.ink, w: 2, boil: 0.3, seed: 41, misreg: false }); K.dot(c, -r * 0.38, r * 0.28, r * 0.14, P.cream, P.ink, 2.5, 42); },
  (c, r) => K.chainIcon(c, r * 0.1, 0, r * 0.45, 50),
];
const PLATE_COLORS = [P.cherry, P.USDC, P.mustard, P.teal, P.ETH, P.cherryDark];

/* ---------- swing doors (screen space). u: 0 open .. 1 shut ---------- */
function drawDoors(t) {
  const shut = E.back(inv(T.doors[0], T.doors[0] + 0.38, t), 1.4), open = E.inOut(inv(T.doors[1] - 0.12, T.doors[1] + 0.32, t));
  const k = Math.max(0, Math.min(1.08, shut) * (1 - open));
  if (k <= 0.001) return;
  K.screen(ctx);
  [-1, 1].forEach((sd, i) => {
    const w = 990 * k, x0 = sd < 0 ? -20 : 1940 - w, flex = Math.sin(t * 30) * 4 * (1 - inv(T.doors[0] + 0.38, T.doors[0] + 0.7, t));
    const pts = K.rectPts(x0, -20, w, 1120, 6).map((p) => [p[0] + (p[0] > x0 + 1 && p[0] < x0 + w - 1 ? 0 : 0), p[1] + (Math.abs(p[0] - (sd < 0 ? x0 + w : x0)) < 1 ? flex : 0)]);
    K.shape(ctx, pts, { fill: P.cherry, w: 7, boil: 1.2, seed: 950 + i, shade: { color: P.cherryDark, dx: sd * 40, dy: 0 } });
    const cx = x0 + w / 2;
    K.shape(ctx, K.rectPts(x0 + 40 * k, 820, w - 80 * k, 200, 4), { fill: P.chrome, w: 5, boil: 1, seed: 960 + i, misreg: false, shade: { color: P.chromeDark, dx: 0, dy: -60, dots: false } });
    K.shape(ctx, K.ellipsePts(cx, 360, 150 * k, 150, 18), { fill: P.chrome, w: 6, boil: 1.1, seed: 970 + i, misreg: false });
    K.shape(ctx, K.ellipsePts(cx, 360, 118 * k, 118, 18), { fill: "#ffe7a8", w: 4.5, boil: 1, seed: 980 + i, misreg: false, shade: { color: "#f7cf6a", dx: 18, dy: 18 } });
    K.line(ctx, [[cx - 60 * k, 320], [cx - 30 * k, 280], [cx + 10 * k, 268]], { stroke: "#ffffff", w: 10, boil: 0.5, seed: 990 + i, alpha: 0.8 });
  });
}

function drawTitleSet(t) {
  K.cam = { x: 960, y: 540, z: K.tw(t, T.doors[1], DUR, 1.05, 1.0, E.out3), rot: 0 };
  K.applyCam(ctx, 1);
  K.wall(ctx, -300, 2220, -300, 860, { seed: 13, wainscot: 0.32 });
  K.lamp(ctx, 150, -60, 0.8, 1, 53); K.lamp(ctx, 1770, -60, 0.8, 1, 54);
  /* conveyor keeps the blocks rolling behind the sign */
  K.conveyor(ctx, -300, 2220, 650, BELT_V * t, { seed: 61 });
  for (let k = -1; k < 5; k++) { const x = ((k * 520 + BELT_V * t) % 3120 + 3120) % 3120 - 520; K.block(ctx, x, 650, 0.8, { num: "#19 204 " + (140 + k), items: TRAY_ITEMS(k + 30), seed: 300 + k * 7 }); }
  /* the sign */
  const on = inv(T.sign, T.sign + 0.6, t);
  const box = K.neonSign(ctx, SIGN.cx, SIGN.cy, SIGN.w, SIGN.h, on, { seed: 71, a: inv(T.doors[1] - 0.25, T.doors[1] + 0.2, t) });
  if (on > 0.5) K.glow(ctx, SIGN.cx, SIGN.cy, 900, "rgba(255,93,143,0.35)", 0.35 * on);
  /* Slyce peeks from behind the counter on the left, gets caught, bolts */
  if (t > T.peek) {
    const pk = E.out3(inv(T.peek, T.peek + 0.35, t)), run = inv(T.caught + 0.2, T.caught + 0.8, t);
    const st = { glow: 0.6, look: t < T.caught ? 0.8 : -1, grin: 0.8, seed: 900, sliceR: true, armL: { x: -100, y: -150 }, armR: { x: 120, y: -190 } };
    let x = K.lerp(150, 330, pk), y = K.lerp(1010, 905, pk);
    if (t > T.caught) { st.shock = 1; st.armL = { x: -110, y: -290 }; st.armR = { x: 110, y: -290 }; y -= Math.sin(Math.min(1, (t - T.caught) / 0.35) * Math.PI) * 90; }
    if (run > 0) { x = K.lerp(330, -260, E.in3(run)); st.walk = t * 22; st.lean = -16; }
    K.sandwichBot(ctx, x, y, 0.95, st);
  }
  K.counter(ctx, -300, 2220, 860, 260, { seed: 42 });
  /* episode plates pop on half beats */
  for (let i = 0; i < 6; i++) {
    const t0 = T.plates + i * BEAT / 2, a = inv(t0, t0 + 0.35, t); if (a <= 0) continue;
    const s = E.back(a, 2.6), x = 960 + (i - 2.5) * 150, y = PLATE_Y - 6 * K.pulse(t - i * 0.06, 1, 6);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    K.plate(ctx, 0, 18, 0.75, 610 + i);
    K.coin(ctx, 0, -40, PLATE_R, { color: PLATE_COLORS[i], seed: 620 + i * 7 });
    ctx.translate(0, -40); ICONS[i](ctx, PLATE_R);
    ctx.restore();
  }
  nibbsTitle(t);
  return box;
}
function nibbsTitle(t) {
  const st = { blink: K.blinkAt(t, 11), mouth: "grin", cheeks: 0.4, hold: "magnifier", magHand: "L", magS: 1.2, magAng: -115, seed: 700 };
  const enter = inv(T.doors[1], T.doors[1] + 0.45, t), down = (1 - E.back(enter, 1.8)) * 260;
  st.squash = enter < 1 ? -0.2 * Math.sin(enter * Math.PI) : 0.08 * K.pulse(t, 1, 6);
  st.pawL = { x: -96, y: -150 + 10 * K.pulse(t, 1, 6) };
  st.pawR = { x: 80, y: -40 };
  const tip = inv(T.tip, T.tip + 0.3, t) * (1 - inv(T.tip + 0.8, T.tip + 1.1, t));
  if (tip > 0) { st.pawR = { x: K.lerp(80, 40, tip), y: K.lerp(-40, -250, tip) }; st.toqueTip = 16 * tip; st.toqueLift = 26 * tip; st.wink = tip; }
  if (t > T.peek + 0.1) { /* spots Slyce: swings the magnifier left, flash on the downbeat */
    const sw = E.inOut(inv(T.peek + 0.1, T.caught - 0.05, t));
    st.magAng = K.lerp(-115, -178, sw); st.pawL = { x: K.lerp(-96, -112, sw), y: K.lerp(-150, -120, sw) };
    st.look = [-sw, 0]; st.brow = -0.8 * sw; st.mouth = "smirk";
    if (t > T.caught) { st.mouth = "grin"; st.brow = 0.8; }
    const back = E.inOut(inv(T.caught + 0.5, T.caught + 0.9, t)); /* lens back up, clear of the plates */
    if (back > 0) { st.magAng = K.lerp(-178, -115, back); st.pawL = { x: K.lerp(-112, -96, back), y: K.lerp(-120, -150, back) }; st.look = [-1 + back, 0]; }
  }
  K.hamster(ctx, 1640, 1000 + down, 1.6, st);
  if (t > T.caught && t < T.caught + 0.5 && K.lens) { /* magnifier flash */
    const k = inv(T.caught, T.caught + 0.5, t);
    K.screen(ctx); K.glow(ctx, K.lens.x, K.lens.y, 260 * (1 - k * 0.5), "rgba(255,255,230,1)", 1 - k);
    K.sparkle(ctx, K.lens.x, K.lens.y, 80 * (1 - k), 1 - k, 5);
    K.applyCam(ctx, 1);
  }
}

/* ---------- title DOM: fit, place inside the sign face, drop letters on the beat ---------- */
const fitCache = {};
function fitSize(line, cls, maxW, maxSize) {
  const key = cls + "|" + line + "|" + (document.fonts ? document.fonts.status : "");
  if (fitCache[key]) return fitCache[key];
  const fam = cls === "l1" ? (IS_CJK ? '900 100px "Nunito", ' + (LANG === "zh-TW" ? '"CJK TC"' : '"CJK SC"') : '900 100px "Nunito"') : IS_CJK ? '900 100px "Nunito", ' + (LANG === "zh-TW" ? '"CJK TC"' : '"CJK SC"') : '400 100px "Lobster"';
  ctx.save(); ctx.font = fam; ctx.letterSpacing = cls === "l1" ? "4px" : "1px"; const w = ctx.measureText(line).width; ctx.restore();
  const v = Math.min(maxSize, Math.floor((100 * maxW) / Math.max(1, w)));
  fitCache[key] = v; return v;
}
function layoutTitleDom(t, box) {
  const vis = t >= T.letters - 0.05 && box;
  titleEl.style.opacity = vis ? "1" : "0";
  if (!vis) return;
  const n = TITLE_LN.length, maxW = SIGN.w - 230;
  const sizes = TITLE_LN.map((d, i) => {
    const cls = d.classList.contains("l1") ? "l1" : "l0", line = TITLE_LINES[i];
    return fitSize(line, cls, maxW, IS_CJK ? 150 : n > 1 ? (cls === "l1" ? 104 : 132) : 140);
  });
  TITLE_LN.forEach((d, i) => { d.style.fontSize = sizes[i] + "px"; });
  const gap = 4, total = sizes.reduce((a, b) => a + b, 0) + gap * (n - 1);
  const zs = K.cam.z, cy = 540 + (SIGN.cy + 6 - 540) * zs;
  let y = cy - total / 2 - (n > 1 ? 6 : 0);
  TITLE_LN.forEach((d, i) => { d.style.top = y.toFixed(1) + "px"; y += sizes[i] + gap; });
  titleEl.style.transform = `scale(${zs.toFixed(4)})`; titleEl.style.transformOrigin = "960px " + cy.toFixed(1) + "px";
  TITLE_CH.forEach((c) => {
    const t0 = T.letters + c.idx * 0.04, a = inv(t0, t0 + 0.4, t);
    const yy = (1 - E.back(a, 2.4)) * -160, land = inv(t0 + 0.28, t0 + 0.55, t);
    const sq = Math.sin(land * Math.PI) * 0.16 * (1 - land);
    const hop = c.line === n - 1 ? -7 * K.pulse(t, 4, 6) * inv(T.plates, T.plates + 0.2, t) : 0;
    c.el.style.opacity = a > 0 ? Math.min(1, a * 3).toFixed(2) : "0";
    c.el.style.transform = `translateY(${(yy + hop).toFixed(1)}px) scale(${(1 + sq).toFixed(3)}, ${(1 - sq).toFixed(3)})`;
  });
}

/* ============================================================
   INTRO 70 RENDER: render(t) is the whole film. One paused GSAP timeline
   drives a proxy whose setter calls render(t).
   0.00 - 1.76  diner: Nibbs pops up behind the counter, magnifier up
   1.76 - 4.97  "MEV lurks in the mempool dark": dolly to the dark corner,
                Slyce's red eye, he hops onto the counter
   4.97 - 8.15  "sandwich attacks leave their mark": front + back tickets
                around the victim, they fly into a tray as a sandwich, bite, -1.2 %
   7.75 - 8.15  menu-card slap transition
   8.15 - 11.35 "Read the book, read the book": order-book menu, the lens reads it
   10.95- 11.35 whip pan
   11.35- 14.56 "Microstructure off the hook": AMM scale + x*y=k placemat, 1 ETH trade
   14.56        the order bell DING
   15.36- 16.40 swing doors shut and open on the title set
   16.18- 20.90 neon sign title, episode plates, Slyce caught
   ============================================================ */
function slapCard(t, nb) {
  const u = inv(T.slap[0], T.slap[1], t), e = u * u;
  if (u <= 0) return;
  const paw = K.toScreen(nb.x - 30, nb.y - 330);
  const cx = K.lerp(paw[0], 960, e), cy = K.lerp(paw[1], 540, e), w = K.lerp(150, 2050, e), h = K.lerp(200, 1200, e), r = K.lerp(-0.6, 0, e);
  const rect = K.roundRectPts(-w / 2, -h / 2, w, h, 30).map((p) => [cx + p[0] * Math.cos(r) - p[1] * Math.sin(r), cy + p[0] * Math.sin(r) + p[1] * Math.cos(r)]);
  K.screen(ctx); ctx.save(); K.pathOf(ctx, rect, true); ctx.clip();
  drawTable(t);
  ctx.restore();
  K.screen(ctx); K.shape(ctx, rect, { fill: null, stroke: P.cherry, w: 34, boil: 1.2, seed: 940, taper: 0 });
  K.shape(ctx, rect, { fill: null, stroke: P.ink, w: 7, boil: 1.2, seed: 941 });
  for (let i = 0; i < 6; i++) { const a = r + Math.PI + (i - 2.5) * 0.18, l = 140 + 80 * K.hash(i, K.bf); K.line(ctx, [[cx + Math.cos(a) * (w * 0.5 + 20), cy + Math.sin(a) * (h * 0.4)], [cx + Math.cos(a) * (w * 0.5 + 20 + l), cy + Math.sin(a) * (h * 0.4 + l * 0.3)]], { stroke: P.ink, w: 7, boil: 0.5, seed: 945 + i, alpha: 1 - e }); }
}

function render(t) {
  let box = null;
  try {
    K.begin(ctx, t, { x: 960, y: 540, z: 1 });
    if (t < T.slap[1]) {
      const nb = drawDiner(t);
      if (t >= T.slap[0]) slapCard(t, nb);
    } else if (t < T.doors[1] - 0.12) {
      drawTable(t);
    } else {
      box = drawTitleSet(t);
    }
    if (t >= T.doors[0]) drawDoors(t);
    layoutTitleDom(t, box);
  } catch (err) {
    /* never leave a black frame silently: draw the error so a snapshot shows it */
    K.screen(ctx); ctx.fillStyle = "#300"; ctx.fillRect(0, 0, 1920, 80); ctx.fillStyle = "#fff"; ctx.font = "28px monospace"; ctx.fillText(String(err && err.stack || err).slice(0, 140), 20, 50);
  }
  /* paper grain steps at the boil rate */
  const f = K.boilFrame(t);
  grainEl.style.backgroundPosition = ((f % 7) * 37) + "px " + ((f % 5) * 53) + "px";
}

const grainEl = document.getElementById("grain");
grainEl.style.backgroundImage = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .4  0 0 0 1.4 -.2'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>\")";

const TL = gsap.timeline({ paused: true });
const drv = { _t: 0 };
Object.defineProperty(drv, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
TL.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
render(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(drv._t));
window.__timelines["main"] = TL;
window.__render = render;

})();
    </script>
  </body>
