<!doctype html>
<html lang="en">

    <title>Block Diner kit gallery</title>
    <script src="assets/gsap.min.js"></script>
    <style>
/*__FONTS__*/
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f4dcc0; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f4dcc0; }
      #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .ov { position: absolute; inset: 0; pointer-events: none; }
      #preload { position: absolute; left: -9999px; top: 0; opacity: 0; }
      #preload .lb { font-family: "Lobster"; font-weight: 400; }
      #preload .n6 { font-family: "Nunito"; font-weight: 600; }
      #preload .n8 { font-family: "Nunito"; font-weight: 800; }
      #preload .n9 { font-family: "Nunito"; font-weight: 900; }
      #preload .m4 { font-family: "Anonymous Pro"; font-weight: 400; }
      #preload .m7 { font-family: "Anonymous Pro"; font-weight: 700; }
      #preload .sc { font-family: "CJK SC"; font-weight: 900; }
      #preload .tc { font-family: "CJK TC"; font-weight: 900; }
      #vig { background: radial-gradient(100% 90% at 50% 46%, rgba(0, 0, 0, 0) 64%, rgba(26, 18, 22, 0.38) 100%); }
      #grain { opacity: 0.1; mix-blend-mode: multiply; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">
      <canvas id="cv" width="1920" height="1080" data-layout-allow-overflow></canvas>
      <div class="ov" id="vig"></div>

    </div>
