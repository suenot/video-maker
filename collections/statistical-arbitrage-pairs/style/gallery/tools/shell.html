<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Vaudeville kit gallery</title>
    <script src="assets/gsap.min.js"></script>
    <style>
/*__FONTS__*/
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #141312; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #141312; }
      #cv, #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .ov { position: absolute; inset: 0; pointer-events: none; }
      #title { position: absolute; left: 0; top: 0; width: 1920px; height: 0; pointer-events: none; }
      #title .ln { position: absolute; left: 0; width: 1920px; text-align: center; white-space: nowrap; line-height: 1.12; }
      #title .fit { display: inline-block; white-space: nowrap; }
      #title .ch { display: inline-block; will-change: transform, opacity; }
      #title .l0 { font-family: "Playfair Display", "CJK SC", "CJK TC", serif; font-weight: 900; color: #ece7da; letter-spacing: 0.01em; }
      #title .l1 { font-family: "Playfair Display", "CJK SC", "CJK TC", serif; font-weight: 900; color: #e9b43a; -webkit-text-stroke: 6px #141312; paint-order: stroke fill; letter-spacing: 0.02em; }
      #title.cjk-sc .ln { font-family: "Playfair Display", "CJK SC", serif; }
      #title.cjk-tc .ln { font-family: "Playfair Display", "CJK TC", serif; }
      #preload { position: absolute; left: -9999px; top: 0; opacity: 0; }
      #preload .p7 { font-family: "Playfair Display"; font-weight: 700; }
      #preload .p9 { font-family: "Playfair Display"; font-weight: 900; }
      #preload .o5 { font-family: "Oswald"; font-weight: 500; }
      #preload .o7 { font-family: "Oswald"; font-weight: 700; }
      #preload .m5 { font-family: "IBM Plex Mono"; font-weight: 500; }
      #preload .m7 { font-family: "IBM Plex Mono"; font-weight: 700; }
      #preload .sc { font-family: "CJK SC"; font-weight: 900; }
      #preload .tc { font-family: "CJK TC"; font-weight: 900; }
      #grain { opacity: 0.22; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <canvas id="cv" width="1920" height="1080" data-layout-allow-overflow></canvas>
      <canvas id="fx" width="1920" height="1080" data-layout-allow-overflow data-layout-allow-occlusion></canvas>
      <div class="ov" id="grain"></div>
      <div id="preload"><span class="p7">Aa Бб 0</span><span class="p9">Aa Бб 0</span><span class="o5">Aa Бб 0</span><span class="o7">Aa Бб 0</span><span class="m5">Aa 0</span><span class="m7">Aa 0</span><span class="sc">统计套利</span><span class="tc">統計套利</span></div>
    </div>
    <script>
(function () {
/*__SCRIPT__*/
})();
    </script>
  </body>
</html>
