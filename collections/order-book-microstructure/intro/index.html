    <script>
(function () {
/* ============================================================
   KIT 00 CORE (Bazaar kit): math, seeded random, noise, splines, beat grid, boil clock
   Every frame is a pure function of time t (seconds). No Math.random,
   no Date.now, no performance.now anywhere in the kit.
   ============================================================ */
var BK = window.BK || (window.BK = {});
(function (K) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const ss = (a, b, t) => { const u = inv(a, b, t); return u * u * (3 - 2 * u); };
  const f1 = (n) => Math.round(n * 10) / 10;
  const f2 = (n) => Math.round(n * 100) / 100;

  /* eases (u in 0..1) */
  const E = {
    inOut: (u) => u * u * (3 - 2 * u),
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    back: (u, s) => { s = s == null ? 1.7 : s; const v = u - 1; return 1 + v * v * ((s + 1) * v + s); },
    elastic: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
  };
  /* tween value from a to b during [t0, t1] with an ease */
  const tw = (t, t0, t1, a, b, ease) => lerp(a, b, (ease || E.inOut)(inv(t0, t1, t)));

  /* seeded PRNG (mulberry32) */
  function mulberry(seed) {
    let s = seed | 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let q = Math.imul(s ^ (s >>> 15), 1 | s);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* stateless hash -> [0,1) for (i, seed) */
  function hash(i, s) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const hs = (i, s) => hash(i, s) * 2 - 1; /* signed */
  function vnoise(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s), hash(i + 1, s), u); }
  function fbm(x, s, oct) { let a = 0.5, v = 0, fr = 1, n = 0; for (let k = 0; k < (oct || 3); k++) { v += a * vnoise(x * fr, s + k * 17); n += a; a *= 0.5; fr *= 2.03; } return v / n; }

  /* monotone cubic Hermite spline through [[t, v], ...] (no overshoot) */
  function mkSpline(pts) {
    const n = pts.length, T = pts.map((p) => p[0]), V = pts.map((p) => p[1]);
    if (n === 1) return () => V[0];
    const d = [], m = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) d[i] = (V[i + 1] - V[i]) / (T[i + 1] - T[i]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
    }
    return function (x) {
      x = clamp(x, T[0], T[n - 1]);
      let i = 0; while (i < n - 2 && x >= T[i + 1]) i++;
      const h = T[i + 1] - T[i], u = (x - T[i]) / h, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * V[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * V[i + 1] + (u3 - u2) * h * m[i + 1];
    };
  }
  /* keys: [[t, {a:.., b:..}], ...] -> fn(t) -> {a, b} (one spline per channel) */
  function mkTrack(keys) {
    const names = Object.keys(keys[0][1]), sp = {};
    names.forEach((k) => { sp[k] = mkSpline(keys.map((q) => [q[0], q[1][k]])); });
    return (t) => { const o = {}; names.forEach((k) => (o[k] = sp[k](t))); return o; };
  }

  /* ---------- beat grid (retime to the real song by changing BPM/OFFSET or BARS) ----------
     BARS: optional list of measured downbeat times (seconds). Songs cut from
     several takes drift a few ms per splice, so measured downbeats beat a
     single OFFSET. Past the list, bars extrapolate at BPM. */
  const G = { BPM: 152, OFFSET: 0, BEATS_PER_ACCENT: 4, BARS: null };
  const beatLen = () => 60 / G.BPM;
  const barLen = () => beatLen() * G.BEATS_PER_ACCENT;
  function barStart(b) {
    const B = G.BARS;
    if (!B || !B.length) return G.OFFSET + b * barLen();
    if (b < 0) return B[0] + b * barLen();
    if (b < B.length) return B[b];
    return B[B.length - 1] + (b - B.length + 1) * barLen();
  }
  /* time of bar b (0-based, an "accent" = 4 beats) plus beat k (fractional ok) */
  const at = (bar, beat) => barStart(Math.floor(bar)) + ((bar - Math.floor(bar)) * G.BEATS_PER_ACCENT + (beat || 0)) * beatLen();
  /* index of the bar containing t (-1 before the first downbeat) */
  function barAt(t) {
    if (t < barStart(0)) return -1;
    let b = 0; while (barStart(b + 1) <= t) b++;
    return b;
  }
  /* 1 on the beat, decaying to 0 before the next beat (k = sharpness) */

  /* ---------- line boil clock: drawings change 12 times per second ---------- */
  const BOIL_FPS = 12;
  const boilFrame = (t) => Math.floor(t * BOIL_FPS);

  Object.assign(K, { clamp, lerp, inv, ss, f1, f2, E, tw, mulberry, hash, hs, vnoise, fbm, mkSpline, mkTrack,

})(BK);

      const kind = Math.floor(hash(i, o.seed) * 4), w = 120 + 150 * hash(i + 3, o.seed), h = o.h * (0.45 + 0.6 * hash(i + 5, o.seed));
      if (kind === 0) { /* dome house */
        K.shape(ctx, K.rectPts(x, baseY - h, w, h + 40, 2), { fill: col, w: 4, boil: 1, seed: o.seed + i, stroke: P.ink, gouge: { side: 1, alpha: 0.25, color: dark, gap: 16 } });
        const dome = [[x + w * 0.1, baseY - h + 2]];
        for (let k = 1; k < 10; k++) { const a = Math.PI + (k / 10) * Math.PI; dome.push([x + w / 2 + Math.cos(a) * w * 0.4, baseY - h + Math.sin(a) * w * 0.4 * (1 + 0.25 * Math.sin((k / 10) * Math.PI))]); }
        dome.push([x + w * 0.9, baseY - h + 2]);
        K.shape(ctx, dome, { fill: o.layer ? P.saffron : P.saffronLight, w: 4, boil: 1, seed: o.seed + i + 40, k: 0.9 });
        K.line(ctx, [[x + w / 2, baseY - h - w * 0.5], [x + w / 2, baseY - h - w * 0.62]], { stroke: P.ink, w: 4, boil: 0.6, seed: o.seed + i + 41 });
        K.dot(ctx, x + w / 2, baseY - h - w * 0.64, 6, P.saffron, P.ink, 2.5, o.seed + i + 42);
      } else if (kind === 1) { /* slim tower */
        const tw = w * 0.4;
        K.shape(ctx, K.rectPts(x + w * 0.3, baseY - h * 1.5, tw, h * 1.5 + 40, 3), { fill: col, w: 4, boil: 1, seed: o.seed + i, gouge: { side: 1, alpha: 0.25, color: dark, gap: 14 } });
        K.shape(ctx, [[x + w * 0.25, baseY - h * 1.5], [x + w * 0.5, baseY - h * 1.5 - 70], [x + w * 0.75, baseY - h * 1.5]], { fill: P.terra, w: 4, boil: 1, seed: o.seed + i + 40, k: 0.3 });
      } else { /* flat-roof house with an arched window row */
        K.shape(ctx, K.rectPts(x, baseY - h, w, h + 40, 2), { fill: col, w: 4, boil: 1, seed: o.seed + i, pattern: { kind: "zigzag", color: dark, gap: 26, w: 3, alpha: 0.35 } });
      }
      /* arched windows */
      const nwin = Math.max(1, Math.floor(w / 60));
      for (let k = 0; k < nwin; k++) {
        const wx = x + (w * (k + 0.5)) / nwin, wy = baseY - h * 0.35;
        if (kind === 1) continue;
        K.shape(ctx, K.archPts(wx, wy, 22, 40, 5), { fill: o.layer ? P.tealDark : P.terraDark, w: 3, boil: 0.8, seed: o.seed + i * 7 + k, nicks: 0, reg: false });
      }
      x += w + 10; i++;
    }
  };

  /* ---------------- STRINGS: bunting + lanterns ---------------- */
  const sagPts = (A, B, sag, n) => { const o = []; for (let i = 0; i <= n; i++) { const u = i / n; o.push([lerp(A[0], B[0], u), lerp(A[1], B[1], u) + Math.sin(u * Math.PI) * sag]); } return o; };
  K.bunting = function (ctx, A, B, opt) {
    const o = Object.assign({ n: 10, sag: 60, seed: 11, colors: [P.terra, P.saffron, P.teal, P.paper], size: 46 }, opt || {});
    const rope = sagPts(A, B, o.sag, 24);
    K.line(ctx, rope, { stroke: P.ink, w: 3.5, boil: 1, seed: o.seed });
    for (let i = 0; i < o.n; i++) {
      const u = (i + 0.5) / o.n, x = lerp(A[0], B[0], u), y = lerp(A[1], B[1], u) + Math.sin(u * Math.PI) * o.sag;
      const sw = Math.sin(K.now * 3 + i * 0.9) * 0.12, s = o.size;
      ctx.save(); ctx.translate(x, y); ctx.rotate(sw);
      K.shape(ctx, [[-s * 0.45, 0], [s * 0.45, 0], [0, s]], { fill: o.colors[i % o.colors.length], w: 3, boil: 0.9, seed: o.seed + i, k: 0.1, nicks: 0 });
      ctx.restore();
    }
  };
  K.lantern = function (ctx, x, y, s, opt) {
    const o = Object.assign({ color: P.saffron, glow: 0.6, seed: 21 }, opt || {});
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(K.now * 2.2 + o.seed) * 0.08); ctx.scale(s, s);
    if (o.glow > 0) K.glow(ctx, 0, 34, 90, "rgba(255,210,120,0.9)", o.glow);
    K.line(ctx, [[0, 0], [0, 12]], { stroke: P.ink, w: 3, boil: 0.6, seed: o.seed });
    K.shape(ctx, [[-12, 12], [12, 12], [8, 20], [-8, 20]], { fill: P.brass, w: 3, boil: 0.6, seed: o.seed + 1, k: 0.1 });
    K.shape(ctx, [[-8, 20], [8, 20], [22, 36], [14, 56], [-14, 56], [-22, 36]], { fill: o.color, w: 3.5, boil: 0.9, seed: o.seed + 2, k: 0.6, pattern: { kind: "stripes", color: P.terraDark, gap: 7, alpha: 0.35 } });
    K.shape(ctx, [[-14, 56], [14, 56], [6, 64], [-6, 64]], { fill: P.brass, w: 3, boil: 0.6, seed: o.seed + 3, k: 0.1 });
    K.line(ctx, [[0, 64], [0, 76]], { stroke: P.ink, w: 3, boil: 0.6, seed: o.seed + 4 });
    ctx.restore();
  };
  K.lanternString = function (ctx, A, B, opt) {
    const o = Object.assign({ n: 5, sag: 40, seed: 31, s: 1, glow: 0.5, colors: [P.saffron, P.terra, P.teal] }, opt || {});
    K.line(ctx, sagPts(A, B, o.sag, 20), { stroke: P.ink, w: 3.5, boil: 1, seed: o.seed });
    for (let i = 0; i < o.n; i++) {
      const u = (i + 0.5) / o.n;
      K.lantern(ctx, lerp(A[0], B[0], u), lerp(A[1], B[1], u) + Math.sin(u * Math.PI) * o.sag, o.s, { color: o.colors[i % o.colors.length], glow: o.glow, seed: o.seed + i * 5 });
    }
  };

  /* ---------------- ORDERS: crates ---------------- */
  /* crate (one resting limit order). opt: side ("ask"|"bid") for the painted stamp,
     star (our own order, gold), label (size text), a (appear 0..1), squash */
  K.crate = function (ctx, x, y, s, opt) {
    const o = Object.assign({ side: "bid", star: false, label: "", a: 1, seed: 41, tilt: 0, fill: null }, opt || {});
    const a = o.a <= 0 ? 0 : o.a >= 1 ? 1 : K.E.back(o.a, 2.2); if (a <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt); ctx.scale(s * a, s * a);
    const c = o.fill || (o.star ? P.gold : P.crate);
    K.shape(ctx, K.rectPts(-30, -56, 60, 56, 2), { fill: c, w: 4, boil: 0.9, seed: o.seed, k: 0.15, shade: { color: o.star ? P.goldDark : P.crateDark, dx: 8, dy: -8 } });
    /* planks + cross brace */
    K.line(ctx, [[-27, -38], [27, -38]], { stroke: P.ink, w: 2.5, boil: 0.6, seed: o.seed + 1 });
    K.line(ctx, [[-27, -19], [27, -19]], { stroke: P.ink, w: 2.5, boil: 0.6, seed: o.seed + 2 });
    /* side stamp: a small triangle pointing to the side's direction (up = ask sells high, down = bid) */
    const st = o.side === "ask" ? P.ask : P.bid;
    if (o.star) {
      const pts = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 7 : 16, an = -Math.PI / 2 + (i / 10) * K.TAU; pts.push([Math.cos(an) * r, -28 + Math.sin(an) * r]); }
      K.shape(ctx, pts, { fill: P.paper, w: 3, boil: 0.6, seed: o.seed + 3, k: 0, nicks: 0, reg: false });
    } else K.dot(ctx, 0, -28, 7, st, P.ink, 2.5, o.seed + 3);
    ctx.restore();
    if (o.label) K.text(ctx, o.label, x, y - 74 * s * a, { size: 26 * s, weight: 800, fill: P.ink });
  };

  /* ---------------- STALL: one price level ----------------
     x, y = left edge / floor of the stall; w, h = size. opt:
       side "ask" | "bid", price (string on the hanging plaque), open (awning drop 0..1),
       crates [{a, star, tilt, dx, dy, gone, slot}] drawn left to right on the counter (slot = fractional queue position),
       hot (0..1 lantern glow, e.g. best level), plaque (show sign), seed */
  /* x of crate slot k (0 = front of the queue) in a stall whose left edge is x */
  K.slotX = (x, k, cs) => x + 240 + 66 * (cs || 0.95) * (k + 0.5);
  K.stall = function (ctx, x, y, w, h, opt) {
    const o = Object.assign({ side: "bid", price: "", price2: null, open: 1, crates: [], hot: 0, plaque: true, seed: 51, crateS: 0.95, priceA: 1, flip: 0, ping: 0 }, opt || {});
    const isAsk = o.side === "ask", main = isAsk ? P.ask : P.bid, dark = isAsk ? P.askDark : P.bidDark;
    const sx = x + 200, sw = w - 220; /* stall box right of the plaque column */
    /* back wall: deep arch (shadowed interior) */
    K.shape(ctx, K.rectPts(sx, y - h, sw, h, 4), { fill: P.plaster, w: 4.5, boil: 1, seed: o.seed, k: 0.2, gouge: { side: 1, alpha: 0.18, color: P.plasterShade, gap: 18 } });
    K.shape(ctx, K.archPts(sx + sw / 2, y - 8, sw - 40, h - 40, 11), { fill: isAsk ? P.indigo : P.tealDark, w: 4, boil: 1, seed: o.seed + 1, k: 0.7, specks: 6 });
    if (o.hot > 0) K.glow(ctx, sx + sw * 0.3, y - h * 0.5, h * 1.1, "rgba(255,214,120,0.95)", o.hot * 0.55);
    /* roll-up wooden shutter: closed until the awning drops (open 0 = shut) */
    const shut = 1 - K.E.out3(clamp(o.open * 1.6, 0, 1));
    if (shut > 0.01) {
      const st = y - h + 8, sh = (h - 24) * shut;
      K.shape(ctx, K.rectPts(sx + 14, st, sw - 28, sh, 4), { fill: P.woodLight, w: 4.5, boil: 0.9, seed: o.seed + 11, k: 0.1, gouge: { ang: 0, alpha: 0.35, color: P.woodDark, gap: 13, len: 0.95 } });
      if (sh > 30) K.dot(ctx, sx + sw / 2, st + sh - 14, 8, P.brass, P.ink, 3, o.seed + 12);
    }
    /* counter */
    K.shape(ctx, K.rectPts(sx - 6, y - 16, sw + 12, 22, 4), { fill: P.wood, w: 4, boil: 0.9, seed: o.seed + 2, k: 0.1, shade: { color: P.woodDark, dx: 0, dy: -8 } });
    /* crates queue on the counter, left = front of the queue */
    const cs = o.crateS;
    o.crates.forEach((c, i) => {
      if (c.gone) return;
      K.crate(ctx, K.slotX(x, c.slot != null ? c.slot : i, cs) + (c.dx || 0), y - 16 + (c.dy || 0), cs, { side: o.side, star: c.star, a: c.a == null ? 1 : c.a, seed: o.seed + 100 + i * 3, tilt: c.tilt || 0 });
    });
    /* awning: scalloped, striped, drops down with `open` */
    const op = clamp(o.open, 0, 1); if (op > 0) {
      const ay = y - h + 4, ad = 26 + 34 * K.E.back(op, 1.6), N = Math.max(5, Math.round(sw / 70));
      const pts = [[sx - 18, ay - 14], [sx + sw + 18, ay - 14], [sx + sw + 18, ay + ad * 0.4]];
      for (let i = N; i >= 0; i--) { const xx = sx - 18 + ((sw + 36) * i) / N; pts.push([xx, ay + ad * 0.45]); if (i) pts.push([xx - (sw + 36) / N / 2, ay + ad]); }
      K.shape(ctx, pts, { fill: main, w: 5, boil: 1.1, seed: o.seed + 3, k: 0.35, pattern: { kind: "stripes", color: P.paper, gap: (sw + 36) / N / 2, alpha: 0.9 }, shade: { color: dark, dx: 0, dy: -10 } });
    }
    /* price plaque hanging from the column on the left */
    if (o.plaque && o.price) {
      const px = x + 96, py = y - h / 2 + 4, pa = (o.priceA <= 0 ? 0 : o.priceA >= 1 ? 1 : K.E.back(o.priceA, 2)) * (1 + 0.16 * o.ping);
      if (pa > 0) {
        if (o.ping > 0) K.glow(ctx, px, py - 10, 150, "rgba(255,214,120,0.95)", o.ping * 0.9);
        ctx.save(); ctx.translate(px, py - 46); ctx.rotate(Math.sin(K.now * 1.7 + o.seed) * 0.025); ctx.scale(pa, pa);
        K.line(ctx, [[-50, 0], [0, -26], [50, 0]], { stroke: P.ink, w: 3, boil: 0.7, seed: o.seed + 6 });
        const fl = o.flip > 0 && o.flip < 1 ? Math.abs(Math.cos(o.flip * Math.PI)) : 1; /* flip-card turn when the price ticks */
        ctx.scale(1, Math.max(0.05, fl));
        K.shape(ctx, K.rectPts(-86, 0, 172, 72, 3), { fill: P.paper, w: 4.5, boil: 0.9, seed: o.seed + 7, k: 0.2, shade: { color: P.paperShade, dx: 0, dy: -8 } });
        K.shape(ctx, K.rectPts(-86, 0, 12, 72, 1), { fill: main, stroke: null, w: 0, boil: 0.6, seed: o.seed + 8, reg: false });
        /* flip 0..1: the card turns over; the new price (price2) shows on the back half */
        K.text(ctx, o.price2 != null && o.flip >= 0.5 ? o.price2 : o.price, 6, 39, { size: 40, weight: 800, fill: isAsk ? P.askDark : P.bidDark });
        ctx.restore();
      }
    }
  };

  /* ---------------- TOWER: the whole book from data ----------------
     cx = centre x, alleyY = centre of the alley (spread), opt:
       asks [{p, q, p2}] best first, bids [{p, q, p2}] best first (p2 = price after a flip),
       gap (alley height), lh (level height), w (stall width), open(i, side) -> 0..1,
       crates(i, side, q) -> crate array (default q plain crates),
       hot (best levels glow), facade (draw the plaster tower body),
       priceA / flip / ping (i, side) -> 0..1 for the price plaques
     returns { askY: [floor y per level], bidY: [...], left: x0, top, bottom } */
  K.tower = function (ctx, cx, alleyY, opt) {
    const o = Object.assign({ asks: [], bids: [], gap: 220, lh: 150, w: 1100, open: () => 1, crates: null, hot: 1, facade: true, seed: 300, priceA: () => 1, flip: () => 0, ping: () => 0 }, opt || {});
    const x0 = cx - o.w / 2, nA = o.asks.length, nB = o.bids.length;
    const top = alleyY - o.gap / 2 - nA * o.lh, bottom = alleyY + o.gap / 2 + nB * o.lh;
    if (o.facade) {
      /* tower body: plaster with tile bands, a crenellated top */
      const body = K.rectPts(x0 - 40, top - 60, o.w + 80, bottom - top + 60, 6);
      K.shape(ctx, body, { fill: P.plaster, w: 6, boil: 1.4, seed: o.seed, k: 0.2, gouge: { side: 1, alpha: 0.2, color: P.plasterShade, gap: 22, len: 0.25 }, specks: 30 });
      const cren = [];
      for (let i = 0; i <= 12; i++) { const xx = x0 - 40 + ((o.w + 80) * i) / 12; cren.push([xx, top - 60], [xx, top - (i % 2 ? 60 : 100)]); }
      for (let i = 0; i < 12; i += 2) { const xa = x0 - 40 + ((o.w + 80) * i) / 12, xb = x0 - 40 + ((o.w + 80) * (i + 1)) / 12; K.shape(ctx, [[xa, top - 58], [xa, top - 100], [xb, top - 100], [xb, top - 58]], { fill: P.terra, w: 5, boil: 1.1, seed: o.seed + 70 + i, k: 0.1 }); }
      /* the alley: a dark lane through the tower */
      K.shape(ctx, K.rectPts(x0 - 44, alleyY - o.gap / 2, o.w + 88, o.gap, 6), { fill: P.indigoDark, w: 5, boil: 1.2, seed: o.seed + 2, k: 0.2, pattern: { kind: "diamonds", color: P.indigo, gap: 44, w: 10, alpha: 0.7 } });
    }
    const askY = [], bidY = [];
    /* asks: best (i = 0) sits right above the alley */
    for (let i = 0; i < nA; i++) {
      const fy = alleyY - o.gap / 2 - i * o.lh, L = o.asks[i];
      askY.push(fy);
      const cr = o.crates ? o.crates(i, "ask", L.q) : Array.from({ length: L.q }, () => ({}));
      K.stall(ctx, x0, fy, o.w, o.lh - 6, { side: "ask", price: L.p, price2: L.p2, open: o.open(i, "ask"), crates: cr, hot: i === 0 ? o.hot : 0, seed: o.seed + 10 + i * 13, priceA: o.priceA(i, "ask"), flip: o.flip(i, "ask"), ping: o.ping(i, "ask") });
    }
    for (let i = 0; i < nB; i++) {
      const fy = alleyY + o.gap / 2 + (i + 1) * o.lh, L = o.bids[i];
      bidY.push(fy);
      const cr = o.crates ? o.crates(i, "bid", L.q) : Array.from({ length: L.q }, () => ({}));
      K.stall(ctx, x0, fy, o.w, o.lh - 6, { side: "bid", price: L.p, price2: L.p2, open: o.open(i, "bid"), crates: cr, hot: i === 0 ? o.hot : 0, seed: o.seed + 200 + i * 13, priceA: o.priceA(i, "bid"), flip: o.flip(i, "bid"), ping: o.ping(i, "bid") });
    }
    return { askY, bidY, left: x0, right: x0 + o.w, top, bottom, alleyY, gap: o.gap };
  };

  /* ---------------- COINS, SPARKLES ---------------- */
  /* bazaar coin with a square hole and a punched rim */
  K.coin = function (ctx, x, y, r, opt) {
    const o = Object.assign({ color: P.gold, label: "", labelColor: P.ink, seed: 61, size: null, hole: true, spin: 0 }, opt || {});
    const sx = Math.max(0.08, Math.abs(Math.cos(o.spin)));
    ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
    K.shape(ctx, K.ellipsePts(0, 0, r, r, 16), { fill: o.color, w: Math.max(3, r * 0.09), boil: r * 0.02 + 0.5, seed: o.seed, k: 1, shade: { color: P.goldDark, dx: r * 0.12, dy: r * 0.12 } });
    K.shape(ctx, K.ellipsePts(0, 0, r * 0.74, r * 0.74, 14), { fill: null, w: Math.max(2.2, r * 0.05), boil: 0.6, seed: o.seed + 1, k: 1, nicks: 0 });
    if (o.label) K.text(ctx, o.label, 0, 2, { size: o.size || r * 0.6, weight: 800, fill: o.labelColor });
    else if (o.hole) K.shape(ctx, K.rectPts(-r * 0.2, -r * 0.2, r * 0.4, r * 0.4, 1), { fill: P.ink, stroke: P.ink, w: 2, boil: 0.4, seed: o.seed + 2, k: 0, reg: false });
    ctx.restore();
  };
  K.sparkle = function (ctx, x, y, r, a, seed) {
    if (a <= 0 || r <= 0) return;
    ctx.save(); ctx.globalAlpha *= clamp(a, 0, 1); ctx.translate(x, y); ctx.rotate(hash(seed || 1, 9) * 0.6);
    K.shape(ctx, [[0, -r], [r * 0.22, -r * 0.22], [r, 0], [r * 0.22, r * 0.22], [0, r], [-r * 0.22, r * 0.22], [-r, 0], [-r * 0.22, -r * 0.22]], { fill: P.goldGlow, w: 2.5, boil: 0.6, seed: (seed || 1) + 80, k: 0, nicks: 0, reg: false });
    ctx.restore();
  };

  /* ---------------- MARKET ORDER: a hand cart that crosses the spread ----------------
     side "buy" (green up arrow, takes asks) | "sell" (red down arrow, takes bids); dir -1 faces left */
  K.cart = function (ctx, x, y, s, opt) {
    const o = Object.assign({ color: P.saffron, dir: 1, seed: 81, label: "", roll: 0, side: "buy" }, opt || {});
    ctx.save(); ctx.translate(x, y); ctx.scale(s * o.dir, s);
    const bump = Math.abs(Math.sin(o.roll * 2)) * 4;
    ctx.translate(0, -bump);
    K.line(ctx, [[-110, -70], [-170, -110]], { stroke: P.woodDark, w: 9, boil: 0.8, seed: o.seed });
    K.shape(ctx, [[-110, -110], [110, -110], [96, -36], [-96, -36]], { fill: o.color, w: 5, boil: 1, seed: o.seed + 1, k: 0.1, pattern: { kind: "zigzag", color: P.terra, gap: 26, w: 5, alpha: 0.8 }, shade: { color: P.saffronDark, dx: 0, dy: -10 } });
    /* flag with a big arrow (direction of the aggressive order) */
    K.line(ctx, [[70, -110], [70, -230]], { stroke: P.ink, w: 5, boil: 0.8, seed: o.seed + 2 });
    const fw = Math.sin(K.now * 8) * 6;
    K.shape(ctx, [[70, -230], [160, -222 + fw], [150, -190 + fw], [70, -182]], { fill: P.paper, w: 4, boil: 0.9, seed: o.seed + 3, k: 0.3 });
    const up = o.side !== "sell", ay = (v) => (up ? v : -412 - v + fw * 1.2); /* sell = arrow mirrored to point down */
    K.shape(ctx, [[96, ay(-192)], [122, ay(-220 + fw * 0.6)], [140, ay(-194 + fw * 0.6)], [128, ay(-194)], [128, ay(-186)], [108, ay(-186)], [108, ay(-192)]].map((p) => [p[0], p[1]]), { fill: up ? P.up : P.down, w: 3, boil: 0.6, seed: o.seed + 4, k: 0, nicks: 0 });
    /* wheels */
    [-60, 60].forEach((wx, i) => {
      K.shape(ctx, K.ellipsePts(wx, -24, 30, 30, 14), { fill: P.wood, w: 5, boil: 0.9, seed: o.seed + 5 + i, k: 1 });
      for (let k = 0; k < 4; k++) { const a = o.roll + (k / 4) * Math.PI; K.line(ctx, [[wx - Math.cos(a) * 26, -24 - Math.sin(a) * 26], [wx + Math.cos(a) * 26, -24 + Math.sin(a) * 26]], { stroke: P.ink, w: 3, boil: 0.5, seed: o.seed + 10 + k }); }
      K.dot(ctx, wx, -24, 6, P.brass, P.ink, 2.5, o.seed + 20 + i);
    });
    if (o.label) K.text(ctx, o.label, 0, -76, { size: 34, weight: 800, fill: P.ink });
    ctx.restore();
  };

  /* ---------------- RUG (kilim): curtain, title banner, table cloth ----------------
     x, y = top-left; w, h; roll = 0 flat .. 1 fully rolled up to the top edge;
     motifs (diamond grid), field = px kept plain at the top (a title sits there) */
  K.rug = function (ctx, x, y, w, h, opt) {
    const o = Object.assign({ roll: 0, seed: 91, base: P.terra, band: P.saffron, motif: P.teal, fringe: true, motifs: true, field: 0 }, opt || {});
    const hh = h * (1 - clamp(o.roll, 0, 1));
    if (hh > 2) {
      const sway = Math.sin(K.now * 1.3) * 4;
      const body = [[x, y], [x + w, y], [x + w + sway, y + hh], [x + sway, y + hh]];
      K.shape(ctx, body, { fill: o.base, w: 6, boil: 1.4, seed: o.seed, k: 0.1, specks: 40 });

/* resting size per level right now (for the depth hills: they follow the crates) */
function levelSize(side, i, t) {
  return CRATES[side][i].reduce((s, c) => s + (t >= c.arrive && !(c.remove != null && t >= c.remove) ? K.clamp((t - c.arrive) / 0.4, 0, 1) : 0), 0);
}
const cum = (arr) => arr.reduce((o, v) => (o.push((o.length ? o[o.length - 1] : 0) + v), o), []);

/* the market-order carts */
const cartX = (t) => K.lerp(-1320, 1260, K.inv(T.cart[0], T.cart[1], t));            /* buy: left to right */
const cart2X = (t) => K.lerp(1380, -1500, K.E.inOut(K.inv(T.cart2[0], T.cart2[1], t)) * 0.3 + K.inv(T.cart2[0], T.cart2[1], t) * 0.7); /* sell: right to left */

/* night palette for the background (sky, city, ground); the lantern-lit tower keeps its day colours */
const NIGHT = { skyTop: "#262b5a", skyMid: "#4f437c", skyLow: "#c8664e", sun: "#f3e3c3", saffronDark: "#3a3466", cityFar: "#5e4a6c", cityMid: "#1b4650", saffronLight: "#8c6a8a", saffron: "#b98a5a", terraLight: "#9a5a48", terraDark: "#5a2a2a", tealDark: "#0f3a3a" };
const mixHex = (a, b, u) => { const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16), ch = (s) => Math.round(((pa >> s) & 255) * (1 - u) + ((pb >> s) & 255) * u); return "#" + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1); };
function withNight(t, fn) {
  const d = duskAt(t); if (d <= 0) return fn();
  const saved = {}; Object.keys(NIGHT).forEach((k) => { saved[k] = P[k]; P[k] = mixHex(P[k], NIGHT[k], d); });
  try { fn(); } finally { Object.assign(P, saved); }
}
function drawBackground(t) { withNight(t, () => drawBackgroundDay(t)); }
function drawBackgroundDay(t) {
  K.screen(ctx);
  K.sky(ctx, -20, -20, 1940, 1100, { sunX: 1220 - (K.cam.x + 360) * 0.06, sunY: 250 - (K.cam.y) * 0.05 + 260 * duskAt(t), sunR: 78 });
  K.applyCam(ctx, 0.3);
  K.city(ctx, -2600, 2600, 520, { layer: 0, seed: 4, h: 260 });
  K.applyCam(ctx, 0.5);
  K.city(ctx, -2800, 2800, 700, { layer: 1, seed: 9, h: 190 });
  /* stars at night */
  const d = duskAt(t);
  if (d > 0) { K.screen(ctx); for (let i = 0; i < 40; i++) K.sparkle(ctx, 1920 * K.hash(i, 71), 420 * K.hash(i, 73), 7 + 6 * K.hash(i, 75) + 3 * Math.sin(t * 3 + i), d * (0.6 + 0.4 * K.hash(i, 77)), i); }
}

function drawGround(t) { withNight(t, () => drawGroundDay()); }
function drawGroundDay() {
  K.shape(ctx, K.rectPts(-4200, 860, 8400, 2400, 6), { fill: P.terraLight, w: 6, boil: 1.2, seed: 5, k: 0.1, pattern: { kind: "diamonds", color: P.terra, gap: 90, w: 16, alpha: 0.45 }, specks: 40 });
}

/* "Bids on the left and the asks up high": the book's depth as terraced hills behind the tower */
function drawHills(t) {
  if (t < T.hills[0]) return;
  const nA = askCount(t), bids = cum(BIDS.map((L, i) => levelSize("bid", i, t))), asks = cum(ASKS.slice(0, nA).map((L, i) => levelSize("ask", i, t)));
  const pulse = 1 + 0.04 * (K.pulse(t, 4, 5) * (t > T.flow2 ? 1 : 0));
  K.depthHills(ctx, 0, 862, 4300, 900 * pulse, bids, asks, { a: 1, growBid: K.E.out3(K.inv(T.hills[0], T.hills[0] + 0.9, t)), growAsk: K.E.out3(K.inv(T.hills[1], T.hills[1] + 0.9, t)), max: 46, mid: TW / 2 + 70, seed: 13 });
}

/* tower + everything attached to it, in world space */
function drawTower(t) {
  const gap = gapAt(t), nA = askCount(t), topY = askFloor(nA - 1, t) - LH;
  /* bunting from the battlements out to the city */
  K.bunting(ctx, [-TW / 2 - 30, topY - 70], [-2100, topY + 310], { n: 12, sag: 90, seed: 11, size: 60 });
  K.bunting(ctx, [TW / 2 + 30, topY - 70], [2100, topY + 310], { n: 12, sag: 90, seed: 23, size: 60 });
  const pingAt = (tk0) => (i, side) => { const idx = side === "bid" ? 4 - i : 5 + i, tk = tk0 + idx * 0.068; return Math.max(0, 1 - Math.abs(t - tk) / 0.2); };
  const pings = [pingAt(T.ticks), pingAt(T.fireworks), pingAt(T.fireworks + 2 * BEAT), pingAt(T.ticks3)];
  K.tower(ctx, 0, YB0 - gap / 2, {
    asks: ASKS.slice(0, nA).map((L) => ({ p: L.p0, p2: L.p1, q: L.n2 })), bids: BIDS.map((L) => ({ p: L.p0, p2: L.p1, q: L.n2 })),
    gap, lh: LH, w: TW, seed: 300, hot: 0.35 + 0.35 * K.inv(T.tight, T.tight + 0.4, t) + 0.3 * duskAt(t),
    open: (i, side) => (side === "ask" && i > 4 ? 1 : K.inv(stallOpenAt(side, i), stallOpenAt(side, i) + 0.4, t)),
    priceA: (i, side) => (side === "ask" && i > 4 ? 1 : K.inv(stallOpenAt(side, i) + 0.1, stallOpenAt(side, i) + 0.45, t)),
    flip: (i, side) => (side === "ask" && i < 5 ? K.inv(T.slam + 0.05 + i * BEAT / 4, T.slam + 0.35 + i * BEAT / 4, t) : 0),
    ping: (i, side) => Math.max(...pings.map((f) => f(i, side))),
    crates: (i, side) => crateState(side, i, t),
  });
  /* the flag on top: "reaching to the sky" */
  const fl = K.inv(T.sky[2], T.sky[2] + 0.45, t);
  if (fl > 0) {
    const h = 260 * K.E.back(fl, 1.8), fx = 0, fy = topY - 100, wv = Math.sin(t * 6) * 10;
    K.line(ctx, [[fx, fy], [fx, fy - h]], { stroke: P.ink, w: 9, boil: 0.8, seed: 520 });
    if (fl > 0.5) K.shape(ctx, [[fx, fy - h], [fx + 190, fy - h + 20 + wv], [fx + 170, fy - h + 70 + wv], [fx, fy - h + 100]], { fill: P.teal, w: 5, boil: 1, seed: 521, k: 0.4, pattern: { kind: "zigzag", color: P.saffron, gap: 24, w: 5 } });
    K.dot(ctx, fx, fy - h, 12, P.brass, P.ink, 3, 522);
  }
  /* lanterns across the alley: sag at night, pulled tight on "tight" (with a twang) */
  const top = YB0 - gap, d = duskAt(t);
  const pull = K.ss(T.rope - 0.2, T.rope + 0.05, t), tw = t > T.rope ? 14 * Math.exp(-5 * (t - T.rope)) * Math.sin((t - T.rope) * 30) : 0;
  const sag = 10 + 34 * d * (1 - pull) + tw;
  K.lanternString(ctx, [-TW / 2 - 20, top + 4], [TW / 2 + 20, top + 4], { n: 6, sag, s: 0.5, glow: 0.4 + 0.5 * d, seed: 31 });
  /* spread tag hanging in the alley */
  const tagA = K.inv(T.stalls + 2.0, T.stalls + 2.35, t);
  if (t < T.tight) {
    const sq = t > T.slam - 0.1 ? 1 - 0.35 * Math.sin(K.inv(T.slam - 0.1, T.tight, t) * Math.PI) : 1;
    ctx.save(); ctx.translate(330, YB0 - gap / 2); ctx.scale(1 / sq, sq);
    K.tag(ctx, 0, 0, "0.05", { a: tagA * (1 - K.inv(T.tight - 0.08, T.tight, t)), size: 34, seed: 3 });
    ctx.restore();
  } else {
    const bump = [T.rope, T.hey3 + 2 * BEAT].reduce((m, tb) => Math.max(m, t > tb ? Math.exp(-6 * (t - tb)) : 0), 0);
    ctx.save(); ctx.translate(330, YB0 - gap / 2); ctx.scale(1 + 0.3 * bump, 1 + 0.3 * bump);
    K.tag(ctx, 0, 0, "0.01", { a: K.inv(T.tight, T.tight + 0.35, t), size: 34, seed: 4, fill: P.goldGlow });
    ctx.restore();
  }
  /* dust puffs: the slam, and each sky level landing */
  const puff = (t0, y, spread) => {
    const dd = t - t0; if (dd < 0 || dd > 0.6) return;
    for (let i = 0; i < 8; i++) {
      const sd = i % 2 ? 1 : -1, r = 18 + 70 * dd + 14 * K.hash(i, 3), x = sd * (TW / 2 + 30 + spread * dd * (1 + K.hash(i, 5))), yy = y + (K.hash(i, 7) - 0.5) * 80;
      ctx.save(); ctx.globalAlpha = 1 - dd / 0.6; K.shape(ctx, K.blobPts(x, yy, r, r * 0.8, 9, i, 0.25), { fill: P.paper, w: 4, boil: 1.2, seed: 700 + i, k: 0.9 }); ctx.restore();
    }
  };
  puff(T.slam, YB0 - gap / 2, 120);
  ASKS.forEach((L, i) => { if (L.sky != null) puff(levelLand(i), askFloor(i, t), 160); });
}

/* a level falling from the sky onto the tower ("stacked like a tower") */
function drawFallingLevels(t) {
  ASKS.forEach((L, i) => {
    if (L.sky == null) return;
    const tl = levelLand(i), u = K.inv(tl - 0.55, tl, t);
    if (u <= 0 || u >= 1) return;
    const dy = -(1 - K.E.in3(u)) * 1500, fy = askFloor(i, t) + dy;
    K.shape(ctx, K.rectPts(-TW / 2 - 40, fy - LH, TW + 80, LH, 4), { fill: P.plaster, w: 6, boil: 1.2, seed: 530 + i, k: 0.2 });
    K.stall(ctx, towerX0, fy, TW, LH - 6, { side: "ask", price: L.p1, crates: crateState("ask", i, t), seed: 300 + 10 + i * 13 });
    for (let k = 0; k < 3; k++) K.line(ctx, [[-300 + k * 300, fy - LH - 40], [-300 + k * 300, fy - LH - 200]], { stroke: P.paper, w: 6, boil: 1, seed: 540 + k + i * 3 });
  });
}

/* wooden balcony at the alley mouth (Tikki's stand), rides the bid half */
function drawBalcony() {

  [x0 + 330, x1 - 10].forEach((bx, i) => K.shape(ctx, [[bx - 110, y + 20], [bx, y + 20], [bx, y + 120]], { fill: P.woodDark, w: 4.5, boil: 0.9, seed: 640 + i, k: 0, gouge: { alpha: 0.3, gap: 10, color: P.ink } }));
  K.shape(ctx, K.rectPts(x0, y - 4, x1 - x0, 30, 4), { fill: P.wood, w: 5, boil: 1, seed: 642, k: 0.1, shade: { color: P.woodDark, dx: 0, dy: -10 } });

}

/* crates in the air: carried off by a cart, or filled and flying up */
function drawFlying(t) {
  [["ask", 0], ["bid", 0]].forEach(([side, i]) => {
    const arr = CRATES[side][i], floor = side === "ask" ? askFloor(i, t) : bidFloor(i);
    arr.forEach((c) => {
      if (c.remove == null) return;
      const d = t - c.remove; if (d < 0 || d > 0.7) return;
      const sx = K.slotX(towerX0, slotOf(arr, c.k, c.remove), 0.95), sy = floor - 16;
      if (c.kind === "cart" || c.kind === "cart2") {
        if (d > 0.36) return;
        const cx = c.kind === "cart" ? cartX(c.remove + 0.36) : cart2X(c.remove + 0.36);
        const u = K.inv(0, 0.36, d), tx = cx + (c.k % 2 ? 12 : -30), ty = YB0 - 60;
        const x = K.lerp(sx, tx, u), y = K.lerp(sy, ty, u) - 120 * Math.sin(u * Math.PI);
        K.crate(ctx, x, y, 0.95 * (1 - 0.45 * u), { side, star: c.star, seed: 900 + c.k, tilt: u * 5 });
      } else {
        const u = K.inv(0, 0.7, d), x = sx + 520 * u, y = sy - 300 * K.E.out3(u);
        ctx.save(); ctx.globalAlpha = 1 - K.inv(0.3, 0.55, d);
        K.crate(ctx, x, y, 0.95, { side, seed: 910 + c.k, tilt: u * 3 });
        ctx.restore();
        K.coin(ctx, sx + 40 * u, sy - 80 - 200 * u, 22, { spin: d * 14, seed: 920 + c.k });
        for (let k = 0; k < 4; k++) K.sparkle(ctx, sx + Math.cos(k * 1.6) * 90 * u, sy - 40 + Math.sin(k * 1.6) * 90 * u, 20 * (1 - u), 1 - u, k);
      }
    });
  });
}

function drawCarts(t) {
  const one = (x, side, dir, taken, starIn) => {
    for (let i = 0; i < 3; i++) K.line(ctx, [[x - dir * (150 + i * 26), YB0 - 40 - i * 20], [x - dir * (330 + i * 40), YB0 - 40 - i * 20]], { stroke: P.paper, w: 5, boil: 1, seed: 960 + i });
    K.cart(ctx, x, YB0 + 2, 0.6, { roll: x / 18, seed: side === "buy" ? 81 : 85, side, dir, color: side === "buy" ? P.saffron : P.tealLight });
    for (let k = 0; k < taken; k++) K.crate(ctx, x - 30 + k * 42, YB0 - 58 - k * 8, 0.7, { side: side === "buy" ? "ask" : "bid", star: starIn && k === 0, seed: 970 + k, tilt: 0.1 * (k ? 1 : -1) });
  };
  if (t > T.cart[0] && t < T.cart[1]) one(cartX(t), "buy", 1, CRATES.ask[0].filter((c) => c.kind === "cart" && t > c.remove + 0.36).length, false);
  if (t > T.cart2[0] && t < T.cart2[1]) one(cart2X(t), "sell", -1, CRATES.bid[0].filter((c) => c.kind === "cart2" && t > c.remove + 0.36).length, true);
}

/* tags over crates: queue position of ours (#4 -> #1), then price-time arrival numbers */
function drawQueueTags(t) {
  if (t > T.queueCam - 0.3 && t < Math.min(T.tease[1], T.fireworks + 0.3)) {
    const arr = CRATES.bid[0], c = arr[STAR.k], left = arr.filter((q) => q.kind === "fill" && t >= q.remove + 0.3).length;
    const x = K.slotX(towerX0, slotOf(arr, c.k, t), 0.95), y = bidFloor(0) - 16 - 104;
    const bump = T.fills.reduce((m, tf) => Math.max(m, t > tf + 0.3 ? Math.exp(-8 * (t - tf - 0.3)) : 0), 0);
    ctx.save(); ctx.translate(x, y); ctx.scale(1 + 0.18 * bump, 1 + 0.18 * bump);
    K.tag(ctx, 0, 0, "#" + (STAR.k + 1 - left), { a: K.inv(T.queueCam - 0.3, T.queueCam, t) * (1 - K.inv(Math.min(T.tease[1], T.fireworks + 0.3) - 0.25, Math.min(T.tease[1], T.fireworks + 0.3), t)), size: 30, seed: 6, fill: left >= 3 ? P.goldGlow : P.paper, string: 30 });
    ctx.restore();
  }
  if (t > T.prio - 0.1 && t < T.cart2[0]) {
    const arr = CRATES[PRIO.side][PRIO.level], y = askFloor(PRIO.level, t) - 16 - 100;
    arr.forEach((c, k) => {
      const t0 = k < ASKS[PRIO.level].n1 ? T.prio + k * BEAT / 2 : T.newbie + 0.5;
      const a = K.inv(t0, t0 + 0.3, t) * (1 - K.inv(T.cart2[0] - 0.3, T.cart2[0], t));
      if (a <= 0 || t < c.arrive) return;
      K.tag(ctx, K.slotX(towerX0, slotOf(arr, k, t), 0.95), y, String(k + 1), { a, size: 22, seed: 40 + k, fill: k === arr.length - 1 && t > T.newbie ? P.goldGlow : P.paper, string: 26 });
    });
  }
}

/* flow arrow across the street ("from left to right"): chorus 1 and the final chorus */
function drawFlowArrow(t) {
  const a = Math.max(K.inv(T.arrow, T.arrow + 0.5, t) * (1 - K.inv(T.cart[0] - 0.2, T.cart[0] + 0.2, t)),
    K.inv(T.flow3 + 2 * BEAT, T.flow3 + 2 * BEAT + 0.5, t) * (1 - K.inv(T.ticks3 - 0.2, T.ticks3 + 0.1, t)),
    K.inv(T.flow2 + 2 * BEAT, T.flow2 + 2 * BEAT + 0.5, t) * (1 - K.inv(T.tickChart[0] - 0.2, T.tickChart[0] + 0.1, t)));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = Math.min(1, a * 2);
  K.arrow(ctx, [-1150, 930], [1150, 930], { p: a, w: 64, bend: -30, color: P.teal, seed: 980 });
  ctx.restore();
}

/* jagged speech bursts near Tikki's head */
function drawShouts(t) {
  const hx = -1040, hy = -330;
  [[T.hey, T.clap], [T.hey2, T.hey2 + 3 * BEAT], [T.hey3, T.hey3 + 3 * BEAT]].forEach(([a, b], i) => {
    const h = K.inv(a - 0.02, a + 0.3, t) * (1 - K.inv(b - 0.2, b, t));
    if (h > 0) K.shout(ctx, hx, hy, 230, 190, { a: h, text: "!", size: 120, tail: [0.9, 0.8], seed: 990 + i, color: P.paper });
  });
  const h2 = K.inv(T.shout, T.shout + 0.28, t) * (1 - K.inv(T.ticks + 0.4, T.ticks + 0.6, t));
  if (h2 > 0) K.shout(ctx, hx - 20, hy - 40, 380, 210, { a: h2, text: IMB, arrow: 1, size: 66, tail: [0.9, 0.8], seed: 995 });
}

/* coin fountain from the alley ("Order Book and Market Microstructure!" in chorus 2) */
function drawFireworks(t) {
  const d = t - T.fireworks; if (d < 0 || d > 3.2) return;
  for (let i = 0; i < 36; i++) {
    const t0 = (i % 18) * BEAT / 6 + (i < 18 ? 0 : 1.6), u = (d - t0) / 1.3; if (u < 0 || u > 1) continue;
    const ang = -Math.PI / 2 + (K.hash(i, 3) - 0.5) * 2.2, v = 1400 + 500 * K.hash(i, 5);
    const x = 330 * (K.hash(i, 9) - 0.5) + Math.cos(ang) * v * u, y = YB0 - 40 + Math.sin(ang) * v * u + 1500 * u * u;
    K.coin(ctx, x, y, 52, { spin: t * 10 + i, seed: 930 + i });
    if (u < 0.3) K.sparkle(ctx, x, y, 70 * (1 - u / 0.3), 1 - u / 0.3, i);
  }
}

/* the coin from our filled order flies to Tikki's paw */
function drawOurCoin(t) {
  const d = t - T.take2[0]; if (d < 0 || t > T.cart2[1] + 1.2) return;
  const sx = K.slotX(towerX0, 0, 0.95), sy = bidFloor(0) - 60, u = K.inv(0, T.coin - T.take2[0] + 0.1, d);
  const paw = tikkiPaw(t);
  const x = u < 1 ? K.lerp(sx, paw[0], u) : paw[0], y = u < 1 ? K.lerp(sy, paw[1], u) - 260 * Math.sin(u * Math.PI) : paw[1] - 30;
  K.coin(ctx, x, y, 34, { spin: u < 1 ? d * 16 : 0, seed: 950 });
  if (u >= 1) for (let k = 0; k < 4; k++) { const ph = (t * 1.6 + k / 4) % 1; K.sparkle(ctx, x + Math.cos(k * 1.7) * 60 * ph, y + Math.sin(k * 1.7) * 60 * ph, 22 * Math.sin(ph * Math.PI), 1, k); }
}

/* explainer boards: the tick chart (chorus 2) and the three boards of the break */
const TICKS = [101.25, 101.26, 101.26, 101.25, 101.26, 101.27, 101.26, 101.27, 101.28, 101.27, 101.27, 101.28, 101.29, 101.28, 101.29, 101.30];
const CANDLES = [{ o: 101.25, h: 101.27, l: 101.24, c: 101.27 }, { o: 101.27, h: 101.28, l: 101.25, c: 101.26 }, { o: 101.26, h: 101.29, l: 101.26, c: 101.29 }, { o: 101.29, h: 101.30, l: 101.27, c: 101.28 },

const CODE = ["import ccxt.pro as ccxtpro", "ex = ccxtpro.binance()", "while True:", "    ob = await ex.watch_order_book('BTC/USDT')", "    bid, ask = ob['bids'][0], ob['asks'][0]", "    spread = ask[0] - bid[0]"];
function drawBoards(t) {
  const hang = (t0, t1) => { const a = win(t, t0, t1, 0.4, 0.3); return { a, dy: -700 * (1 - K.E.out3(K.inv(t0, t0 + 0.45, t))) }; };

  h = hang(T.ofi[0], T.ofi[1]);
  if (h.a > 0) K.tileBoard(ctx, -160, -400 + h.dy, 760, 230, ["OFI = Δbid − Δask", { t: "(5 − 2) / (5 + 2) = " + IMB, c: P.terraDark }], { a: Math.min(1, h.a * 3), size: 46, write: K.inv(T.ofi[0] + 0.35, T.ofi[0] + 0.35 + 5.5 * BEAT, t), seed: 31 });
  h = hang(T.candles[0], T.candles[1]);
  if (h.a > 0) K.scrollChart(ctx, -120, -360 + h.dy, 760, 480, [{ kind: "candle", data: CANDLES }], { a: Math.min(1, h.a * 3), draw: K.inv(T.candles[0] + 0.3, T.candles[0] + 0.3 + 8 * BEAT * 0.9, t), seed: 45, yMin: 101.23, yMax: 101.35 });

  if (h.a > 0) K.codeScroll(ctx, -60, -330 + h.dy, 1000, CODE, { a: Math.min(1, h.a * 3), size: 30, typed: K.inv(T.code[0] + 0.35, T.code[0] + 0.35 + 6.5 * BEAT, t), seed: 61 });
}

/* ============================================================
   INTRO 30 TIKKI: where the raccoon is and what it does, as a pure function of t.
   Gestures are small functions with their own anchor times, so each chorus can
   reuse them (shout, clap, pinch, point along the flow, hop over a cart ...).
   The acts are listed in tikki(t) in film order; later acts win.
   ============================================================ */
const RAC = { x: -790, y: YB0, s: 1.2 };
const PIV = [-900, -1700], ROPE = 1600, OMEGA = 1.4, TH0 = -0.82;
const ropeTheta = (t) => {
  const tau = t - T.swing;
  if (t < T.release) return TH0 * Math.cos(OMEGA * tau);
  const thR = TH0 * Math.cos(OMEGA * (T.release - T.swing));
  return K.lerp(thR, -1.15, K.ss(T.release, T.release + 1.0, t)); /* the empty rope is pulled back off screen */
};
const ropeEnd = (th) => [PIV[0] + Math.sin(th) * ROPE, PIV[1] + Math.cos(th) * ROPE];
const HAND_LOCAL = [34, -206]; /* hand target while hanging (arm straight up), raccoon space */
const HAND_UP = [HAND_LOCAL[0] * RAC.s, HAND_LOCAL[1] * RAC.s]; /* the same in world units */

function drawRope(t) {
  if (t < T.swing || t > T.release + 1.0) return;
  const e = ropeEnd(ropeTheta(t)), pts = [];
  for (let i = 0; i <= 10; i++) { const u = i / 10; pts.push([K.lerp(PIV[0], e[0], u) + Math.sin(u * Math.PI) * 12 * Math.sin(t * 5), K.lerp(PIV[1], e[1], u)]); }
  K.line(ctx, pts, { stroke: P.ink, w: 9, boil: 1, seed: 600 });
  K.line(ctx, pts, { stroke: P.saffronDark, w: 4, boil: 1, seed: 601 });
}

/* abacus rows: best-level sizes, then the queue count, later the imbalance */
function beadsAt(t) {
  const flick = (t0) => K.ss(t0, t0 + 0.12, t);
  if (t < T.depth) return [0.2 + 0.2 * flick(T.beads), 0.6 - 0.2 * flick(T.beads + BEAT / 2), 0.4 + 0.4 * flick(T.beads + BEAT), 0.8];
  if (t < T.prio) { const left = CRATES.bid[0].filter((q) => q.kind === "fill" && t >= q.remove + 0.2).length; return [(STAR.k + 1 - left) / 5, 0.4, 0.8, 0.2]; }
  const k = Math.max(0, Math.floor((t - T.prio) / (BEAT / 2)));
  if (t < T.cart2[0]) return [Math.min(5, k) / 5, Math.min(7, k) > 5 ? (k - 5) / 5 : 0, 0.6, 0.2];
  if (t < T.candles[0]) return [1, 0.4, 0.4 + 0.2 * Math.sin(t * 3) * 0, 0.6];
  const j = Math.floor((t - T.candles[0]) / BEAT) % 6;
  return [j / 5, (5 - j) / 5, 0.6, 0.4];
}

/* ---------- gestures (each edits the pose st in place; t0.. anchors) ---------- */
function gInhale(st, t, tH) {
  const inh = K.ss(tH - 0.42, tH - 0.05, t) * (1 - K.ss(tH - 0.05, tH + 0.02, t));
  if (inh > 0) { st.squash = -0.22 * inh; st.handL = { x: -100, y: -100 - 20 * inh, pose: "fist" }; st.handR = { x: 100, y: -110 - 30 * inh, pose: "open" }; st.mouth = "o"; st.brow = 0.4 * inh; st.ear = 0.8 * inh; st.look = [0.4, -0.4]; }
}
function gShout(st, t, tH, tEnd) {
  const hey = K.inv(tH - 0.03, tH + 0.08, t) * (1 - K.ss(tEnd - 0.25, tEnd - 0.05, t));
  if (hey <= 0) return;
  const hh = Math.sin(K.inv(tH, tH + 0.4, t) * Math.PI);
  st.mouth = "shout"; st.brow = 1.3; st.hop = 26 * hh; st.squash = 0.18 * (1 - hey) - 0.2 * hh; st.ear = 1; st.blink = 0;
  st.handL = { x: -120, y: -250, pose: "fist" }; st.handR = { x: 130, y: -260, pose: "open" }; st.look = [0.8, -0.3];
  st.tassel = 30 * Math.sin((t - tH) * 14) * Math.exp(-3 * (t - tH));
}
function gClap(st, t, tC, tS, tEnd) {
  const cl = K.ss(tC - 0.2, tS - 0.02, t) * (1 - K.ss(tEnd - 0.15, tEnd + 0.05, t));
  if (cl <= 0) return;
  const meet = K.ss(tS - 0.15, tS - 0.02, t);
  st.handL = { x: K.lerp(-130, -14, meet), y: K.lerp(-230, -118, meet), pose: "open", rot: K.lerp(-60, 0, meet) };
  st.handR = { x: K.lerp(130, 14, meet), y: K.lerp(-230, -118, meet), pose: "open", rot: K.lerp(240, 180, meet) };
  st.hold = null; st.mouth = meet > 0.5 ? "grin" : "open"; st.blink = meet > 0.9 && t < tS + 0.15 ? 1 : 0;
  st.squash = t > tS ? 0.2 * Math.exp(-6 * (t - tS)) : 0;
  st.headTilt = 6 * Math.sin((t - tC) * 8) * Math.exp(-2 * Math.max(0, t - tS));
}
function gPinch(st, t, t0, t1) {
  const ti = K.ss(t0 - 0.15, t0 + 0.05, t) * (1 - K.ss(t1 - 0.25, t1, t));
  if (ti <= 0) return;
  st.handR = { x: K.lerp(84, 96, ti), y: K.lerp(-84, -232, ti), pose: "pinch", rot: -100 };
  st.mouth = "smirk"; st.brow = -0.5 * ti; st.look = [0.9, -0.5]; st.lean = -4 * ti; st.blink = Math.max(st.blink, t > t0 + 0.5 && t < t0 + 0.7 ? 0.7 : 0);
}
function gPointFlow(st, t, t0, t1, b) {
  const fl = K.ss(t0 - 0.1, t0 + 0.2, t) * (1 - K.ss(t1 - 0.2, t1, t));
  if (fl <= 0) return;
  const sw = K.inv(t0, t1 - 0.2, t);
  st.handR = { x: 140, y: K.lerp(-220, -120, sw) + 10 * b, pose: "point", rot: K.lerp(-40, 10, sw) };
  st.look = [K.lerp(-0.4, 1, sw), 0.1]; st.mouth = "grin"; st.lean = 3;
}
/* a cart zooms past along the alley floor: crouch, hop over it, land */
function gHop(st, t, tc, dirRight) {
  if (t < tc - 0.2 || t > tc + 0.9) return;
  const crouch = K.ss(tc - 0.2, tc - 0.04, t) * (1 - K.ss(tc - 0.04, tc, t));
  const j = K.inv(tc, tc + 0.44, t), hh = Math.sin(j * Math.PI);
  st.squash = 0.3 * crouch - 0.3 * hh * (j < 1 ? 1 : 0); st.hop = 110 * hh;
  st.mouth = "o"; st.brow = 1.2; st.blink = 0; st.handL = { x: -120, y: -170 - 40 * hh, pose: "fist" }; st.handR = { x: 120, y: -200 - 40 * hh, pose: "open" };
  st.look = [dirRight ? 1 : -1, 0.6]; st.tassel = 40 * hh;
  const ld = K.inv(tc + 0.44, tc + 0.7, t); if (ld > 0 && ld < 1) st.squash += 0.3 * Math.sin(ld * Math.PI);
}
function gNodTicks(st, t, t0, t1) {
  if (t < t0 - 0.1 || t > t1) return;
  const u = K.inv(t0, t0 + 0.7, t); st.look = [0.9, K.lerp(0.8, -1, u)]; st.headTilt = 4 * Math.sin(t * 26); st.mouth = "o";
}
/* bouncy dance on the beat: hops, alternating arms, legs kicking */
function gDance(st, t, t0, t1, amp) {
  const w = K.ss(t0 - 0.1, t0 + 0.1, t) * (1 - K.ss(t1 - 0.2, t1, t));
  if (w <= 0) return;
  const b = pulseB(t), ph = Math.floor((t - t0) / BEAT) % 2 ? 1 : -1, sw = Math.sin(((t - t0) / BEAT) * Math.PI);
  st.hop = (amp || 34) * b * w; st.squash = 0.16 * (1 - b) * w - 0.08 * b;
  st.handL = { x: -110 - 20 * sw, y: -170 - 70 * Math.max(0, ph) * b, pose: "open" };
  st.handR = { x: 120 + 20 * sw, y: -170 - 70 * Math.max(0, -ph) * b, pose: "open" };
  st.legWalk = (t - t0) * 9; st.lean = 7 * sw * w; st.tassel = -22 * sw; st.tail = sw; st.mouth = "grin"; st.look = [sw * 0.6, -0.3];
}
/* point at something (world point) with the right paw */
function gPointAt(st, t, t0, t1, wx, wy, look) {
  const w = K.ss(t0 - 0.1, t0 + 0.2, t) * (1 - K.ss(t1 - 0.2, t1, t));
  if (w <= 0) return;
  const lx = (wx - RAC.x) / RAC.s, ly = (wy - RAC.y) / RAC.s, a = Math.atan2(ly + 134, lx - 48), r = 76;
  st.handR = { x: K.lerp(st.handR.x, 48 + Math.cos(a) * r, w), y: K.lerp(st.handR.y, -134 + Math.sin(a) * r, w), pose: "point", rot: (a * 180) / Math.PI };
  st.look = look || [Math.cos(a), Math.sin(a)]; st.lean = 3 * w;
}

/* returns { mode: "hang" | "stand", ... , st } */
function tikki(t) {
  const st = { seed: 700, blink: K.blinkAt(t, 5), mouth: "smile", look: [0.3, 0], hold: "abacus", beads: beadsAt(t) };
  const b = pulseB(t);
  st.squash = 0.07 * b - 0.02;
  st.handL = { x: -92, y: -96 + 6 * b, pose: "fist" };
  st.handR = { x: 84, y: -84 - 8 * b, pose: "open" };
  /* --- swinging in --- */
  if (t < T.release) {
    const th = ropeTheta(t), vel = -TH0 * OMEGA * Math.sin(OMEGA * (t - T.swing));
    Object.assign(st, { handR: { x: HAND_LOCAL[0], y: HAND_LOCAL[1], pose: "fist" }, handL: { x: -110, y: -150 + 20 * Math.sin(t * 9), pose: "fist" }, mouth: "grin", look: [1, -0.2], legWalk: t * 16, tassel: -vel * 40, tail: Math.sin(t * 8) * 0.9, squash: -0.12, blink: 0, ear: 0.6 });
    return { mode: "hang", hand: ropeEnd(th), rot: th * 0.9, st };
  }
  /* --- flight from the rope to the balcony --- */
  if (t < T.land) {
    const u = K.inv(T.release, T.land, t), e = ropeEnd(ropeTheta(T.release));
    const th = TH0 * Math.cos(OMEGA * (T.release - T.swing)), c = Math.cos(th * 0.9), s = Math.sin(th * 0.9);
    const fx = e[0] - (HAND_UP[0] * c - HAND_UP[1] * s), fy = e[1] - (HAND_UP[0] * s + HAND_UP[1] * c);
    const x = K.lerp(fx, RAC.x, u), y = K.lerp(fy, RAC.y, u) - 90 * Math.sin(u * Math.PI);
    Object.assign(st, { handR: { x: 96, y: -230, pose: "open" }, handL: { x: -110, y: -200, pose: "fist" }, mouth: "open", squash: -0.25 * (1 - u), tassel: 30 * (1 - u), look: [0, 0.6], blink: 0, ear: 1 });
    return { mode: "stand", x, y, s: RAC.s, lean: th * 50 * (1 - u), st };
  }
  /* --- intro, on the balcony --- */
  const land = K.inv(T.land, T.land + 0.35, t);
  if (land < 1) { st.squash += 0.42 * Math.sin(land * Math.PI) * (1 - land * 0.5); st.tassel = -24 * Math.sin(land * Math.PI * 2) * (1 - land); }
  const f = K.ss(T.fez - 0.2, T.fez, t) * (1 - K.ss(T.fez + 0.35, T.fez + 0.6, t));
  if (f > 0) { st.handR = { x: K.lerp(84, 44, f), y: K.lerp(-84, -268, f), pose: "pinch" }; st.fezTip = -18 * f; st.fezLift = 12 * f; st.mouth = "smirk"; st.brow = -0.4 * f; }
  if (t > T.beads - 0.15 && t < T.inhale) {
    const k = Math.max(0, Math.floor((t - T.beads + 0.15) / (BEAT / 2))), ph = ((t - T.beads + 0.15) % (BEAT / 2)) / (BEAT / 2);
    st.handR = { x: -40 + 30 * Math.sin(ph * Math.PI) + k * 6, y: -110 - 30 * Math.sin(ph * Math.PI), pose: "point" };
    st.look = [-0.6, 0.5];
  }
  /* --- chorus 1 --- */
  gInhale(st, t, T.hey);
  gShout(st, t, T.hey, T.clap);
  gClap(st, t, T.clap, T.slam, T.tight);
  gPinch(st, t, T.tight, T.depth);
  gPointFlow(st, t, T.depth, T.cart[0], b);
  gHop(st, t, T.cart[0] + 0.06, true);
  if (t > T.take[0] - 0.1 && t < T.shout) { st.exclaim = K.inv(T.take[0] - 0.1, T.take[0] + 0.1, t); st.eyeUp = 14; st.look = [1, -0.2]; st.blink = 0; }
  const sh = K.ss(T.shout - 0.05, T.shout + 0.08, t) * (1 - K.ss(T.ticks + 0.2, T.ticks + 0.5, t));
  if (sh > 0) { st.mouth = "shout"; st.brow = 1.2; st.blink = 0; st.handR = { x: 150, y: -270, pose: "point", rot: -70 }; st.handL = { x: -110, y: -120, pose: "fist" }; st.squash = -0.12 * sh + 0.1 * b; st.tassel = 22 * Math.sin((t - T.shout) * 12); st.look = [0.8, -0.4]; }
  gNodTicks(st, t, T.ticks, T.queueCam);
  if (t > T.queueCam && t < T.tease[0]) {
    const near = T.fills.reduce((m, tf) => Math.max(m, Math.exp(-10 * Math.abs(t - tf))), 0);
    st.handR = { x: -30 + 20 * near, y: -112 - 26 * near, pose: "point" }; st.look = [0.8, 0.6]; st.mouth = "smile";
    if (t > T.fills[2] + 0.2) { st.mouth = "grin"; st.handR = { x: 120, y: -240, pose: "fist", rot: -90 }; st.brow = 0.8; st.look = [0.7, 0.2]; st.hop = 14 * b; }
  }
  gDance(st, t, T.tease[0], T.tease[3], 26);
  /* --- verse --- */
  /* "Bids on the left": points left at the green hills; "asks up high": up-right at the red ones */
  gPointAt(st, t, T.hills[0], T.hills[1], -2200, 500, [-1, 0.2]);
  if (t > T.hills[0] && t < T.hills[1]) st.handL = { x: -150, y: -150, pose: "open" };
  gPointAt(st, t, T.hills[1], T.sky[0] - 0.3, 1800, -900, [1, -1]);
  /* "Stacked like a tower reaching to the sky": looks up, flinches on each landing, cheers at the flag */
  if (t > T.sky[0] - 0.4 && t < T.prio) {
    st.look = [0.7, -1]; st.mouth = "o"; st.brow = 0.8;
    const thump = [T.sky[0], T.sky[1]].reduce((m, tl) => Math.max(m, t > tl ? Math.exp(-7 * (t - tl)) : 0), 0);
    st.squash += 0.25 * thump; st.ear = thump; st.blink = thump > 0.6 ? 1 : 0;
    if (t > T.sky[2]) { st.mouth = "grin"; st.handR = { x: 130, y: -280, pose: "open" }; st.handL = { x: -130, y: -270, pose: "fist" }; st.hop = 20 * b; }
  }
  /* "Limit orders wait in a price-time queue": counts the crates on the beats with the abacus */
  if (t > T.prio - 0.1 && t < T.cart2[0]) {
    const ph = ((t - T.prio) % (BEAT / 2)) / (BEAT / 2);
    st.handR = { x: -40 + 30 * Math.sin(ph * Math.PI), y: -110 - 30 * Math.sin(ph * Math.PI), pose: "point" }; st.look = [0.9, -0.6]; st.mouth = "smile";
    if (t > T.newbie && t < T.newbie + 0.9) { st.exclaim = K.inv(T.newbie, T.newbie + 0.15, t); st.look = [1, -0.7]; st.mouth = "o"; }
  }
  /* "Market orders come and they cross right through!": the sell cart, hop, our fill pays a coin */
  const cross = (() => { for (let x = 0; x < 200; x++) { const tt = T.cart2[0] + x * 0.01; if (cart2X(tt) < RAC.x + 120) return tt; } return T.cart2[1]; })();
  if (t > T.cart2[0] && t < cross - 0.2) { st.look = [1, 0.5]; st.mouth = "o"; st.brow = 0.8; }
  if (t > T.take2[0] - 0.05 && t < T.coin) { st.exclaim = K.inv(T.take2[0] - 0.05, T.take2[0] + 0.1, t); st.look = [1, 0.3]; st.eyeUp = 12; st.blink = 0; }
  gHop(st, t, cross - 0.1, false);
  if (t > T.coin && t < T.dusk[1] + 0.2) { const c = K.ss(T.coin - 0.05, T.coin + 0.1, t); st.handR = { x: 110, y: -250 - 10 * b, pose: "fist" }; st.mouth = "grin"; st.brow = 0.9; st.look = [0.7, -0.8]; st.hop = Math.max(st.hop || 0, 16 * b * c); }
  /* --- chorus 2 (dusk) --- */
  gInhale(st, t, T.hey2);
  gShout(st, t, T.hey2, T.hey2 + 3 * BEAT);
  /* "tight": grabs the lantern rope at the alley mouth and pulls it taut */
  const rp = K.ss(T.rope - 0.6, T.rope - 0.3, t) * (1 - K.ss(T.flow2 - 0.3, T.flow2, t));
  if (rp > 0) {
    const pull = K.ss(T.rope - 0.2, T.rope + 0.05, t);
    st.handR = { x: K.lerp(190, 150, pull), y: -150 + 6 * pull, pose: "fist" }; st.handL = { x: K.lerp(140, 100, pull), y: -150, pose: "fist" }; st.hold = null;
    st.lean = -10 * pull; st.mouth = pull > 0.5 ? "grin" : "o"; st.brow = -0.3; st.look = [1, 0];
  }
  gPointFlow(st, t, T.flow2, T.tickChart[0], b);
  gPointAt(st, t, T.tickChart[0], T.fireworks, 380, -380, [1, -0.6]);
  gDance(st, t, T.fireworks, T.dance[0], 46);
  /* --- break (night) --- */
  gDance(st, t, T.dance[0], T.dance[1], 40);
  if (t > T.ofi[0] - 0.1 && t < T.ofi[1]) { st.handR = { x: 70, y: -236, pose: "pinch", rot: -110 }; st.look = [0.8, -0.6]; st.brow = -0.3; st.mouth = "smirk"; st.headTilt = 3 * Math.sin(t * 2); }
  gPointAt(st, t, T.ofi[0] + 4 * BEAT, T.ofi[1], -400, -360, [1, -0.6]);
  if (t > T.ofi[0] + 4 * BEAT && t < T.ofi[1]) st.mouth = "grin";
  gPointAt(st, t, T.candles[0], T.candles[1], -300 + 80 * Math.floor(K.clamp((t - T.candles[0]) / BEAT, 0, 7)), -400, [1, -0.5]);
  if (t > T.code[0] - 0.1 && t < T.code[1] - 0.3) { st.look = [1, -0.5]; st.handR = { x: 66, y: -232, pose: "pinch", rot: -110 }; st.mouth = "o"; if (t > T.code[0] + 6 * BEAT) { st.handR = { x: 130, y: -250, pose: "fist", rot: -90 }; st.mouth = "grin"; } }
  /* --- final chorus (dawn) --- */
  gInhale(st, t, T.hey3);
  gShout(st, t, T.hey3, T.hey3 + 2 * BEAT - 0.05);
  gClap(st, t, T.hey3 + 2 * BEAT - 0.2, T.hey3 + 2 * BEAT + 0.15, T.hey3 + 4 * BEAT);
  gPinch(st, t, T.hey3 + 4 * BEAT, T.flow3);
  gPointFlow(st, t, T.flow3, T.ticks3 - 0.1, b);
  gNodTicks(st, t, T.ticks3, T.drop[1]);
  return { mode: "stand", x: RAC.x, y: RAC.y, s: RAC.s, lean: st.lean || 0, st };
}

/* world position of Tikki's right paw (approximate: target, hop and scale) */
function tikkiPaw(t) {
  const r = tikki(t), h = r.st.handR;
  return [RAC.x + h.x * RAC.s, RAC.y + (h.y - (r.st.hop || 0)) * RAC.s];
}

function drawTikki(t) {
  if (t < T.swing) return;
  const r = tikki(t);
  if (r.mode === "hang") {
    ctx.save(); ctx.translate(r.hand[0], r.hand[1]); ctx.rotate(r.rot);
    K.raccoon(ctx, -HAND_UP[0], -HAND_UP[1], RAC.s, r.st);
    ctx.restore();
  } else {
    r.st.lean = r.lean;
    K.raccoon(ctx, r.x, r.y, r.s, r.st);
  }
}

/* ============================================================
   INTRO 40 TITLE: the kilim curtain becomes the title banner; DOM title
   letters are block-stamped in; five episode medallions; Tikki in front.
   The title text lives in the DOM (crisp type, variable per language).
   ============================================================ */
const BAN = { cx: 960, top: 0, w: 1980, h: 1110, stop: 0.62 }; /* full curtain, rolls up to 38 % */
const MEDAL_Y = 660, MEDAL_R = 62, MEDAL_X0 = 860, MEDAL_DX = 205;

/* five episode icons, language-free: websocket stream, candles, imbalance, queue, spread */
const ICONS = [
  (c, r) => { [-1, 1].forEach((sd, i) => K.shape(c, sd > 0 ? [[-r * 0.5, -r * 0.2], [r * 0.2, -r * 0.2], [r * 0.2, -r * 0.38], [r * 0.52, -r * 0.12], [r * 0.2, r * 0.14], [r * 0.2, -r * 0.02], [-r * 0.5, -r * 0.02]] : [[r * 0.5, r * 0.06], [-r * 0.2, r * 0.06], [-r * 0.2, -r * 0.12], [-r * 0.52, r * 0.14], [-r * 0.2, r * 0.4], [-r * 0.2, r * 0.24], [r * 0.5, r * 0.24]], { fill: P.paper, w: 3, boil: 0.5, seed: 1 + i, k: 0, nicks: 0, reg: false })); },
  (c, r) => { [[-0.25, -0.35, 0.3, P.up], [0.25, -0.1, 0.36, P.down]].forEach(([x, y, h, col], i) => { K.line(c, [[x * r, (y - 0.15) * r], [x * r, (y + h + 0.2) * r]], { stroke: P.ink, w: 3, boil: 0.4, seed: 5 + i }); K.shape(c, K.rectPts((x - 0.13) * r, y * r, 0.26 * r, h * r, 1), { fill: col, w: 3, boil: 0.4, seed: 7 + i, k: 0, nicks: 0, reg: false }); }); },
  (c, r) => { K.line(c, [[-r * 0.5, r * 0.1], [r * 0.5, -r * 0.15]], { stroke: P.ink, w: 4, boil: 0.4, seed: 10 }); K.line(c, [[0, -r * 0.05], [0, r * 0.45]], { stroke: P.ink, w: 4, boil: 0.4, seed: 11 }); K.dot(c, -r * 0.5, r * 0.18, r * 0.16, P.up, P.ink, 2.5, 12); K.dot(c, r * 0.5, -r * 0.08, r * 0.1, P.down, P.ink, 2.5, 13); },
  (c, r) => { for (let i = 0; i < 3; i++) K.shape(c, K.rectPts(-r * 0.55 + i * r * 0.38, -r * 0.14, r * 0.3, r * 0.3, 1), { fill: i === 1 ? P.gold : P.crate, w: 2.5, boil: 0.4, seed: 20 + i, k: 0, nicks: 0, reg: false }); },
  (c, r) => { K.shape(c, K.rectPts(-r * 0.5, -r * 0.5, r, r * 0.3, 1), { fill: P.ask, w: 2.5, boil: 0.4, seed: 30, k: 0, nicks: 0, reg: false }); K.shape(c, K.rectPts(-r * 0.5, r * 0.2, r, r * 0.3, 1), { fill: P.bid, w: 2.5, boil: 0.4, seed: 31, k: 0, nicks: 0, reg: false }); K.line(c, [[0, -r * 0.16], [0, r * 0.16]], { stroke: P.paper, w: 3, boil: 0.3, seed: 32 }); },
];
const MEDAL_COLORS = [P.teal, P.saffron, P.terra, P.indigo, P.tealDark];

/* banner unroll. Chorus 1 (tease): it drops over the world to the banner height,
   stays for the sung title, then rolls back up. Ending: down over everything,
   then up into the title card. */
function bannerDrop(t) {
  if (t < T.drop[0] - 0.5) {
    const up = K.E.out3(K.inv(T.tease[0], T.tease[1], t)) * (1 - K.E.in3(K.inv(T.tease[2], T.tease[3], t)));
    return up * (1 - BAN.stop);
  }
  if (t < T.drop[0]) return 0;
  if (t < T.rise[0]) return K.E.in3(K.inv(T.drop[0], T.drop[1], t)) * 0.999 + 0.001;
  return K.lerp(1, 1 - BAN.stop, K.E.out3(K.inv(T.rise[0], T.rise[1], t)));
}

/* Tikki on the title card (screen space, bottom left) */
function tikkiTitle(t) {
  const b = pulseB(t), st = { seed: 700, blink: K.blinkAt(t, 9), mouth: "grin", look: [0.6, -0.5], hold: "abacus", beads: [1, 0.2, 0.6, 0.4], squash: 0.08 * b - 0.03 };
  st.handL = { x: -100, y: -120 - 14 * b, pose: "fist" };
  st.handR = { x: 120, y: -230 - 20 * b, pose: "open" };
  /* opening cheer on the title hit */
  const ch = K.inv(T.title, T.title + 0.4, t);
  if (ch < 1) { st.mouth = "shout"; st.hop = 30 * Math.sin(ch * Math.PI); st.handR = { x: 130, y: -270, pose: "open" }; st.handL = { x: -130, y: -250, pose: "fist" }; st.brow = 1.2; }
  /* jump: crouch, stretch up, land squash */
  const j0 = T.jump - 0.3, j1 = T.jump + 0.5;
  if (t > j0 && t < j1 + 0.4) {
    const crouch = K.ss(j0, T.jump, t) * (1 - K.ss(T.jump, T.jump + 0.05, t));
    const air = K.inv(T.jump, j1, t), h = Math.sin(air * Math.PI);
    st.squash += 0.35 * crouch - 0.35 * h * (air < 1 ? 1 : 0); st.hop = 30 * h; /* stays below the banner roll */
    const land = K.inv(j1, j1 + 0.35, t); if (land > 0 && land < 1) st.squash += 0.4 * Math.sin(land * Math.PI) * (1 - land);
    st.handL = { x: -120, y: -240 - 40 * h, pose: "fist" }; st.handR = { x: 130, y: -260 - 40 * h, pose: "open" };
    st.mouth = "open"; st.fezLift = 14 * h; st.tassel = 60 * h; st.look = [0, -1]; st.tail = 1.2 * h;
  }
  /* bow: tips the fez on the last downbeat */
  const bw = K.ss(T.bow - 0.2, T.bow + 0.1, t);
  if (bw > 0) { st.handR = { x: K.lerp(120, 44, bw), y: K.lerp(-230, -268, bw), pose: "pinch" }; st.fezTip = -22 * bw; st.fezLift = 18 * bw; st.headTilt = 8 * bw; st.mouth = "grin"; st.blink = bw > 0.6 ? 0.9 : st.blink; st.lean = -6 * bw; }
  return st;
}

function drawTitleCanvas(t) {
  K.screen(ctx);
  /* medallions pop on eighth notes from the bar after the title */
  for (let i = 0; i < 5; i++) {
    const t0 = T.medals + i * BEAT / 2, a = K.inv(t0, t0 + 0.35, t);
    if (a <= 0) continue;
    const s = K.E.back(a, 2.6), x = MEDAL_X0 + i * MEDAL_DX, y = MEDAL_Y + 6 * Math.sin(t * 2.4 + i) - 10 * K.pulse(t - i * 0.08, 1, 6);
    const sw = 0.08 * Math.sin(t * 2.2 + i * 1.3), top = BAN.h * (1 - BAN.stop) + 40;
    K.line(ctx, [[x, top], [x + Math.sin(sw) * (y - top), y - MEDAL_R]], { stroke: P.ink, w: 3.5, boil: 0.6, seed: 610 + i });
    ctx.save(); ctx.translate(x + Math.sin(sw) * (y - top), y); ctx.rotate(-sw); ctx.scale(s, s);
    K.coin(ctx, 0, 0, MEDAL_R, { color: MEDAL_COLORS[i], seed: 600 + i * 7, hole: false });
    ICONS[i](ctx, MEDAL_R);
    ctx.restore();
  }
  K.raccoon(ctx, 470, 1072, 1.5, tikkiTitle(t));
}

/* the title is stamped twice: on chorus 1 (tease) and on the final chorus */
function layoutTitleDom(t) {
  const d = bannerDrop(t), fin = t >= T.title - 0.05, tease = t >= T.tease[1] - 0.05 && t < T.tease[3];
  const t0 = fin ? T.title : T.tease[1], t1 = fin ? T.line2 : T.tease[1] + 2 * BEAT;
  titleEl.style.opacity = fin ? "1" : tease ? (1 - K.inv(T.tease[2], T.tease[2] + 0.25, t)).toFixed(2) : "0";
  if (!fin && !tease) return;
  const bh = BAN.h * d, n = TITLE_LN.length, sizes = TITLE_LN.map((x) => +x.dataset.size), gap = 14;
  const total = sizes.reduce((a, b) => a + b, 0) + gap * (n - 1);
  let y = n > 1 ? Math.max(90, (bh + 30) / 2 - total / 2) : Math.max(186, (bh + 30) / 2 - total / 2 + 24); /* below the band (and the logo), above the roll */
  TITLE_LN.forEach((x, i) => { x.style.top = y.toFixed(1) + "px"; y += sizes[i] + gap; });
  /* block-stamp: each letter drops from 1.7x, slams down with a squash, staggered */
  TITLE_CH.forEach((c) => {
    const base = c.line === 0 ? t0 : t1, tc = base + c.li * 0.03;
    const a = K.inv(tc, tc + 0.16, t), land = K.inv(tc + 0.16, tc + 0.4, t);
    const sc = a < 1 ? K.lerp(1.7, 1, K.E.in3(a)) : 1 + 0.1 * Math.sin(land * Math.PI) * (1 - land);
    const sq = a >= 1 ? Math.sin(land * Math.PI) * 0.14 * (1 - land) : 0;
    const hop = c.line === n - 1 ? -5 * K.pulse(t, 4, 6) * K.inv(t1 + 1, t1 + 1.2, t) : 0;
    c.el.style.opacity = a > 0 ? Math.min(1, a * 2.5).toFixed(2) : "0";
    c.el.style.transform = `translateY(${hop.toFixed(1)}px) scale(${(sc * (1 + sq)).toFixed(3)}, ${(sc * (1 - sq)).toFixed(3)}) rotate(${(K.hs(c.idx, 3) * 3 * (1 - land)).toFixed(2)}deg)`;
  });
}

/* ============================================================
   INTRO 70 RENDER: render(t) is the whole film. One paused GSAP timeline
   drives a proxy whose setter calls render(t).
   intro      0 - 6.4   curtain rolls up, shutters open, Tikki swings in, lands, fez, abacus
   chorus     6.4 - 16  "Hey!" shout, clap slams the book (0.05 -> 0.01), depth flow, buy cart
              + imbalance shout, ticks, our queue #4 -> #1
              16 - 19.2 "Order Book and Market Microstructure!": plaque ripple + coin fountain
   break      19.2 - 21.6 Tikki dances
   ending     21.6 - 26.4 curtain drops and rolls up into the title card ("Order Book..." 22.34),
              medallions, jump, fez tip
   ============================================================ */
const CAM = K.mkTrack([
  [0.0, { x: 0, y: -40, z: 0.5 }],
  [T.swing, { x: -80, y: -40, z: 0.55 }],
  [T.land, { x: -380, y: -90, z: 0.92 }],
  [T.hey, { x: -370, y: -80, z: 0.96 }],
  [T.tight, { x: -340, y: -60, z: 1.0 }],
  [T.depth, { x: -330, y: -50, z: 0.98 }],
  [T.depth + 0.8, { x: -150, y: 90, z: 0.6 }],
  [T.cart[0] - 0.1, { x: -150, y: 80, z: 0.62 }],
  [T.cart[0] + 0.5, { x: -260, y: -40, z: 0.82 }],
  [T.ticks, { x: -240, y: -30, z: 0.84 }],
  [T.queueCam, { x: -230, y: -10, z: 0.88 }],
  [T.queueCam + 0.4, { x: -170, y: 150, z: 1.22 }],
  [T.fireworks - 0.1, { x: -170, y: 150, z: 1.25 }],
  [T.fireworks + 0.6, { x: -60, y: -150, z: 0.5 }],
  [T.dance[0] - 0.1, { x: -60, y: -150, z: 0.52 }],
  [T.dance[0] + 0.5, { x: -700, y: -100, z: 1.3 }],
  [T.drop[1], { x: -690, y: -100, z: 1.34 }],
]);
/* accents: punch-in on each "Hey!", a shake on the slam and on each level landing from the sky */
function camAt(t) {
  const c = CAM(t);
  const punch = [T.hey, T.hey2, T.hey3].reduce((m, th) => Math.max(m, t > th ? Math.exp(-5 * (t - th)) * K.inv(th, th + 0.06, t) : 0), 0);
  c.z *= 1 + 0.09 * punch;
  [[T.slam, 14], [T.sky[0], 10], [T.sky[1], 10]].forEach(([t0, amp]) => {
    const sd = t - t0;
    if (sd > 0 && sd < 0.45) { const a = amp * (1 - sd / 0.45); c.x += a * Math.sin(sd * 70); c.y += a * Math.cos(sd * 53); }
  });
  c.rot = 0;
  return c;
}
const TITLE_CAM = { x: -520, y: 40, z: 0.44, rot: 0 };

/* ts = story time (what happens), t = clock (boil, sway). The title set shows the
   finished bazaar (story frozen after the queue scene) while the ink keeps boiling. */
function drawWorld(ts, cam, t, titleSet) {
  K.begin(ctx, t, cam);
  drawBackground(ts);
  K.applyCam(ctx, 1);
  drawGround(ts);
  drawHills(ts);
  drawTower(ts);
  drawFallingLevels(ts);
  drawBalcony();
  if (titleSet) return;
  drawFlowArrow(ts);
  drawFireworks(ts);
  drawBoards(ts);
  drawRope(ts);
  drawCarts(ts);
  drawTikki(ts);
  drawFlying(ts);
  drawOurCoin(ts);
  drawQueueTags(ts);
  drawShouts(ts);
}

function render(t) {
  try {
    titleEl.style.opacity = "0";
    const titleSet = t >= T.rise[0];
    if (!titleSet) drawWorld(t, camAt(t), t, false);
    else {
      /* title set: the bazaar seen wide behind the banner, Tikki in front */
      drawWorld(T.drop[1], TITLE_CAM, t, true);
      /* faded-print wash: the bazaar steps back so the title, medallions and Tikki read */
      K.screen(ctx); ctx.fillStyle = "rgba(243, 227, 195, 0.5)"; ctx.fillRect(0, 0, 1920, 1080);
      drawTitleCanvas(t);
    }
    /* opening curtain (screen space) */
    if (t < T.curtain[1] + 0.05) {
      K.screen(ctx);
      K.rug(ctx, -30, -40, 1980, 1160, { roll: K.E.inOut(K.inv(T.curtain[0], T.curtain[1], t)), seed: 91, base: P.terra, band: P.saffron, motif: P.teal });
    }
    /* title banner: the tease in chorus 1, then the closing curtain -> title card */
    if (bannerDrop(t) > 0) {
      K.screen(ctx);
      K.kilimBanner(ctx, BAN.cx, BAN.top, BAN.w, BAN.h, bannerDrop(t), { seed: 71, field: 400 });
    }
    layoutTitleDom(t);
  } catch (err) {
    K.screen(ctx); ctx.fillStyle = "#300"; ctx.fillRect(0, 0, 1920, 80); ctx.fillStyle = "#fff"; ctx.font = "28px monospace"; ctx.fillText(String(err && err.stack || err).slice(0, 140), 20, 50);
  }
  /* logo: one small hop on the first bar after the curtain lifts, otherwise static */
  const lh = K.inv(T.curtain[1], T.curtain[1] + 0.4, t);
  logoEl.style.transform = lh > 0 && lh < 1 ? `translateY(${(-16 * Math.sin(lh * Math.PI)).toFixed(1)}px)` : "none";
  const f = K.boilFrame(t);
  grainEl.style.backgroundPosition = ((f % 7) * 37) + "px " + ((f % 5) * 53) + "px";
}

const grainEl = document.getElementById("grain");
const logoEl = document.getElementById("logo");
grainEl.style.backgroundImage = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .25  0 0 0 1.5 -.25'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>\")";

const TL = gsap.timeline({ paused: true });
const drv = { _t: 0 };
Object.defineProperty(drv, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
TL.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
render(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(drv._t));
window.__timelines["main"] = TL;
window.__render = render;

})();
    </script>
