<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bazaar kit gallery</title>
    <script src="assets/gsap.min.js"></script>
    <style>
/*__FONTS__*/
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f3e3c3; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f3e3c3; }
      #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .ov { position: absolute; inset: 0; pointer-events: none; }
      #preload { position: absolute; left: -9999px; top: 0; opacity: 0; }
      #preload .y4 { font-family: "Yeseva One"; font-weight: 400; }
      #preload .f6 { font-family: "Fira Sans Condensed"; font-weight: 600; }
      #preload .f8 { font-family: "Fira Sans Condensed"; font-weight: 800; }
      #preload .m4 { font-family: "PT Mono"; font-weight: 400; }
      #vig { background: radial-gradient(95% 85% at 50% 48%, rgba(0, 0, 0, 0) 60%, rgba(31, 23, 32, 0.4) 100%); }
      #grain { opacity: 0.16; mix-blend-mode: multiply; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <canvas id="cv" width="1920" height="1080" data-layout-allow-overflow></canvas>
      <div class="ov" id="vig"></div>
      <div class="ov" id="grain"></div>
      <div id="preload"><span class="y4">Aa Бб 0</span><span class="f6">Aa Бб 0</span><span class="f8">Aa Бб 0</span><span class="m4">Aa 0</span></div>
    </div>
    <script>
(function () {
/*__SCRIPT__*/
})();
    </script>
  </body>
</html>
