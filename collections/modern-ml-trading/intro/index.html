    <script>
(function () {
/* ============================================================
   LAB KIT 00 CORE: math, seeded random, noise, splines, beat grid, boil clock
   Every frame is a pure function of time t (seconds). No Math.random,
   no Date.now, no performance.now anywhere in the kit.
   ============================================================ */
var LK = window.LK || (window.LK = {});
(function (K) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const ss = (a, b, t) => { const u = inv(a, b, t); return u * u * (3 - 2 * u); };
  const f1 = (n) => Math.round(n * 10) / 10;
  const f2 = (n) => Math.round(n * 100) / 100;

  /* eases (u in 0..1) */
  const E = {
    inOut: (u) => u * u * (3 - 2 * u),
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    back: (u, s) => { s = s == null ? 1.7 : s; const v = u - 1; return 1 + v * v * ((s + 1) * v + s); },
    elastic: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
  };
  /* tween value from a to b during [t0, t1] with an ease */
  const tw = (t, t0, t1, a, b, ease) => lerp(a, b, (ease || E.inOut)(inv(t0, t1, t)));

  /* seeded PRNG (mulberry32) */
  function mulberry(seed) {
    let s = seed | 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let q = Math.imul(s ^ (s >>> 15), 1 | s);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* stateless hash -> [0,1) for (i, seed) */
  function hash(i, s) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const hs = (i, s) => hash(i, s) * 2 - 1; /* signed */
  function vnoise(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s), hash(i + 1, s), u); }
  function fbm(x, s, oct) { let a = 0.5, v = 0, fr = 1, n = 0; for (let k = 0; k < (oct || 3); k++) { v += a * vnoise(x * fr, s + k * 17); n += a; a *= 0.5; fr *= 2.03; } return v / n; }

  /* monotone cubic Hermite spline through [[t, v], ...] (no overshoot) */
  function mkSpline(pts) {
    const n = pts.length, T = pts.map((p) => p[0]), V = pts.map((p) => p[1]);
    if (n === 1) return () => V[0];
    const d = [], m = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) d[i] = (V[i + 1] - V[i]) / (T[i + 1] - T[i]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
    }
    return function (x) {
      x = clamp(x, T[0], T[n - 1]);
      let i = 0; while (i < n - 2 && x >= T[i + 1]) i++;
      const h = T[i + 1] - T[i], u = (x - T[i]) / h, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * V[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * V[i + 1] + (u3 - u2) * h * m[i + 1];
    };
  }
  /* keys: [[t, {a:.., b:..}], ...] -> fn(t) -> {a, b} (one spline per channel) */
  function mkTrack(keys) {
    const names = Object.keys(keys[0][1]), sp = {};
    names.forEach((k) => { sp[k] = mkSpline(keys.map((q) => [q[0], q[1][k]])); });
    return (t) => { const o = {}; names.forEach((k) => (o[k] = sp[k](t))); return o; };
  }

  /* ---------- beat grid (retime to the real song by changing BPM/OFFSET or BARS) ----------
     BARS: optional list of measured downbeat times (seconds). Songs cut from
     several takes drift a few ms per splice, so measured downbeats beat a
     single OFFSET. Past the list, bars extrapolate at BPM. */

    K.shape(ctx, K.rectPts(x0 - 20, o.dado - 12, x1 - x0 + 40, 24, 24), { fill: P.woodLight, w: 3.5, boil: 0.9, seed: o.seed + 1, shade: { color: P.wood, dx: 0, dy: -9 } });
    o.windows.forEach((w, i) => K.archWindow(ctx, w[0], w[1], w[2], w[3], o.seed + 20 + i));
  };

  /* ---------- tall arched greenhouse window with green panes ---------- */
  K.archWindow = function (ctx, cx, top, w, h, seed) {
    const arch = [], r = w / 2;
    for (let i = 0; i <= 10; i++) { const a = Math.PI + (i / 10) * Math.PI; arch.push([cx + Math.cos(a) * r, top + r + Math.sin(a) * r]); }
    const pts = arch.concat([[cx + r, top + h], [cx - r, top + h]]);
    K.shape(ctx, pts.map((p) => [p[0] + (p[0] - cx) * 0.08, p[1] - 14]), { fill: P.brassDark, w: 4, boil: 0.9, seed }); /* frame */
    K.shape(ctx, pts, { fill: P.pane, w: 4, boil: 0.9, seed: seed + 1, shade: { color: P.paneDark, dx: 24, dy: 30 } });
    /* plant silhouettes behind the glass */
    ctx.save(); K.pathOf(ctx, pts, true); ctx.clip();
    ctx.globalAlpha = 0.35; ctx.fillStyle = P.leafDark;
    for (let i = 0; i < 5; i++) { const lx = cx - r + (i + 0.5) * (w / 5), ly = top + h - 30 - hash(i, seed) * h * 0.35; K.pathOf(ctx, K.blobPts(lx, ly, 46, 70, 9, seed + i, 0.35), true); ctx.fill(); }
    ctx.globalAlpha = 0.5; ctx.strokeStyle = P.glassHi; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(cx - r * 0.6, top + h * 0.7); ctx.lineTo(cx - r * 0.1, top + h * 0.3); ctx.stroke();
    ctx.restore();
    /* mullions: deco sunrise in the arch + a grid below */
    for (let k = 1; k < 4; k++) { const a = Math.PI + (k / 4) * Math.PI; K.line(ctx, [[cx, top + r], [cx + Math.cos(a) * r, top + r + Math.sin(a) * r]], { stroke: P.brassDark, w: 5, boil: 0.6, seed: seed + 5 + k, taper: false }); }
    K.line(ctx, [[cx - r, top + r], [cx + r, top + r]], { stroke: P.brassDark, w: 6, boil: 0.6, seed: seed + 9, taper: false });
    K.line(ctx, [[cx, top + r], [cx, top + h]], { stroke: P.brassDark, w: 6, boil: 0.6, seed: seed + 10, taper: false });
    for (let y = top + r + (h - r) / 3; y < top + h - 10; y += (h - r) / 3) K.line(ctx, [[cx - r, y], [cx + r, y]], { stroke: P.brassDark, w: 5, boil: 0.6, seed: seed + y, taper: false });
  };

  /* ---------- brass pipe along the wall (pts), with joints ---------- */
  K.pipe = function (ctx, pts, opt) {
    const o = Object.assign({ w: 22, seed: 40 }, opt || {});
    K.line(ctx, pts, { stroke: P.ink, w: o.w + 8, boil: 0.7, seed: o.seed, taper: false });
    K.line(ctx, pts, { stroke: P.brass, w: o.w, boil: 0.7, seed: o.seed + 1, taper: false });
    K.line(ctx, pts.map((p) => [p[0] - 3, p[1] - 4]), { stroke: P.brassLight, w: o.w * 0.25, boil: 0.7, seed: o.seed + 2 });
    pts.forEach((p, i) => { if (i && i < pts.length - 1) K.shape(ctx, K.ellipsePts(p[0], p[1], o.w * 0.9, o.w * 0.9, 10), { fill: P.brassDark, w: 3.5, boil: 0.6, seed: o.seed + 10 + i }); });
  };

  /* ---------- workbench: top at y, legs and a drawer apron below ---------- */
  K.bench = function (ctx, x0, x1, y, opt) {
    const o = Object.assign({ seed: 60, drawers: 3 }, opt || {});
    const w = x1 - x0;
    for (let x = x0 + 60; x < x1; x += Math.max(400, w / 4)) K.shape(ctx, K.rectPts(x, y + 30, 34, 420, 2), { fill: P.woodDark, w: 4, boil: 0.8, seed: o.seed + x });
    K.shape(ctx, K.rectPts(x0 + 30, y + 30, w - 60, 150, 6), { fill: P.wood, w: 4.5, boil: 1, seed: o.seed + 1, shade: { color: P.woodDark, dx: 0, dy: -36 }, dots: { gap: 10, alpha: 0.25 } });
    for (let i = 0; i < Math.floor(w / 360); i++) {
      const dx = x0 + 80 + i * 360;
      K.shape(ctx, K.rrectPts(dx, y + 54, 300, 96, 10), { fill: P.woodLight, w: 3.5, boil: 0.8, seed: o.seed + 10 + i, shade: { color: P.wood, dx: 0, dy: -12 } });
      K.shape(ctx, K.rrectPts(dx + 120, y + 90, 60, 18, 9), { fill: P.brass, w: 3, boil: 0.5, seed: o.seed + 30 + i });
    }
    K.shape(ctx, K.rectPts(x0, y - 6, w, 40, 8), { fill: P.woodLight, w: 5, boil: 1.1, seed: o.seed + 2, shade: { color: P.wood, dx: 0, dy: -14 }, rim: 3 });
  };
  /* wall shelf with two brackets */
  K.shelf = function (ctx, x0, x1, y, seed) {
    seed = seed || 80;
    [x0 + 60, x1 - 60].forEach((bx, i) => K.shape(ctx, [[bx - 14, y], [bx + 14, y], [bx + 14, y + 90], [bx - 14, y + 40]], { fill: P.brassDark, w: 3.5, boil: 0.7, seed: seed + i }));
    K.shape(ctx, K.rectPts(x0, y - 22, x1 - x0, 26, 8), { fill: P.woodLight, w: 4.5, boil: 1, seed: seed + 3, shade: { color: P.wood, dx: 0, dy: -9 } });
  };
  /* hanging art-deco lamp with a warm light cone */
  K.lamp = function (ctx, x, y, opt) {
    const o = Object.assign({ seed: 90, len: 260, on: 1, sway: 0 }, opt || {});
    const sx = x + o.sway;
    K.line(ctx, [[x, y - o.len], [sx, y - 40]], { stroke: P.ink, w: 4, boil: 0.6, seed: o.seed, taper: false });
    if (o.on > 0) { K.glow(ctx, sx, y + 30, 420, "rgba(255,226,150,0.55)", o.on); }
    K.shape(ctx, [[sx - 26, y - 40], [sx + 26, y - 40], [sx + 90, y + 34], [sx - 90, y + 34]], { fill: P.glassDark, w: 4.5, boil: 0.9, seed: o.seed + 1, shade: { color: P.glassDeep, dx: 18, dy: 0 } });
    K.shape(ctx, K.rectPts(sx - 92, y + 30, 184, 12, 6), { fill: P.brass, w: 3.5, boil: 0.6, seed: o.seed + 2 });
    K.dot(ctx, sx, y + 50, 20, "#fff4c8", P.ink, 3, o.seed + 3);
  };

  /* ---------- terracotta pot with soil ---------- */
  K.pot = function (ctx, x, y, s, opt) {
    const o = Object.assign({ seed: 100, color: P.pot, shadow: P.potDark, squash: 0 }, opt || {});
    ctx.save(); ctx.translate(x, y); ctx.scale(s * (1 + o.squash * 0.5), s / (1 + o.squash * 0.5));
    K.shape(ctx, [[-70, -96], [70, -96], [56, 0], [-56, 0]], { fill: o.color, w: 5, boil: 1, seed: o.seed, shade: { color: o.shadow, dx: -22, dy: 0 }, dots: { gap: 8, alpha: 0.25 } });
    K.shape(ctx, K.rectPts(-82, -120, 164, 34, 6), { fill: o.color, w: 5, boil: 1, seed: o.seed + 1, shade: { color: o.shadow, dx: 0, dy: -10 }, rim: 2.5 });
    K.shape(ctx, K.ellipsePts(0, -120, 70, 10, 12), { fill: P.soil, w: 3, boil: 0.6, seed: o.seed + 2 });
    ctx.restore();
  };
  /* single leaf, base at (x,y) pointing along ang */
  K.leaf = function (ctx, x, y, ang, s, seed, color) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
    K.shape(ctx, [[0, 0], [16, -12], [38, -10], [56, 0], [38, 10], [16, 12]], { fill: color || P.leaf, w: 3.2, boil: 0.7, seed, shade: { color: P.leafDark, dx: 0, dy: -7 } });
    K.line(ctx, [[4, 0], [46, 0]], { stroke: P.leafDark, w: 2.2, boil: 0.4, seed: seed + 1 });
    ctx.restore();
  };

  /* ---------- the data seed: a brass-green capsule engraved with a tiny chart ---------- */
  K.seed = function (ctx, x, y, r, opt) {
    const o = Object.assign({ seed: 120, rot: 0, glow: 0 }, opt || {});
    if (o.glow > 0) K.glow(ctx, x, y, r * 4, P.glow, o.glow);
    ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot);
    const pts = [[0, -r * 1.25], [r * 0.7, -r * 0.6], [r * 0.85, r * 0.3], [0, r * 1.05], [-r * 0.85, r * 0.3], [-r * 0.7, -r * 0.6]];
    K.shape(ctx, pts, { fill: P.glassDark, w: Math.max(2.5, r * 0.13), boil: 0.5, seed: o.seed, shade: { color: P.glassDeep, dx: -r * 0.3, dy: -r * 0.25 }, rim: Math.max(1.5, r * 0.08) });
    /* engraved candles */
    for (let i = 0; i < 3; i++) {
      const cx = (i - 1) * r * 0.36, h = r * (0.3 + 0.25 * i), cy = r * 0.2 - h * 0.4 - i * r * 0.1;
      K.line(ctx, [[cx, cy - h * 0.8], [cx, cy + h * 0.8]], { stroke: P.brassLight, w: Math.max(1.4, r * 0.06), boil: 0.2, seed: o.seed + 5 + i, taper: false });
      K.shape(ctx, K.rectPts(cx - r * 0.1, cy - h * 0.45, r * 0.2, h * 0.9, 1), { fill: P.brassLight, stroke: null, w: 0, boil: 0.2, seed: o.seed + 9 + i });
    }
    ctx.restore();
  };

  /* ---------- round-bottom flask ----------
     layers: [{ h: 0..1 of the bowl, color }] stacked from the bottom; bubbles; tag */
  K.flask = function (ctx, x, y, s, opt) {
    const o = Object.assign({ seed: 140, layers: [{ h: 0.55, color: P.glass }], bubbles: 0, cork: true, glowA: 0, label: "", rot: 0 }, opt || {});
    ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot); ctx.scale(s, s);
    if (o.glowA > 0) K.glow(ctx, 0, -70, 190, "rgba(190,255,200,0.9)", o.glowA);
    const R = 62, cy = -R - 4;
    const bowl = [];
    for (let i = 0; i <= 16; i++) { const a = -Math.PI / 2 + 0.38 + (i / 16) * (K.TAU - 0.76); bowl.push([Math.cos(a) * R, cy - Math.sin(a) * R]); }
    const outline = [[-17, cy - R - 76]].concat(bowl.slice().reverse().map((p) => p), [[17, cy - R - 76]]);
    const neck = [[-17, cy - R - 76], [17, cy - R - 76], [17, cy - R + 6], [-17, cy - R + 6]];
    /* glass body */
    K.shape(ctx, K.ellipsePts(0, cy, R, R, 18), { fill: "rgba(214,240,226,0.55)", stroke: null, w: 0, boil: 0.6, seed: o.seed });
    K.shape(ctx, neck, { fill: "rgba(214,240,226,0.55)", stroke: null, w: 0, boil: 0.6, seed: o.seed + 1 });
    /* liquid layers: clip to the bowl */
    ctx.save(); K.pathOf(ctx, K.ellipsePts(0, cy, R - 5, R - 5, 18), true); ctx.clip();
    let base = cy + R;
    o.layers.forEach((L, i) => {
      const hh = L.h * 2 * R, wob = Math.sin(K.now * 3 + i + o.seed) * 3;
      ctx.fillStyle = L.color; ctx.beginPath(); ctx.moveTo(-R, base); ctx.lineTo(-R, base - hh + wob); ctx.quadraticCurveTo(0, base - hh - wob, R, base - hh + wob); ctx.lineTo(R, base); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-R, base - hh + wob); ctx.quadraticCurveTo(0, base - hh - wob, R, base - hh + wob); ctx.stroke();
      base -= hh;
    });
    for (let i = 0; i < o.bubbles; i++) {
      const ph = (K.now * 0.9 + hash(i, o.seed)) % 1, bx = hs(i, o.seed + 3) * R * 0.5, by = cy + R - 10 - ph * (cy + R - base);
      K.dot(ctx, bx + Math.sin(K.now * 4 + i) * 3, by, 4 + 3 * hash(i, 5), "rgba(255,255,255,0.7)", P.ink, 1.6, o.seed + 30 + i);
    }
    ctx.restore();
    /* outline + highlight */
    K.shape(ctx, outline, { fill: null, w: 5, boil: 0.9, seed: o.seed + 2, closed: true });
    K.line(ctx, [[-R * 0.62, cy - R * 0.2], [-R * 0.45, cy - R * 0.55], [-R * 0.18, cy - R * 0.72]], { stroke: P.glassHi, w: 6, boil: 0.5, seed: o.seed + 3 });
    K.shape(ctx, K.rectPts(-23, cy - R - 82, 46, 12, 4), { fill: P.glassHi, w: 3.5, boil: 0.5, seed: o.seed + 4 }); /* lip */
    if (o.cork) K.shape(ctx, K.rectPts(-15, cy - R - 104, 30, 26, 3), { fill: P.woodLight, w: 3.5, boil: 0.6, seed: o.seed + 5, shade: { color: P.wood, dx: 8, dy: 0 } });
    if (o.label) {
      K.shape(ctx, K.rrectPts(-34, cy - 8, 68, 40, 8), { fill: P.paper, w: 3, boil: 0.5, seed: o.seed + 6 });
      K.text(ctx, o.label, 0, cy + 13, { size: 28, weight: 600, font: K.FONT.mono, fill: P.ink });
    }
    ctx.restore();
  };
  /* simple straight beaker (props on the bench) */
  K.beaker = function (ctx, x, y, s, color, seed) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const body = [[-40, -120], [40, -120], [36, 0], [-36, 0]];
    K.shape(ctx, body, { fill: "rgba(214,240,226,0.5)", stroke: null, w: 0, boil: 0.5, seed });
    K.shape(ctx, [[-38, -60], [38, -60], [36, 0], [-36, 0]], { fill: color || P.glass, stroke: null, w: 0, boil: 0.5, seed: seed + 1 });
    K.shape(ctx, body.concat([[-48, -126]]), { fill: null, w: 4.5, boil: 0.8, seed: seed + 2 });
    for (let i = 1; i < 4; i++) K.line(ctx, [[-36, -i * 28], [-18, -i * 28]], { stroke: P.ink, w: 2.5, boil: 0.4, seed: seed + 5 + i });
    ctx.restore();
  };

  /* ---------- tools ---------- */
  K.shears = function (ctx, x, y, ang, open, s, seed) {
    seed = seed || 160;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s || 1, s || 1);
    const o = 0.08 + 0.5 * clamp(open, 0, 1);
    [-1, 1].forEach((sd, i) => {
      ctx.save(); ctx.rotate(sd * o);
      K.shape(ctx, [[0, -5 * sd], [70, -9 * sd], [96, -2 * sd], [70, 4 * sd], [0, 4 * sd]], { fill: "#d8dcd2", w: 3.5, boil: 0.6, seed: seed + i, rim: 1.5 });
      K.shape(ctx, K.ellipsePts(-34, 0, 30, 11, 10, -sd * 0.25), { fill: P.bad, w: 3.5, boil: 0.6, seed: seed + 3 + i, shade: { color: "#7a2420", dx: 0, dy: 5 } });
      ctx.restore();
    });
    K.dot(ctx, 0, 0, 6, P.brass, P.ink, 2.5, seed + 9);
    ctx.restore();
  };
  K.magnifier = function (ctx, x, y, ang, s, seed) {
    seed = seed || 170;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s || 1, s || 1);
    K.shape(ctx, K.rrectPts(-4, -9, 70, 18, 8), { fill: P.wood, w: 3.5, boil: 0.6, seed });
    K.shape(ctx, K.ellipsePts(108, 0, 44, 44, 16), { fill: "rgba(220,250,236,0.45)", w: 9, stroke: P.brass, boil: 0.6, seed: seed + 1 });
    K.shape(ctx, K.ellipsePts(108, 0, 50, 50, 16), { fill: null, w: 3.5, boil: 0.6, seed: seed + 2 });
    K.line(ctx, [[84, -18], [96, -30]], { stroke: "#ffffff", w: 5, boil: 0.4, seed: seed + 3 });
    ctx.restore();
  };
  K.wateringCan = function (ctx, x, y, ang, s, seed) {
    seed = seed || 180;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s || 1, s || 1);
    K.shape(ctx, [[-10, -20], [60, -32], [118, -64], [126, -54], [64, -14]], { fill: P.copper, w: 3.5, boil: 0.7, seed });
    K.shape(ctx, K.rrectPts(-80, -60, 90, 80, 14), { fill: P.copper, w: 4.5, boil: 0.8, seed: seed + 1, shade: { color: "#844524", dx: -16, dy: 0 }, rim: 2 });
    K.line(ctx, [[-70, -60], [-36, -96], [0, -60]], { stroke: P.ink, w: 7, boil: 0.6, seed: seed + 2, taper: false });
    ctx.restore();
  };

  /* ---------- effects ---------- */
  K.sparkle = function (ctx, x, y, r, a, seed) {
    if (a <= 0 || r <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(hs(seed || 1, 3) * 0.4); ctx.globalAlpha *= clamp(a, 0, 1);
    const pts = [];
    for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * 0.3 : r; const ang = (i / 8) * K.TAU; pts.push([Math.cos(ang) * rr, Math.sin(ang) * rr]); }
    K.shape(ctx, pts, { fill: P.brassLight, w: 3, boil: 0.5, seed: seed || 1 });
    ctx.restore();
  };
  /* scalloped brass medal (episode badges); icon(ctx, r) draws inside */
  K.medal = function (ctx, x, y, r, opt) {
    const o = Object.assign({ seed: 200, color: P.glassDark, icon: null }, opt || {});
    const sc = [];
    for (let i = 0; i < 24; i++) { const a = (i / 24) * K.TAU, rr = r * (i % 2 ? 0.93 : 1.04); sc.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
    K.shape(ctx, sc, { fill: P.brass, w: 4, boil: 0.7, seed: o.seed, shade: { color: P.brassDark, dx: -r * 0.12, dy: -r * 0.12 } });
    K.shape(ctx, K.ellipsePts(x, y, r * 0.74, r * 0.74, 16), { fill: o.color, w: 3.5, boil: 0.6, seed: o.seed + 1, rim: 2 });
    if (o.icon) { ctx.save(); ctx.translate(x, y); o.icon(ctx, r * 0.74); ctx.restore(); }
  };
  /* art-deco sunburst: alternating rays behind a title or a reveal */
  K.sunburst = function (ctx, x, y, r, opt) {
    const o = Object.assign({ n: 24, a: 1, c1: "rgba(255,236,170,0.35)", c2: "rgba(255,236,170,0.0)", rot: 0 }, opt || {});
    if (o.a <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot); ctx.globalAlpha *= o.a;
    for (let i = 0; i < o.n; i++) {
      const a0 = (i / o.n) * K.TAU, a1 = ((i + 0.5) / o.n) * K.TAU;
      ctx.fillStyle = o.c1; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a0, a1); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  };
  /* steam / dust puff, life u 0..1 */
  K.puff = function (ctx, x, y, r, u, seed) {
    if (u <= 0 || u >= 1) return;
    K.shape(ctx, K.blobPts(x, y - u * 60, r * (0.5 + u), r * (0.45 + u * 0.9), 9, seed, 0.25), { fill: P.paper, w: 3, boil: 0.8, seed, alpha: 1 - u * u });
  };
  /* validation tick on a round green stamp */
  K.check = function (ctx, x, y, r, a, seed) {
    if (a <= 0) return;
    const s = K.E.back(clamp(a, 0, 1), 2.6);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(-0.12);
    K.shape(ctx, K.ellipsePts(0, 0, r, r, 14), { fill: P.good, w: 4, boil: 0.6, seed: seed || 210, rim: 2 });
    K.line(ctx, [[-r * 0.45, 0], [-r * 0.1, r * 0.35], [r * 0.5, -r * 0.4]], { stroke: P.paper, w: r * 0.22, boil: 0.4, seed: (seed || 210) + 1, taper: false });
    ctx.restore();
  };
  /* oxblood cross (rejected, overfit) */
  K.cross = function (ctx, x, y, r, a, seed) {
    if (a <= 0) return;
    const s = K.E.back(clamp(a, 0, 1), 2.6);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(0.1);
    K.shape(ctx, K.ellipsePts(0, 0, r, r, 14), { fill: P.bad, w: 4, boil: 0.6, seed: seed || 220 });
    K.line(ctx, [[-r * 0.4, -r * 0.4], [r * 0.4, r * 0.4]], { stroke: P.paper, w: r * 0.2, boil: 0.4, seed: (seed || 220) + 1, taper: false });
    K.line(ctx, [[r * 0.4, -r * 0.4], [-r * 0.4, r * 0.4]], { stroke: P.paper, w: r * 0.2, boil: 0.4, seed: (seed || 220) + 2, taper: false });
    ctx.restore();
  };
  /* ---------- feature pellet: a round seed-cake with a language-free feature icon ----------
     kind 0 candles (price), 1 bars (volume), 2 wave (cycle), 3 dot cloud (alt data) */
  K.pellet = function (ctx, x, y, r, kind, seed) {
    seed = seed || 240;
    K.shape(ctx, K.ellipsePts(x, y, r, r, 12), { fill: [P.brass, P.leafLight, P.glass, P.test][kind % 4], w: Math.max(2.5, r * 0.12), boil: 0.4, seed, rim: 1.5 });
    const c = P.ink, w = Math.max(1.6, r * 0.11);
    if (kind % 4 === 0) [-0.4, 0, 0.4].forEach((dx, i) => { K.line(ctx, [[x + dx * r, y - r * 0.5 + i * 3], [x + dx * r, y + r * 0.45 - i * 3]], { stroke: c, w, boil: 0.2, seed: seed + i, taper: false }); });

  /* ---------- decision tree plant: binary splits grow level by level ----------

  K.treePlant = function (ctx, x, y, s, opt) {
    const o = Object.assign({ grow: 3, depth: 3, seed: 480, spread: 230, ratio: 2.1, levelH: 120, leaves: null, sway: 1, hot: -1 }, opt || {});

  /* ---------- neural-net vine: layers of bud-neurons joined by tendrils ----------

      const g = clamp(o.grow - li - 1 + 0.5, 0, 1); if (g <= 0) continue;

        const e = [lerp(a[0], b[0], g), lerp(a[1], b[1], g)], mid = [lerp(a[0], e[0], 0.5), lerp(a[1], e[1], 0.5) + hs(i * 7 + j, o.seed + li) * 18];

      const g = clamp(o.grow - li, 0, 1); if (g <= 0) return;
      const sc = K.E.back(g, 2.6), hot = o.pulse >= 0 && Math.abs(o.pulse * (L - 1) - li) < 0.5;

  };

  /* ---------- art-deco marquee (titles). u = drop-in 0..1, returns the inner text box ---------- */
  K.marquee = function (ctx, cx, cy, w, h, u, opt) {
    const o = Object.assign({ seed: 560, chase: 0, bulbs: 1 }, opt || {});
    if (u <= 0) return null;

    [-1, 1].forEach((sd, i) => { for (let k = 0; k < 9; k++) { const yy = cy - h / 2 - 34 - k * 34; K.shape(ctx, K.ellipsePts(cx + sd * w * 0.36, yy, 9, 16, 8), { fill: null, stroke: P.brassDark, w: 4, boil: 0.5, seed: o.seed + i * 20 + k }); } });

    K.sunburst(ctx, cx, cy - h / 2 - 4, 54, { n: 14, c1: "rgba(138,99,34,0.65)", rot: Math.PI });
    K.decoFrame(ctx, cx - w / 2, cy - h / 2, w, h, { seed: o.seed, fill: P.glassDeep, bw: 30, step: 30 });
    /* inner pinstripe */
    K.shape(ctx, K.rectPts(cx - w / 2 + 16, cy - h / 2 + 16, w - 32, h - 32, 4), { fill: null, stroke: P.brassLight, w: 3, boil: 0.6, seed: o.seed + 60 });
    /* bulbs around the frame: every third one lit in a chasing pattern */
    if (o.bulbs) {
      const per = 2 * (w + h) + 120, n = Math.floor(per / 52);
      for (let i = 0; i < n; i++) {
        const d = (i / n) * per; let bx, by; const W2 = w + 60, H2 = h + 60;
        if (d < W2) { bx = cx - W2 / 2 + d; by = cy - H2 / 2; } else if (d < W2 + H2) { bx = cx + W2 / 2; by = cy - H2 / 2 + (d - W2); } else if (d < 2 * W2 + H2) { bx = cx + W2 / 2 - (d - W2 - H2); by = cy + H2 / 2; } else { bx = cx - W2 / 2; by = cy + H2 / 2 - (d - 2 * W2 - H2); }
        const lit = (i + Math.floor(o.chase)) % 3 === 0;
        if (lit) K.glow(ctx, bx, by, 34, "rgba(255,240,180,0.9)", 0.9);

/* ============================================================
   INTRO 10 SETUP: variables, title DOM, world layout, timing (beat grid)
   Song: song_short.m4a (26.6 s) = song_raw.mp4 7.385 - 32.66 s (5 bars
   instrumental + chorus + "an owl in a lab" line) spliced on a downbeat
   to the song's real ending 57.893 - 59.25 s (30 ms crossfade, 0.5 s fade).
   Electro-swing, 133 BPM (beat 0.451 s, bar 1.804 s), measured downbeats
   below. Lyric map (film time):
     0.0 - 11.8 instrumental: dark lab, lamps, swivel, gauge, a swing dance,
                the data seed tossed into the pot, sprout, data points
     11.8 "Fit it RIGHT (12.63), don't overfit"     -> overfit vine, snip, smooth fit
     15.8 "Validate every little bit"               -> walk-forward flasks get ticks
     17.9 "Trees and nets that learn and grow"      -> tree plant + net vine grow
     19.6 "Modern ML for Trading, steal the show"   -> marquee title (19.85), bow (21.65)
     22.8 "An owl in a lab with a data seed"        -> owl raises the glowing seed
     25.26 final hit                                -> ta-da

   ============================================================ */
const K = LK, P = K.P, at = K.at;
K.G.BPM = 133;
K.G.BARS = [0.000, 1.804, 3.609, 5.413, 7.218, 9.022, 10.827, 12.631, 14.435, 16.240, 18.044, 19.849, 21.653, 23.458, 25.262];
const DUR = 26.6;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const BEAT = K.beatLen();

/* ---------- story beats ---------- */
const T = {
  iris: [0, at(0, 2)],               /* deco iris opens on a dark lab */
  lamps: [at(1, 0), at(2, 0)],       /* lamps flicker on, full on bar 2 */
  swivel: at(2, 0),                  /* the head swivels 180 to face us */
  wave: [at(2, 2), at(3, 0)],        /* waves hello */
  gauge: at(3, 0),                   /* train-accuracy gauge pops */
  dance1: [at(4, 0), at(5, 0)],      /* a bar of swing dance */
  pocket: at(5, 0),                  /* hand to the coat pocket: the data seed */
  toss: at(5, 1),                    /* seed flies to the pot */
  land: at(5, 2),                    /* lands, pot squashes */
  pour: [at(5, 3), at(6, 0.5)],      /* data drizzle from a flask */
  sprout: at(6, 0),                  /* sprout + data points pop */
  vine: [at(6, 2), at(7, -0.3)],     /* "Fit it": vine overfits every point */
  worry: at(6, 3.3),                 /* eyes pop at the mess */
  snip: at(7, 0),                    /* "RIGHT": snip! */
  wag: [at(7, 3), at(8, 0.6)],       /* "don't overfit": finger wag */
  band: at(8, 0),                    /* uncertainty band blooms */
  truck1: [at(8, 2), at(9, 0)],      /* walk to the flask bench */
  flasks: at(8, 3.2),                /* flasks pop on sixteenths as we arrive */
  ticks: at(9, 0.5),                 /* "Validate every little bit": ticks on eighths */
  jump: [at(9, 3), at(10, 0)],        /* leap to the garden bench */
  grow: at(10, 0),                    /* "Trees and nets": both grow */
  zoomOut: [at(10, 3), at(11, 0)],
  title: at(11, 0),                   /* "Modern ML for Trading": marquee drop */
  letters: at(11, 0.5),
  show: at(12, 0),                    /* "steal the show": spotlight, bow, medals */
  thumb: at(12, 2.5),
  seedUp: at(13, 0),                 /* "An owl in a lab with a data seed" */
  wink: at(13, 2),
  finale: at(14, 0),                 /* the song's last hit: ta-da */
};

/* ---------- variables ---------- */
const VARS = Object.assign({ title: "Modern ML|for Trading", lang: "en" },
  (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {});
const LANG = VARS.lang || "en";
const TITLE_LINES = String(VARS.title || "Modern ML|for Trading").split("|").map((s) => s.trim()).filter(Boolean);
const IS_CJK = LANG === "zh-CN" || LANG === "zh-TW";

/* ---------- title DOM: one span per character ---------- */
const titleEl = document.getElementById("title");
if (LANG === "zh-CN") titleEl.classList.add("cjk-sc");
if (LANG === "zh-TW") titleEl.classList.add("cjk-tc");
/* the marquee's glass panel is about 1240 px wide inside the bulbs.
   Oswald is condensed: a capital at 100 px is about 50-58 px wide with tracking */
const longest = Math.max(...TITLE_LINES.map((s) => Array.from(s).length));
const CYR = /[Ѐ-ӿ]/.test(VARS.title);
const TITLE_SIZE = IS_CJK ? 98 : Math.min(110, Math.floor((CYR ? 1700 : 1850) / Math.max(9, longest)));
const TITLE_CH = [];

const TITLE_LN = Array.from(titleEl.querySelectorAll(".ln"));

/* ---------- world layout (one long lab; the camera trucks along it) ---------- */
const BENCH_Y = 780;
const ST_A = { cam: { x: 1000, y: 520 }, owl: 1430, pot: 640, plate: { x: 900, y: 360, w: 680, h: 430 } };
const ST_B = { cam: { x: 2420, y: 520 }, owl: 1830, flasks: [2090, 2280, 2470, 2660, 2850] };
const ST_C = { cam: { x: 4050, y: 520 }, owl: 4050, tree: 3500, net: 4620 };
const WINDOWS = [[1960, -160, 300, 560], [2900, -160, 300, 560], [4050, -220, 360, 600], [520, -160, 300, 560], [3300, -160, 300, 560], [4800, -160, 300, 560]];

/* plate data: a gentle trend plus seeded noise (the "market") */
const NPTS = 12;
const TRUE_F = (u) => 0.30 + 0.40 * u + 0.13 * Math.sin(u * 5.2 + 0.3);
const PTS = Array.from({ length: NPTS }, (_, i) => K.clamp(TRUE_F(i / (NPTS - 1)) + K.hs(i, 11) * 0.16, 0.06, 0.94));
/* the smooth fit and its uncertainty band (wider at the edges, like a real fit) */
const FIT = Array.from({ length: 25 }, (_, i) => TRUE_F(i / 24));
const BAND_W = (u) => 0.07 + 0.09 * Math.pow(2 * u - 1, 2);
const BAND = { lo: FIT.map((v, i) => v - BAND_W(i / 24)), hi: FIT.map((v, i) => v + BAND_W(i / 24)) };

/* ============================================================
   INTRO 20 LAB: the long greenhouse lab and its three stations.
     A (x ~1000): the plate. Seed -> sprout -> overfit vine -> snip -> smooth fit + band
     B (x ~2420): five walk-forward flasks on the bench, fold strips, ticks
     C (x ~3400): decision-tree plant + neural-net vine; title set
   Camera: one monotone track, moves start and land on downbeats.
   ============================================================ */
/* lamps: dark lab, flickers on beats, full on bar 2 */
function lampsOn(t) {
  if (t < T.lamps[0]) return 0;
  if (t < T.lamps[1]) return [0.8, 0.1, 0.7, 0.25][Math.min(3, Math.floor((t - T.lamps[0]) / BEAT))];
  return 1;
}
const camTrack = K.mkTrack([
  [0, { x: 1060, y: 500, z: 1.12 }],
  [T.lamps[1], { x: 1000, y: 520, z: 1.0 }],
  [T.dance1[0], { x: 1000, y: 520, z: 1.0 }],
  [T.dance1[1], { x: 1060, y: 540, z: 1.07 }],
  [T.vine[0], { x: 1000, y: 520, z: 1.0 }],
  [T.truck1[0], { x: 1000, y: 520, z: 1.0 }],
  [T.truck1[1], { x: ST_B.cam.x, y: 520, z: 1.0 }],
  [T.jump[0] - 0.05, { x: ST_B.cam.x + 30, y: 520, z: 1.0 }],
  [T.jump[1], { x: ST_C.cam.x, y: 540, z: 1.0 }],
  [T.zoomOut[0], { x: ST_C.cam.x, y: 540, z: 1.0 }],
  [T.zoomOut[1], { x: ST_C.cam.x, y: 520, z: 0.9 }],
  [DUR, { x: ST_C.cam.x, y: 528, z: 0.93 }],
]);
const cam = (t) => Object.assign({ rot: 0 }, camTrack(t));

/* ---------- overfit curve: passes through every point and wiggles between them ---------- */
function interpPts(u) {
  const f = u * (NPTS - 1), i = Math.min(NPTS - 2, Math.floor(f)), r = f - i;
  const p0 = PTS[Math.max(0, i - 1)], p1 = PTS[i], p2 = PTS[i + 1], p3 = PTS[Math.min(NPTS - 1, i + 2)];
  return 0.5 * (2 * p1 + (-p0 + p2) * r + (2 * p0 - 5 * p1 + 4 * p2 - p3) * r * r + (-p0 + 3 * p1 - 3 * p2 + p3) * r * r * r);
}
const OVER = (u) => interpPts(u) + 0.07 * Math.sin(u * (NPTS - 1) * K.TAU);
const NS = 110;
const PLATE_M = K.plateMap(ST_A.plate.x, ST_A.plate.y, ST_A.plate.w, ST_A.plate.h, 0, 1, "");
const POT_TOP = [ST_A.pot, BENCH_Y - 122];
const STEM = [[POT_TOP[0], POT_TOP[1] + 6], [POT_TOP[0] - 4, POT_TOP[1] - 50], [PLATE_M.X(0) - 6, PLATE_M.Y(OVER(0)) + 40]];
const OVER_PTS = Array.from({ length: NS + 1 }, (_, i) => [PLATE_M.X(i / NS), PLATE_M.Y(OVER(i / NS))]);
const FIT_PTS = Array.from({ length: 41 }, (_, i) => [PLATE_M.X(i / 40), PLATE_M.Y(TRUE_F(i / 40))]);
const SNIP_U = 0.86;
const SNIP_PT = [PLATE_M.X(SNIP_U), PLATE_M.Y(OVER(SNIP_U))];

function vinePath(pts, p, seed, color, leafEvery) {
  const all = STEM.concat(pts), n = Math.max(2, Math.floor(all.length * p));
  const vis = all.slice(0, n);
  K.line(ctx, vis, { stroke: P.ink, w: 15, boil: 0.8, seed, taper: false });
  K.line(ctx, vis, { stroke: color, w: 8, boil: 0.8, seed: seed + 1, taper: false });
  for (let i = 4; i < n - 2; i += leafEvery) {
    const a = all[i], b = all[i + 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]) + ((i / leafEvery) % 2 ? -1.1 : 1.1);
    const g = K.clamp((n - i) / 6, 0, 1);
    K.leaf(ctx, a[0], a[1], ang, 0.55 * K.E.back(g, 2), seed + i, color === P.bad ? "#7f9a3c" : P.leaf);
  }
}

function drawStationA(t) {
  const pl = ST_A.plate;
  /* easel legs behind the plate */
  K.line(ctx, [[pl.x - 240, pl.y + 150], [pl.x - 300, BENCH_Y]], { stroke: P.woodDark, w: 14, boil: 0.7, seed: 1201, taper: false });
  K.line(ctx, [[pl.x + 240, pl.y + 150], [pl.x + 300, BENCH_Y]], { stroke: P.woodDark, w: 14, boil: 0.7, seed: 1202, taper: false });
  const ptsShown = K.clamp((t - T.sprout) / (BEAT * 2), 0, 1); /* data points pop on sixteenths */
  const bandA = K.E.out3(K.inv(T.band, T.band + 0.5, t));
  K.plate(ctx, pl.x, pl.y, pl.w, pl.h, [{ data: PTS, kind: "scatter", color: P.data }], {
    a: K.inv(T.pour[0], T.pour[0] + 0.4, t), draw: ptsShown, seed: 330, yMin: 0, yMax: 1,
    band: bandA > 0 ? { lo: BAND.lo, hi: BAND.hi, a: bandA } : null,
  });
  /* the vine: overfit, then snipped, then the smooth fit */
  const vp = K.inv(T.vine[0], T.vine[1], t);
  if (t < T.snip && vp > 0) vinePath(OVER_PTS, K.E.inOut(vp), 1300, P.leafLight, 7);
  else if (t >= T.snip) {
    /* falling cuttings */
    const d = t - T.snip;
    if (d < 1.4) for (let c = 0; c < 6; c++) {
      const i0 = Math.floor((c / 6) * NS), i1 = Math.floor(((c + 1) / 6) * NS) + 1;
      const seg = OVER_PTS.slice(i0, i1), cx = seg[Math.floor(seg.length / 2)][0], cy = seg[Math.floor(seg.length / 2)][1];
      const dy = 900 * d * d + 60 * d * K.hash(c, 4), rot = (K.hash(c, 5) - 0.5) * 2.2 * d, dx = (K.hash(c, 6) - 0.5) * 120 * d;
      ctx.save(); ctx.globalAlpha = K.clamp(1 - d / 1.4, 0, 1); ctx.translate(cx + dx, cy + dy); ctx.rotate(rot); ctx.translate(-cx, -cy);
      K.line(ctx, seg, { stroke: P.ink, w: 15, boil: 0.8, seed: 1400 + c, taper: false });
      K.line(ctx, seg, { stroke: "#a3b45a", w: 8, boil: 0.8, seed: 1410 + c, taper: false });
      ctx.restore();
    }
    vinePath(FIT_PTS, K.E.out3(K.inv(T.snip + 0.05, T.snip + 0.6, t)), 1500, P.leaf, 6);
    /* snip flash */
    const f = K.inv(T.snip, T.snip + 0.45, t);
    if (f < 1) for (let i = 0; i < 6; i++) { const a = (i / 6) * K.TAU + 0.3, r = 30 + 110 * f; K.sparkle(ctx, SNIP_PT[0] + Math.cos(a) * r, SNIP_PT[1] + Math.sin(a) * r, 22 * (1 - f), 1 - f, 1600 + i); }
    if (f < 1) K.cross(ctx, SNIP_PT[0] + 40, SNIP_PT[1] - 70, 30, K.inv(T.snip, T.snip + 0.25, t) * (1 - f * f), 1620);
  }
  /* sprout leaves on the pot */
  const sp = K.inv(T.sprout, T.sprout + 0.35, t);
  if (sp > 0) { const s = K.E.back(sp, 2.6); K.leaf(ctx, POT_TOP[0], POT_TOP[1] + 2, -2.4, 0.9 * s, 1700); K.leaf(ctx, POT_TOP[0], POT_TOP[1] + 2, -0.75, 0.9 * s, 1701); }
  /* pot squashes when the seed lands */
  const ls = t > T.land ? Math.exp(-(t - T.land) * 9) * Math.sin((t - T.land) * 30) * 0.35 : 0;
  K.pot(ctx, ST_A.pot, BENCH_Y, 1, { seed: 1720, squash: ls });
  /* soil puff */
  for (let i = 0; i < 3; i++) K.puff(ctx, POT_TOP[0] + (i - 1) * 40, POT_TOP[1] - 6, 18, K.inv(T.land, T.land + 0.6, t) * (0.7 + 0.15 * i), 1730 + i);
  /* beakers on the bench (props) */
  K.beaker(ctx, 465, BENCH_Y, 0.9, P.test, 1740);
  K.beaker(ctx, 545, BENCH_Y, 0.7, P.glass, 1745);
  /* train-accuracy gauge: climbs into the red while the vine overfits, drops back after the snip */
  const ga = K.inv(T.gauge, T.gauge + 0.4, t);
  if (ga > 0) {
    const acc = t < T.snip ? 0.55 + 0.2 * K.inv(T.gauge, T.vine[0], t) + 0.24 * K.inv(T.vine[0], T.vine[1], t) : K.lerp(0.99, 0.74, K.E.out3(K.inv(T.snip, T.snip + 0.6, t)));
    K.line(ctx, [[300, BENCH_Y - 120], [300, BENCH_Y]], { stroke: P.brassDark, w: 14, boil: 0.5, seed: 1750, taper: false });
    K.gauge(ctx, 300, BENCH_Y - 230, 105, (acc - 0.5) * 2, { a: ga, readout: Math.round(acc * 100) + "%", seed: 1760 });
  }
}

/* walk-forward folds: train grows, test is the next slice */
const FOLD_N = 5;
function drawStationB(t) {
  K.lamp(ctx, 2470, 40, { seed: 2000, len: 260, on: lampsOn(t), sway: Math.sin(t * 1.3) * 8 });
  ST_B.flasks.forEach((fx, i) => {
    const a = K.inv(T.flasks + (i * BEAT) / 4, T.flasks + (i * BEAT) / 4 + 0.35, t);
    if (a <= 0) return;
    const s = 1.05 * K.E.back(a, 2.4), tick = T.ticks + (i * BEAT) / 2, tk = K.inv(tick, tick + 0.3, t);
    K.flask(ctx, fx, BENCH_Y, s, { seed: 2100 + i * 20, layers: [{ h: 0.24 + 0.1 * i, color: P.train }, { h: 0.16, color: P.test }], bubbles: 3, glowA: tk > 0 ? 0.6 * (1 - K.inv(tick + 0.3, tick + 1.2, t)) + 0.15 : 0 });
    /* fold strip on the bench edge: [train | test] along time */
    const sx = fx - 80, sy = BENCH_Y + 2, u = 160 / 7;
    ctx.save(); ctx.translate(fx, sy + 14); ctx.scale(K.E.back(a, 2.4), K.E.back(a, 2.4)); ctx.translate(-fx, -(sy + 14));
    K.shape(ctx, K.rectPts(sx - 6, sy, 172, 28, 4), { fill: P.paper, w: 3, boil: 0.5, seed: 2200 + i });
    K.shape(ctx, K.rectPts(sx, sy + 6, u * (2 + i), 16, 2), { fill: P.train, stroke: null, w: 0, boil: 0.4, seed: 2210 + i });
    K.shape(ctx, K.rectPts(sx + u * (2 + i), sy + 6, u, 16, 2), { fill: P.test, stroke: null, w: 0, boil: 0.4, seed: 2220 + i });
    ctx.restore();
    K.check(ctx, fx + 4, BENCH_Y - 330 - 6 * K.pulse(t, 1), 38, tk, 2300 + i * 3);
  });
}

function drawStationC(t) {
  const gT = K.inv(T.grow - 0.05, T.grow + BEAT * 3.2, t) * 3, gN = K.inv(T.grow + BEAT * 0.5, T.grow + BEAT * 3.6, t) * 4;
  const potA = K.inv(T.grow - 0.3, T.grow, t);
  if (potA > 0) {
    const s = K.E.back(potA, 2.2);
    K.treePlant(ctx, ST_C.tree, BENCH_Y - 118 * s, 0.8, { grow: gT, depth: 3, seed: 2500, spread: 270, ratio: 2.1, levelH: 86, leaves: ["0.2", "0.7", "0.4", "0.9", "0.1", "0.6", "0.3", "0.8"], hot: t > T.seedUp ? 3 : -1 });
    K.pot(ctx, ST_C.tree, BENCH_Y, 1.0 * s, { seed: 2560 });
    const pulse = t > T.show ? ((t - T.show) / (BEAT * 4)) % 1 : -1;
    K.netVine(ctx, ST_C.net, BENCH_Y - 400, 0.95, { layers: [3, 4, 4, 2], grow: gN, seed: 2600, w: 420, h: 300, pulse });
    K.pot(ctx, ST_C.net, BENCH_Y, 1.0 * s, { seed: 2660, color: P.glassDark, shadow: P.glassDeep });
  }
}

/* ============================================================
   INTRO 30 OWL: Professor Strix's choreography.
   Arms are IK targets keyed in owl-local space ([t, x, y, hand, hold]);
   positions ease between keys, hand shape and held prop switch at keys.
   Every big move lands on a downbeat, with anticipation before it.
   ============================================================ */
const holdShears = (ctx) => { const o = 1 - K.inv(T.snip - 0.05, T.snip, K.now); K.shears(ctx, 6, 0, -0.1, o * (K.now > T.snip - 0.4 ? 1 : 0.3), 1.1, 3010); };
const holdFlask = (ctx) => K.flask(ctx, 10, 40, 0.42, { seed: 3020, rot: -2.2, layers: [{ h: 0.5, color: P.glass }], cork: false });
const holdLens = (ctx) => K.magnifier(ctx, -10, 0, 0, 0.9, 3030);
const holdCan = (ctx) => K.wateringCan(ctx, 30, 30, 0.35, 0.8, 3040);
const holdSeed = (ctx) => K.seed(ctx, 26, -34, 32, { seed: 3050, glow: 0.8 + 0.2 * K.pulse(K.now, 1), rot: Math.sin(K.now * 3) * 0.2 });

/* [time, x, y, hand, hold] (owl-local, scale 1) */
const R_KEYS = [
  [0, 120, -130, "fist"], [T.swivel, 120, -130, "open"],
  [T.wave[0], 150, -360, "open"], [T.wave[1] - 0.25, 150, -360, "open"],
  [T.gauge - 0.2, 120, -150, "open"], [T.dance1[1], 120, -150, "open"],
  [T.pocket, -48, -170, "fist"], [T.toss - 0.1, -48, -175, "fist"],
  [T.toss, -150, -400, "open"], [T.toss + 0.35, 110, -200, "open"],
  [T.sprout, 120, -150, "open"], [T.worry - 0.1, 120, -150, "open"],
  [T.worry, 96, -300, "open"], [T.snip - 0.35, 96, -300, "hold", holdShears],
  [T.snip + 0.75, 125, -140, "open"],
  [T.band - 0.15, 125, -140, "point"], [T.band + 0.1, 46, -312, "point"], [T.band + 0.5, 46, -312, "point"], [T.truck1[0], 125, -140, "open"],
  [T.truck1[1] - 0.3, 20, -210, "hold", holdLens], [T.ticks + 0.45, 20, -210, "hold", holdLens],
  [T.ticks + 0.7, 200, -230, "point"], [T.jump[0] - 0.2, 200, -230, "point"],
  [T.jump[0], 110, -90, "fist"], [T.jump[1], 150, -300, "open"],
  [T.grow + 0.8, 230, -210, "open"], [T.title - 0.25, 140, -150, "open"],
  [T.title, 190, -440, "open"], [T.title + 0.9, 160, -250, "open"],
  [T.show, -40, -160, "open"], [T.show + 0.7, -40, -160, "open"],
  [T.thumb - 0.2, 150, -290, "thumb"], [T.seedUp - 0.4, 150, -290, "thumb"],
  [T.seedUp, 150, -330, "hold", holdSeed], [DUR, 155, -340, "hold", holdSeed],
];
const L_KEYS = [
  [0, -120, -130, "fist"], [T.swivel, -120, -130, "open"],
  [T.gauge, -360, -270, "point"], [T.gauge + 1.2, -360, -270, "point"], [T.dance1[0], -125, -140, "open"],
  [T.pour[0] - 0.3, -125, -130, "open"],
  [T.pour[0], -175, -330, "hold", holdFlask], [T.pour[1], -175, -330, "hold", holdFlask],
  [T.pour[1] + 0.3, -125, -140, "open"], [T.worry - 0.1, -125, -140, "open"],
  [T.worry, -96, -300, "open"], [T.snip - 0.3, -96, -300, "open"],
  [T.snip, -120, -190, "fist"], [T.wag[0] - 0.15, -120, -190, "fist"],
  [T.wag[0], -125, -390, "point"], [T.wag[1], -125, -390, "point"],
  [T.wag[1] + 0.3, -125, -140, "open"], [T.ticks + 0.5, -125, -140, "open"],
  [T.ticks + 0.75, -160, -290, "thumb"], [T.jump[0] - 0.2, -160, -290, "thumb"],
  [T.jump[0], -110, -90, "fist"], [T.jump[1], -150, -300, "open"],
  [T.grow + 0.25, -330, -250, "hold", holdCan], [T.title - 0.4, -330, -250, "hold", holdCan],
  [T.title - 0.15, -140, -150, "open"], [T.title, -190, -440, "open"], [T.title + 0.9, -160, -250, "open"],
  [T.show, -230, -200, "open"], [T.show + 0.8, -230, -200, "open"],
  [T.show + 1.2, -125, -140, "open"], [T.seedUp, -150, -200, "open"], [DUR, -150, -205, "open"],
];
function armAt(keys, t) {
  let i = 0; while (i < keys.length - 1 && t >= keys[i + 1][0]) i++;
  const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
  const u = b[0] > a[0] ? K.E.inOut(K.inv(a[0], b[0], t)) : 0;
  return { x: K.lerp(a[1], b[1], u), y: K.lerp(a[2], b[2], u), hand: a[3], hold: a[4] };
}

const owlX = K.mkTrack([[0, { x: ST_A.owl }], [T.truck1[0], { x: ST_A.owl }], [T.truck1[1], { x: ST_B.owl }], [T.jump[0], { x: ST_B.owl }], [T.jump[1], { x: ST_C.owl }]]);
const OWL_S = (t) => (t < T.jump[0] ? 1.22 : 1.06);

function owlState(t) {
  const x = owlX(t).x, s = OWL_S(t);
  let y = BENCH_Y, hop = 0, squash = 0.07 * K.pulse(t, 1), lean = 0, tilt = 0, walk = 0;
  /* jump to station C: crouch, stretch in the air, splat on landing */
  const ju = K.inv(T.jump[0], T.jump[1], t);
  if (ju > 0 && ju < 1) { y -= Math.sin(ju * Math.PI) * 300; squash = -0.3 * Math.sin(ju * Math.PI); }
  if (t > T.jump[0] - 0.22 && t < T.jump[0]) squash = 0.35 * K.inv(T.jump[0] - 0.22, T.jump[0] - 0.05, t);
  if (t > T.jump[1]) squash += 0.45 * Math.exp(-(t - T.jump[1]) * 7) * Math.cos((t - T.jump[1]) * 22);
  /* toss + snip + title punches */
  [[T.toss, 0.25], [T.snip, 0.3], [T.land, 0.12], [T.show, 0.2]].forEach(([tt, k]) => { if (t > tt) squash += k * Math.exp(-(t - tt) * 8) * Math.cos((t - tt) * 20); });
  const th = K.inv(T.title, T.title + 0.42, t);
  if (th > 0 && th < 1) { hop = Math.sin(th * Math.PI) * 60; squash = -0.25 * Math.sin(th * Math.PI); }
  if (t > T.title + 0.42) squash += 0.35 * Math.exp(-(t - T.title - 0.42) * 8) * Math.cos((t - T.title - 0.42) * 20);
  /* walk to the flasks */
  const wu = K.inv(T.truck1[0], T.truck1[1], t);
  if (wu > 0 && wu < 1) { walk = (t - T.truck1[0]) * 15; hop = Math.abs(Math.sin(walk)) * 12; lean = 6; }
  /* bow on "steal the show" */
  const bw = K.inv(T.show, T.show + 0.25, t) * (1 - K.inv(T.show + 0.7, T.show + 1.0, t));
  lean += -12 * K.E.inOut(bw); tilt += 14 * K.E.inOut(bw);
  /* head */
  let yaw = 0;
  if (t < T.swivel) yaw = 180;
  else if (t < T.swivel + 0.4) yaw = 180 * (1 - K.E.back(K.inv(T.swivel, T.swivel + 0.4, t), 1.6));
  const spin = K.inv(T.jump[1] + 0.05, T.jump[1] + 0.5, t);
  if (spin > 0 && spin < 1) yaw = 360 * K.E.inOut(spin);
  const worry = K.inv(T.worry, T.worry + 0.15, t) * (1 - K.inv(T.snip, T.snip + 0.2, t));
  const wag = t > T.wag[0] && t < T.wag[1];
  if (wag) tilt += 9 * Math.sin((t - T.wag[0]) * 14);
  if (t > T.band && t < T.truck1[0]) tilt -= 8 * K.inv(T.band, T.band + 0.3, t);
  if (t > T.seedUp) tilt += 6 * K.inv(T.seedUp, T.seedUp + 0.4, t);
  /* face */
  let look = [0, 0.1];
  if (t > T.land - 0.6 && t < T.vine[0]) look = [-1, 0.5];
  else if (t >= T.vine[0] && t < T.snip + 0.6) look = [-0.9, -0.4];
  else if (t >= T.band && t < T.truck1[0]) look = [-0.8, -0.3];
  else if (t >= T.truck1[0] && t < T.jump[0]) look = [1, 0];
  else if (t >= T.grow + 0.2 && t < T.grow + 1.2) look = [-1, 0.2];
  else if (t >= T.grow + 1.2 && t < T.title) look = [1, 0];
  else if (t >= T.seedUp && t < T.wink - 0.1) look = [0.6, -1];
  else if (t >= T.gauge && t < T.gauge + 1.4) look = [-1, 0.2];
  const swivelPop = K.inv(T.swivel + 0.2, T.swivel + 0.35, t) * (1 - K.inv(T.swivel + 0.8, T.swivel + 1.1, t));
  const titlePop = K.inv(T.title, T.title + 0.2, t) * (1 - K.inv(T.title + 0.9, T.title + 1.3, t));
  let mouth = "smile";
  if (worry > 0.3) mouth = "o"; else if (wag) mouth = "open"; else if (t > T.snip && t < T.snip + 0.8) mouth = "grin";
  else if (titlePop > 0.3) mouth = "open"; else if (t > T.show && t < T.show + 1.1) mouth = "grin";
  if (t > T.dance1[0] && t < T.dance1[1]) mouth = "grin";
  const forceOpen = worry > 0 || swivelPop > 0 || titlePop > 0 || (t > T.seedUp && t < T.wink);
  let wingR = armAt(R_KEYS, t), wingL = armAt(L_KEYS, t);
  if (t > T.wave[0] && t < T.wave[1] - 0.25) wingR.x += 26 * Math.sin((t - T.wave[0]) * 15);
  if (wag) wingL.x += 22 * Math.sin((t - T.wag[0]) * 14);
  /* the snip: the shears go to the vine, in owl-local space */
  if (wingR.hold === holdShears) {
    const sx = (SNIP_PT[0] - x) / s - 70, sy = (SNIP_PT[1] - y) / s + 20;
    const kin = K.E.inOut(K.inv(T.snip - 0.35, T.snip - 0.05, t)), kout = K.E.inOut(K.inv(T.snip + 0.35, T.snip + 0.75, t));
    const from = kout > 0 ? [125, -140] : [96, -300], k = kin * (1 - kout);
    wingR.x = K.lerp(from[0], sx, k); wingR.y = K.lerp(from[1], sy, k);
  }
  /* back turned at the bench: tinkering in time with the music */
  if (t < T.swivel) { const k = Math.sin(t * Math.PI / BEAT); wingR.x += 18 * k; wingR.y += 12 * Math.abs(k); wingL.x += 18 * k; wingL.y += 12 * Math.abs(k); tilt += 5 * Math.sin(t * Math.PI / (BEAT * 2)); hop += 8 * K.pulse(t, 1, 6); }
  /* swing dance: arms swap up / down on every beat, lean side to side, hop */
  if (t > T.dance1[0] && t < T.dance1[1]) {
    const b = K.beatIndex(t), p = b % 2 ? 1 : -1, pu = K.pulse(t, 1, 5);
    wingR = { x: 160, y: (p > 0 ? -420 : -110) + 30 * pu, hand: "open" }; wingL = { x: -160, y: (p > 0 ? -110 : -420) + 30 * pu, hand: "open" };
    lean += 9 * p; hop += 26 * pu; squash += 0.1 - 0.15 * pu; walk = b * Math.PI * 0.5;
  }
  /* the final hit: a little ta-da hop */
  const fh = K.inv(T.finale, T.finale + 0.4, t);
  if (fh > 0 && fh < 1) { hop += Math.sin(fh * Math.PI) * 50; squash = -0.22 * Math.sin(fh * Math.PI); }
  if (t > T.finale + 0.4) squash += 0.3 * Math.exp(-(t - T.finale - 0.4) * 8) * Math.cos((t - T.finale - 0.4) * 20);
  /* idle sway */
  wingR.y += 4 * Math.sin(t * 2.2); wingL.y += 4 * Math.sin(t * 2.2 + 1);
  return {
    x, y, s,
    st: { squash, hop, lean, tilt, yaw, walk, look, mouth, wingR, wingL,
      blink: forceOpen ? 0 : K.blinkAt(t, 5), wink: t > T.wink ? "L" : null,
      eyeUp: Math.max(worry, swivelPop * 0.6, titlePop * 0.5), tufts: Math.max(worry, swivelPop, titlePop),
      brow: worry > 0 ? 1.2 * worry : wag ? -0.8 : t > T.band && t < T.truck1[0] ? 0.6 : 0,
      exclaim: K.inv(T.worry, T.worry + 0.3, t) * (1 - K.inv(T.snip - 0.1, T.snip, t)), seed: 700 },
  };
}
/* world position of a hand target (IK reaches it exactly: the arms stretch) */
const handWorld = (o, w) => [o.x + o.s * w.x, o.y + o.s * (w.y - (o.st.hop || 0))];

function drawOwl(t) {
  const o = owlState(t);
  /* spotlight on "steal the show" */
  const sp = K.inv(T.show - 0.1, T.show + 0.2, t);
  if (sp > 0) { K.glow(ctx, o.x, o.y - 230, 420, "rgba(255,240,190,0.5)", sp * (0.8 + 0.2 * K.pulse(t, 1))); }
  /* shadow on the bench */
  ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = P.woodDark; ctx.beginPath(); ctx.ellipse(o.x, BENCH_Y + 4, 120 * o.s * (1 - (BENCH_Y - o.y) / 900), 14, 0, 0, K.TAU); ctx.fill(); ctx.restore();
  K.owl(ctx, o.x, o.y, o.s, o.st);
  /* seed in flight: from the flinging hand to the pot */
  const fu = K.inv(T.toss, T.land, t);
  if (fu > 0 && fu < 1) {
    const h0 = handWorld({ x: ST_A.owl, y: BENCH_Y, s: OWL_S(0), st: {} }, { x: -150, y: -400 });
    const sx = K.lerp(h0[0], POT_TOP[0], fu), sy = K.lerp(h0[1], POT_TOP[1] - 4, fu) - Math.sin(fu * Math.PI) * 220;
    K.seed(ctx, sx, sy, 22, { seed: 3060, rot: fu * 9, glow: 0.7 });
    for (let i = 1; i < 4; i++) { const u2 = Math.max(0, fu - i * 0.06); K.dot(ctx, K.lerp(h0[0], POT_TOP[0], u2), K.lerp(h0[1], POT_TOP[1], u2) - Math.sin(u2 * Math.PI) * 220, 5 - i, P.brassLight, null, 0, 3070 + i); }
  }
  /* data drizzle from the flask: little digits of light falling into the pot */
  const pu = K.inv(T.pour[0] + 0.15, T.pour[1], t);
  if (pu > 0 && pu < 1) {
    const h = handWorld(o, { x: -175, y: -330 }), mouthX = h[0] - 70, mouthY = h[1] + 40;
    for (let i = 0; i < 14; i++) {
      const ph = ((t * 2.2 + i / 14) % 1), dx = K.lerp(mouthX, POT_TOP[0] + 10, ph), dy = K.lerp(mouthY, POT_TOP[1], ph) - Math.sin(ph * Math.PI) * 120;
      K.dot(ctx, dx, dy, 6, i % 3 ? P.glass : P.brassLight, P.ink, 2, 3100 + i);
    }
  }
  /* water drops from the can to the tree pot */
  const wu = K.inv(T.grow + 0.35, T.title - 0.45, t);
  if (wu > 0 && wu < 1) {
    const h = handWorld(o, { x: -330, y: -250 }), x0 = h[0] - 120, y0 = h[1] - 40;
    for (let i = 0; i < 10; i++) {
      const ph = ((t * 2.6 + i / 10) % 1), dx = K.lerp(x0, ST_C.tree + 40, ph), dy = K.lerp(y0, BENCH_Y - 130, ph) - Math.sin(ph * Math.PI) * 50;
      K.shape(ctx, [[dx, dy - 9], [dx + 5, dy + 2], [dx, dy + 6], [dx - 5, dy + 2]], { fill: P.pane, w: 2.4, boil: 0.4, seed: 3200 + i });
    }
  }
  return o;
}

/* ============================================================
   INTRO 40 TITLE: art-deco marquee drops on "Modern ML for Trading",
   DOM letters fall into it, bulbs chase on eighth notes, five episode
   medals pop on "steal the show". Title text is DOM (crisp, per language);
   the marquee is canvas ink in screen space.
   ============================================================ */
const MQ = { cx: 860, cy: 196, w: 1140, h: 246 }; /* shifted left: the marketmaker.cc plate owns the top-right corner */
const MEDAL_Y = 952, MEDAL_R = 50;
function marqueeDrop(t) {
  const u = K.inv(T.title, T.title + 0.55, t);
  if (u <= 0) return null;
  const y = -560 * (1 - K.E.back(u, 1.5)), d = t - T.title;
  return { y, rot: 0.035 * Math.exp(-d * 2.5) * Math.sin(d * 9) };
}

/* five episode icons, language-free: anomaly, AutoML, Bayesian, conformal band, diffusion */
const ICONS = [
  (c, r) => { K.line(c, [[-r * 0.6, r * 0.2], [-r * 0.25, r * 0.15], [-r * 0.05, -r * 0.55], [r * 0.12, r * 0.2], [r * 0.6, r * 0.1]], { stroke: P.paper, w: 4, boil: 0.4, seed: 1 }); K.dot(c, -r * 0.05, -r * 0.55, r * 0.12, P.bad, P.ink, 2, 2); },
  (c, r) => { for (let i = 0; i < 8; i++) { const a = (i / 8) * K.TAU; K.line(c, [[Math.cos(a) * r * 0.32, Math.sin(a) * r * 0.32], [Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55]], { stroke: P.paper, w: 6, boil: 0.3, seed: 10 + i, taper: false }); } K.dot(c, 0, 0, r * 0.34, P.paper, P.ink, 2.5, 19); K.dot(c, 0, 0, r * 0.12, P.glassDeep, P.ink, 2, 20); },
  (c, r) => { const p = []; for (let i = 0; i <= 12; i++) { const x = -0.6 + (i / 12) * 1.2; p.push([x * r, r * 0.4 - Math.exp(-x * x * 9) * r * 0.85]); } K.line(c, p, { stroke: P.paper, w: 4.5, boil: 0.4, seed: 30 }); },
  (c, r) => { c.save(); c.globalAlpha = 0.55; c.fillStyle = P.glass; c.beginPath(); c.moveTo(-r * 0.6, r * 0.05); c.lineTo(r * 0.6, -r * 0.45); c.lineTo(r * 0.6, -r * 0.05); c.lineTo(-r * 0.6, r * 0.45); c.closePath(); c.fill(); c.restore(); K.line(c, [[-r * 0.6, r * 0.25], [r * 0.6, -r * 0.25]], { stroke: P.paper, w: 4.5, boil: 0.4, seed: 40 }); },
  (c, r) => { for (let i = 0; i < 9; i++) K.dot(c, K.hs(i, 3) * r * 0.5 - r * 0.15, K.hs(i, 4) * r * 0.5, r * 0.07, P.paper, null, 0, 50 + i); K.line(c, [[r * 0.05, 0], [r * 0.32, 0]], { stroke: P.brassLight, w: 3.5, boil: 0.3, seed: 60 }); K.dot(c, r * 0.48, 0, r * 0.14, P.brassLight, P.ink, 2, 61); },
];
const MEDAL_COLORS = [P.bad, P.glassDeep, P.copper, P.glassDark, P.owlDark];

function drawTitleCanvas(t) {
  K.screen(ctx);
  const m = marqueeDrop(t);
  if (m) {
    ctx.save(); ctx.translate(MQ.cx, MQ.cy + m.y); ctx.rotate(m.rot); ctx.translate(-MQ.cx, -MQ.cy);
    K.marquee(ctx, MQ.cx, MQ.cy, MQ.w, MQ.h, 1, { seed: 560, chase: Math.floor((t - T.title) / (BEAT / 2)) });
    ctx.restore();
  }
  for (let i = 0; i < 5; i++) {
    const t0 = T.show + (i * BEAT) / 2, a = K.inv(t0, t0 + 0.35, t);
    if (a <= 0) continue;
    const s = K.E.back(a, 2.6), x = MQ.cx + (i - 2) * 150, y = MEDAL_Y + 5 * Math.sin(t * 2.4 + i) - 8 * K.pulse(t - i * 0.06, 1, 6);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    K.medal(ctx, 0, 0, MEDAL_R, { seed: 600 + i * 7, color: MEDAL_COLORS[i], icon: ICONS[i] });
    ctx.restore();
  }
  return m;
}

function layoutTitleDom(t, m) {
  titleEl.style.opacity = m ? "1" : "0";
  if (!m) return;
  const n = TITLE_LN.length, sizes = TITLE_LN.map((d) => +d.dataset.size), gap = 6;
  const total = sizes.reduce((a, b) => a + b, 0) * 1.12 + gap * (n - 1);
  let y = MQ.cy + m.y - total / 2;
  TITLE_LN.forEach((d, i) => { d.style.left = (MQ.cx - 960) + "px"; d.style.top = y.toFixed(1) + "px"; d.style.transform = `rotate(${(m.rot * 57.3).toFixed(2)}deg)`; d.style.transformOrigin = "960px " + (MQ.cy + m.y - y).toFixed(0) + "px"; y += sizes[i] * 1.12 + gap; });
  TITLE_CH.forEach((c) => {
    const t0 = T.letters + c.idx * 0.03, a = K.inv(t0, t0 + 0.38, t);
    const yy = (1 - K.E.back(a, 2.2)) * -120, land = K.inv(t0 + 0.26, t0 + 0.5, t);
    const sq = Math.sin(land * Math.PI) * 0.18 * (1 - land);
    const beatHop = -5 * K.pulse(t, 2, 6) * K.inv(T.show, T.show + 0.2, t) * (c.line === n - 1 ? 1 : 0);
    c.el.style.opacity = a > 0 ? Math.min(1, a * 3).toFixed(2) : "0";
    c.el.style.transform = `translateY(${(yy + beatHop).toFixed(1)}px) scale(${(1 + sq).toFixed(3)}, ${(1 - sq).toFixed(3)})`;
  });
}

/* ============================================================
   INTRO 70 RENDER: render(t) is the whole film (26.6 s, the short song).
   One paused GSAP timeline drives a proxy whose setter calls render(t).
   0.0 - 3.6   deco iris opens on a dark lab; lamps flicker on; owl's back to us
   3.61        head swivels 180 to face us, waves; 5.41 train-accuracy gauge
   7.22        a bar of swing dance
   9.02 - 10.8 data seed tossed into the pot, data drizzle, sprout, data points
   11.7 - 14.4 "Fit it RIGHT, don't overfit": overfit vine -> snip -> smooth fit -> band
   15.3 - 16.2 truck to the flasks; "Validate every little bit": ticks
   17.0 - 17.9 leap to the garden bench; "Trees and nets that learn and grow"
   19.85       marquee title "Modern ML for Trading"; 21.65 "steal the show": bow, medals
   23.46       "An owl in a lab with a data seed": seed held high, wink; 25.26 final hit
   The marketmaker.cc plate (DOM, top-right) stays on screen the whole time.
   ============================================================ */
function drawIris(t) {
  const u = K.inv(T.iris[0], T.iris[1], t);
  if (u >= 1) return;
  const r = 1250 * K.E.inOut(u) + 2, cx = 1180, cy = 460;
  K.screen(ctx); ctx.save();
  ctx.fillStyle = "#16100a"; ctx.beginPath(); ctx.rect(-10, -10, 1940, 1100); ctx.arc(cx, cy, r, 0, K.TAU, true); ctx.fill("evenodd");
  /* brass deco ring with rays */
  ctx.lineWidth = 18; ctx.strokeStyle = P.brass; ctx.beginPath(); ctx.arc(cx, cy, r + 9, 0, K.TAU); ctx.stroke();
  ctx.lineWidth = 4; ctx.strokeStyle = P.ink; ctx.beginPath(); ctx.arc(cx, cy, r + 20, 0, K.TAU); ctx.stroke();
  for (let i = 0; i < 24; i++) { const a = (i / 24) * K.TAU + u; ctx.strokeStyle = P.brassDark; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (r + 26), cy + Math.sin(a) * (r + 26)); ctx.lineTo(cx + Math.cos(a) * (r + 60), cy + Math.sin(a) * (r + 60)); ctx.stroke(); }
  ctx.restore();
}

/* 1930s print: flicker and a few hairline scratches, stepped at the boil rate */
function drawFilm(t) {
  const f = K.boilFrame(t);
  flickEl.style.opacity = (0.02 + 0.05 * K.hash(f, 77)).toFixed(3);
  K.screen(ctx); ctx.save();
  for (let i = 0; i < 2; i++) {
    if (K.hash(f * 3 + i, 91) > 0.3) continue;
    const x = 80 + K.hash(f * 5 + i, 92) * 1760, y0 = K.hash(f * 7 + i, 93) * 500, len = 200 + K.hash(f + i, 94) * 600;
    ctx.globalAlpha = 0.28; ctx.strokeStyle = "#fff6dc"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + 6 * K.hs(f, 95), y0 + len); ctx.stroke();
  }
  ctx.restore();
  grainEl.style.backgroundPosition = ((f % 7) * 37) + "px " + ((f % 5) * 53) + "px";
}

function render(t) {
  try {
    K.begin(ctx, t, cam(t));
    drawLab(t);
    K.applyCam(ctx, 1);
    drawOwl(t);
    drawForeground();
    /* the lab before the lamps come on */
    const dark = 1 - lampsOn(t);
    if (dark > 0) { K.screen(ctx); ctx.fillStyle = `rgba(26,16,6,${(0.62 * dark).toFixed(3)})`; ctx.fillRect(0, 0, 1920, 1080); }
    const m = drawTitleCanvas(t);
    layoutTitleDom(t, m);
    drawIris(t);
  } catch (err) {
    K.screen(ctx); ctx.fillStyle = "#300"; ctx.fillRect(0, 0, 1920, 80); ctx.fillStyle = "#fff"; ctx.font = "28px monospace"; ctx.fillText(String(err && err.stack || err).slice(0, 140), 20, 50);
  }
  drawFilm(t);
  /* the marketmaker.cc plate: one small bounce on the second downbeat, then static */
  const lb = t > K.at(1) ? Math.exp(-(t - K.at(1)) * 7) * Math.sin((t - K.at(1)) * 18) : 0;
  logoEl.style.transform = `scale(${(1 + 0.08 * lb).toFixed(3)})`;
}

const grainEl = document.getElementById("grain"), flickEl = document.getElementById("flick"), logoEl = document.getElementById("logo");
grainEl.style.backgroundImage = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .38  0 0 0 0 .22  0 0 0 1.5 -.25'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>\")";

const TL = gsap.timeline({ paused: true });
const drv = { _t: 0 };
Object.defineProperty(drv, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
TL.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
render(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(drv._t));
window.__timelines["main"] = TL;
window.__render = render;

})();
    </script>
  </body>
