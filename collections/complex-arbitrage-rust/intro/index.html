    <script>
(function () {
/* ============================================================
   KIT 00 CORE: math, seeded random, noise, splines, beat grid, boil clock
   Every frame is a pure function of time t (seconds). No Math.random,
   no Date.now, no performance.now anywhere in the kit.
   ============================================================ */
var CK = window.CK || (window.CK = {});
(function (K) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const ss = (a, b, t) => { const u = inv(a, b, t); return u * u * (3 - 2 * u); };
  const f1 = (n) => Math.round(n * 10) / 10;
  const f2 = (n) => Math.round(n * 100) / 100;

  /* eases (u in 0..1) */
  const E = {
    inOut: (u) => u * u * (3 - 2 * u),
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    back: (u, s) => { s = s == null ? 1.7 : s; const v = u - 1; return 1 + v * v * ((s + 1) * v + s); },
    elastic: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
  };
  /* tween value from a to b during [t0, t1] with an ease */
  const tw = (t, t0, t1, a, b, ease) => lerp(a, b, (ease || E.inOut)(inv(t0, t1, t)));

  /* seeded PRNG (mulberry32) */
  function mulberry(seed) {
    let s = seed | 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let q = Math.imul(s ^ (s >>> 15), 1 | s);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* stateless hash -> [0,1) for (i, seed) */
  function hash(i, s) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const hs = (i, s) => hash(i, s) * 2 - 1; /* signed */
  function vnoise(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s), hash(i + 1, s), u); }
  function fbm(x, s, oct) { let a = 0.5, v = 0, fr = 1, n = 0; for (let k = 0; k < (oct || 3); k++) { v += a * vnoise(x * fr, s + k * 17); n += a; a *= 0.5; fr *= 2.03; } return v / n; }

  /* monotone cubic Hermite spline through [[t, v], ...] (no overshoot) */
  function mkSpline(pts) {
    const n = pts.length, T = pts.map((p) => p[0]), V = pts.map((p) => p[1]);
    if (n === 1) return () => V[0];
    const d = [], m = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) d[i] = (V[i + 1] - V[i]) / (T[i + 1] - T[i]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
    }
    return function (x) {
      x = clamp(x, T[0], T[n - 1]);
      let i = 0; while (i < n - 2 && x >= T[i + 1]) i++;
      const h = T[i + 1] - T[i], u = (x - T[i]) / h, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * V[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * V[i + 1] + (u3 - u2) * h * m[i + 1];
    };
  }
  /* keys: [[t, {a:.., b:..}], ...] -> fn(t) -> {a, b} (one spline per channel) */
  function mkTrack(keys) {
    const names = Object.keys(keys[0][1]), sp = {};
    names.forEach((k) => { sp[k] = mkSpline(keys.map((q) => [q[0], q[1][k]])); });
    return (t) => { const o = {}; names.forEach((k) => (o[k] = sp[k](t))); return o; };
  }

  /* ---------- beat grid (retime to the real song by changing BPM/OFFSET or BARS) ----------
     BARS: optional list of measured downbeat times (seconds). Songs cut from
     several takes drift a few ms per splice, so measured downbeats beat a
     single OFFSET. Past the list, bars extrapolate at BPM. */
  const G = { BPM: 120, OFFSET: 0, BEATS_PER_ACCENT: 4, BARS: null };
  const beatLen = () => 60 / G.BPM;
  const barLen = () => beatLen() * G.BEATS_PER_ACCENT;
  function barStart(b) {
    const B = G.BARS;
    if (!B || !B.length) return G.OFFSET + b * barLen();
    if (b < 0) return B[0] + b * barLen();
    if (b < B.length) return B[b];
    return B[B.length - 1] + (b - B.length + 1) * barLen();
  }
  /* time of bar b (0-based, an "accent" = 4 beats) plus beat k (fractional ok) */
  const at = (bar, beat) => barStart(Math.floor(bar)) + ((bar - Math.floor(bar)) * G.BEATS_PER_ACCENT + (beat || 0)) * beatLen();
  /* index of the bar containing t (-1 before the first downbeat) */

    if (t < barStart(0)) return -1;
    let b = 0; while (barStart(b + 1) <= t) b++;
    return b;
  }
  /* 1 on the beat, decaying to 0 before the next beat (k = sharpness) */

    const b = barAt(t); if (b < 0) return 0;
    const L = beatLen() * (everyBeats || 1), x = t - barStart(b);

  }

  /* ---------- line boil clock: drawings change 12 times per second ---------- */
  const BOIL_FPS = 12;
  const boilFrame = (t) => Math.floor(t * BOIL_FPS);

  Object.assign(K, { clamp, lerp, inv, ss, f1, f2, E, tw, mulberry, hash, hs, vnoise, fbm, mkSpline, mkTrack,
    G, beatLen, barLen, barStart, barAt, at, pulse, beatIndex, BOIL_FPS, boilFrame, TAU: Math.PI * 2 });
})(CK);

   ============================================================ */

    inkSoft: "#5a4334",    /* hatching, secondary lines */

    for (let i = 6; i >= 0; i--) edge.push([-w / 2 + hs(i + 60, o.seed) * 4, -h / 2 + (h * i) / 6]);

  /* ---------- slate board (formulas, 1-3 lines, chalk type) ---------- */
  K.slate = function (ctx, x, y, w, h, lines, opt) {
    const o = Object.assign({ a: 1, size: 56, seed: 31, write: 1, font: K.FONT.mono }, opt || {});
    const a = popS(o.a); if (a <= 0) return;

  /* ---------- chart painted on a sail-cloth ----------

  K.sailChart = function (ctx, x, y, w, h, series, opt) {
    const o = Object.assign({ a: 1, draw: 1, seed: 41, yMin: null, yMax: null, xLabels: [], title: "" }, opt || {});
    const a = popS(o.a); if (a <= 0) return;

    const pl = -w / 2 + 70, pr = w / 2 - 40, pt = -h / 2 + (o.title ? 80 : 40), pb = h / 2 - 60;

    K.line(ctx, [[pl, pb], [pr, pb]], { stroke: P.ink, w: 4, boil: 1, seed: o.seed + 8 });

    if (mn == null || mx == null) { const all = series.flatMap((s) => s.data); mn = mn == null ? Math.min(...all) : mn; mx = mx == null ? Math.max(...all) : mx; }
    const X = (i, n) => pl + 20 + ((pr - pl - 40) * i) / Math.max(1, n - 1), Y = (v) => pb - ((v - mn) / (mx - mn || 1)) * (pb - pt);
    series.forEach((s, si) => {
      const n = s.data.length, k = o.draw * (n - 1);
      if (s.kind === "bar") {

        s.data.forEach((v, i) => { const g = clamp(o.draw * n - i, 0, 1); if (g <= 0) return; const top = lerp(pb, Y(v), K.E.back(g, 1.4)); K.shape(ctx, K.rectPts(X(i, n) - bw / 2, top, bw, pb - top, 2), { fill: s.color, w: 3.5, boil: 1, seed: o.seed + 20 + i, hatch: { ang: 0.8, gap: 9, alpha: 0.25 } }); });

    ctx.restore();

    K.shape(ctx, K.rectPts(-w / 2 + 16, -h / 2 + 16, w - 32, h - 32, 4), { fill: P.paper, w: 3, boil: 1, seed: o.seed + 3 });

  const KW = /^(fn|let|mut|for|in|if|else|return|pub|struct|impl|use|match|while|loop|const|async|await|self|Self|where|break|continue)$/;
  K.logbook = function (ctx, x, y, w, lines, opt) {

    const a = popS(o.a); if (a <= 0) return;

    K.shape(ctx, K.rectPts(-w / 2, -h / 2, w, h, 4), { fill: P.paper, w: 4, boil: 1.1, seed: o.seed + 1, shade: { color: P.paperShade, dx: 14, dy: 0 } });
    K.line(ctx, [[0, -h / 2 + 6], [0, h / 2 - 6]], { stroke: P.paperShade, w: 3, boil: 1, seed: o.seed + 2, alpha: 0.4 });
    ctx.save(); ctx.font = `500 ${o.size}px ${K.FONT.mono}`; const cw = ctx.measureText("M").width; ctx.restore();

    lines.forEach((ln, i) => {

  K.banner = function (ctx, cx, cy, w, h, u, opt) {

/* ---------- opening + verse: helm, cap tip, spyglass, "!" ---------- */
function crabOpening(t) {
  const st = { seed: 500, blink: K.blinkAt(t, 3), mouth: "smile", look: [0.2, 0] };
  const bounce = pulseB(t);
  st.squash = 0.1 * bounce - 0.04;
  /* left claw on the helm wheel, right claw waves to the beat */
  st.clawL = { x: -72, y: -42 + 4 * Math.sin(t * 3), open: 0.15 };
  st.clawR = { x: 92, y: -70 - 18 * bounce, open: 0.3 + 0.4 * bounce };
  st.look = [Math.sin(t * 1.3) * 0.8, -0.1];
  /* "A crab sails out": tips the cap to us, wink-smile */
  const sal = win(t, T.salute, T.salute + 1.4, 0.3, 0.35);
  if (sal > 0) {
    st.clawR = { x: K.lerp(92, 62, sal), y: K.lerp(-70, -150, sal), open: 0.35, rot: K.lerp(-40, -150, sal) };
    st.hatLift = 18 * sal; st.hatTip = 14 * sal; st.look = [0, 0]; st.mouth = "grin";
    st.wink = K.ss(T.salute + 0.2, T.salute + 0.35, t) * (1 - K.ss(T.salute + 0.9, T.salute + 1.05, t));
  }
  /* "Rust-iron ship": proud knock on the rail */
  const rv = win(t, T.rivets, T.rivets + 1.2, 0.2, 0.3);
  if (rv > 0) { st.clawR = { x: 70, y: K.lerp(-70, -12, rv) + 10 * pulseB(t), open: 0.1 }; st.look = [0.6, 0.8]; st.mouth = "grin"; }
  /* "markets wide": looks around */
  if (t > T.pullOut[0] && t < T.spyUp - 0.6) st.look = [Math.sin((t - T.pullOut[0]) * 2.2), -0.5];
  /* anticipation then spyglass up */
  const up = K.ss(T.spyUp - 0.25, T.spyUp + 0.2, t);
  if (t > T.spyUp - 0.6) st.squash += 0.22 * K.ss(T.spyUp - 0.6, T.spyUp - 0.25, t) * (1 - up);
  if (up > 0) {
    st.hold = "spyglass";
    st.clawR = { x: K.lerp(92, 38, up), y: K.lerp(-70, -150, up), open: 0.05, rot: K.lerp(-30, -14, up) };
    st.look = [1, -0.6]; st.lean = -4 * up;
  }
  /* discovery: eyes pop, mouth open, a little hop */
  const pop = K.ss(T.spot - 0.08, T.spot + 0.06, t) * (1 - K.ss(T.spot + 0.5, T.spot + 0.9, t));
  if (t > T.spot - 0.1) {
    st.blink = 0; st.exclaim = K.inv(T.spot - 0.05, T.spot + 0.2, t) * (1 - K.inv(T.spot + 0.9, T.spot + 1.1, t)); st.eyeUp = 20 * pop; st.brow = 1.5 * pop; st.mouth = pop > 0.3 ? "open" : "o";
    st.hop = 18 * Math.max(0, Math.sin(K.inv(T.spot, T.spot + 0.35, t) * Math.PI));
    st.squash -= 0.25 * pop;
  }
  return st;
}

/* ---------- chorus: "sail with me!" beckon + wink ---------- */
function crabBeckon(t) {
  const b = pulseB(t), st = { seed: 500, blink: K.blinkAt(t, 23), mouth: "grin", look: [0, 0], squash: 0.1 * b - 0.03 };
  st.clawL = { x: -96, y: -50 - 10 * b, open: 0.25 };
  const curl = 0.5 + 0.5 * Math.sin((t - T.beckon) * Math.PI / K.beatLen()); /* "come here" on the beat */
  st.clawR = { x: 70 + 26 * curl, y: -120 + 30 * curl, open: 0.2 + 0.6 * (1 - curl), rot: -110 + 50 * curl };
  st.wink = K.ss(T.wink - 0.08, T.wink + 0.05, t) * (1 - K.ss(T.wink + 0.45, T.wink + 0.6, t));
  if (st.wink > 0.2) st.mouth = "smile";
  return st;
}

/* ---------- title card: haul the net, jump, snap, cap tip, wave ---------- */
function crabTitle(t) {
  const st = { seed: 500, blink: K.blinkAt(t, 9), mouth: "grin", look: [0.3, -0.5], squash: 0.08 * pulseB(t) - 0.03 };
  st.clawL = { x: -96, y: -50 - 10 * pulseB(t), open: 0.25 };
  st.clawR = { x: 96, y: -50 - 10 * pulseB(t + 0.25), open: 0.25 };
  /* "Haul in the spread": both claws on the rope, lean back on every beat */
  const hl = win(t, T.haul[0], T.haul[1], 0.3, 0.3);
  if (hl > 0) {
    const pull = pulseB(t);
    st.clawL = { x: K.lerp(-96, 70, hl), y: K.lerp(-50, -40 - 30 * pull, hl), open: 0.1 };
    st.clawR = { x: K.lerp(96, 110, hl), y: K.lerp(-50, -60 - 30 * pull, hl), open: 0.1 };
    st.lean = -10 * hl * (0.4 + 0.6 * pull); st.mouth = pull > 0.5 ? "open" : "grin"; st.look = [1, 0.3]; st.squash += 0.12 * pull * hl;
  }
  /* jump: crouch, stretch up, land squash */
  const j0 = T.jump - 0.3, j1 = T.jump + 0.55;
  if (t > j0 && t < j1 + 0.4) {
    const crouch = K.ss(j0, T.jump, t) * (1 - K.ss(T.jump, T.jump + 0.05, t));
    const air = K.inv(T.jump, j1, t), h = Math.sin(air * Math.PI);
    st.squash += 0.35 * crouch - 0.35 * h * (air < 1 ? 1 : 0);
    st.hop = 85 * h;
    const land = K.inv(j1, j1 + 0.35, t);
    if (land > 0 && land < 1) st.squash += 0.4 * Math.sin(land * Math.PI) * (1 - land);
    st.clawL = { x: -100, y: -130 - 60 * h, open: 0.8 }; st.clawR = { x: 100, y: -130 - 60 * h, open: 0.8 };
    st.mouth = "open"; st.look = [0, -1]; st.lean = 0;
  }
  /* claw snap flourish on two beats: right claw high, snapping */
  const s0 = T.snap[0] - 0.3, s1 = T.hatTip - 0.2;
  if (t > s0 && t < s1) {
    const r = K.ss(s0, T.snap[0], t) * (1 - K.ss(s1 - 0.3, s1, t));
    const snapOpen = Math.min(K.inv(T.snap[0] - 0.2, T.snap[0], t) - K.inv(T.snap[0], T.snap[0] + 0.06, t) + K.inv(T.snap[1] - 0.2, T.snap[1], t) - K.inv(T.snap[1], T.snap[1] + 0.06, t), 1);
    st.clawR = { x: K.lerp(96, 104, r), y: K.lerp(-50, -196, r), open: 0.1 + 0.85 * snapOpen, rot: K.lerp(0, -70, r) };
    st.look = [0.9, -0.8]; st.lean = -5 * r;
  }
  /* cap tip with the left claw */
  const h0 = T.hatTip - 0.2, h1 = T.hatTip + 0.9;
  if (t > h0 && t < h1) {
    const r = K.ss(h0, T.hatTip, t) * (1 - K.ss(h1 - 0.3, h1, t));
    st.clawL = { x: K.lerp(-96, -66, r), y: K.lerp(-50, -146, r), open: 0.35, rot: K.lerp(180, -30, r) };
    st.hatLift = 16 * r; st.hatTip = -16 * r; st.blink = Math.max(st.blink, r > 0.6 ? 1 : 0); st.mouth = "grin";
  }
  /* wave goodbye to the end */
  if (t > T.hatTip + 1.0) {
    const r = K.ss(T.hatTip + 1.0, T.hatTip + 1.3, t);
    st.clawR = { x: 110 + 16 * Math.sin((t - T.hatTip) * 9) * r, y: K.lerp(-50, -170, r), open: 0.5, rot: -80 + 20 * Math.sin((t - T.hatTip) * 9) * r };
  }
  return st;
}

/* ---------- the side set ----------
   o: horizon, warm, zoom/fx/fy (push-in), sunX/sunY, drift, scroll (island parallax, px),
      shipX/Y/S, crab(t) -> pose, crabS, coins, swell, behind/front hooks,
      markets [{x, label, color, t0}] (coin flags on the horizon islands),
      rivets (time the spark run starts) */
function drawSide(t, o) {
  const horizon = o.horizon;
  K.screen(ctx);
  ctx.save();
  const z = o.zoom || 1, fx = o.fx || 960, fy = o.fy || 600;
  const toX = o.toX == null ? fx : o.toX; /* screen x the focus point moves to (lets a push-in recentre) */
  const camAt = (k) => { ctx.setTransform(1, 0, 0, 1, 0, 0); const zz = 1 + (z - 1) * k; ctx.translate(K.lerp(fx, toX, k), fy); ctx.scale(zz, zz); ctx.translate(-fx, -fy); };
  camAt(0.4);
  const sky = { warm: o.warm, drift: o.drift || 0 }; if (o.sunX != null) sky.sunX = o.sunX; if (o.sunY != null) sky.sunY = o.sunY;
  K.sideSky(ctx, horizon, sky);
  for (let i = 0; i < 3; i++) {
    const gx = ((t * (70 + i * 12) + i * 520) % 2400) - 240, gy = 170 + i * 60 + Math.sin(t * 1.5 + i) * 14;
    K.gull(ctx, gx, gy, 0.9 - i * 0.15, i * 2);
  }
  camAt(0.7);
  const isl = (x) => ((((x - (o.scroll || 0)) % 2500) + 2500) % 2500) - 300; /* scroll > 0: the ship sails right, islands slide left */
  K.farIsland(ctx, isl(630), horizon, 320, 70, 1);
  K.farIsland(ctx, isl(1540), horizon, 200, 44, 2);
  K.farIsland(ctx, isl(2020), horizon, 240, 52, 3);
  (o.markets || []).forEach((m, i) => {
    const a = K.inv(m.t0, m.t0 + 0.4, t); if (a <= 0) return;
    const s = K.E.back(a, 2.4), bob = Math.sin(t * 2 + i) * 4;
    K.line(ctx, [[m.x, horizon - 30], [m.x, horizon - 30 - 90 * s]], { stroke: P.ink, w: 4, boil: 0.6, seed: 960 + i, gap: 0 });
    ctx.save(); ctx.translate(m.x, horizon - 140 * s + bob); ctx.scale(s, s);
    K.coin(ctx, 0, 0, 48, { color: m.color, label: m.label, labelColor: P.paper, size: m.label.length > 3 ? 21 : 26, seed: 970 + i });
    ctx.restore();
  });
  K.sideSea(ctx, horizon, { warm: o.warm });
  K.waveRow(ctx, horizon + 70, { amp: 6, len: 90, speed: 18, color: "#4aa3b8", w: 2.5, seed: 21, crest: "#e6f4ee" });
  camAt(1);
  const sw = o.swell || 0; /* 0..1: one big swell lifts every ship together ("copula sea") */
  K.waveRow(ctx, horizon + 190, { amp: 9 + 10 * sw, len: 140 + 60 * sw, speed: 32, color: P.seaMid, w: 3.2, seed: 22 });
  const bob = 7 * Math.sin(t * 2.2) - 6 * pulseA(t) - 34 * sw * Math.sin(t * 2.4), rock = 2.4 * Math.sin(t * 1.6 + 0.4) + 3 * sw * Math.cos(t * 2.4);
  if (o.behind) o.behind(t, bob, rock);
  const cs = o.crabS || 1, pose = o.crab(t);
  const crabFn = (c) => K.crab(c, 0, 0, cs, pose);
  K.ship(ctx, o.shipX, o.shipY + bob, o.shipS, { rock, coins: o.coins || 0, crab: crabFn, sail: 1 });
  if (o.wake) for (let i = 0; i < 6; i++) { /* foam streaks peel off the stern while sailing */
    const ph = (t * 0.9 + i / 6) % 1, wx = o.shipX - o.shipS * (150 + 260 * ph), wy = o.shipY + bob * 0.4 + o.shipS * (8 + 10 * (i % 3));
    K.line(ctx, [[wx, wy], [wx - 70 * o.shipS * (1 - ph * 0.5), wy + 4]], { stroke: P.foam, w: 6 * (1 - ph), boil: 1, seed: 1500 + i, gap: 0 });
  }
  if (o.front) o.front(t, bob, rock);
  /* "Rust-iron": a spark runs along the rivet row */
  if (o.rivets != null) {
    const d = t - o.rivets;
    if (d > 0 && d < 1.3) for (let i = 0; i < 15; i++) {
      const k = d * 18 - i; if (k < 0 || k > 3) continue;
      const a = Math.sin((k / 3) * Math.PI);
      K.glow(ctx, o.shipX + o.shipS * (-150 + i * 21), o.shipY + bob + o.shipS * -46, 50, "rgba(255,230,150,0.9)", a * 0.7);
      K.sparkle(ctx, o.shipX + o.shipS * (-150 + i * 21), o.shipY + bob + o.shipS * -46, 34 * a, a, 980 + i);
    }
  }
  if (o.coins) for (let i = 0; i < 3; i++) {
    const ph = (t * 1.3 + i * 0.37) % 1, gx = o.shipX + o.shipS * (70 + 50 * K.hash(i, Math.floor(t * 1.3 + i * 0.37))), gy = o.shipY + bob - o.shipS * (90 + 30 * K.hash(i + 5, Math.floor(t * 1.3 + i * 0.37)));
    K.sparkle(ctx, gx, gy, 22 * Math.sin(ph * Math.PI), Math.sin(ph * Math.PI), i);
  }
  if (o.notes) o.notes(t, bob);
  K.waveRow(ctx, o.shipY + 30, { amp: 12 + 16 * sw, len: 180 + 80 * sw, speed: 44, color: "#2a86a0", w: 4, seed: 23 });
  K.waveRow(ctx, o.shipY + 110, { amp: 14 + 18 * sw, len: 220 + 90 * sw, speed: 60, color: P.seaDeep, w: 4.5, seed: 24 });
  if (o.over) o.over(t, bob);
  ctx.restore();
}

/* ============================================================
   INTRO 30 CHART SET: the archipelago as a graph. Islands = currencies,
   routes = exchange rates. Verse: three ports, the prices don't match,
   the crab sails the loop. Chorus: the cycle glows, the rates fly into a
   matrix (chorus 2: the matrix stacks into a tensor) and the Rust-crab knows.
   ============================================================ */
const EDGE_TRIM = 150, DOCK_TRIM = 175;
const LAPS = [T.lap1, T.lap2];
const ARRIVALS = LAPS.flatMap((L) => [1, 2, 3].map((k) => L[0] + (k * (L[1] - L[0])) / 3));
const endsOf = (e) => [[NODES[e[0]].x, NODES[e[0]].y], [NODES[e[1]].x, NODES[e[1]].y]];

/* ship position on the loop: {x, y, heading} */
function shipAt(t) {
  let leg = 2, v = 1;
  if (t < LAPS[0][0]) { leg = 0; v = 0; }
  LAPS.forEach((L) => { if (t >= L[0] && t < L[1]) { const k = ((t - L[0]) / (L[1] - L[0])) * 3; leg = Math.min(2, Math.floor(k)); v = k - leg; } });
  const e = EDGES[LOOP[leg]], [A, B] = endsOf(e), L = Math.hypot(B[0] - A[0], B[1] - A[1]);
  const u0 = DOCK_TRIM / L, u = K.lerp(u0, 1 - u0, K.E.inOut(K.clamp(v, 0, 1)));
  const p = K.edgePoint(A, B, e[3], u);
  return { x: p[0] + 30, y: p[1] + 50, heading: p[2] };
}
const arrivedCount = (t) => ARRIVALS.filter((a) => t >= a).length;

const MATRIX_CAM = { x: 2157, y: 840, z: 0.42 };
const camB = K.mkTrack([
  [T.iris[0], { x: 1350, y: 250, z: 1.45 }],
  [T.iris[1], { x: 1310, y: 720, z: 0.74 }],
  [T.lap1[1] - 0.6, { x: 1300, y: 730, z: 0.75 }],
  [at(3, 0.2), { x: 1310, y: 930, z: 0.6 }],
  [at(3, 0.9), MATRIX_CAM],
  [T.irisOut[1], { x: 2120, y: 850, z: 0.44 }],
  [T.wipe1[0], { x: 1300, y: 740, z: 0.7 }],
  [T.lap2[1], { x: 1300, y: 740, z: 0.76 }],
  [at(7, 0.6), MATRIX_CAM],
  [T.irisOut2[1], { x: 2120, y: 850, z: 0.44 }],
]);
function camChart(t) { const c = camB(t); return { x: c.x, y: c.y, z: c.z, rot: 0 }; }

/* crab pose on the ship in the chart view */
function crabChart(t) {
  const b = pulseB(t), rich = K.ss(T.lap1[1], T.lap1[1] + 0.4, t) * (1 - K.ss(T.lap2[0] - 0.3, T.lap2[0], t)) + K.ss(T.lap2[1], T.lap2[1] + 0.3, t);
  const st = { seed: 500, blink: K.blinkAt(t, 5), mouth: rich > 0.5 ? "grin" : "smile", look: [0.6, -0.2], squash: 0.12 * b - 0.04 };
  st.clawL = { x: -72, y: -44, open: 0.15 };
  st.clawR = { x: 92, y: -70 - 18 * b, open: 0.3 + 0.4 * b };
  if (rich > 0) {
    st.clawL = { x: -100, y: K.lerp(-44, -150 - 20 * b, rich), open: 0.3 + 0.6 * b };
    st.clawR = { x: 100, y: K.lerp(-70, -150 - 20 * K.pulse(t + 0.25, 1, 6), rich), open: 0.3 + 0.6 * b };
    st.hop = 14 * b * rich;
  }
  return st;
}

/* ---------- rate matrix (screen space) ---------- */
const MX = { order: ["USDT", "BTC", "ETH", "SOL", "EUR"], x: 1100, y: 190, head: 130, cw: 116, hh: 70, ch: 84, pad: 20 };
MX.w = MX.pad * 2 + MX.head + MX.cw * 5; MX.h = MX.pad * 2 + MX.hh + MX.ch * 5;
const cellXY = (r, c) => [MX.x + MX.pad + MX.head + MX.cw * (c + 0.5), MX.y + MX.pad + MX.hh + MX.ch * (r + 0.5)];
const FLY = EDGES.map((e, i) => ({ r: MX.order.indexOf(e[0]), c: MX.order.indexOf(e[1]), v: e[2], t0: T.fly + bl(i / 4), loop: LOOP.indexOf(i) >= 0, i }));
const FLY_DUR = 0.42;

function drawMatrix(t, cam) {
  const second = t >= T.tensor;
  if (!second && t >= T.irisOut[1]) return;
  const a = second ? K.inv(T.tensor, T.tensor + 0.4, t) : K.inv(T.matrix, T.matrix + 0.45, t); if (a <= 0) return;
  const s = K.E.back(a, 2), cx = MX.x + MX.w / 2, cy = MX.y + MX.h / 2;
  K.screen(ctx); ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  /* chorus 2: the matrix becomes a tensor, two more sheets slide in behind on the beat */
  if (second) for (let k = 2; k >= 1; k--) {
    const g = K.E.back(K.inv(T.tensor + bl(k), T.tensor + bl(k) + 0.35, t), 2); if (g <= 0) continue;
    const ox = 34 * k * g, oy = -30 * k * g;
    K.shape(ctx, K.rectPts(MX.x + ox, MX.y + oy, MX.w, MX.h, 4), { fill: K.shadeC(P.paper, -0.06 * k), w: 5, boil: 1.4, seed: 860 + k, shade: { color: P.paperShade, dx: -10, dy: -10 } });
    for (let i = 0; i < 5; i++) K.text(ctx, MX.order[i], MX.x + ox + MX.pad + MX.head + MX.cw * (i + 0.5), MX.y + oy + 30, { size: 22, weight: 800, fill: K.shadeC(P[MX.order[i]], -0.25), alpha: 0.55 });
  }
  /* parchment */
  const edge = [];
  for (let i = 0; i <= 10; i++) edge.push([MX.x + (MX.w * i) / 10, MX.y + K.hs(i, 4) * 4]);
  for (let i = 0; i <= 7; i++) edge.push([MX.x + MX.w + K.hs(i + 20, 4) * 4, MX.y + (MX.h * i) / 7]);
  for (let i = 10; i >= 0; i--) edge.push([MX.x + (MX.w * i) / 10, MX.y + MX.h + K.hs(i + 40, 4) * 4]);
  for (let i = 7; i >= 0; i--) edge.push([MX.x + K.hs(i + 60, 4) * 4, MX.y + (MX.h * i) / 7]);
  K.shape(ctx, edge, { fill: P.paper, w: 5, boil: 1.4, seed: 820, shade: { color: P.paperShade, dx: -12, dy: -12 } });
  /* loop cells glow once the crab "knows" */
  const know = second ? K.inv(T.knows2 + 0.2, T.knows2 + 0.5, t) : K.inv(T.knows + 0.2, T.knows + 0.5, t);
  if (know > 0) FLY.filter((f) => f.loop).forEach((f, k) => {
    const [x, y] = cellXY(f.r, f.c), pz = 1 + 0.08 * pulseB(t - k * 0.08);
    ctx.save(); ctx.globalAlpha = know * 0.9;
    K.shape(ctx, K.rectPts(x - (MX.cw / 2 - 6) * pz, y - (MX.ch / 2 - 8) * pz, (MX.cw - 12) * pz, (MX.ch - 16) * pz, 3), { fill: P.profit, w: 3.5, boil: 1, seed: 830 + k });
    ctx.restore();
  });
  /* headers */
  MX.order.forEach((k, i) => {
    const hx = MX.x + MX.pad + MX.head + MX.cw * (i + 0.5), hy = MX.y + MX.pad + MX.hh / 2;
    K.text(ctx, k, hx, hy, { size: 28, weight: 800, fill: K.shadeC(P[k], -0.25) });
    const vy = MX.y + MX.pad + MX.hh + MX.ch * (i + 0.5);
    K.text(ctx, k, MX.x + MX.pad + MX.head / 2, vy, { size: 28, weight: 800, fill: K.shadeC(P[k], -0.25) });
  });
  K.line(ctx, [[MX.x + 14, MX.y + MX.pad + MX.hh], [MX.x + MX.w - 14, MX.y + MX.pad + MX.hh]], { stroke: P.ink, w: 3.5, boil: 1, seed: 840 });
  K.line(ctx, [[MX.x + MX.pad + MX.head, MX.y + 14], [MX.x + MX.pad + MX.head, MX.y + MX.h - 14]], { stroke: P.ink, w: 3.5, boil: 1, seed: 841 });
  /* cells: diagonal 1, empty dots, landed rates */
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const [x, y] = cellXY(r, c), f = FLY.find((q) => q.r === r && q.c === c);
    if (f) { if (t >= f.t0 + FLY_DUR) K.text(ctx, f.v, x, y, { size: 26, weight: 700, font: K.FONT.mono, fill: P.ink }); }
    else K.text(ctx, r === c ? "1" : "·", x, y, { size: 26, weight: 500, font: K.FONT.mono, fill: P.inkSoft, alpha: 0.6 });
  }
  ctx.restore();
  /* rates in flight: from the route tag on the map to their cell */
  FLY.forEach((f) => {
    const u = K.inv(f.t0, f.t0 + FLY_DUR, t); if (u <= 0 || u >= 1 || second) return;
    const e = EDGES[f.i], [A, B] = endsOf(e), q = K.edgePoint(A, B, e[3], e[5] || 0.5);
    const S = K.toScreen(q[0], q[1] - 6), D = cellXY(f.r, f.c), w = K.E.inOut(u);
    const x = K.lerp(S[0], D[0], w), y = K.lerp(S[1], D[1], w) - Math.sin(w * Math.PI) * 120;
    K.tag(ctx, x, y, f.v, { size: K.lerp(46 * cam.z, 28, w), hot: f.loop, seed: 850 + f.i });
  });
}

/* the crab pops up beside the matrix and points at the cycle */
function drawKnowingCrab(t) {
  const W = t >= T.tensor ? [T.knows2, T.irisOut2[0]] : [T.knows, T.irisOut[0]];
  const a = K.inv(W[0] - 0.35, W[0] + 0.1, t); if (a <= 0) return;
  const out = K.inv(W[1] - 0.1, W[1] + 0.25, t);
  const y = K.lerp(1330, 1010, K.E.back(a, 1.8)) + 300 * K.E.in3(out), x = 990, s = 1.35;
  const target = cellXY(0, 1), b = pulseB(t);
  K.screen(ctx);
  K.crab(ctx, x, y, s, {
    seed: 500, blink: K.blinkAt(t, 13), mouth: "grin", look: [1, -1], squash: 0.1 * b - 0.03, brow: 0.8,
    clawR: { x: (target[0] - x) / s, y: (target[1] - y) / s, open: 0.1 },
    clawL: { x: -100, y: -60 - 20 * b, open: 0.3 + 0.5 * b },
  });
}

function drawChart(t) {
  const cam = camChart(t);
  K.cam = cam; K.applyCam(ctx, 1);
  K.chartSea(ctx, { seed: 5 });
  const hotK = K.ss(T.hot - 0.1, T.hot + 0.3, t);
  /* routes under islands */
  EDGES.forEach((e, i) => {
    const [A, B] = endsOf(e), inLoop = LOOP.indexOf(i) >= 0;
    const p = K.E.out3(K.inv(e[4], e[4] + 0.55, t));
    const state = inLoop ? (hotK > 0.5 ? "hot" : "plain") : (hotK > 0.5 ? "dim" : "plain");
    K.edge(ctx, A, B, { p, bend: e[3], label: e[2], seed: 100 + i * 13, trim: EDGE_TRIM, state, w: 10, labelSize: 46, lu: e[5] || 0.5 });
  });
  /* islands */
  Object.keys(NODES).forEach((k) => {
    const n = NODES[k], a = K.inv(n.pop - 0.05, n.pop + 0.45, t);
    const hot = (k === "USDT" || k === "BTC" || k === "ETH") ? hotK * (0.7 + 0.3 * pulseB(t)) : 0;
    ctx.save(); ctx.globalAlpha = (k === "SOL" || k === "EUR") ? 1 - 0.35 * hotK : 1;
    K.node(ctx, n.x, n.y, NODE_S, { label: k, color: n.c, a, seed: n.seed, palms: n.palms, lighthouse: n.lighthouse, hot });
    ctx.restore();
  });
  /* the ship */
  const s = shipAt(t), n = arrivedCount(t);
  K.miniShip(ctx, s.x, s.y, 0.6, { heading: s.heading, coins: 3 + n * 4, crab: (c) => K.crab(c, 0, 0, 1, crabChart(t)) });
  K.shipScreen = K.toScreen(s.x, s.y - 80);
  /* coin splash on every arrival */
  ARRIVALS.forEach((ta, ai) => {
    const d = t - ta; if (d < 0 || d > 0.9) return;
    const sp = shipAt(ta);
    for (let i = 0; i < 9; i++) {
      const vx = K.hs(i, ai + 3) * 260, vy = -420 - 220 * K.hash(i, ai + 4);
      K.goldBit(ctx, sp.x + vx * d, sp.y - 120 + vy * d + 700 * d * d, 16, ai * 20 + i, d * 9 + i);
    }
    K.sparkle(ctx, sp.x + 40, sp.y - 190, 40 * Math.sin(K.inv(0, 0.5, d) * Math.PI), 1, ai);
  });
  /* cargo plank: what we hold right now */
  const plankA = K.inv(T.lap1[0] - 0.2, T.lap1[0] + 0.3, t);
  if (plankA > 0) {
    const bumpT = ARRIVALS.filter((a) => t >= a).pop(), bump = bumpT ? Math.exp(-8 * (t - bumpT)) : 0;
    const gain = n >= 6 ? "+0.92 %" : n >= 3 ? "+0.46 %" : "";
    ctx.save(); ctx.translate(1320, 640); ctx.scale(1 + 0.12 * bump, 1 + 0.12 * bump);
    K.plank(ctx, 0, 0, 640, gain ? 190 : 130, gain ? [HOLD[n], gain] : [HOLD[n]], { a: plankA, size: 56, seed: 11, colors: [P.ink, "#2f8a3e"] });
    ctx.restore();
  }
  drawMatrix(t, cam);
  drawKnowingCrab(t);
}

/* ============================================================
   INTRO 35 "Futures, spot and copula sea": side set with two ships.
   Our ship (cog sail) is spot; the hourglass ship is the future.
   A gold rope between them carries the basis; then one swell lifts
   both ships together: dependence you can see.
   Chorus 1 (midday) ends with "sail with me!": the crab beckons us aboard.
   Chorus 2 is the same idea at sunset, and a wave wipes to the title.
   ============================================================ */
const FUT = { y: 845, s: 0.98 };
const TWO = [
  { t0: T.two1, rope: T.rope1, swell: T.swell1, warm: 0.2, gap: "+0.8 %", beckon: T.beckon, end: T.wipe1[1] },
  { t0: T.two2, rope: T.rope2, swell: T.swell2, warm: 0.75, gap: "+0.6 %", beckon: null, end: T.wipe2[1] },
];
const hourglass = (c, x, y) => {
  K.coin(c, x, y, 34, { color: P.ETH, seed: 870 });
  K.shape(c, [[x - 13, y - 18], [x + 13, y - 18], [x, y], [x + 13, y + 18], [x - 13, y + 18], [x, y]], { fill: P.paper, w: 3, boil: 0.6, seed: 871, gap: 0 });
};
const futX = (t, V) => K.tw(t, V.t0 - 0.4, V.t0 + 0.9, 2350, 1360, K.E.out3) + (V.beckon ? K.tw(t, V.beckon, V.beckon + 2.5, 0, 1100, K.E.in3) : 0);

function crabTwoShips(t, V) {
  if (V.beckon && t > V.beckon - 0.25) return crabBeckon(t);
  const b = pulseB(t), st = { seed: 500, blink: K.blinkAt(t, 21), mouth: "smile", look: [1, -0.3], squash: 0.1 * b - 0.03 };
  st.clawL = { x: -72, y: -42, open: 0.15 };
  st.clawR = { x: 92, y: -70 - 18 * b, open: 0.3 + 0.4 * b };
  const p = K.ss(V.rope - 0.3, V.rope, t) * (1 - K.ss(V.swell - 0.2, V.swell + 0.1, t));
  if (p > 0) { st.clawR = { x: K.lerp(92, 118, p), y: K.lerp(-70, -120, p), open: 0.05, rot: -18 }; st.mouth = "o"; st.brow = 0.8 * p; }
  const sw = K.ss(V.swell - 0.1, V.swell + 0.3, t);
  if (sw > 0) {
    st.mouth = "grin"; st.look = [0.2, -1];
    st.clawL = { x: -100, y: K.lerp(-42, -150 - 20 * b, sw), open: 0.3 + 0.6 * b };
    st.clawR = { x: 100, y: K.lerp(-70, -150 - 20 * K.pulse(t + 0.24, 1, 6), sw), open: 0.3 + 0.6 * b };
  }
  return st;
}

const SIDE_TWO = (t, V) => {
  const sw = K.ss(V.swell - 0.15, V.swell + 0.6, t) * (V.beckon ? 1 - K.ss(V.beckon, V.beckon + 1.2, t) : 1);
  const our = { x: 640, y: 930, s: 1.4 };
  /* "sail with me!": the camera closes on the crab */
  const bk = V.beckon ? K.ss(V.beckon - 0.2, V.beckon + 0.9, t) : 0;
  return {
    horizon: 600, warm: V.warm, sunY: V.warm > 0.5 ? 430 : 250, sunX: V.warm > 0.5 ? 1560 : 1480,
    zoom: K.lerp(K.tw(t, V.t0 - 0.5, V.end, 1.0, 1.08, K.E.inOut), 1.75, bk), fx: K.lerp(960, 560, bk), toX: K.lerp(960, 820, bk), fy: K.lerp(700, 640, bk), drift: 300,
    shipX: our.x, shipY: our.y, shipS: our.s, crabS: 1.15, crab: (tt) => crabTwoShips(tt, V), coins: V.beckon ? 15 : 22, swell: sw,
    behind: (tt, bob, rock) => {
      const fx = futX(tt, V); if (fx > 2500) return;
      K.ship(ctx, fx, FUT.y + bob * 0.9, FUT.s, { rock, sail: 1, flagColor: P.ETH, emblem: hourglass, seed: 700 });
    },
    front: (tt, bob) => {
      /* basis rope between the masts (sags, bobs with both ships) */
      const ra = K.inv(V.rope - 0.1, V.rope + 0.4, tt) * (V.beckon ? 1 - K.inv(V.beckon, V.beckon + 0.3, tt) : 1); if (ra <= 0) return;
      const fx = futX(tt, V), A = [our.x + 40 * our.s, our.y + bob - 250 * our.s], B = [fx + 40 * FUT.s, FUT.y + bob * 0.9 - 250 * FUT.s];
      const pts = [];
      for (let i = 0; i <= 12; i++) { const u = (i / 12) * K.E.out3(ra); pts.push([K.lerp(A[0], B[0], u), K.lerp(A[1], B[1], u) + Math.sin(u * Math.PI) * 60]); }
      K.line(ctx, pts, { stroke: P.ink, w: 12, boil: 1.2, seed: 880, gap: 0 });
      K.line(ctx, pts, { stroke: P.profit, w: 6, boil: 1.2, seed: 881, gap: 0.15 });
      const m = [K.lerp(A[0], B[0], 0.5), K.lerp(A[1], B[1], 0.5) + 60];
      K.tag(ctx, m[0], m[1] - 6, V.gap, { a: K.inv(V.rope + 0.2, V.rope + 0.6, tt) * ra, hot: true, size: 44, seed: 882 });
      /* one swell, two ships: matching foam marks under both hulls */
      const sw2 = K.ss(V.swell - 0.15, V.swell + 0.6, tt);
      if (sw2 > 0) [our.x, fx].forEach((x, i) => {
        const y = (i ? FUT.y : our.y) + bob * (i ? 0.9 : 1) + 60;
        K.line(ctx, [[x - 120, y], [x - 40, y - 14], [x + 40, y - 14], [x + 120, y]], { stroke: P.foam, w: 6, boil: 1.6, seed: 890 + i, gap: 0, alpha: sw2 * ra });
      });
    },
  };
};

/* ============================================================
   INTRO 40 TITLE: banner + DOM title letters + six episode medallions.
   The title text lives in the DOM (crisp type, variable per language);
   the banner it sits on is canvas ink and follows the same wave.
   ============================================================ */
const BANNER = { cx: 960, cy: 292, w: 1520, h: 250 }; /* top edge clears the logo plate (y <= 144) */
const MEDAL_Y = 480, MEDAL_R = 48;

/* six episode icons, language-free: graph, basis, matrix, copula, ML, execution */
const ICONS = [
  (c, r) => { const p = [[0, -r * 0.5], [r * 0.5, r * 0.35], [-r * 0.5, r * 0.35]]; K.line(c, p.concat([p[0]]), { stroke: P.ink, w: 3.5, boil: 0.6, seed: 1, gap: 0 }); p.forEach((q, i) => K.dot(c, q[0], q[1], r * 0.14, P.paper, P.ink, 2, 2 + i)); },
  (c, r) => { K.shape(c, K.rectPts(-r * 0.45, -r * 0.1, r * 0.35, r * 0.5, 1), { fill: P.paper, w: 3, boil: 0.5, seed: 3 }); K.shape(c, K.rectPts(r * 0.1, -r * 0.45, r * 0.35, r * 0.85, 1), { fill: P.paper, w: 3, boil: 0.5, seed: 4 }); },
  (c, r) => { for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) K.dot(c, (i - 1) * r * 0.32, (j - 1) * r * 0.32, r * 0.1, (i + j) % 2 ? P.paper : P.ink, P.ink, 2, 10 + i * 3 + j); },
  (c, r) => { K.line(c, [[-r * 0.5, r * 0.4], [-r * 0.15, r * 0.25], [0, 0], [r * 0.15, -r * 0.25], [r * 0.5, -r * 0.4]], { stroke: P.ink, w: 3.5, boil: 0.6, seed: 20, gap: 0 }); K.line(c, [[-r * 0.5, -r * 0.4], [-r * 0.1, -r * 0.1], [r * 0.1, r * 0.1], [r * 0.5, r * 0.4]], { stroke: P.paper, w: 3.5, boil: 0.6, seed: 21, gap: 0 }); },
  (c, r) => { const L = [[-r * 0.45, -r * 0.3], [-r * 0.45, r * 0.3]], M = [[0, -r * 0.42], [0, 0], [0, r * 0.42]], R = [[r * 0.45, 0]]; L.forEach((a) => M.forEach((b) => K.line(c, [a, b], { stroke: P.ink, w: 2, boil: 0.4, seed: 30, gap: 0 }))); M.forEach((a) => R.forEach((b) => K.line(c, [a, b], { stroke: P.ink, w: 2, boil: 0.4, seed: 31, gap: 0 }))); L.concat(M, R).forEach((q, i) => K.dot(c, q[0], q[1], r * 0.11, P.paper, P.ink, 2, 40 + i)); },
  (c, r) => K.cog(c, 0, 0, r * 0.52, P.paper, 50),
];
const MEDAL_COLORS = [P.BTC, P.USDT, P.ETH, P.SOL, P.EUR, P.rust];

function drawTitleCanvas(t) {
  const u = K.inv(T.banner[0], T.banner[1], t);
  K.screen(ctx);
  const box = K.banner(ctx, BANNER.cx, BANNER.cy, BANNER.w, BANNER.h, u, { seed: 71 });
  /* medallions pop on eighth notes after the snap */
  for (let i = 0; i < 6; i++) {
    const t0 = T.medals + i * K.beatLen() / 2, a = K.inv(t0, t0 + 0.35, t);
    if (a <= 0) continue;
    const s = K.E.back(a, 2.6), x = 960 + (i - 2.5) * 132, y = MEDAL_Y + 6 * Math.sin(t * 2.4 + i) - 10 * K.pulse(t - i * 0.08, 1, 6);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    K.coin(ctx, 0, 0, MEDAL_R, { color: MEDAL_COLORS[i], seed: 600 + i * 7 });
    ICONS[i](ctx, MEDAL_R);
    ctx.restore();
  }
  /* snap sparkles near the raised claw */
  [T.snap[0], T.snap[1]].forEach((ts, k) => {
    const d = t - ts; if (d < 0 || d > 0.5) return;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * K.TAU + k, r = 40 + 160 * d;
      K.sparkle(ctx, SNAP_PT[0] + Math.cos(a) * r, SNAP_PT[1] + Math.sin(a) * r, 26 * (1 - d / 0.5), 1 - d / 0.5, i + k * 5);
    }
  });
  drawPip(t);
  return box;
}

/* ---------- Pip, the first mate, joins on the instrumental outro ----------
   Flies in from the left and glides alongside the sailing ship (the empty
   left third of the frame), sings on the beat, cheers the medallions,
   salutes with the captain and waves to the end. */
const PIP = { x: 420, y: 750, s: 1.3 };
function noteGlyph(x, y, s, a, seed) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(-0.15);
  K.line(ctx, [[8, 0], [8, -38], [24, -30]], { stroke: P.ink, w: 4, boil: 0.6, seed, gap: 0 });
  K.shape(ctx, K.ellipsePts(0, 0, 10, 7.5, 10), { fill: P.ink, stroke: null, w: 0, boil: 0.5, seed: seed + 1 });
  ctx.restore();
}
function drawPip(t) {
  const [f0, f1] = T.pipIn;
  if (t < f0) return;
  const fly = K.inv(f0, f1, t), e = K.E.out3(fly);
  const flap = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 * K.G.BPM / 60); /* one wingbeat per beat while gliding */
  const st = { seed: 700, blink: K.blinkAt(t, 13), look: [0.5, 0.2], wingL: 0.25 + 0.6 * flap, wingR: 0.25 + 0.6 * flap, lean: 8 };
  let x = PIP.x, y = PIP.y + 14 * Math.sin(t * 2.2) - 16 * K.pulse(t, 1, 6);
  if (fly < 1) {
    /* swoop in from the top-left, fast wingbeats, flare to a glide */
    const fast = 0.5 + 0.5 * Math.sin(t * 34);
    x = K.lerp(-180, x, e); y = K.lerp(380, y, e) + 90 * Math.sin(fly * Math.PI) * (1 - fly);
    st.wingL = st.wingR = 0.3 + 0.65 * fast; st.lean = 26 * (1 - e) + 8; st.look = [1, 0]; st.squash = -0.1 * (1 - e);
  }
  /* sing: beak opens on every beat, head bobs, notes drift up */
  const sing = win(t, T.pipSing[0], T.pipSing[1], 0.2, 0.3);
  if (sing > 0) {
    const b = K.pulse(t, 1, 6);
    st.talk = sing * b; st.head = sing * 12 * Math.sin(t * Math.PI * K.G.BPM / 60); st.look = [0.6, -0.4];
    for (let i = 0; i < 4; i++) {
      const t0 = T.pipSing[0] + i * K.beatLen() * 2, d = (t - t0) % (K.beatLen() * 8);
      if (t < t0 || d > 1.6) continue;
      const u = d / 1.6;
      noteGlyph(x + 60 + 110 * u + 16 * Math.sin(u * 7 + i), y - 190 - 120 * u, 1.5 + 0.3 * (i % 2), Math.sin(u * Math.PI) * sing, 1600 + i * 3);
    }
  }
  /* medallions pop: "!" and a look down at them */
  const m = win(t, T.medals - 0.1, T.hatTip - 0.2, 0.15, 0.3);
  if (m > 0) { st.exclaim = K.inv(T.medals, T.medals + 0.4, t) * (1 - K.inv(T.medals + 1.2, T.medals + 1.5, t)); st.look = [1, 0.8]; st.head = -10 * m; st.brow = 1.2 * m; st.wingR = K.lerp(st.wingR, 0.75 + 0.25 * Math.sin(t * 16), m); }
  /* salute with the captain's cap tip, then wave a wing to the end */
  const sal = win(t, T.hatTip - 0.2, T.hatTip + 0.9, 0.2, 0.3);
  if (sal > 0) { st.wingR = K.lerp(st.wingR, 0.98, sal); st.blink = Math.max(st.blink, sal > 0.6 ? 1 : 0); st.head = -14 * sal; }
  if (t > T.hatTip + 1.0) { const r = K.ss(T.hatTip + 1.0, T.hatTip + 1.3, t); st.wingR = K.lerp(st.wingR, 0.6 + 0.35 * Math.sin((t - T.hatTip) * 9), r); st.look = [0.3, 0]; }
  K.parrot(ctx, x, y, PIP.s, st);
}
/* screen point near the snapping claw (set by the title scene layout) */
const SNAP_PT = [1000, 635];

function layoutTitleDom(t) {
  const u = K.inv(T.banner[0], T.banner[1], t);
  titleEl.style.opacity = u > 0 ? "1" : "0";
  if (u <= 0) return;
  const n = TITLE_LN.length, sizes = TITLE_LN.map((d) => +d.dataset.size), gap = 10;
  const total = sizes.reduce((a, b) => a + b, 0) + gap * (n - 1);
  let y = BANNER.cy - total / 2 - 8 + Math.sin(BANNER.cx * 0.006 + t * 1.4) * 8;
  TITLE_LN.forEach((d, i) => { d.style.top = y.toFixed(1) + "px"; y += sizes[i] + gap; });
  TITLE_CH.forEach((c) => {
    const t0 = T.letters + c.idx * 0.035, a = K.inv(t0, t0 + 0.42, t);
    const yy = (1 - K.E.back(a, 2.4)) * -140, land = K.inv(t0 + 0.3, t0 + 0.55, t);
    const sq = Math.sin(land * Math.PI) * 0.16 * (1 - land);
    const beatHop = c.line === n - 1 ? -6 * K.pulse(t, 4, 6) * K.inv(T.letters + 1, T.letters + 1.2, t) : 0; /* whole line hops on the accent */
    c.el.style.opacity = a > 0 ? Math.min(1, a * 3).toFixed(2) : "0";
    c.el.style.transform = `translateY(${(yy + beatHop).toFixed(1)}px) scale(${(1 + sq).toFixed(3)}, ${(1 - sq).toFixed(3)})`;
  });
}

/* ---------- "Haul in the spread": a net of coins comes up, one pull per beat ---------- */
const TITLE_SHIP = { x: 960, y: 1035, s: 1.45, crabS: 1.22 };
function netState(t) {
  const steps = (T.haul[1] - T.haul[0]) / K.beatLen(); /* 8 pulls */
  const k = K.clamp((t - T.haul[0]) / K.beatLen(), 0, steps), whole = Math.floor(k), fr = k - whole;
  const rise = (whole + K.E.back(Math.min(1, fr * 2.2), 1.6)) / steps; /* jerk up on each beat */
  const dump = K.inv(T.dump, T.dump + 0.5, t);
  return { x: K.lerp(1330, 1170, dump), y: K.lerp(1180, 800, K.clamp(rise, 0, 1)) - 60 * dump, open: dump, gone: K.inv(T.dump + 0.5, T.dump + 0.9, t) };
}
function drawNet(t, bob) {
  if (t < T.haul[0] - 0.3 || t > T.dump + 1.0) return;
  const n = netState(t), hand = [TITLE_SHIP.x - 95 * TITLE_SHIP.s + 110 * TITLE_SHIP.crabS * TITLE_SHIP.s, TITLE_SHIP.y + bob - 60 * TITLE_SHIP.s - 75 * TITLE_SHIP.crabS * TITLE_SHIP.s];
  const top = [n.x, n.y - 100 + bob * 0.5];
  if (n.gone < 1) {
    K.line(ctx, [hand, [K.lerp(hand[0], top[0], 0.5), Math.max(hand[1], top[1]) + 20], top], { stroke: P.ink, w: 9, boil: 1, seed: 1400, gap: 0 });
    K.line(ctx, [hand, [K.lerp(hand[0], top[0], 0.5), Math.max(hand[1], top[1]) + 20], top], { stroke: P.sailShade, w: 5, boil: 1, seed: 1400, gap: 0 });
  }
  ctx.save(); ctx.globalAlpha *= 1 - n.gone; ctx.translate(n.x, n.y + bob * 0.5); ctx.rotate(-0.5 * n.open); ctx.scale(1.4, 1.4);
  const bag = K.blobPts(0, 0, 80, 70, 14, 1401, 0.12);
  ctx.save(); K.pathOf(ctx, bag, true); ctx.clip();
  for (let i = 0; i < 16; i++) if (K.hash(i, 1402) > n.open * 0.9) K.goldBit(ctx, K.hs(i, 1403) * 60, 20 - (i % 5) * 16 + K.hs(i, 1404) * 6, 15, 1405 + i, K.hs(i, 1406) * 0.4);
  ctx.restore();
  for (let i = -3; i <= 3; i++) { K.line(ctx, [[i * 22, -72], [i * 26, 72]], { stroke: P.inkSoft, w: 2.5, boil: 0.8, seed: 1410 + i, gap: 0.1 }); K.line(ctx, [[-82, i * 20], [82, i * 20]], { stroke: P.inkSoft, w: 2.5, boil: 0.8, seed: 1420 + i, gap: 0.1 }); }
  K.shape(ctx, bag, { fill: null, w: 5, boil: 1.2, seed: 1430 });
  ctx.restore();
  /* coins pour onto the pile when the net opens */
  const d = t - T.dump; if (d > 0 && d < 0.9) for (let i = 0; i < 10; i++) {
    const u = K.clamp(d * 1.6 - i * 0.05, 0, 1); if (u <= 0 || u >= 1) continue;
    K.goldBit(ctx, K.lerp(n.x - 40, TITLE_SHIP.x + 95 * TITLE_SHIP.s + K.hs(i, 1440) * 60, u), K.lerp(n.y + 30, TITLE_SHIP.y + bob - 80 * TITLE_SHIP.s, u * u), 14, 1450 + i, u * 6 + i);
  }
}

/* ============================================================
   INTRO 70 RENDER: render(t) is the whole film (31.5 s). One paused GSAP
   timeline drives a proxy whose setter calls render(t).
    0.0 - 3.6   side set: ship sails in, cap tip + wink, spyglass "!"
    3.6 - 4.35  spyglass iris into the chart (first sung line)
    4.35- 8.6   "cycle flows": loop draws, glows, one lap (+0.46 %);
                "graph and matrix": full graph, rates fly into a matrix
    8.1 - 8.6   iris closes on the ship -> two ships (futures/spot, rope, swell)
   10.35-12.35  "sail with me!": push-in, the crab beckons and winks
   11.95-12.35  wave wipe -> chart: fast lap (+0.92 %), matrix -> tensor
   16.1 - 16.6  iris out -> two ships at sunset
   17.85-18.35  wave wipe -> title on the last "sail with me!"; outro: net
                haul, jump, snap + medallions, cap tip, wave
   The marketmaker.cc logo plate (DOM, top-right) stays for the whole film.
   ============================================================ */
const OPEN_CAM = K.mkTrack([
  [0, { z: 1.0, fx: 900, fy: 640, toX: 900 }],
  [T.spyUp, { z: 1.05, fx: 800, fy: 660, toX: 820 }],
  [T.iris[1], { z: 1.18, fx: 800, fy: 660, toX: 820 }],
]);
const SIDE_OPEN = (t) => {
  const c = OPEN_CAM(t);
  return {
    horizon: 600, warm: 0, zoom: c.z, fx: c.fx, fy: c.fy, toX: c.toX,
    shipX: K.tw(t, T.shipIn[0], T.shipIn[1], -520, 800, K.E.out3), shipY: 930, shipS: 1.6, crabS: 1.15, crab: crabOpening,
  };
};
const SIDE_TITLE = (t) => ({
  horizon: 640, warm: 0.7, fx: 960, fy: 760,
  /* settle after the wipe, then a slow push-in through the instrumental outro */
  zoom: t < T.pipIn[0] ? K.tw(t, T.wipe2[0], T.wipe2[1] + 2, 1.06, 1.0, K.E.out3) : K.tw(t, T.pipIn[0], DUR, 1.0, 1.1, K.E.inOut),
  drift: 600 + 50 * Math.max(0, t - T.sail), scroll: 70 * Math.max(0, t - T.sail), wake: true,
  shipX: TITLE_SHIP.x, shipY: TITLE_SHIP.y, shipS: TITLE_SHIP.s, crabS: TITLE_SHIP.crabS, crab: crabTitle,
  coins: Math.round(22 + 12 * K.inv(T.dump + 0.2, T.dump + 0.9, t)), front: (tt, bob) => drawNet(tt, bob),
});

function drawWaveFront(x) {
  /* a tall curling wave sweeps right; left of it is already the next set */
  const crest = [];
  for (let i = 0; i <= 16; i++) { const y = -40 + (i / 16) * 1160; crest.push([x + 50 * Math.sin(y * 0.01 + K.now * 5) + 24 * Math.sin(y * 0.027 + 1), y]); }
  const body = crest.concat(crest.slice().reverse().map((p) => [p[0] - 260, p[1]]));
  K.shape(ctx, body, { fill: P.seaMid, w: 6, boil: 2, seed: 900, shade: { color: P.seaDeep, dx: -70, dy: 0 }, hatch: { ang: 1.35, gap: 26, alpha: 0.25, color: P.foam } });
  K.line(ctx, crest, { stroke: P.foam, w: 26, boil: 2.4, seed: 901, gap: 0.05 });
  K.line(ctx, crest.map((p) => [p[0] - 60, p[1]]), { stroke: "#bfe6ec", w: 8, boil: 2, seed: 902, gap: 0.3 });
  for (let i = 0; i < 26; i++) {
    const y = (i / 26) * 1100 + 10, c = crest[Math.min(16, Math.round(((y + 40) / 1160) * 16))];
    const bx = c[0] + 22 + 46 * K.hash(i, 7) + 30 * Math.sin(K.now * 7 + i);
    K.dot(ctx, bx, y + 10 * Math.sin(K.now * 5 + i), 9 + 14 * K.hash(i, 8), P.foam, P.ink, 3, 910 + i);
  }
}

function ring(cx, cy, r) {
  K.screen(ctx); ctx.save();
  ctx.lineWidth = 22; ctx.strokeStyle = P.goldDark; ctx.beginPath(); ctx.arc(cx, cy, r + 8, 0, K.TAU); ctx.stroke();
  ctx.lineWidth = 6; ctx.strokeStyle = P.ink; ctx.beginPath(); ctx.arc(cx, cy, r + 20, 0, K.TAU); ctx.stroke();
  ctx.restore();
}

function irisIn(t, win, drawA, drawB) {
  /* drawA full, drawB inside a circle growing from the spyglass lens (K.lens, set while drawA draws) */
  drawA(); const from = K.lens || { x: 1200, y: 400 };
  const u = K.E.inOut(K.inv(win[0], win[1], t));
  const cx = K.lerp(from.x, 960, u), cy = K.lerp(from.y, 540, u), r = K.lerp(10, 1250, u);
  K.screen(ctx); ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, K.TAU); ctx.clip(); drawB(); ctx.restore(); ring(cx, cy, r);
}
function irisOutOnShip(t, win, drawNext) {
  const u = K.E.inOut(K.inv(win[0], win[1], t)), r = K.lerp(1300, 0, u);
  K.cam = camChart(t); const sp = shipAt(t), c = K.toScreen(sp.x, sp.y - 80);
  K.screen(ctx); ctx.save(); ctx.beginPath(); ctx.rect(-10, -10, 1940, 1100); ctx.arc(c[0], c[1], r, 0, K.TAU, true); ctx.clip("evenodd"); drawNext(); ctx.restore();
  K.screen(ctx); ctx.save(); ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, K.TAU); ctx.clip(); drawChart(t); ctx.restore();
  if (r > 4) ring(c[0], c[1], r);
}
function waveWipe(t, win, drawOld, drawNew) {
  const x = K.tw(t, win[0], win[1], -420, 2400, K.E.inOut);
  drawOld(); K.screen(ctx); ctx.save(); ctx.beginPath(); ctx.rect(-10, -10, x + 10, 1100); ctx.clip(); drawNew(); ctx.restore();
  K.screen(ctx); drawWaveFront(x);
}
const drawTitleSet = (t) => { drawSide(t, SIDE_TITLE(t)); K.screen(ctx); if (t >= T.banner[0]) drawTitleCanvas(t); };

function render(t) {
  try {
    K.begin(ctx, t, { x: 0, y: 0, z: 1 });
    titleEl.style.opacity = "0";
    const two1 = () => drawSide(t, SIDE_TWO(t, TWO[0])), two2 = () => drawSide(t, SIDE_TWO(t, TWO[1]));
    if (t < T.iris[0]) drawSide(t, SIDE_OPEN(t));
    else if (t < T.iris[1]) irisIn(t, T.iris, () => drawSide(t, SIDE_OPEN(t)), () => drawChart(t));
    else if (t < T.irisOut[0]) drawChart(t);
    else if (t < T.irisOut[1]) irisOutOnShip(t, T.irisOut, two1);
    else if (t < T.wipe1[0]) two1();
    else if (t < T.wipe1[1]) waveWipe(t, T.wipe1, two1, () => drawChart(t));
    else if (t < T.irisOut2[0]) drawChart(t);
    else if (t < T.irisOut2[1]) irisOutOnShip(t, T.irisOut2, two2);
    else if (t < T.wipe2[0]) two2();
    else if (t < T.wipe2[1]) waveWipe(t, T.wipe2, two2, () => drawTitleSet(t));
    else drawTitleSet(t);
    if (t >= T.banner[0]) layoutTitleDom(t);
  } catch (err) {
    /* never leave a black frame silently: draw the error so a snapshot shows it */
    K.screen(ctx); ctx.fillStyle = "#300"; ctx.fillRect(0, 0, 1920, 80); ctx.fillStyle = "#fff"; ctx.font = "28px monospace"; ctx.fillText(String(err && err.stack || err).slice(0, 140), 20, 50);
  }
/* paper grain steps at the boil rate */
  const f = K.boilFrame(t);
  grainEl.style.backgroundPosition = ((f % 7) * 37) + "px " + ((f % 5) * 53) + "px";
}

const grainEl = document.getElementById("grain"), logoEl = document.getElementById("logo");
grainEl.style.backgroundImage = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .35  0 0 0 1.4 -.2'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>\")";

const TL = gsap.timeline({ paused: true });
const drv = { _t: 0 };
Object.defineProperty(drv, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
TL.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
render(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(drv._t));
window.__timelines["main"] = TL;
window.__render = render;

})();
    </script>
  </body>
