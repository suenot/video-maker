    <script>
(function () {
/* ============================================================
   KIT 00 CORE: math, seeded random, noise, splines, beat grid, boil clock
   Every frame is a pure function of time t (seconds). No Math.random,
   no Date.now, no performance.now anywhere in the kit.
   ============================================================ */
var MK = window.MK || (window.MK = {});
(function (K) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const ss = (a, b, t) => { const u = inv(a, b, t); return u * u * (3 - 2 * u); };
  const f1 = (n) => Math.round(n * 10) / 10;
  const f2 = (n) => Math.round(n * 100) / 100;

  /* eases (u in 0..1) */
  const E = {
    inOut: (u) => u * u * (3 - 2 * u),
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    back: (u, s) => { s = s == null ? 1.7 : s; const v = u - 1; return 1 + v * v * ((s + 1) * v + s); },
    elastic: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
  };
  /* tween value from a to b during [t0, t1] with an ease */
  const tw = (t, t0, t1, a, b, ease) => lerp(a, b, (ease || E.inOut)(inv(t0, t1, t)));

  /* seeded PRNG (mulberry32) */
  function mulberry(seed) {
    let s = seed | 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let q = Math.imul(s ^ (s >>> 15), 1 | s);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* stateless hash -> [0,1) for (i, seed) */
  function hash(i, s) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const hs = (i, s) => hash(i, s) * 2 - 1; /* signed */
  function vnoise(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s), hash(i + 1, s), u); }
  function fbm(x, s, oct) { let a = 0.5, v = 0, fr = 1, n = 0; for (let k = 0; k < (oct || 3); k++) { v += a * vnoise(x * fr, s + k * 17); n += a; a *= 0.5; fr *= 2.03; } return v / n; }

  /* monotone cubic Hermite spline through [[t, v], ...] (no overshoot) */
  function mkSpline(pts) {
    const n = pts.length, T = pts.map((p) => p[0]), V = pts.map((p) => p[1]);
    if (n === 1) return () => V[0];
    const d = [], m = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) d[i] = (V[i + 1] - V[i]) / (T[i + 1] - T[i]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
    }
    return function (x) {
      x = clamp(x, T[0], T[n - 1]);
      let i = 0; while (i < n - 2 && x >= T[i + 1]) i++;
      const h = T[i + 1] - T[i], u = (x - T[i]) / h, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * V[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * V[i + 1] + (u3 - u2) * h * m[i + 1];
    };
  }
  /* keys: [[t, {a:.., b:..}], ...] -> fn(t) -> {a, b} (one spline per channel) */
  function mkTrack(keys) {
    const names = Object.keys(keys[0][1]), sp = {};
    names.forEach((k) => { sp[k] = mkSpline(keys.map((q) => [q[0], q[1][k]])); });
    return (t) => { const o = {}; names.forEach((k) => (o[k] = sp[k](t))); return o; };
  }

  /* ---------- beat grid (retime to the real song by changing BPM/OFFSET or BARS) ----------
     BARS: optional list of measured downbeat times (seconds). Songs cut from
     several takes drift a few ms per splice, so measured downbeats beat a
     single OFFSET. Past the list, bars extrapolate at BPM. */
  const G = { BPM: 120, OFFSET: 0, BEATS_PER_ACCENT: 4, BARS: null };
  const beatLen = () => 60 / G.BPM;
  const barLen = () => beatLen() * G.BEATS_PER_ACCENT;
  function barStart(b) {
    const B = G.BARS;
    if (!B || !B.length) return G.OFFSET + b * barLen();
    if (b < 0) return B[0] + b * barLen();
    if (b < B.length) return B[b];
    return B[B.length - 1] + (b - B.length + 1) * barLen();
  }
  /* time of bar b (0-based, an "accent" = 4 beats) plus beat k (fractional ok) */
  const at = (bar, beat) => barStart(Math.floor(bar)) + ((bar - Math.floor(bar)) * G.BEATS_PER_ACCENT + (beat || 0)) * beatLen();
  /* index of the bar containing t (-1 before the first downbeat) */
  function barAt(t) {
    if (t < barStart(0)) return -1;
    let b = 0; while (barStart(b + 1) <= t) b++;
    return b;
  }
  /* 1 on the beat, decaying to 0 before the next beat (k = sharpness) */
  function pulse(t, everyBeats, k) {
    const b = barAt(t); if (b < 0) return 0;
    const L = beatLen() * (everyBeats || 1), x = t - barStart(b);
    return Math.exp(-(k || 7) * ((x % L) / L));
  }
  const beatIndex = (t) => { const b = barAt(t); return b < 0 ? -1 : b * G.BEATS_PER_ACCENT + Math.floor((t - barStart(b)) / beatLen()); };

  /* ---------- line boil clock: drawings change 12 times per second ---------- */
  const BOIL_FPS = 12;
  const boilFrame = (t) => Math.floor(t * BOIL_FPS);

  Object.assign(K, { clamp, lerp, inv, ss, f1, f2, E, tw, mulberry, hash, hs, vnoise, fbm, mkSpline, mkTrack,
    G, beatLen, barLen, barStart, barAt, at, pulse, beatIndex, BOIL_FPS, boilFrame, TAU: Math.PI * 2 });
})(MK);

/* the whole reef. o: { depth, pop(i) -> 0..1 tower grow, mid(ctx), octo(ctx), front(ctx), traffic, desk, rays, bubbles } */
function drawReef(t, cam, o) {
  o = o || {};

  K.ocean(ctx, { depth: o.depth == null ? 0.45 : o.depth });
  K.rays(ctx, { a: o.rays == null ? 1 : o.rays, x: 960 - (cam.x - 960) * 0.2 });

  /* far layer: muted silhouettes */
  K.applyCam(ctx, 0.35);
  FAR.forEach((f, i) => {
    const g = o.pop ? o.pop(i - 20) : 1; if (g <= 0) return;
    const h = f[2] * K.E.back(Math.min(1, g), 1.4);
    K.tower(ctx, f[0], 1000, f[1], h, { color: K.mix(P.shallow, P.mid, 0.4 + 0.3 * K.hash(i, 1)), dark: K.mix(P.mid, P.deep, 0.5), seed: 300 + i, windows: 2 });
  });

/* standard Otto at his desk: merges a pose with idle life (blink, beat bob, singing) */
function otto(t, pose, place) {

  const st = Object.assign({ blink: K.blinkAt(t, 5), squash: 0.07 * K.pulse(t, 1, 6), talk: singAt(t) * 0.9, look: [0.15 * Math.sin(t * 0.9), 0] }, pose || {});

/* ---------- transitions ---------- */
/* bubble curtain: a dense wall of foam bubbles rises through the frame; full cover at tc */

    const i = row * 11 + col, x = col * 190 - 20 + (row % 2) * 95 + K.hs(i, 4) * 30, y = 540 + off + (row - 7.5) * 150 + K.hs(i, 5) * 30;

/* ============================================================

   Scenes are pure functions of t. Arm poses come from armTrack():

    const u = K.E.back(K.inv(t0, t0 + d, t), 1.2);
    cur = mixArm(from, to, u);
    card = tg && tg.card ? tg.card : null; prop = tg && tg.prop ? tg.prop : null;
  }
  if (!cur) return null;
  if (card) cur.card = card; if (prop) cur.prop = prop;
  return cur;
}
/* a fanned ladder of 8 quote cards (bids left, asks right) around the head */
function fanArms(t, t0, opt) {
  const o = Object.assign({ r: 470, ry: 400, cy: -300, s: 0.7, spread: 1, wob: 1 }, opt || {});
  const prices = ["99.92", "99.94", "99.96", "99.98", "100.02", "100.04", "100.06", "100.08"];

    const th = Math.PI + ((i + 0.5) / 8) * Math.PI, w = 0.06 * Math.sin(t * 5 + i) * o.wob;

/* a fish that swims through (x0 -> card at tk -> x1), carrying the card after tk */

      const r = sc14.res, i = Math.max(0, Math.min(CD14.length - 1, Math.floor(draw * CD14.length) - 1));
      /* point at the chart from its right edge, at the height of the newest candle */
      const tip = r ? toLocal(BOARD.x + BOARD.w / 2 + 40, K.clamp(r.Y(CD14[i].h), BOARD.y - 40, BOARD.y + 220), SIDE) : { x: -600, y: -500 };
      /* two arms snap like alligator jaws on every beat */
      const snap = K.pulse(t, 1, 5);
      otto(t, { mouth: "grin", look: [-1, -0.3], brow: 0.5,
        arms: [null, null, { x: tip.x, y: tip.y, bend: -40, curl: 0.6 }, null, null, { x: 330, y: -470 - 60 * snap, bend: 40, curl: 1.2 }, { x: 360, y: -330 + 50 * snap, bend: 40, curl: -1.2 }, null] }, SIDE);
    },
  });
}

/* ---------- SC15 break: a Lorenz attractor (chaos) traced by Otto (bars 29.5 - 30.75) ---------- */
function flipWrap(cx, sx, fn) { ctx.save(); ctx.translate(cx, 0); ctx.scale(Math.max(0.001, sx), 1); ctx.translate(-cx, 0); const r = fn(); ctx.restore(); return r; }
function sc15(t) {
  const out = K.inv(at(30, 2.6), at(30, 3), t);
  drawReef(t, { x: 960, y: 540, z: 1 }, {
    desk: false, traffic: 2, depth: 0.85, rays: 0.5,
    mid: () => {
      K.applyCam(ctx, 1);
      sc15.head = flipWrap(BOARD.x, 1 - out, () => K.attractor(ctx, BOARD.x, BOARD.y, BOARD.w, BOARD.h, { a: ap(t, at(29, 2), 0.3), draw: K.tw(t, at(29, 2), at(30, 2.6), 0.08, 1, K.E.out3), yaw: -0.25 + (t - at(29, 2)) * 0.3, pitch: 0.15, scale: 1.3, tab: P.lilac }));
    },
    octo: () => {
      const hd = sc15.head || [BOARD.x, BOARD.y], tl = toLocal(hd[0] + 30, hd[1] + 30, SIDE);
      otto(t, { skin: K.SKIN.chaos, mouth: "o", brow: 1.2, look: [-1, -0.4], arms: [null, null, { x: K.clamp(tl.x, -1300, -200), y: tl.y, bend: -80 }, null, null, null, null, null] }, SIDE);
    },
  });
}

/* ---------- SC16 break: a manifold with a path on it (bars 30.75 - 32) ---------- */
const PATH16 = Array.from({ length: 40 }, (_, i) => [-0.85 + i * 0.044, 0.55 * Math.sin(i * 0.16) - 0.2]);
function sc16(t) {
  const inn = K.inv(at(30, 3), at(30, 3.5), t);
  drawReef(t, { x: 960, y: 540, z: 1 }, {
    desk: false, traffic: 2, depth: 0.7, rays: 0.7,
    mid: () => {
      K.applyCam(ctx, 1);
      flipWrap(BOARD.x, K.E.back(inn, 1.5), () => K.manifold(ctx, BOARD.x, BOARD.y, BOARD.w, BOARD.h, { a: 1, draw: K.inv(at(30, 3), at(31, 1), t), yaw: 0.4 + (t - at(30, 3)) * 0.35, tilt: 0.6, path: PATH16, pathDraw: K.inv(at(31, 0.5), at(31, 3.4), t), tab: P.kelp }));
    },
    octo: () => otto(t, { skin: K.SKIN.bull, mouth: "grin", brow: 0.6, look: [-1, -0.2], glint: K.inv(at(31, 3), at(31, 3.6), t),
      arms: [null, null, armTrack(t, 2, [[at(31, 0), { x: -520, y: -420, bend: -50, curl: 1.4 }]]), null, null, null, null, null] }, SIDE),
  });
}

/* ---------- SC17 "Buy low, sell high" (bars 32 - 34): Otto surfs the price wave ---------- */
const WAVE = (x) => 600 + 230 * Math.cos((2 * Math.PI * (x - 625)) / 1700);
function sc17(t) {
  const sx = K.lerp(200, 1900, K.inv(at(32), at(34), t)), sy = WAVE(sx), slope = (WAVE(sx + 5) - WAVE(sx - 5)) / 10;
  const buy = at(32, 2), sell = at(33, 2);
  drawReef(t, { x: K.clamp(sx + 80, 760, 1700), y: 520, z: 0.98 }, {
    desk: false, traffic: 5,
    mid: () => {
      K.applyCam(ctx, 1);
      const pts = []; for (let x = -700; x <= 2700; x += 60) pts.push([x, WAVE(x)]);
      ctx.save(); ctx.globalAlpha = 0.28; K.pathOf(ctx, pts.concat([[2700, 1100], [-700, 1100]]), true, true); ctx.fillStyle = P.foam; ctx.fill(); ctx.restore();
      K.line(ctx, pts, { stroke: P.ink, w: 26, boil: 0.6, seed: 260 }); K.line(ctx, pts, { stroke: P.bid, w: 16, boil: 0.6, seed: 260 });
      K.line(ctx, pts.map((p) => [p[0], p[1] - 4]), { stroke: "#9fe0ff", w: 4, boil: 0.5, seed: 261 });
      [[625, buy, "bid", "98.50"], [1475, sell, "ask", "101.50"]].forEach(([x, tt, kind, txt], k) => {
        const a = ap(t, tt, 0.35); if (a <= 0) return;
        K.dot(ctx, x, WAVE(x), 18, kind === "bid" ? P.bid : P.ask, P.ink, 5, 262 + k);
        K.card(ctx, x, WAVE(x) + (kind === "bid" ? 110 : -120), 0.9, { kind, text: txt, a, seed: 264 + k });
      });
    },
    octo: () => {
      /* clam-shell surfboard + Otto riding the line */
      const lean = Math.atan(slope) * 180 / Math.PI;
      ctx.save(); K.applyCam(ctx, 1); ctx.translate(sx, sy - 14); ctx.rotate(Math.atan(slope));
      K.shape(ctx, [[-170, 0], [-130, -34], [130, -34], [180, -8], [140, 16], [-140, 16]], { fill: P.shell, w: 5, boil: 0.6, seed: 270, shade: { color: P.shellDark, dx: 0, dy: -10 } });
      ctx.restore();
      const pl = { x: sx, y: sy - 34, s: 0.66 };
      otto(t, { lean: lean * 0.8, mouth: "grin", brow: 0.7, look: [1, slope], hop: 10 * K.pulse(t, 1, 5),
        arms: [null, armTrack(t, 1, [[buy, { x: -330, y: -420, bend: -40, card: { kind: "bid", text: "98.50", s: 0.9, a: ap(t, buy) } }]]), null, null, null, null,
          armTrack(t, 6, [[sell, { x: 340, y: -460, bend: 40, card: { kind: "ask", text: "101.50", s: 0.9, a: ap(t, sell) } }]]), null] }, pl);
      if (t > at(33, 3)) K.badge(ctx, sx, sy - 420, "+3.00", { a: ap(t, at(33, 3), 0.35), color: P.up, dark: P.upDark, textColor: "#ffffff", size: 54 });
    },
  });
}

/* ---------- SC18 "Quote both sides as the fish swim by" (bars 34 - 36): the spread formula ---------- */
function sc18(t) {
  const write = K.inv(at(34, 0.2), at(35, 2.5), t), line = Math.min(2, Math.floor(write * 3));
  drawReef(t, { x: 960, y: 540, z: 1 }, {
    desk: false, traffic: 3,
    mid: () => {
      K.applyCam(ctx, 1);
      K.formula(ctx, 790, 430, 1180, 520, ["spread = ask - bid", "  0.04 = 100.02 - 99.98", { t: "mid = (ask + bid) / 2", c: P.sun }], { a: ap(t, at(34, 0), 0.35), write, size: 58, tab: P.sun });
    },
    octo: () => otto(t, { mouth: "smile", look: [-1, -0.3], brow: 0.3,
      arms: [null, null, { x: -620, y: -520 + line * 105 + 60 * K.pulse(t, 1, 6) * 0, bend: -60, curl: 0.8 }, null, null, null, null, null] }, SIDE),
    front: () => {
      K.applyCam(ctx, 1);
      [[0, "bid", 1], [1, "ask", -1], [2, "bid", 1]].forEach(([j, side, dir]) => {
        const t0 = at(34, 0.5 + j * 1.6), d = t - t0; if (d < 0 || d > 2.6) return;
        const x = dir > 0 ? -300 + 1000 * d : 2200 - 1000 * d;
        K.fish(ctx, x, 940 - j * 40 + 20 * Math.sin(d * 5), 0.8, { species: ["O", "Y", "T"][j], dir, seed: 600 + j, card: { kind: side, text: side === "bid" ? BID : ASK } });
      });
    },
  });
}

/* ---------- SC19 "Tight spread, steady hand" (bars 36 - 38): quote() in code, the two cards pop out ---------- */
const CODE19 = ["def quote(mid, spread):", "    bid = mid - spread / 2", "    ask = mid + spread / 2", "    return bid, ask", "", "quote(100.00, 0.04)  # 99.98, 100.02"];
function sc19(t) {
  const typed = K.inv(at(36, 0.2), at(37, 1.5), t), out = at(37, 2);
  drawReef(t, { x: 960, y: 540, z: 1 }, {
    desk: false, traffic: 2,
    mid: () => { K.applyCam(ctx, 1); K.code(ctx, 790, 450, 1180, CODE19, { a: ap(t, at(36, 0), 0.35), typed, size: 40, tab: P.fan }); },
    octo: () => {
      const tap = K.pulse(t, 0.5, 8) * (t < at(37, 1.5) ? 1 : 0);
      otto(t, { mouth: t > out ? "grin" : "smile", brow: t > out ? 0.8 : 0, look: t > out ? [0, -0.8] : [-1, 0.2], glint: K.inv(at(37, 3), at(37, 3.6), t), wave: 0.3,
        arms: [null, armTrack(t, 1, [[out, { x: -330, y: -470, bend: -40, card: { kind: "bid", text: BID, s: 1, a: ap(t, out, 0.35) } }]]),
          t < out ? { x: -620, y: -260 - 40 * tap, bend: -40 } : null, null, null, null,
          armTrack(t, 6, [[out, { x: 330, y: -470, bend: 40, card: { kind: "ask", text: ASK, s: 1, a: ap(t, out, 0.35) } }]]), null] }, SIDE);
    },
    front: () => { K.applyCam(ctx, 1); K.bubbleBurst(ctx, SIDE.x, SIDE.y - 420, t - out, { n: 12, r: 300, size: 18, seed: 61 }); },
  });
}

/* ============================================================
   INTRO 50 TITLE (bar 38 -> end): "Marketmaker! Marketmaker of the sand!"
   A wavy cream plate pops on the downbeat; the title letters (DOM, crisp,
   per-language) drop in on 32nd notes; the subtitle sits on a navy pill.
   Otto waves the eight-card fan below, fish swim behind, the last note winks.
   ============================================================ */
const PLATE = { cx: 960, cy: 292, w: 1480, h: 340 };
const T_PLATE = at(38, 0), T_LETTERS = at(38, 0.5), T_SUB = at(39, 0), T_WINK = at(40, 0);
let SUB_W = 0;

function titleSizes() {
  const w0 = K.textW(ctx, TITLE_LINES[0], 100, 900, '"Unbounded", "CJK SC", "CJK TC", sans-serif');
  const s0 = Math.min(150, Math.floor((1240 / Math.max(1, w0)) * 100));
  let s1 = 0;
  if (TITLE_LINES[1]) {
    const f1 = IS_CJK ? (LANG === "zh-TW" ? '"Manrope", "CJK TC", sans-serif' : '"Manrope", "CJK SC", sans-serif') : '"Manrope", sans-serif';
    const w1 = K.textW(ctx, TITLE_LINES[1], 100, IS_CJK ? 900 : 800, f1);
    s1 = Math.min(IS_CJK ? 66 : 58, Math.floor((1120 / Math.max(1, w1)) * 100));
    SUB_W = (w1 * s1) / 100;
  }
  return [s0, s1];
}

function scTitle(t) {
  const d = t - T_PLATE, hop = Math.max(0, Math.sin(K.inv(0, 0.6, d) * Math.PI)) * 90 + 16 * K.pulse(t, 2, 5);
  drawReef(t, { x: 960, y: 540, z: K.tw(t, T_PLATE, DUR, 1, 1.04, K.E.out3) }, {
    desk: false, traffic: 6, trafficY: -60, bubbles: false,
    octo: () => otto(t, { hop, mouth: t > T_WINK ? "grin" : "grin", brow: 0.9, wink: t > T_WINK && t < T_WINK + 0.6 ? Math.sin(K.inv(T_WINK, T_WINK + 0.6, t) * Math.PI) : 0,
      glint: K.inv(T_WINK + 0.5, T_WINK + 1.0, t), squash: d < 0.1 ? -0.2 : 0.07 * K.pulse(t, 1, 6),
      arms: fanArms(t, T_PLATE, { r: 600, ry: 300, cy: -250, s: 0.66 }) }, { x: 960, y: 1070, s: 0.84 }),
    front: () => {
      K.screen(ctx);
      const u = K.inv(T_PLATE, T_PLATE + 0.45, t);
      K.titlePlate(ctx, PLATE.cx, PLATE.cy, PLATE.w, PLATE.h, u, {});
      /* subtitle pill */
      const su = K.inv(T_SUB, T_SUB + 0.35, t);
      if (su > 0 && SUB_W > 0) {
        const s = K.popS(su), pw = SUB_W + 90, ph = 84;
        ctx.save(); ctx.translate(PLATE.cx, PLATE.cy + 98); ctx.scale(s, s);
        K.shape(ctx, K.rrectPts(-pw / 2, -ph / 2, pw, ph, ph / 2, 4), { fill: P.ink, stroke: P.ink, w: 5, boil: 0.5, seed: 820, hi: { color: "#22306a", dx: 0, dy: 10 } });
        ctx.restore();
      }
      /* sparkles on the plate hit and on the wink */
      [[T_PLATE, PLATE.cy, 760], [T_WINK, PLATE.cy, 700]].forEach(([ts, cy, rr], k) => {
        const dd = t - ts; if (dd < 0 || dd > 0.6) return;
        for (let i = 0; i < 10; i++) { const a = (i / 10) * K.TAU + k; K.sparkle(ctx, PLATE.cx + Math.cos(a) * rr * (0.7 + 0.5 * dd), cy + Math.sin(a) * 200 * (0.8 + dd), 30 * (1 - dd / 0.6), 1 - dd / 0.6, 830 + i + k * 10); }
      });
      K.bubbleBurst(ctx, 960, 760, t - T_PLATE, { n: 16, r: 700, size: 26, dur: 1.1, seed: 840 });
    },
  });
}

function layoutTitleDom(t) {
  const on = t >= T_LETTERS - 0.05;
  titleEl.style.opacity = on ? "1" : "0";
  if (!on) return;
  const [s0, s1] = titleSizes();
  TITLE_LN[0].style.fontSize = s0 + "px";
  TITLE_LN[0].style.top = (PLATE.cy - 60 - s0 / 2 + 4 * Math.sin(t * 1.6)).toFixed(1) + "px";
  if (TITLE_LN[1]) { TITLE_LN[1].style.fontSize = s1 + "px"; TITLE_LN[1].style.top = (PLATE.cy + 98 - s1 * 0.56).toFixed(1) + "px"; }
  TITLE_CH.forEach((c) => {
    const t0 = c.line === 0 ? T_LETTERS + c.k * 0.045 : T_SUB + 0.1 + c.k * 0.018, a = K.inv(t0, t0 + 0.38, t);
    const yy = (1 - K.E.back(a, 2.6)) * (c.line === 0 ? -120 : 40), land = K.inv(t0 + 0.25, t0 + 0.5, t), sq = Math.sin(land * Math.PI) * 0.18 * (1 - land);
    const beatHop = c.line === 0 ? -7 * K.pulse(t - c.k * 0.03, 2, 6) * K.inv(T_SUB, T_SUB + 0.2, t) : 0; /* the word bounces along with the skank */
    c.el.style.opacity = a > 0 ? Math.min(1, a * 3).toFixed(2) : "0";
    c.el.style.transform = `translateY(${(yy + beatHop).toFixed(1)}px) scale(${(1 + sq).toFixed(3)}, ${(1 - sq).toFixed(3)})`;
  });
}

/* ============================================================
   INTRO 70 RENDER: render(t) is the whole film. One paused GSAP timeline
   drives a proxy whose setter calls render(t).
     0.00 - 6.35   SC1  descent from the surface, towers grow, Otto pops out of the clam
     6.35 - 9.48   SC2  "Buy low, sell high": bid card low, ask card high
     9.48 - 12.60  SC3  "Quote both sides as the fish swim by": fish take the quotes
    12.60 - 15.73  SC4  "Tight spread, steady hand": quotes squeeze 0.40 -> 0.04
    15.73 - 18.86  SC5  "Marketmaker!": the eight-card fan, sand puff
    18.86 - 21.99  SC6  "Down on the reef...": exchange panorama (bubble curtain in)
    21.99 - 25.11  SC7  "...quotes through the market's changes": chart, Otto changes colour
    25.11 - 28.24  SC8  "Bid with one arm and an ask with another": close-ups, whip pan
    28.24 - 31.37  SC9  "Eight arms on the book, one spread to cover!"
    31.37 - 34.49  SC10 "Buy low, sell high": juggled candles -> chart with buy/sell
    34.49 - 37.62  SC11 "Quote both sides": a school of takers, spread adds up
    37.62 - 40.75  SC12 "Tight spread, steady hand": the balance on Otto's head
    40.75 - 43.88  SC13 "Marketmaker!": hero shot with orbiting fish
    43.88 - 46.22  SC14 break: Bill Williams Alligator + fractals + AO
    46.22 - 48.18  SC15 break: Lorenz attractor (ink transition in)
    48.18 - 50.13  SC16 break: manifold with a path (panel flip in)
    50.13 - 53.26  SC17 "Buy low, sell high": surfing the price wave (ink out)
    53.26 - 56.38  SC18 "Quote both sides": the spread formula
    56.38 - 59.51  SC19 "Tight spread, steady hand": quote() in code
    59.51 - 64.00  title card "Marketmaker" + subtitle (bubble curtain in)
   ============================================================ */
const SCENES = [
  [0, sc1], [at(4), sc2], [at(6), sc3], [at(8), sc4], [at(10), sc5], [at(12), sc6], [at(14), sc7], [at(16), sc8], [at(18), sc9],
  [at(20), sc10], [at(22), sc11], [at(24), sc12], [at(26), sc13], [at(28), sc14], [at(29, 2), sc15], [at(30, 3), sc16],
  [at(32), sc17], [at(34), sc18], [at(36), sc19], [at(38), scTitle],
];
const CURTAINS = [at(12), at(20), at(28), at(38)];

function render(t) {
  try {
    let fn = SCENES[0][1];
    for (const s of SCENES) if (t >= s[0]) fn = s[1];
    titleEl.style.opacity = "0";
    fn(t);
    CURTAINS.forEach((tc) => bubbleCurtain(t, tc));
    inkTransition(t, at(29, 2), 1500, 640);
    inkTransition(t, at(32), 1500, 640);
    if (t >= at(38)) layoutTitleDom(t);
  } catch (err) {
    /* never leave a black frame silently: draw the error so a snapshot shows it */
    K.screen(ctx); ctx.fillStyle = "#300"; ctx.fillRect(0, 0, 1920, 80); ctx.fillStyle = "#fff"; ctx.font = "28px monospace"; ctx.fillText(String((err && err.stack) || err).slice(0, 150), 20, 50);
  }
  const f = K.boilFrame(t);
  grainEl.style.backgroundPosition = ((f % 7) * 37) + "px " + ((f % 5) * 53) + "px";
}

const grainEl = document.getElementById("grain");
grainEl.style.backgroundImage = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.5 -.25'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>\")";

const TL = gsap.timeline({ paused: true });
const drv = { _t: 0 };
Object.defineProperty(drv, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
TL.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
render(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(drv._t));
window.__timelines["main"] = TL;
window.__render = render;

})();
    </script>
  </body>
</html>
